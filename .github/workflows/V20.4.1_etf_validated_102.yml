name: V20.4.1 Validated ETF 102 Committee

on:
  workflow_dispatch:
  push:
    branches: [feature/smart-money-v1]
    paths:
      - '.github/workflows/V20.4.1_etf_validated_102.yml'
      - 'src/v182/decision/etf_validated_102_v2041.py'

permissions:
  contents: read
  actions: read

jobs:
  etf-validated-committee:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -c constraints-ci.txt -e .[test]
      - name: Preflight
        run: |
          python -m pip check
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 src tests
      - name: Reuse latest fully audited V18.2 ETF reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/etfref outputs
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts|sort_by(.created_at)|reverse|.[]|select(.expired==false)|select(.name|startswith("V18.2-full-audit-"))|[.id,.workflow_run.id]|@tsv' > /tmp/etfref/list.tsv
          FOUND=0
          while IFS=$'\t' read -r ART RUN; do
            [ -n "$ART" ] || continue
            C=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}" --jq '.conclusion // ""' 2>/dev/null || true)
            [ "$C" = success ] || continue
            rm -rf /tmp/etfref/unpack; mkdir -p /tmp/etfref/unpack
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" > /tmp/etfref/a.zip
            unzip -oq /tmp/etfref/a.zip -d /tmp/etfref/unpack
            SRC=$(find /tmp/etfref/unpack -name V18.2_PEA_ETF_MASTER_ENRICHED.csv -print -quit)
            [ -n "$SRC" ] || continue
            cp "$SRC" outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
            echo "ETF_REFERENCE_RUN=$RUN" >> "$GITHUB_ENV"
            FOUND=1; break
          done < /tmp/etfref/list.tsv
          test "$FOUND" = 1
      - name: Build validated ETF committee
        run: python -m v182.decision.etf_validated_102_v2041
      - name: Quality gates
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          p='outputs/V20.4.1_ETF_PEA_VALIDATED_102_COMMITTEE.csv'
          df=pd.read_csv(p,sep=';',dtype=object,encoding='utf-8-sig')
          assert len(df)==102 and df['isin'].nunique()==102
          assert df['ticker_identity_status'].eq('FINAL_VALIDATED').all()
          assert pd.to_numeric(df['ticker_confidence_pct'],errors='coerce').ge(95).all()
          assert pd.to_numeric(df['last_close'],errors='coerce').notna().all()
          assert df['execution'].eq('RESEARCH_ONLY').all()
          req={'score_short_term','score_medium_term','score_long_term','short_thesis_score','committee_score_v2041_etf','identity_confidence_final','decision','execution'}
          assert req.issubset(df.columns), req-set(df.columns)
          audit=json.loads(Path('outputs/audit/V20.4.1_ETF_PEA_VALIDATED_102_AUDIT.json').read_text())
          assert audit['passed'] is True and audit['smart_money_enabled'] is False and audit['live_order_execution_enabled'] is False
          print('ETF_102_QUALITY_GATES_OK',df.decision.value_counts().to_dict())
          PY
      - name: Publish summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os,pandas as pd
          df=pd.read_csv('outputs/V20.4.1_ETF_PEA_VALIDATED_102_COMMITTEE.csv',sep=';',dtype=object,encoding='utf-8-sig')
          print('## V20.4.1 ETF PEA — validated real identities')
          print(f'- V18.2 reference run: {os.environ.get("ETF_REFERENCE_RUN")}')
          print(f'- ETF: {len(df)}; valid unique ISIN: {df.isin.nunique()}')
          print(f'- Decisions: {df.decision.value_counts().to_dict()}')
          print('- Old 266 synthetic/pseudo universe is not trusted: checksum gate required before any future reuse.')
          print('- Smart Money: not integrated')
          print('- Live/order execution: disabled')
          PY
      - name: Upload validated ETF evidence
        uses: actions/upload-artifact@v6
        with:
          name: V20.4.1-ETF-Validated-102-${{ github.run_id }}
          path: |
            outputs/V20.4.1_ETF_PEA_VALIDATED_102_COMMITTEE.csv
            outputs/audit/V20.4.1_ETF_PEA_VALIDATED_102_AUDIT.json
          if-no-files-found: error
          retention-days: 30
