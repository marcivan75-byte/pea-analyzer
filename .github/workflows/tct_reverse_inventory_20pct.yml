name: TCT reverse inventory +20pct 2010-2026

on:
  push:
    branches:
      - v22/pit-mae-mfe-preopen
    paths:
      - ".github/workflows/tct_reverse_inventory_20pct.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install runtime
        run: python -m pip install --prefer-binary -r requirements-runtime.txt
      - name: Download governed 2010-2026 history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/history
          gh run download 33393842087 -n pea-history-2010-2026-33393842087 -D inputs/history
          test -f inputs/history/PEA_OHLCV_2010_2026_CONSOLIDATED.parquet
      - name: Inventory distinct ACTION winners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import pandas as pd

          src = Path('inputs/history/PEA_OHLCV_2010_2026_CONSOLIDATED.parquet')
          out = Path('outputs/tct_reverse_inventory_20pct')
          out.mkdir(parents=True, exist_ok=True)

          use = ['date','asset_class','isin','ticker','open','high','low','close','volume','origin']
          df = pd.read_parquet(src, columns=use)
          df['date'] = pd.to_datetime(df['date'], errors='coerce')
          df = df[df['asset_class'].eq('ACTION')].copy()
          df = df.dropna(subset=['date','isin','ticker','close'])
          df['close'] = pd.to_numeric(df['close'], errors='coerce')
          df['high'] = pd.to_numeric(df['high'], errors='coerce')
          df = df[df['close'].gt(0)].sort_values(['isin','date']).drop_duplicates(['isin','date'], keep='last')

          horizons = (4,10,20)
          event_chunks = []
          for (isin,ticker), g0 in df.groupby(['isin','ticker'], sort=False):
              g = g0.sort_values('date').reset_index(drop=True)
              c = g['close'].to_numpy(float)
              hi = g['high'].to_numpy(float)
              n = len(g)
              for H in horizons:
                  fmax_c = np.full(n, np.nan)
                  fmax_h = np.full(n, np.nan)
                  first_hit = np.full(n, np.nan)
                  hit_date = np.full(n, np.datetime64('NaT'), dtype='datetime64[ns]')
                  for i in range(n):
                      j1 = i + 1
                      j2 = min(n, i + H + 1)
                      if j1 >= j2:
                          continue
                      cc = c[j1:j2]
                      hh = hi[j1:j2]
                      if np.isfinite(cc).any():
                          fmax_c[i] = np.nanmax(cc)
                      if np.isfinite(hh).any():
                          fmax_h[i] = np.nanmax(hh)
                      target = c[i] * 1.20
                      hits = np.flatnonzero(cc > target)
                      if len(hits):
                          k = int(hits[0])
                          first_hit[i] = k + 1
                          hit_date[i] = g.loc[j1+k, 'date'].to_datetime64()
                  gain_c = fmax_c / c - 1.0
                  gain_h = fmax_h / c - 1.0
                  hit = gain_c > 0.20
                  if hit.any():
                      z = pd.DataFrame({
                          'isin': isin,
                          'ticker': ticker,
                          'entry_date': g.loc[hit,'date'].to_numpy(),
                          'entry_year': g.loc[hit,'date'].dt.year.to_numpy(),
                          'horizon_sessions': H,
                          'entry_close': c[hit],
                          'max_future_close_gain': gain_c[hit],
                          'max_future_high_gain_diag': gain_h[hit],
                          'first_close_hit_sessions': first_hit[hit],
                          'first_close_hit_date': hit_date[hit],
                      })
                      event_chunks.append(z)

          events = pd.concat(event_chunks, ignore_index=True) if event_chunks else pd.DataFrame()
          events = events.sort_values(['entry_year','horizon_sessions','ticker','entry_date'])
          events.to_csv(out/'TCT_PLUS20_EVENTS_CLOSE_BASED.csv', index=False)

          coverage = (df.assign(year=df['date'].dt.year)
                        .groupby('year')['isin'].nunique()
                        .rename('action_universe')
                        .reset_index())

          if len(events):
              annual = (events.groupby(['entry_year','horizon_sessions'])['isin']
                              .nunique().rename('distinct_winners').reset_index())
              wide = annual.pivot(index='entry_year', columns='horizon_sessions', values='distinct_winners').fillna(0).astype(int)
              wide = wide.rename(columns={4:'plus20_within_4_sessions',10:'plus20_within_10_sessions',20:'plus20_within_20_sessions'}).reset_index().rename(columns={'entry_year':'year'})
              summary = coverage.merge(wide, on='year', how='left').fillna(0)
              for c0 in ['plus20_within_4_sessions','plus20_within_10_sessions','plus20_within_20_sessions']:
                  summary[c0] = summary[c0].astype(int)

              names = (events.groupby(['entry_year','horizon_sessions','isin','ticker'], as_index=False)
                             .agg(first_event_date=('entry_date','min'),
                                  event_start_dates=('entry_date','nunique'),
                                  best_close_gain=('max_future_close_gain','max'),
                                  best_high_gain_diag=('max_future_high_gain_diag','max'),
                                  fastest_close_hit_sessions=('first_close_hit_sessions','min')))
          else:
              summary = coverage.copy()
              names = pd.DataFrame()

          summary.to_csv(out/'TCT_PLUS20_ANNUAL_SUMMARY.csv', index=False)
          names.to_csv(out/'TCT_PLUS20_DISTINCT_WINNERS_BY_YEAR_HORIZON.csv', index=False)

          # Nested membership and global distinct counts are useful sanity checks.
          checks = {
              'definition_primary': 'close(J0) to any future close in next H sessions strictly > +20%',
              'horizons_sessions': list(horizons),
              'asset_class': 'ACTION only',
              'source_run_id': 33393842087,
              'source_artifact': 'pea-history-2010-2026-33393842087',
              'rows_actions': int(len(df)),
              'unique_actions': int(df['isin'].nunique()),
              'period': [str(df['date'].min().date()), str(df['date'].max().date())],
              'global_distinct_winners': {str(H): int(events.loc[events.horizon_sessions.eq(H),'isin'].nunique()) for H in horizons} if len(events) else {},
              'nested_4_in_10': bool(set(events.loc[events.horizon_sessions.eq(4),'isin']) <= set(events.loc[events.horizon_sessions.eq(10),'isin'])) if len(events) else True,
              'nested_10_in_20': bool(set(events.loc[events.horizon_sessions.eq(10),'isin']) <= set(events.loc[events.horizon_sessions.eq(20),'isin'])) if len(events) else True,
              'note': 'Intraday high gain is diagnostic only; it does not define primary winners.'
          }
          (out/'TCT_PLUS20_INVENTORY_AUDIT.json').write_text(json.dumps(checks, indent=2), encoding='utf-8')
          print(summary.to_string(index=False))
          print(json.dumps(checks, indent=2))
          PY
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f outputs/tct_reverse_inventory_20pct/TCT_PLUS20_ANNUAL_SUMMARY.csv ]; then
            echo '## TCT +20% annual inventory' >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/tct_reverse_inventory_20pct/TCT_PLUS20_ANNUAL_SUMMARY.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tct-reverse-inventory-plus20-${{ github.run_id }}
          path: outputs/tct_reverse_inventory_20pct/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
