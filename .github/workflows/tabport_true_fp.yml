name: TABPORT true-FP durable diagnostic

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - 'v182/hebdo/tabport_walkforward.py'
      - 'v182/hebdo/tabport_true_fp_publish.py'
      - 'tests/test_tabport_true_fp.py'
      - '.github/workflows/tabport_true_fp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabport-true-fp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Require governed cache
        run: test -n "$(find data/cache/actions -maxdepth 1 -name 'history_*.parquet' -print -quit)"
      - name: Install runtime
        run: |
          python -m pip install --prefer-binary -r requirements-runtime.txt
          python -m pip install pytest scikit-learn scipy
      - name: Test durable FP label
        run: |
          python - <<'PY'
          import pytest, v182.hebdo
          raise SystemExit(pytest.main(['-q','tests/test_tabport_true_fp.py','tests/test_tabport_meta.py']))
          PY
      - name: Run PIT true-FP diagnostic
        run: python -m v182.hebdo.tabport_true_fp_publish --cache data/cache/actions --output-dir outputs/tabport_true_fp
      - name: Validate contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs/tabport_true_fp'); d=json.loads((root/'TABPORT_TRUE_FP_DIAGNOSTIC.json').read_text())
          assert d['decision_influence'] is False and d['promotion']=='FORBIDDEN_DIAGNOSTIC_ONLY', d
          for name in ['TABPORT_TRUE_FP_MATURE_OUTCOMES.csv','TABPORT_TRUE_FP_VINTAGES.csv','TABPORT_TRUE_FP_DIAGNOSTIC.json']:
              p=root/name; assert p.exists() and p.stat().st_size>0, name
          print(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TABPORT-TRUE-FP-${{ github.run_id }}
          path: outputs/tabport_true_fp/
