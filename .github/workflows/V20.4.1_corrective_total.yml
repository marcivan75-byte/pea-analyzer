name: V20.4.1 Corrective Committee 1829 Actions + 266 ETF

on:
  workflow_dispatch:
  push:
    branches: [feature/smart-money-v1]
    paths:
      - '.github/workflows/V20.4.1_corrective_total.yml'
      - 'src/v182/decision/v2041_corrective_reweight.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: v2041-corrective-total
  cancel-in-progress: true

jobs:
  corrective-committee:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validated dependency set
        run: pip install -c constraints-ci.txt -e .[test]
      - name: Preflight
        run: |
          python -m pip check
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 src tests
      - name: Reuse latest successful V20.4 total artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2041 outputs/audit
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts|sort_by(.created_at)|reverse|.[]|select(.expired==false)|select(.name|startswith("V20.4-Total-1829-266-"))|[.id,.workflow_run.id]|@tsv' > /tmp/v2041/list.tsv
          FOUND=0
          while IFS=$'\t' read -r ART RUN; do
            [ -n "$ART" ] || continue
            C=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}" --jq '.conclusion // ""' 2>/dev/null || true)
            [ "$C" = success ] || continue
            rm -rf /tmp/v2041/art; mkdir -p /tmp/v2041/art
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" > /tmp/v2041/a.zip
            unzip -oq /tmp/v2041/a.zip -d /tmp/v2041/art
            A=$(find /tmp/v2041/art -name V20.4_GITOK_ACTIONS_1829_DECISIONS.csv -print -quit)
            E=$(find /tmp/v2041/art -name V20.4_GITOK_ETF_266_DECISIONS.csv -print -quit)
            [ -n "$A" ] && [ -n "$E" ] || continue
            cp "$A" outputs/V20.4_GITOK_ACTIONS_1829_DECISIONS.csv
            cp "$E" outputs/V20.4_GITOK_ETF_266_DECISIONS.csv
            echo "V204_SOURCE_RUN=$RUN" >> "$GITHUB_ENV"
            FOUND=1; break
          done < /tmp/v2041/list.tsv
          test "$FOUND" = 1
      - name: Execute V20.4.1 corrective reweight
        run: python -m v182.decision.v2041_corrective_reweight
      - name: Validate V20.4.1 outputs
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          a=pd.read_csv('outputs/V20.4.1_GITOK_ACTIONS_1829_DECISIONS.csv',sep=';',dtype=object,encoding='utf-8-sig')
          e=pd.read_csv('outputs/V20.4.1_GITOK_ETF_266_DECISIONS.csv',sep=';',dtype=object,encoding='utf-8-sig')
          au=json.loads(Path('outputs/audit/V20.4.1_CORRECTIVE_AUDIT.json').read_text(encoding='utf-8'))
          assert len(a)==1829 and a['isin'].nunique()==1829
          assert len(e)==266 and e['ISIN'].astype(str).nunique()==266
          assert au.get('passed') is True
          assert au.get('smart_money_integrated') is False
          assert au.get('live_order_execution_enabled') is False
          live={'LIVE','ORDER','EXECUTE','BROKER','REAL_ORDER','LIVE_ORDER'}
          assert not a.execution.astype(str).str.upper().isin(live).any()
          assert not e.execution.astype(str).str.upper().isin(live).any()
          print('V20_4_1_GATES_OK',a.decision.value_counts().to_dict(),e.decision.value_counts().to_dict())
          PY
      - name: Publish V20.4.1 summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          a=json.loads(Path('outputs/audit/V20.4.1_CORRECTIVE_AUDIT.json').read_text())
          print('## V20.4.1 Corrective Committee')
          print(f'- V20.4 source run: {__import__("os").environ.get("V204_SOURCE_RUN")}')
          print(f'- Actions V20.4: {a["actions_v204_decisions"]}')
          print(f'- Actions V20.4.1: {a["actions_v2041_decisions"]}')
          print(f'- ETF V20.4: {a["etf_v204_decisions"]}')
          print(f'- ETF V20.4.1: {a["etf_v2041_decisions"]}')
          print(f'- BUY overlap Actions: {a["actions_buy_overlap"]}')
          print('- Smart Money: NOT integrated')
          print('- Live/order execution: disabled')
          PY
      - name: Upload V20.4.1 evidence
        uses: actions/upload-artifact@v6
        with:
          name: V20.4.1-Corrective-1829-266-${{ github.run_id }}
          path: |
            outputs/V20.4.1_GITOK_ACTIONS_1829_DECISIONS.csv
            outputs/V20.4.1_GITOK_ETF_266_DECISIONS.csv
            outputs/V20.4.1_COMMITTEE_COMPARISON.xlsx
            outputs/audit/V20.4.1_CORRECTIVE_AUDIT.json
          if-no-files-found: error
          retention-days: 30
