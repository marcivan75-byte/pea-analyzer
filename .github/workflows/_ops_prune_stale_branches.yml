name: OPS - Prune stale branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_ops_prune_stale_branches.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete stale audit automation and ops branches
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error, urllib.parse
          repo=os.environ['REPO']; token=os.environ['TOKEN']
          branches=[
            'audit/fmp-key-smoke',
            'audit/marketbeat-key-smoke',
            'audit/marketbeat-schema-smoke-v182',
            'audit/twelvedata-key-smoke',
            'audit/v18-2-consensus-momentum-final',
            'audit/v18-2-marketbeat-consensus-integration',
            'audit/v18-2-release-candidate-hardening',
            'automation/v18-2-refresh-31154099324',
            'automation/v18-2-refresh-31157092616',
            'automation/v18-2-refresh-31259775797',
            'automation/v18-2-refresh-31260728029',
            'feature/v18-2-consensus-momentum',
            'fix/v18-2-waves-resilience',
            'ops/cancel-stale-queue-20260809',
            'sync/v21-into-backtest-optimizer',
            'tmp-noop',
          ]
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10','User-Agent':'branch-pruner'}
          results=[]
          for branch in branches:
              ref='heads/'+branch
              encoded=urllib.parse.quote(ref,safe='')
              url=f'https://api.github.com/repos/{repo}/git/refs/{encoded}'
              req=urllib.request.Request(url,method='DELETE',headers=headers)
              try:
                  with urllib.request.urlopen(req) as r: code=r.status
              except urllib.error.HTTPError as e:
                  code=e.code
                  print('DELETE_BRANCH',branch,'HTTP',code,e.read().decode('utf-8','replace'))
              else:
                  print('DELETE_BRANCH',branch,'HTTP',code)
              results.append((branch,code))
          print('RESULTS',results)
          print('DELETED_COUNT',sum(1 for _,c in results if c==204))
          failed=[x for x in results if x[1] not in (204,404)]
          if failed: raise SystemExit(f'FAILED={failed}')
          PY
