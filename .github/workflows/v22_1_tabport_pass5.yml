name: V22.1 TABPORT pass 5 realistic portfolio

on:
  workflow_dispatch:
  push:
    branches: [v22/pit-mae-mfe-preopen]
    paths:
      - scripts/v22_1_portfolio_robustness_pass5.py
      - .github/workflows/v22_1_tabport_pass5.yml

permissions:
  contents: read
  actions: read

env:
  BACKTEST_RUN_ID: '33420487572'
  PASS4_RUN_ID: '33447685885'
  HISTORY_RUN_ID: '33393842087'

jobs:
  realistic-portfolio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: python -m pip install --prefer-binary 'pandas>=2.2' 'numpy>=2.0' 'pyarrow>=18'
      - name: Download governed ledger, daily OHLC and frozen pass 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs pass4 history
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKTEST_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("v22-1-historical-weekly-backtest-")) | .name' | head -n1)"
          p4="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PASS4_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("v22-1-tabport-pass4-")) | .name' | head -n1)"
          hist="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${HISTORY_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("pea-history-2010-2026-")) | .name' | head -n1)"
          test -n "$artifact" && test -n "$p4" && test -n "$hist" || { echo 'BLOCK_PASS5_DATA: upstream artifact missing'; exit 1; }
          gh run download "$BACKTEST_RUN_ID" -n "$artifact" -D inputs
          gh run download "$PASS4_RUN_ID" -n "$p4" -D pass4
          gh run download "$HISTORY_RUN_ID" -n "$hist" -D history
          test -f inputs/V22_1_TRAIN.csv
          test -f pass4/PASS4_REPORT.json
          test -f pass4/PASS4_SELECTED_PRE2023.csv
          test -f history/PEA_OHLCV_2010_2026_CONSOLIDATED.parquet
      - name: Normalize governed signal timestamp for exact causal join
        run: |
          python - <<'PY'
          import pandas as pd
          p='inputs/V22_1_TRAIN.csv'
          x=pd.read_csv(p,low_memory=False)
          d=pd.to_datetime(x['as_of_date'],errors='coerce')
          x['as_of_date']=d.dt.normalize().dt.strftime('%Y-%m-%d')
          x.to_csv(p,index=False)
          PY
      - name: Run realistic portfolio robustness
        run: |
          python scripts/v22_1_portfolio_robustness_pass5.py \
            --train inputs/V22_1_TRAIN.csv \
            --pass4-selected pass4/PASS4_SELECTED_PRE2023.csv \
            --pass4-report pass4/PASS4_REPORT.json \
            --price-parquet history/PEA_OHLCV_2010_2026_CONSOLIDATED.parquet \
            --out-dir outputs/pass5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v22-1-tabport-pass5-${{ github.run_id }}
          path: outputs/pass5
          if-no-files-found: error
