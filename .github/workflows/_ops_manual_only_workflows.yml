name: OPS - Manual-only workflow hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_ops_manual_only_workflows.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Convert V20.7 and V21.0 to manual-only and prune backtest copies
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, json, base64, re, urllib.request, urllib.error, urllib.parse
          repo=os.environ['REPO']; token=os.environ['TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10','User-Agent':'manual-only-hardener'}
          files=['.github/workflows/V20.7_etf102_only.yml','.github/workflows/V21.0_actions1429_only.yml']
          def call(url,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,method=method,headers=headers,data=data)
              try:
                  with urllib.request.urlopen(req) as r:
                      b=r.read(); return r.status, (json.loads(b) if b else None)
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  print('HTTP',e.code,method,url,body)
                  return e.code,None
          def contents_url(path,ref=None):
              p=urllib.parse.quote(path,safe='/')
              u=f'https://api.github.com/repos/{repo}/contents/{p}'
              if ref: u += '?ref='+urllib.parse.quote(ref,safe='')
              return u
          for path in files:
              code,obj=call(contents_url(path,'feature/smart-money-v1'))
              assert code==200 and obj
              raw=base64.b64decode(obj['content']).decode('utf-8')
              new,n=re.subn(r'(?ms)^on:\n  workflow_dispatch:\n  push:\n.*?\n\npermissions:', 'on:\n  workflow_dispatch:\n\npermissions:', raw, count=1)
              assert n==1, f'trigger block not found in {path}'
              assert '\n  push:' not in new.split('\npermissions:',1)[0]
              payload={'message':f'ci: make {path.split("/")[-1]} manual-only','content':base64.b64encode(new.encode()).decode(),'sha':obj['sha'],'branch':'feature/smart-money-v1'}
              c,_=call(contents_url(path),'PUT',payload)
              print('MANUAL_ONLY',path,c)
              assert c in (200,201)
          for path in files:
              code,obj=call(contents_url(path,'feature/backtest-optimizer-v1'))
              if code==404:
                  print('BACKTEST_ALREADY_PRUNED',path); continue
              assert code==200 and obj
              payload={'message':f'ci: remove workflow duplicate {path.split("/")[-1]} from backtest branch','sha':obj['sha'],'branch':'feature/backtest-optimizer-v1'}
              c,_=call(contents_url(path),'DELETE',payload)
              print('BACKTEST_DELETE',path,c)
              assert c==200
          print('MANUAL_ONLY_HARDENING_OK')
          PY
