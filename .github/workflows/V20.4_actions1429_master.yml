name: V20.4 Actions 1429 Canonical Master

on:
  push:
    branches:
      - feature/smart-money-v1
    paths:
      - ".github/workflows/V20.4_actions1429_master.yml"
      - "src/v182/decision/actions_universe_1429_master.py"
      - "data/reference/PEA_ACTIONS_1429_EXCLUSIONS.csv"
      - "state/v20.4_actions1429.trigger"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v204-actions1429-master
  cancel-in-progress: true

jobs:
  build-actions1429-master:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -c constraints-ci.txt -e .[test]

      - name: Reuse latest successful validated V20.4 dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v204-bootstrap outputs
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired == false) | select((.name | startswith("V20.4-GitOK-end-to-end-")) or (.name | startswith("V20.4-GitOK-full-cycle-")) or (.name | startswith("V20.4-GitOK-reference-"))) | [.id, .workflow_run.id, .name] | @tsv' \
            > /tmp/v204-bootstrap/candidates.tsv
          FOUND=0
          while IFS=$'\t' read -r ARTIFACT_ID SOURCE_RUN ARTIFACT_NAME; do
            [ -n "${ARTIFACT_ID:-}" ] || continue
            CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.conclusion // ""' 2>/dev/null || true)
            [ "$CONCLUSION" = "success" ] || continue
            rm -rf /tmp/v204-bootstrap/extract
            mkdir -p /tmp/v204-bootstrap/extract
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/v204-bootstrap/artifact.zip || continue
            unzip -oq /tmp/v204-bootstrap/artifact.zip -d /tmp/v204-bootstrap/extract || continue
            SRC=$(find /tmp/v204-bootstrap/extract -name V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv -print -quit)
            [ -n "$SRC" ] || continue
            cp "$SRC" outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv
            echo "SOURCE_RUN=$SOURCE_RUN" >> "$GITHUB_ENV"
            echo "SOURCE_ARTIFACT=$ARTIFACT_NAME" >> "$GITHUB_ENV"
            FOUND=1
            break
          done < /tmp/v204-bootstrap/candidates.tsv
          test "$FOUND" = "1" || { echo "NO_VALIDATED_V20.4_DATASET"; exit 1; }

      - name: Build canonical 1429 enriched master
        run: python -m v182.decision.actions_universe_1429_master

      - name: Validate 1429 x >=150 quality gates
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path('outputs/V20.4_GITOK_ACTIONS_1429_MASTER_ENRICHED.csv')
          df=pd.read_csv(p,sep=';',dtype=object,encoding='utf-8-sig')
          assert len(df)==1429, len(df)
          assert df['isin'].astype(str).nunique()==1429
          assert len(df.columns)>=150, len(df.columns)
          assert df['canonical_execution_guard'].eq('NO_LIVE_EXECUTION').all()
          a=json.loads(Path('outputs/audit/V20.4_ACTIONS_1429_MASTER_AUDIT.json').read_text(encoding='utf-8'))
          assert a.get('passed') is True, a
          assert a.get('smart_money_enabled') is False
          assert a.get('live_order_execution_enabled') is False
          print('ACTIONS1429_MASTER_OK',len(df),len(df.columns))
          print('SOURCE_RUN', '${{ env.SOURCE_RUN }}')
          PY

      - name: Publish summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          a=json.loads(Path('outputs/audit/V20.4_ACTIONS_1429_MASTER_AUDIT.json').read_text(encoding='utf-8'))
          print('## V20.4 canonical Actions 1429')
          print(f"- Rows: {a['rows']}")
          print(f"- Unique ISIN: {a['unique_isin']}")
          print(f"- Columns: {a['columns']}")
          print(f"- Exclusions audited: {a['excluded_isin']}")
          print('- Smart Money: disabled')
          print('- Live/order execution: disabled')
          PY

      - name: Upload canonical 1429 master
        uses: actions/upload-artifact@v6
        with:
          name: V20.4-Actions1429-Master-${{ github.run_id }}
          path: |
            outputs/V20.4_GITOK_ACTIONS_1429_MASTER_ENRICHED.csv
            outputs/audit/V20.4_ACTIONS_1429_MASTER_AUDIT.json
          if-no-files-found: error
          retention-days: 30
