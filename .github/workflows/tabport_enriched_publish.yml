name: TABPORT enriched publication

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - 'v182/hebdo/tabport_enriched.py'
      - 'v182/hebdo/tabport_publish.py'
      - 'v182/hebdo/tabport_antifp.py'
      - 'v182/hebdo/tabport_antifp_publish.py'
      - 'v182/hebdo/tabport_antifp_attribution.py'
      - 'v182/hebdo/tabport_walkforward.py'
      - 'v182/hebdo/tabport_walkforward_publish.py'
      - 'tests/test_tabport_enriched_publish.py'
      - '.github/workflows/tabport_enriched_publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabport-enriched-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Restore governed historical OHLCV cache
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Require governed cache
        run: |
          test -d data/cache/actions
          test -n "$(find data/cache/actions -name 'history_*.parquet' -print -quit)"
          echo "CACHE_HIT=${{ steps.cache.outputs.cache-hit }}"
          echo "CACHE_MATCHED_KEY=${{ steps.cache.outputs.cache-matched-key }}"
      - name: Install runtime
        run: |
          python -m pip install --prefer-binary -r requirements-runtime.txt
          python -m pip install pytest scikit-learn scipy
      - name: Compile publisher
        run: python -m compileall -q v182/hebdo
      - name: Test enriched analytics
        run: python -m pytest -q tests/test_backtest_B_v2.py tests/test_tabport_enriched_publish.py tests/test_tabport_historical_meta.py tests/test_tabport_meta.py
      - name: Publish TABPORT enriched baseline
        run: python -m v182.hebdo.tabport_publish --cache data/cache/actions --output-dir outputs/tabport_enriched
      - name: Publish anti-FP ablation matrix
        run: python -m v182.hebdo.tabport_antifp_publish --cache data/cache/actions --output-dir outputs/tabport_antifp
      - name: Publish paired anti-FP attribution
        run: python -m v182.hebdo.tabport_antifp_attribution --root outputs/tabport_antifp
      - name: Publish walk-forward calibration diagnostic
        run: python -m v182.hebdo.tabport_walkforward_publish --cache data/cache/actions --output-dir outputs/tabport_walkforward
      - name: Validate publication contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('outputs/tabport_enriched')
          pub=json.loads((out/'TABPORT_PUBLICATION.json').read_text())
          assert pub['status']=='PUBLISHED', pub
          required=['TABPORT_ENRICHI.md','TABPORT_LEDGER_ENRICHI.csv','TABPORT_DAILY_NAV.csv','TABPORT_TRIMESTRIEL_ENRICHI.csv','TABPORT_ANNUEL_ENRICHI.csv','TABPORT_ENRICHI_SUMMARY.json','TABPORT_MANIFEST.json','TABPORT_META_SIGNALS_MATURES.csv']
          for name in required:
              p=out/name; assert p.exists() and p.stat().st_size>0, name
          anti=Path('outputs/tabport_antifp')
          diag=json.loads((anti/'TABPORT_ANTIFP_DIAGNOSTIC.json').read_text())
          required_scenarios={'BASELINE','CONFIRM_J1_ONLY','CONFIRM_FAIL_FAST','CONFIRM_TRAIL_BE','CONFIRM_MOM_DEAD_J3','CONFIRM_FAIL_FAST_TRAIL','CONFIRM_FAIL_FAST_MOM','FULL_ANTIFP'}
          assert diag['status']=='PUBLISHED' and required_scenarios == {r['scenario'] for r in diag['scenarios']}, diag
          attr=json.loads((anti/'TABPORT_ANTIFP_PAIRED_ATTRIBUTION.json').read_text())
          assert attr['status']=='PUBLISHED' and attr['reference']=='CONFIRM_J1_ONLY', attr
          wf=Path('outputs/tabport_walkforward')
          wfdiag=json.loads((wf/'TABPORT_WF_DIAGNOSTIC.json').read_text())
          assert wfdiag['status'] in {'PUBLISHED','BLOCKED'}, wfdiag
          for name in ['TABPORT_ANTIFP_COMPARAISON.csv','TABPORT_CONFIRMATION_J1_AUDIT.csv','TABPORT_SIGNALS_CONFIRMES.csv','TABPORT_ANTIFP_PAIRED_ATTRIBUTION.csv','TABPORT_ANTIFP_PAIRED_DETAIL.csv']:
              p=anti/name; assert p.exists() and p.stat().st_size>0, name
          for name in ['TABPORT_WF_CANDIDATES.csv','TABPORT_WF_MATURE_OUTCOMES.csv','TABPORT_WF_MODEL_VINTAGES.csv','TABPORT_WF_DIAGNOSTIC.json']:
              p=wf/name; assert p.exists() and p.stat().st_size>0, name
          print(json.dumps({'anti_fp':diag,'attribution':attr,'walkforward':wfdiag},indent=2))
          PY
      - name: Upload TABPORT enriched publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TABPORT-ENRICHI-${{ github.run_id }}
          path: |
            outputs/tabport_enriched/
            outputs/tabport_antifp/
            outputs/tabport_walkforward/
          if-no-files-found: error
          retention-days: 30
