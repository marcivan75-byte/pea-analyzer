name: V18.2 MarketBeat Integration CI

on:
  push:
    branches:
      - audit/v18-2-marketbeat-consensus-integration
      - audit/v18-2-consensus-momentum-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18-2-marketbeat-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints-ci.txt -e .[test]
      - run: python -m pip check
      - run: python -m compileall -q src tests
      - run: ruff check --select E9,F63,F7,F82 src tests
      - run: pytest -q