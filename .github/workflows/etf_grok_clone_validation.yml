name: ETF GROK clone validation

on:
  pull_request:
    paths:
      - 'config/V20.8_ETF_GROK_HIGH_PRECISION.json'
      - 'config/V20.8.2_ETF_GROK_DYNAMIC.json'
      - 'src/v182/decision/etf_grok_high_precision.py'
      - 'src/v182/features/etf_grok_*.py'
      - 'src/v182/reporting/etf_grok_v2081_run.py'
      - 'tests/test_etf_grok_clone.py'
      - '.github/workflows/etf_grok_*.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

jobs:
  validate-etf-grok:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest

      - name: Compile GROK modules
        run: |
          python -m py_compile \
            src/v182/decision/etf_grok_high_precision.py \
            src/v182/features/etf_grok_v2081.py \
            src/v182/features/etf_grok_history_integrity.py \
            src/v182/features/etf_grok_v2082_dynamic.py \
            src/v182/reporting/etf_grok_v2081_run.py

      - name: Validate JSON
        run: |
          python -m json.tool config/V20.8_ETF_GROK_HIGH_PRECISION.json >/dev/null
          python -m json.tool config/V20.8.2_ETF_GROK_DYNAMIC.json >/dev/null

      - name: Run clone parity and isolation tests
        run: python -m pytest -q tests/test_etf_grok_clone.py

      - name: Audit forbidden coupling
        run: |
          ! grep -R "from v182\.decision\.etf_mt\|from v182\.features\.etf_mt" \
            src/v182/decision/etf_grok_high_precision.py \
            src/v182/features/etf_grok_v2081.py \
            src/v182/features/etf_grok_history_integrity.py \
            src/v182/features/etf_grok_v2082_dynamic.py \
            src/v182/reporting/etf_grok_v2081_run.py
          ! grep -R "outputs/etf_mt\|data/cache/etf_mt" \
            src/v182/reporting/etf_grok_v2081_run.py \
            .github/workflows/etf_grok_v20_8_on_demand.yml

  live-grok-smoke:
    needs: validate-etf-grok
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      ETF_GROK_RUN_ID: PR-${{ github.event.pull_request.number }}-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Execute live ETF GROK runner
        run: python -m v182.reporting.etf_grok_v2081_run

      - name: Verify strict and challenger outputs
        run: |
          test -s outputs/etf_grok_v2081/V20.8.1_ETF_GROK_RANKING.csv
          test -s outputs/etf_grok_v2081/V20.8.1_ETF_GROK_SUMMARY.json
          test -s outputs/etf_grok_v2081/V20.8.2_ETF_GROK_DYNAMIC_RANKING.csv
          test -s outputs/etf_grok_v2081/V20.8.2_ETF_GROK_DYNAMIC_SUMMARY.json
          python - <<'PY'
          import json
          from pathlib import Path
          strict=json.loads(Path('outputs/etf_grok_v2081/V20.8.1_ETF_GROK_SUMMARY.json').read_text())
          dynamic=json.loads(Path('outputs/etf_grok_v2081/V20.8.2_ETF_GROK_DYNAMIC_SUMMARY.json').read_text())
          assert strict['process']=='ETF_GROK'
          assert strict['real_orders_allowed'] is False
          assert strict['legacy_exit_policy_role']=='BACKTEST_REPLAY_ONLY'
          assert strict['current_entry_exit_authority']=='V21.8_ENTRY_EXIT_BASELINE'
          assert dynamic['real_orders_allowed'] is False
          assert dynamic['promotion_allowed'] is False
          assert strict['download']['successful'] > 0
          assert strict['universe_histories'] > 0
          print(json.dumps({'strict_scorable': strict['scorable_etfs'], 'dynamic_scorable': dynamic['scorable_etfs'], 'regime_allowed': dynamic['regime']['allowed'], 'selected': len(dynamic['selected'])}, ensure_ascii=False))
          PY

      - name: Publish live GROK proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ETF_GROK_LIVE_PROOF_${{ github.run_id }}
          path: outputs/etf_grok_v2081/
          if-no-files-found: error
          retention-days: 7
