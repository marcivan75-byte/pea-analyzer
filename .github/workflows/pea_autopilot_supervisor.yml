name: PEA Autopilot Supervisor

on:
  workflow_run:
    workflows:
      - "V22.1 CI corrections + canonical 2010-2019 data"
      - "V22.1 prepare historical data"
      - "V22 PIT True PnL PREOPEN validation"
      - "Action CT V22 validation"
      - "TCT module validation"
      - "Committee Master V21.8.1 data and code audit validation"
      - "Action Identity Hydration V21.9 Audit"
      - "ETF V21.18.1R4 distribution validation"
      - "V4 Hebdo validation"
    types: [completed]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: "Completed upstream run ID for manual supervision"
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: pea-autopilot-wip-1
  cancel-in-progress: false

jobs:
  supervise:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout supervisor package from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: .autopilot
          fetch-depth: 1

      - name: Resolve upstream metadata
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME_UPSTREAM: ${{ github.event.workflow_run.name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          MANUAL_RUN_ID: ${{ inputs.upstream_run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            json="$(gh api "repos/$REPO/actions/runs/$MANUAL_RUN_ID")"
            run_id="$(jq -r '.id' <<<"$json")"
            name="$(jq -r '.name' <<<"$json")"
            conclusion="$(jq -r '.conclusion' <<<"$json")"
            branch="$(jq -r '.head_branch // ""' <<<"$json")"
            sha="$(jq -r '.head_sha // ""' <<<"$json")"
            attempt="$(jq -r '.run_attempt' <<<"$json")"
          else
            run_id="$EVENT_RUN_ID"
            name="$EVENT_NAME_UPSTREAM"
            conclusion="$EVENT_CONCLUSION"
            branch="$EVENT_BRANCH"
            sha="$EVENT_SHA"
            attempt="$EVENT_ATTEMPT"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          if [ "$conclusion" != "success" ] && [ "$name" = "V22.1 CI corrections + canonical 2010-2019 data" ] && [ -n "$branch" ]; then
            echo "needs_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_target=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream branch only when deterministic remediation is eligible
        if: steps.upstream.outputs.needs_target == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.upstream.outputs.branch }}
          path: target
          fetch-depth: 8

      - name: Set up Python only when deterministic remediation is eligible
        if: steps.upstream.outputs.needs_target == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: target/pyproject.toml

      - name: Install target CI runtime only when deterministic remediation is eligible
        if: steps.upstream.outputs.needs_target == 'true'
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/target/constraints-ci.txt
        run: python -m pip install -e "./target[test]"

      - name: Supervise, report and safely remediate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PEA_TARGET_ROOT: ${{ github.workspace }}/target
          PYTHONPATH: ${{ github.workspace }}/target/src
          UPSTREAM_RUN_ID: ${{ steps.upstream.outputs.run_id }}
          UPSTREAM_NAME: ${{ steps.upstream.outputs.name }}
          UPSTREAM_CONCLUSION: ${{ steps.upstream.outputs.conclusion }}
          UPSTREAM_HEAD_BRANCH: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_HEAD_SHA: ${{ steps.upstream.outputs.sha }}
          UPSTREAM_RUN_ATTEMPT: ${{ steps.upstream.outputs.attempt }}
        run: python .autopilot/scripts/pea_autopilot.py

      - name: Hard-chain next governed phase after success
        if: steps.upstream.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UPSTREAM_RUN_ID: ${{ steps.upstream.outputs.run_id }}
          UPSTREAM_NAME: ${{ steps.upstream.outputs.name }}
          BRANCH: ${{ steps.upstream.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=""
          case "$UPSTREAM_NAME" in
            "V22.1 CI corrections + canonical 2010-2019 data")
              workflow="v22_1_prepare_historical_data.yml"
              ;;
            "V22.1 prepare historical data")
              workflow="hebdo_at_chat_v22_1.yml"
              ;;
            *)
              echo "No governed successor for $UPSTREAM_NAME"
              exit 0
              ;;
          esac

          upstream_json="$(gh api "repos/$REPO/actions/runs/$UPSTREAM_RUN_ID")"
          completed_at="$(jq -r '.updated_at' <<<"$upstream_json")"
          existing="$(gh api "repos/$REPO/actions/workflows/$workflow/runs?branch=$(python -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["BRANCH"], safe=""))')&event=workflow_dispatch&per_page=20")"
          if jq -e --arg t "$completed_at" '.workflow_runs[]? | select(.created_at >= $t)' <<<"$existing" >/dev/null; then
            echo "Successor $workflow already dispatched after upstream completion; skip duplicate."
            exit 0
          fi

          echo "Dispatching $workflow on $BRANCH after successful $UPSTREAM_NAME #$UPSTREAM_RUN_ID"
          gh api --method POST "repos/$REPO/actions/workflows/$workflow/dispatches" -f ref="$BRANCH"

      - name: Upload supervisor report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pea-autopilot-report-${{ steps.upstream.outputs.run_id }}-attempt-${{ steps.upstream.outputs.attempt }}
          path: .autopilot/outputs/autopilot/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
