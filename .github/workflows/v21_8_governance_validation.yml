name: V21.8 governance validation

on:
  push:
    branches:
      - agent/v21-8-entry-exit-governance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile governance
        run: python -m compileall -q src/v182/risk src/v182/reporting
      - name: Focused tests
        run: python -m pytest -q tests/test_entry_exit_governance_v21_8.py tests/test_tct_exact_v24_1_7.py
      - name: Governance assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/V21_8_ENTRY_EXIT_GOVERNANCE.json').read_text())
          assert cfg['position_management']['fixed_take_profit_enabled'] is False
          assert cfg['risk']['legacy_fixed_stop_engine_enabled_in_v21_8'] is False
          assert cfg['entry_gate']['tct_requires_exact_t2_confirmation'] is True
          assert cfg['scope']['t1_t2_scope']=='ACTION_TCT_ONLY'
          assert cfg['scope']['real_orders_enabled'] is False
          print('V21.8 governance assertions PASS')
          PY
