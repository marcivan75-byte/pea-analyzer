name: V21.14 TEMP real ETF CT LT shadow qualification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v21-14-etf-ct-lt-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-real-etf-ct-lt:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PEA_PROVENANCE_PATH: state/provenance/OBSERVATION_PROVENANCE.csv
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Restore OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/
          key: v21-14-etf-ct-lt-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - name: Restore provenance and source caches
        uses: actions/cache/restore@v4
        with:
          path: state/provenance/
          key: v21-14-provenance-${{ github.run_id }}
          restore-keys: |
            daily-provenance-v2181-
            provenance-v2181-
            provenance-v2161-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .[test]

      - name: Compile and targeted tests
        run: |
          python -m compileall -q src tests
          ruff check src/v182/features/etf_ct_lt_shadow_v21_14.py src/v182/reporting/etf_ct_lt_shadow_run_v21_14.py tests/test_etf_ct_lt_shadow_v21_14.py
          pytest -q tests/test_etf_ct_lt_shadow_v21_14.py

      - name: Run real daily collection and enrichment
        run: python -m v182.reporting.run

      - name: Refresh V21.13 history-depth context
        run: python -m v182.audit.ohlcv_history_depth --as-of 2026-08-20

      - name: Run V21.14 ETF CT LT shadow
        run: python -m v182.reporting.etf_ct_lt_shadow_run_v21_14

      - name: Verify real V21.14 outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          audit = json.loads(Path('outputs/audit/ETF_CT_LT_V21_14_SHADOW.json').read_text(encoding='utf-8'))
          rows = pd.read_csv('outputs/etf_ct_lt_shadow/ETF_CT_LT_SHADOW.csv', sep=';', encoding='utf-8-sig')
          assert audit['version'] == 'V21.14_ETF_CT_LT_SHADOW_2026_08_20'
          assert audit['mode'] == 'SHADOW_ONLY'
          assert audit['canonical_universe_count'] == 102
          assert audit['decision_influence'] == 0.0
          assert audit['mt_reference_score_influence'] == 0.0
          assert audit['real_orders_allowed'] is False
          assert audit['t1_t2_forbidden'] is True
          assert audit['stress_calibration_weight'] == 0.0
          assert len(rows) == 204
          assert set(rows['horizon']) == {'CT', 'LT'}
          assert rows.groupby('horizon')['isin'].nunique().to_dict() == {'CT': 102, 'LT': 102}
          assert not rows['real_orders_allowed'].astype(bool).any()
          assert not rows['promotion_allowed'].astype(bool).any()
          assert not rows['t1_t2_enabled'].astype(bool).any()
          assert not rows['shadow_context'].astype(str).str.contains('BUY|SELL', case=False, regex=True).any()
          observed_scores = pd.to_numeric(rows['shadow_score'], errors='coerce').dropna()
          assert observed_scores.between(0, 100).all()
          for horizon in ('CT', 'LT'):
              info = audit['horizons'][horizon]
              assert info['universe_rows'] == 102
              assert info['minimum_weighted_coverage'] == 0.70
              assert info['minimum_cross_section_observations'] == 21
              assert info['promotion_allowed'] is False
              assert info['real_orders_allowed'] is False
              assert info['t1_t2_forbidden'] is True
              print('V21_14_REAL_HORIZON', horizon, json.dumps({
                  'scorable_rows': info['scorable_rows'],
                  'blocked_rows': info['blocked_rows'],
                  'rankable_cross_section_criteria': info['rankable_cross_section_criteria'],
                  'blocked_cross_section_criteria': info['blocked_cross_section_criteria'],
                  'cross_section_observed_counts': info['cross_section_observed_counts'],
              }, sort_keys=True))
          print('V21_14_HISTORY_CONTEXT', json.dumps(audit.get('v21_13_history_depth_context', {}), sort_keys=True))
          PY

      - name: Upload V21.14 real evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V21_14_ETF_CT_LT_REAL_${{ github.run_id }}
          path: |
            outputs/etf_ct_lt_shadow/ETF_CT_LT_SHADOW.csv
            outputs/audit/ETF_CT_LT_V21_14_SHADOW.json
            outputs/mobile/ETF_CT_LT_SHADOW.md
            outputs/audit/OHLCV_PRIMARY_HISTORY_DEPTH_SUMMARY.json
            outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
          if-no-files-found: error
          retention-days: 14
