name: ONEOFF Full Timing Committee 2026-08-22

on:
  push:
    branches:
      - ops/full-run-timing-20260822
    paths:
      - RUN_TOTAL_NOW.txt

concurrency:
  group: oneoff-full-timing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

jobs:
  full-timing-run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PEA_SLOW_SOURCE_MODE: LIVE
      PEA_PROVENANCE_PATH: state/provenance/OBSERVATION_PROVENANCE.csv
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - name: Restore consolidated tactical decision state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/
          key: decision-state-v1-${{ github.run_id }}
          restore-keys: |
            decision-state-v1-

      - name: Restore consolidated weekly research state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            state/sector_rotation_v2/
            state/etf_fund_flows/
          key: weekly-research-state-v1-${{ github.run_id }}
          restore-keys: |
            weekly-research-state-v1-

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-runtime.txt

      - name: Install production runtime
        run: pip install --prefer-binary -r requirements-runtime.txt

      - name: Publish Action identity hydration worklist
        run: python -m v182.audit.identity_hydration

      - name: Run weekly unified Committee pipeline
        run: python -m v182.reporting.unified_runner

      - name: Replay governed ETF structural state V21.15 for tactical outputs
        continue-on-error: true
        run: python -m v182.reporting.etf_structure_state_replay

      - name: TCT CT scoring and V21.8
        run: python -m v182.reporting.daily_tct_ct_runner

      - name: Action CT V22.0 V22.1 + TCT V24.3.1 shared-parquet SHADOW
        continue-on-error: true
        run: python -m v182.reporting.tactical_shadow_bundle_run

      - name: POSTMARKET V24.4.2 OHLC + catalyst + lineage + validator single-process
        continue-on-error: true
        run: python -m v182.reporting.tct_postmarket_bundle_run

      - name: Build synthetic decision brief
        if: always()
        run: python -m v182.reporting.decision_brief

      - name: Run ETF Fund Flows V1 SHADOW context
        continue-on-error: true
        run: python -m v182.reporting.etf_fund_flows_shadow_run

      - name: Audit criteria governance
        run: python -m v182.reporting.criteria_governance_audit

      - name: Show timing summaries
        if: always()
        run: |
          for f in \
            outputs/audit/UNIFIED_RUNTIME_V21_13_7.json \
            outputs/audit/ACTION_CT_SHARED_HISTORY_RUNTIME_V21_13_10.json \
            outputs/audit/TACTICAL_SHARED_PARQUET_RUNTIME_V21_13_11.json \
            outputs/audit/POSTMARKET_BUNDLE_RUNTIME_V21_13_12.json \
            outputs/unified/UNIFIED_SUMMARY_LATEST.json \
            outputs/committee_master/SUMMARY.json \
            outputs/decision_brief/DECISION_BRIEF.json; do
              if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done

      - name: Publish CI summaries to job summary
        if: always()
        run: |
          if [ -f outputs/decision_brief/DECISION_BRIEF.md ]; then cat outputs/decision_brief/DECISION_BRIEF.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f outputs/mobile/ANDROID_CI_CONTROL_CENTER.md ]; then printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"; cat outputs/mobile/ANDROID_CI_CONTROL_CENTER.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f outputs/mobile/RISK_V1_1_CONTROL_CENTER.md ]; then printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"; cat outputs/mobile/RISK_V1_1_CONTROL_CENTER.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f outputs/mobile/ETF_FUND_FLOWS_SHADOW.md ]; then printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"; cat outputs/mobile/ETF_FUND_FLOWS_SHADOW.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md ]; then printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"; cat outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save persistent OHLCV cache
        if: ${{ success() && hashFiles('data/cache/**') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-${{ github.run_id }}

      - name: Save consolidated tactical decision state
        if: ${{ always() && (hashFiles('state/TCT_V24_1_7_T1_STATE.json', 'state/tct_context/**', 'state/action_ct/**', 'state/action_ct_v22_1/**', 'state/provenance/**') != '') }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/
          key: decision-state-v1-${{ github.run_id }}

      - name: Save consolidated weekly research state
        if: ${{ always() && (hashFiles('state/sector_rotation_v2/**', 'state/etf_fund_flows/**') != '') }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            state/sector_rotation_v2/
            state/etf_fund_flows/
          key: weekly-research-state-v1-${{ github.run_id }}

      - name: Upload complete Committee results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oneoff-full-timing-${{ github.run_id }}
          path: |
            outputs/unified/
            outputs/decision_brief/
            outputs/committee_master/
            outputs/etf_mt_v2081/
            outputs/etf_fund_flows/
            outputs/sector_rotation/
            outputs/risk/
            outputs/mobile/
            outputs/data_audit/
            outputs/audit/
            outputs/gaps/
            outputs/V21_3_SECTOR_ROTATION.csv
            outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv
            outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
            data/cache/actions/history_manifest.json
            data/cache/etf/history_manifest.json
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/sector_rotation_v2/
            state/etf_fund_flows/
            state/provenance/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14
