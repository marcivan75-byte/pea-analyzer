name: HEBDO AT META volume certification

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - '.github/workflows/hebdo_at_meta_volume_certification.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  volume-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --prefer-binary pandas numpy pyarrow
      - name: Restore governed 2023-2026 holdout cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Download governed PRE2023 corpus
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9817322742'
        run: |
          mkdir -p inputs/pre2023
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/pre2023.zip
          unzip -q /tmp/pre2023.zip -d inputs/pre2023
          test -s inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet
          test -s inputs/pre2023/PRE2023_YAHOO_CORPUS_MANIFEST.json
          test -d data/cache/actions
      - name: Audit volume usability
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from v182.hebdo.meta_price_history import load_2010_2026

          df=load_2010_2026(
              'inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet',
              'inputs/pre2023/PRE2023_YAHOO_CORPUS_MANIFEST.json',
              'data/cache/actions')
          df=df.sort_values(['ticker','date']).copy()
          df['volume']=pd.to_numeric(df['volume'],errors='coerce')
          df['close']=pd.to_numeric(df['close'],errors='coerce')
          df['zero_volume']=df['volume'].eq(0)
          df['ret_abs_pct']=df.groupby('ticker')['close'].pct_change().abs()*100.0
          df['zero_with_move_gt1']=df['zero_volume'] & df['ret_abs_pct'].gt(1.0)
          df['zero_with_move_gt5']=df['zero_volume'] & df['ret_abs_pct'].gt(5.0)

          def longest_true_run(s):
              a=s.to_numpy(dtype=bool)
              best=cur=0
              for v in a:
                  if v:
                      cur+=1; best=max(best,cur)
                  else:
                      cur=0
              return int(best)

          rows=[]
          for ticker,g in df.groupby('ticker',sort=True):
              n=len(g); z=int(g['zero_volume'].sum())
              rows.append({
                  'ticker':ticker,
                  'rows':n,
                  'first_date':g['date'].min(),
                  'last_date':g['date'].max(),
                  'zero_volume_rows':z,
                  'zero_volume_pct':round(100*z/n,6),
                  'longest_zero_volume_streak':longest_true_run(g['zero_volume']),
                  'zero_volume_move_gt1_rows':int(g['zero_with_move_gt1'].sum()),
                  'zero_volume_move_gt5_rows':int(g['zero_with_move_gt5'].sum()),
                  'median_positive_volume':float(g.loc[g['volume'].gt(0),'volume'].median()) if g['volume'].gt(0).any() else np.nan,
              })
          t=pd.DataFrame(rows)

          # Usage classification is deliberately about volume-derived factors only.
          # Price rows remain governed separately by the OHLC certification workflow.
          conditions=[
              t['zero_volume_pct'].ge(90),
              t['zero_volume_pct'].ge(50),
              t['zero_volume_pct'].ge(20),
              t['zero_volume_pct'].ge(5),
          ]
          choices=['EXCLUDE_VOLUME_FACTORS','LOW_CONFIDENCE_VOLUME','USABLE_WITH_LIMITATION','GOOD_VOLUME_COVERAGE']
          t['volume_factor_status']=np.select(conditions,choices,default='CERTIFIED_VOLUME_COVERAGE')
          t.loc[t['zero_volume_move_gt5_rows'].gt(0) & t['volume_factor_status'].eq('CERTIFIED_VOLUME_COVERAGE'),'volume_factor_status']='GOOD_VOLUME_COVERAGE'

          annual=df.assign(year=df['date'].dt.year).groupby('year',as_index=False).agg(
              rows=('ticker','size'),
              tickers=('ticker','nunique'),
              zero_volume_rows=('zero_volume','sum'),
              zero_volume_move_gt1_rows=('zero_with_move_gt1','sum'),
              zero_volume_move_gt5_rows=('zero_with_move_gt5','sum'),
              median_volume=('volume','median'))
          annual['zero_volume_pct']=(100*annual['zero_volume_rows']/annual['rows']).round(6)

          status_counts=t['volume_factor_status'].value_counts().rename_axis('status').reset_index(name='tickers')
          suspicious=t[(t['zero_volume_pct'].ge(50)) | (t['zero_volume_move_gt5_rows'].gt(0))].sort_values(
              ['zero_volume_pct','zero_volume_move_gt5_rows'],ascending=False)

          out=Path('outputs/meta_volume_certification'); out.mkdir(parents=True,exist_ok=True)
          t.to_csv(out/'VOLUME_QUALITY_BY_TICKER_2010_2026.csv',index=False)
          annual.to_csv(out/'VOLUME_QUALITY_BY_YEAR_2010_2026.csv',index=False)
          suspicious.to_csv(out/'VOLUME_REVIEW_QUEUE_2010_2026.csv',index=False)
          status_counts.to_csv(out/'VOLUME_STATUS_COUNTS.csv',index=False)

          summary={
              'status':'OK',
              'rows':int(len(df)),
              'tickers':int(df['ticker'].nunique()),
              'zero_volume_rows':int(df['zero_volume'].sum()),
              'zero_volume_pct':round(100*df['zero_volume'].mean(),6),
              'zero_volume_move_gt1_rows':int(df['zero_with_move_gt1'].sum()),
              'zero_volume_move_gt5_rows':int(df['zero_with_move_gt5'].sum()),
              'status_counts':dict(zip(status_counts['status'],status_counts['tickers'].astype(int))),
              'policy':{
                  'CERTIFIED_VOLUME_COVERAGE':'zero_volume_pct < 5%',
                  'GOOD_VOLUME_COVERAGE':'5% <= zero_volume_pct < 20% or isolated suspicious zero-volume price moves',
                  'USABLE_WITH_LIMITATION':'20% <= zero_volume_pct < 50%',
                  'LOW_CONFIDENCE_VOLUME':'50% <= zero_volume_pct < 90%',
                  'EXCLUDE_VOLUME_FACTORS':'zero_volume_pct >= 90%'
              },
              'synthetic_repair':False,
          }
          (out/'VOLUME_CERTIFICATION_SUMMARY.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print('VOLUME_STATUS_COUNTS_BEGIN')
          print(status_counts.to_csv(index=False).strip())
          print('VOLUME_STATUS_COUNTS_END')
          print('TOP_VOLUME_REVIEW_BEGIN')
          print(suspicious.head(100).to_csv(index=False).strip())
          print('TOP_VOLUME_REVIEW_END')
          print(json.dumps(summary,indent=2))
          PY
      - name: Upload volume certification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hebdo-at-meta-volume-certification-${{ github.run_id }}
          path: outputs/meta_volume_certification/
          retention-days: 30
