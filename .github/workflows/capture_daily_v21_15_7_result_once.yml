name: OPS capture Daily V21.15.7 result once

on:
  push:
    branches:
      - codex/runtime-boursorama-shared-limiter-v21-15-2
    paths:
      - CAPTURE_DAILY_V21_15_7_RESULT_NOW.txt

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Capture latest dispatched Daily result
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: codex/runtime-boursorama-shared-limiter-v21-15-2
        run: |
          RUN_ID=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow committee_tct_ct_daily.yml --branch "${TARGET_BRANCH}" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "${RUN_ID}"
          gh run watch "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status || true
          gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json databaseId,status,conclusion,createdAt,startedAt,updatedAt,headSha,url,jobs > /tmp/daily-result.json
          B64=$(base64 -w0 /tmp/daily-result.json)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/OPS_DAILY_V21_15_7_RESULT.json" \
            -f message="ops: capture Daily V21.15.7 validation result" \
            -f content="${B64}" \
            -f branch="${TARGET_BRANCH}" >/dev/null
