name: V22.1 CI corrections + canonical 2010-2019 data

# Recovery trigger: tactical DAG contract aligned with governed callback wiring.
on:
  push:
    branches: [v22/pit-mae-mfe-preopen]
    paths:
      - ".github/workflows/v22_1_ci_fix_and_canonical_2010_2019.yml"
      - "scripts/maintenance_fix_v22_1_ci.py"
      - "scripts/build_canonical_ohlcv_2010_2019.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  correct-validate-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: v22/pit-mae-mfe-preopen
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install governed runtime and CI tooling
        run: python -m pip install -e ".[test]"

      - name: Apply source and legacy-contract corrections
        run: python scripts/maintenance_fix_v22_1_ci.py

      - name: Validate complete Python suite before data collection
        run: python -m pytest -q

      - name: Commit validated corrections to active V22 branch
        id: corrections
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts .github/workflows/action_ct_v22_validation.yml .github/workflows/committee_tct_ct_daily.yml
          git commit -m "fix(ci): align legacy gates with governed weekly V4.4"
          git push origin HEAD:v22/pit-mae-mfe-preopen
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build canonical PEA OHLCV history 2010-2019
        run: python scripts/build_canonical_ohlcv_2010_2019.py

      - name: Validate canonical artifact fail-closed
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          root=Path('outputs/canonical_ohlcv_2010_2019')
          manifest=json.loads((root/'MANIFEST.json').read_text(encoding='utf-8'))
          assert manifest['canonical_version']=='PEA_OHLCV_CANONICAL_2010_2019_V1'
          assert manifest['period']['start_inclusive']=='2010-01-01'
          assert manifest['period']['end_exclusive']=='2020-01-01'
          assert manifest['anti_lookahead']['current_fundamentals_used_as_history'] is False
          assert manifest['anti_lookahead']['future_returns_embedded'] is False
          data=pd.read_parquet(root/'PEA_OHLCV_2010_2019_CANONICAL.parquet')
          assert not data.empty
          dates=pd.to_datetime(data['date'])
          assert dates.min() >= pd.Timestamp('2010-01-01')
          assert dates.max() < pd.Timestamp('2020-01-01')
          assert {'ACTION','ETF'} & set(data['asset_class'].astype(str))
          assert data[['isin','ticker','date','close_raw']].notna().all(axis=1).any()
          print(manifest)
          PY

      - name: Save canonical 2010-2019 cache for future backtests
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: outputs/canonical_ohlcv_2010_2019/
          key: canonical-ohlcv-2010-2019-v1-${{ github.run_id }}

      - name: Upload canonical 2010-2019 dataset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pea-canonical-ohlcv-2010-2019-v1-${{ github.run_id }}
          path: outputs/canonical_ohlcv_2010_2019/
          if-no-files-found: error
          compression-level: 1
          retention-days: 90
