name: ACTION MT V1 shadow tests

on:
  pull_request:
    paths:
      - "src/v182/features/action_mt_v1.py"
      - "config/ACTION_MT_V1_0_0_SHADOW.json"
      - "tests/test_action_mt_v1.py"
      - ".github/workflows/action_mt_v1_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-mt-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate ACTION MT V1
        run: python -m pytest -q tests/test_action_mt_v1.py
      - name: Validate the decision contract and abstention probes
        run: python scripts/validate_action_mt_ci.py
      - name: Publish the decision audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-mt-ci-decision-audit
          path: outputs/audit/ACTION_MT_CI_DECISION.json
          if-no-files-found: error

