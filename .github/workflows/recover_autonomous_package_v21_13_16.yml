name: Recover Autonomous Package V21.13.16

on:
  pull_request:

permissions:
  contents: read

jobs:
  recover-autonomous-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable final release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 694e23821b57ba9027125f0f87bc1a9da19118d3
          fetch-depth: 1

      - name: Verify immutable source commit
        run: test "$(git rev-parse HEAD)" = "694e23821b57ba9027125f0f87bc1a9da19118d3"

      - name: Restore latest persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/cache/
          key: ohlcv-v3-autonomous-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - name: Restore latest consolidated tactical state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/
          key: decision-state-v1-autonomous-${{ github.run_id }}
          restore-keys: |
            decision-state-v1-

      - name: Restore latest consolidated weekly research state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/sector_rotation_v2/
            state/etf_fund_flows/
          key: weekly-research-state-v1-autonomous-${{ github.run_id }}
          restore-keys: |
            weekly-research-state-v1-

      - name: Validate restored runtime material
        run: |
          python - <<'PY'
          from pathlib import Path
          cache=[p for p in Path('data/cache').rglob('*') if p.is_file()] if Path('data/cache').exists() else []
          state=[p for p in Path('state').rglob('*') if p.is_file()] if Path('state').exists() else []
          assert cache, 'NO_OHLCV_CACHE_RESTORED'
          assert any(str(p).startswith('state/tct_context/') for p in state), 'NO_TCT_CONTEXT_STATE_RESTORED'
          assert any(str(p).startswith('state/action_ct/') or str(p).startswith('state/action_ct_v22_1/') for p in state), 'NO_ACTION_CT_STATE_RESTORED'
          assert any(str(p).startswith('state/provenance/') for p in state), 'NO_PROVENANCE_STATE_RESTORED'
          assert any(str(p).startswith('state/sector_rotation_v2/') for p in state), 'NO_SECTOR_ROTATION_STATE_RESTORED'
          assert any(str(p).startswith('state/etf_fund_flows/') for p in state), 'NO_ETF_FUND_FLOW_STATE_RESTORED'
          print(f'Runtime material restored: cache_files={len(cache)} state_files={len(state)}')
          PY

      - name: Build autonomous package
        run: |
          rm -rf AUTONOMOUS_PACKAGE_V21_13_16
          mkdir -p AUTONOMOUS_PACKAGE_V21_13_16
          git archive --format=tar HEAD | tar -xf - -C AUTONOMOUS_PACKAGE_V21_13_16
          mkdir -p AUTONOMOUS_PACKAGE_V21_13_16/data AUTONOMOUS_PACKAGE_V21_13_16/state
          cp -a data/cache AUTONOMOUS_PACKAGE_V21_13_16/data/
          cp -a state/. AUTONOMOUS_PACKAGE_V21_13_16/state/
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          root=Path('AUTONOMOUS_PACKAGE_V21_13_16')
          def stat(path):
              files=[p for p in path.rglob('*') if p.is_file()] if path.exists() else []
              return {'files':len(files),'bytes':sum(p.stat().st_size for p in files)}
          status={
              'package_name':'PEA_ANALYZER_AUTONOMOUS_V21_13_16',
              'release_commit':'694e23821b57ba9027125f0f87bc1a9da19118d3',
              'generated_at_utc':datetime.now(timezone.utc).isoformat(),
              'tracked_repository_included':True,
              'runtime_caches_included':True,
              'data_cache':stat(root/'data'/'cache'),
              'state':stat(root/'state'),
              'secrets_included':False,
              'git_directory_included':False,
              'virtual_environment_included':False,
              'real_orders_enabled':False,
          }
          (root/'AUTONOMOUS_RECOVERY_STATUS.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')
          readme='''# PEA Analyzer — package autonome V21.13.16\n\nCe package contient la release figée V21.13.16 au commit `694e23821b57ba9027125f0f87bc1a9da19118d3` ainsi que les derniers caches et états restaurés depuis GitHub Actions.\n\n## Inclus\n- dépôt Git suivi complet, dont le README principal ;\n- `data/cache/` OHLCV ;\n- états TCT / catalyst ;\n- états Action CT V22.0 / V22.1 ;\n- provenance ;\n- états Sector Rotation V2 ;\n- états ETF Fund Flows ;\n- manifeste final, configurations, référentiels, workflows, tests et documentation.\n\n## Non inclus\n- secrets et clés API ;\n- `.git/` ;\n- environnement virtuel ;\n- cache pip ou système.\n\n## Reprise\n1. Décompresser sans modifier l'arborescence.\n2. Utiliser Python 3.12.\n3. Installer `requirements-runtime.txt`.\n4. Définir `PYTHONPATH=src`.\n5. Reconfigurer les secrets API séparément.\n6. Conserver `data/cache/` et `state/` à leurs emplacements.\n\n`AUTONOMOUS_RECOVERY_STATUS.json` donne le nombre de fichiers et le volume de caches/états effectivement inclus.\n'''
          (root/'README_REPRISE_AUTONOME.md').write_text(readme,encoding='utf-8')
          files=sorted(str(p.relative_to(root)) for p in root.rglob('*') if p.is_file())
          (root/'AUTONOMOUS_CONTENTS.txt').write_text('\n'.join(files)+'\n',encoding='utf-8')
          PY
          zip -q -r PEA_ANALYZER_AUTONOMOUS_V21_13_16.zip AUTONOMOUS_PACKAGE_V21_13_16
          sha256sum PEA_ANALYZER_AUTONOMOUS_V21_13_16.zip > PEA_ANALYZER_AUTONOMOUS_V21_13_16.sha256
          printf '%s\n' '694e23821b57ba9027125f0f87bc1a9da19118d3' > PEA_ANALYZER_AUTONOMOUS_V21_13_16.commit.txt

      - name: Validate autonomous archive
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('PEA_ANALYZER_AUTONOMOUS_V21_13_16.zip') as zf:
              bad=zf.testzip(); names=set(zf.namelist())
          assert bad is None, bad
          required={
              'AUTONOMOUS_PACKAGE_V21_13_16/README.md',
              'AUTONOMOUS_PACKAGE_V21_13_16/README_REPRISE_AUTONOME.md',
              'AUTONOMOUS_PACKAGE_V21_13_16/AUTONOMOUS_RECOVERY_STATUS.json',
              'AUTONOMOUS_PACKAGE_V21_13_16/AUTONOMOUS_CONTENTS.txt',
              'AUTONOMOUS_PACKAGE_V21_13_16/FINAL_PACKAGE_V21_13_16_MANIFEST.json',
              'AUTONOMOUS_PACKAGE_V21_13_16/requirements-runtime.txt',
          }
          assert not (required-names), sorted(required-names)
          assert any(n.startswith('AUTONOMOUS_PACKAGE_V21_13_16/data/cache/') and not n.endswith('/') for n in names)
          assert any(n.startswith('AUTONOMOUS_PACKAGE_V21_13_16/state/tct_context/') and not n.endswith('/') for n in names)
          assert any(n.startswith('AUTONOMOUS_PACKAGE_V21_13_16/state/sector_rotation_v2/') and not n.endswith('/') for n in names)
          print(f'Autonomous archive OK: {len(names)} entries')
          PY

      - name: Upload autonomous package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PEA_ANALYZER_AUTONOMOUS_V21_13_16
          path: |
            PEA_ANALYZER_AUTONOMOUS_V21_13_16.zip
            PEA_ANALYZER_AUTONOMOUS_V21_13_16.sha256
            PEA_ANALYZER_AUTONOMOUS_V21_13_16.commit.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
