name: ETF GROK2 World Fallback Research V3

on:
  push:
    branches:
      - research/grok2-exit-refactor
    paths:
      - 'config/ETF_GROK2_EXIT_RESEARCH_V3.json'
      - 'src/v182/backtest/etf_grok2_world_fallback_research_v3.py'
      - 'tests/test_etf_grok2_world_fallback_research_v3.py'
      - '.github/workflows/etf_grok2_world_fallback_research_v3.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - name: Unit tests
        run: pytest -q tests/test_etf_grok2_world_fallback_research_v3.py tests/test_etf_grok2_exit_rotation_research_v2.py
      - name: Compile
        run: python -m py_compile src/v182/backtest/etf_grok2_world_fallback_research_v3.py
      - name: Build hardened ETF base
        run: python -m v182.backtest.etf_backtest_base_v1 --full-audit --end 2026-09-02
      - name: Run World fallback and rotation research
        run: python -m v182.backtest.etf_grok2_world_fallback_research_v3
      - name: Validate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/etf_grok2_world_fallback_research_v3/SUMMARY.json')
          x=json.loads(p.read_text())
          assert x['fixed_take_profit_used'] is False
          assert x['same_close_signal_execution_used'] is False
          assert x['score_exhaustion_exit_used'] is False
          assert x['survivorship_bias_resolved'] is False
          assert x['promotion_eligible'] is False
          assert x['real_orders_allowed'] is False
          assert 'E_WORLD_FALLBACK' in x['variants']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ETF_GROK2_WORLD_FALLBACK_RESEARCH_V3
          path: outputs/etf_grok2_world_fallback_research_v3/
          retention-days: 90
