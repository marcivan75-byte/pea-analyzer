name: V23 history continuity repair audit

on:
  push:
    branches: [v23/tabport-reset-benchmark-first]
    paths:
      - scripts/v23_history_continuity_repair_audit.py
      - .github/workflows/v23_history_continuity_repair_audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install minimal runtime
        run: python -m pip install --prefer-binary 'pandas>=2.2' 'numpy>=2.0' 'pyarrow>=17' 'yfinance>=0.2.54'
      - name: Download frozen master history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input_history
          curl -L --fail --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9758563012/zip" \
            -o input_history/history.zip
          unzip -q input_history/history.zip -d input_history/unpacked
          PARQUET=$(find input_history/unpacked -type f -name 'PEA_OHLCV_2010_2026_CONSOLIDATED.parquet' | head -1)
          test -n "$PARQUET"
          echo "HISTORY_PARQUET=$PARQUET" >> "$GITHUB_ENV"
      - name: Compare five broken histories with independent ticker histories
        run: python scripts/v23_history_continuity_repair_audit.py --history "$HISTORY_PARQUET" --out-dir outputs/v23_history_continuity_repair_audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v23-history-continuity-repair-audit-${{ github.run_id }}
          path: outputs/v23_history_continuity_repair_audit/
          retention-days: 90
