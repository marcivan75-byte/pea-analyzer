name: V22.1 TABPORT final frozen holdout

on:
  workflow_dispatch:
  push:
    branches: [v22/pit-mae-mfe-preopen]
    paths:
      - scripts/v22_1_tabport_final_holdout.py
      - .github/workflows/v22_1_tabport_final_holdout.yml

permissions:
  contents: read
  actions: read

env:
  BACKTEST_RUN_ID: '33420487572'
  PASS6_RUN_ID: '33458434377'
  HISTORY_RUN_ID: '33393842087'

jobs:
  final-frozen-holdout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: python -m pip install --prefer-binary 'pandas>=2.2' 'numpy>=2.0' 'pyarrow>=18'
      - name: Download holdout, frozen config and governed OHLC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs pass6 history
          bt="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKTEST_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("v22-1-historical-weekly-backtest-")) | .name' | head -n1)"
          p6="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PASS6_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("v22-1-tabport-pass6-")) | .name' | head -n1)"
          hist="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${HISTORY_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("pea-history-2010-2026-")) | .name' | head -n1)"
          test -n "$bt" && test -n "$p6" && test -n "$hist" || { echo 'BLOCK_FINAL_DATA: artifact missing'; exit 1; }
          gh run download "$BACKTEST_RUN_ID" -n "$bt" -D inputs
          gh run download "$PASS6_RUN_ID" -n "$p6" -D pass6
          gh run download "$HISTORY_RUN_ID" -n "$hist" -D history
          test -f inputs/V22_1_HOLDOUT.csv
          test -f pass6/PASS6_REPORT.json
          test -f pass6/PASS6_FROZEN_CONFIG.json
          test -f history/PEA_OHLCV_2010_2026_CONSOLIDATED.parquet
      - name: Run final frozen 2023-2026 evaluation
        run: |
          python scripts/v22_1_tabport_final_holdout.py \
            --holdout inputs/V22_1_HOLDOUT.csv \
            --pass6-report pass6/PASS6_REPORT.json \
            --frozen-config pass6/PASS6_FROZEN_CONFIG.json \
            --price-parquet history/PEA_OHLCV_2010_2026_CONSOLIDATED.parquet \
            --out-dir outputs/tabport_final
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tabport-final-frozen-${{ github.run_id }}
          path: outputs/tabport_final
          if-no-files-found: error
