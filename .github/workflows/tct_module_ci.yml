name: TCT module validation

on:
  pull_request:
    paths:
      - "src/v182/**tct**"
      - "src/v182/reporting/tactical_shadow_bundle_run.py"
      - "src/v182/features/ohlcv_features.py"
      - "src/v182/sources/yfinance_bulk.py"
      - "config/TCT_*.json"
      - "tests/test_tct*.py"
      - "scripts/build_tct_package_v24_4_2.py"
      - "docs/TCT_*.md"
      - "docs/TCT_*.json"
      - "docs/PIPELINE_RUNTIME_V21_13_11.md"
      - "docs/PIPELINE_RUNTIME_V21_13_12.md"
      - "constraints-ci.txt"
      - ".github/workflows/tct_module_ci.yml"
      - ".github/workflows/committee_tct_ct_daily.yml"
      - ".github/workflows/committee_master_daily.yml"
  push:
    branches: [main]
    paths:
      - "src/v182/**tct**"
      - "src/v182/reporting/tactical_shadow_bundle_run.py"
      - "src/v182/features/ohlcv_features.py"
      - "src/v182/sources/yfinance_bulk.py"
      - "config/TCT_*.json"
      - "tests/test_tct*.py"
      - "scripts/build_tct_package_v24_4_2.py"
      - "docs/TCT_*.md"
      - "docs/TCT_*.json"
      - "docs/PIPELINE_RUNTIME_V21_13_11.md"
      - "docs/PIPELINE_RUNTIME_V21_13_12.md"
      - "constraints-ci.txt"
      - ".github/workflows/tct_module_ci.yml"
      - ".github/workflows/committee_tct_ct_daily.yml"
      - ".github/workflows/committee_master_daily.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and audit tools
        run: python -m pip install -e ".[test]"
      - name: Functional lint
        run: python -m ruff check src tests scripts
      - name: TCT test suite
        run: python -m pytest -q tests/test_tct*.py
      - name: Published V24.4.2 type contract
        run: |
          python -m mypy --ignore-missing-imports \
            src/v182/features/tct_catalyst_context_v24_4_2.py \
            src/v182/reporting/tct_next_session_catalyst_run_v24_4_2.py \
            src/v182/reporting/tct_pit_ohlc_ledger_v24_4_2.py \
            src/v182/reporting/tct_v24_4_2_pit_lineage.py \
            src/v182/reporting/tct_v24_4_2_pit_validator.py \
            src/v182/reporting/tct_postmarket_bundle_run.py \
            src/v182/reporting/tactical_shadow_bundle_run.py \
            src/v182/sources/tct_catalyst_news_v24_4_2.py \
            src/v182/decision/tct_timing_exact_v24_1_7.py \
            src/v182/decision/tct_v24_1_7.py \
            src/v182/backtest/sector_rotation_v2_pit_oos.py \
            src/v182/features/ohlcv_features.py
      - name: Deterministic release package
        run: python -m pytest -q tests/test_tct_v24_4_2_release_package.py
