name: V21.15 TEMP real ETF structural state qualification

on:
  push:
    branches:
      - data/etf-structure-state-v21-15
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v21-15-etf-structure-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-real-structure-state:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PEA_PROVENANCE_PATH: state/provenance/OBSERVATION_PROVENANCE.csv
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Restore OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/
          key: ohlcv-v3-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - name: Restore provenance and temporal state
        uses: actions/cache/restore@v4
        with:
          path: state/provenance/
          key: daily-provenance-v2181-${{ github.run_id }}
          restore-keys: |
            daily-provenance-v2181-
            provenance-v2181-
            provenance-v2161-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e ".[test]"

      - name: Compile and targeted state tests
        run: |
          python -m compileall -q src tests
          ruff check src/v182/state/etf_structure_state.py src/v182/reporting/etf_structure_state_replay.py src/v182/reporting/etf_structure_refresh.py tests/test_etf_structure_state_v21_15.py
          pytest -q tests/test_etf_structure_state_v21_15.py tests/test_etf_structure_provenance.py tests/test_etf_structural_data_v21_10.py tests/test_etf_ct_lt_shadow_v21_14.py

      - name: Build real current enriched masters once
        run: python -m v182.reporting.run

      - name: Freeze pre-structure ETF master
        run: cp outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv /tmp/ETF_PRE_STRUCTURE.csv

      - name: Run real weekly structural refresh and persist V21.15 state
        run: python -m v182.reporting.etf_structure_refresh

      - name: Freeze post-network ETF master and CT LT context
        run: |
          cp outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv /tmp/ETF_POST_NETWORK.csv
          python -m v182.reporting.etf_ct_lt_shadow_run_v21_14
          cp outputs/audit/ETF_CT_LT_V21_14_SHADOW.json /tmp/ETF_CT_LT_POST_NETWORK.json

      - name: Simulate next daily run and replay state without structural network
        run: |
          cp /tmp/ETF_PRE_STRUCTURE.csv outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
          python -m v182.reporting.etf_structure_state_replay
          cp outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv /tmp/ETF_POST_REPLAY.csv
          python -m v182.reporting.etf_ct_lt_shadow_run_v21_14
          cp outputs/audit/ETF_CT_LT_V21_14_SHADOW.json /tmp/ETF_CT_LT_POST_REPLAY.json

      - name: Verify persistence equivalence and publish qualification summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          from v182.io.frames import is_missing

          pre=pd.read_csv('/tmp/ETF_PRE_STRUCTURE.csv',sep=';',encoding='utf-8-sig',dtype=str,low_memory=False)
          network=pd.read_csv('/tmp/ETF_POST_NETWORK.csv',sep=';',encoding='utf-8-sig',dtype=str,low_memory=False)
          replay=pd.read_csv('/tmp/ETF_POST_REPLAY.csv',sep=';',encoding='utf-8-sig',dtype=str,low_memory=False)
          state_path=Path('state/provenance/etf_structure/ETF_STRUCTURE_SNAPSHOT.csv')
          assert state_path.exists() and state_path.stat().st_size > 0
          state=pd.read_csv(state_path,sep=';',encoding='utf-8-sig',dtype=str,low_memory=False)
          replay_audit=json.loads(Path('outputs/audit/V21_15_ETF_STRUCTURE_STATE_REPLAY.json').read_text())
          write_audit=json.loads(Path('outputs/audit/V21_15_ETF_STRUCTURE_STATE_WRITE.json').read_text())
          ct_network=json.loads(Path('/tmp/ETF_CT_LT_POST_NETWORK.json').read_text())
          ct_replay=json.loads(Path('/tmp/ETF_CT_LT_POST_REPLAY.json').read_text())

          assert len(pre)==len(network)==len(replay)==102
          assert pre['isin'].nunique()==network['isin'].nunique()==replay['isin'].nunique()==102
          assert len(state)>0 and not state.duplicated(['isin','field']).any()
          assert replay_audit['state']['eligible_rows'] == replay_audit['replay_observations']
          assert replay_audit['state']['eligible_rows'] > 0
          assert replay_audit['governance']['daily_network_structural_scrape'] is False
          assert ct_replay['decision_influence'] == 0.0
          assert ct_replay['real_orders_allowed'] is False
          assert ct_replay['t1_t2_forbidden'] is True

          def coverage(frame,field):
              if field not in frame.columns: return 0.0
              return round(100.0*(~frame[field].apply(is_missing)).mean(),2)

          fields=['ter_pct','fund_total_assets_eur_m','aum_m','diversification_direct_score','direct_sector_hhi']
          cov={}
          for field in fields:
              cov[field]={
                  'pre':coverage(pre,field),
                  'post_network':coverage(network,field),
                  'post_replay':coverage(replay,field),
              }
              assert cov[field]['post_replay'] + 1e-9 >= cov[field]['pre']

          net=network.set_index('isin')
          rep=replay.set_index('isin')
          mismatches=[]
          for _,row in state.iterrows():
              isin=str(row['isin']); field=str(row['field'])
              if isin not in net.index or isin not in rep.index or field not in net.columns or field not in rep.columns:
                  mismatches.append([isin,field,'MISSING_CELL'])
                  continue
              left=net.at[isin,field]; right=rep.at[isin,field]
              if is_missing(left) or is_missing(right):
                  mismatches.append([isin,field,'MISSING_VALUE'])
                  continue
              try:
                  equal=abs(float(left)-float(right)) <= max(1e-9,abs(float(left))*1e-12)
              except (TypeError,ValueError):
                  equal=str(left).strip()==str(right).strip()
              if not equal:
                  mismatches.append([isin,field,f'{left}!={right}'])
          assert not mismatches[:1], mismatches[:10]

          summary={
              'version':'V21.15_REAL_STRUCTURE_STATE_QUALIFICATION',
              'status':'SUCCESS',
              'canonical_etf':102,
              'state_rows':int(len(state)),
              'state_unique_isins':int(state['isin'].nunique()),
              'state_rows_by_field':{str(k):int(v) for k,v in state['field'].value_counts().to_dict().items()},
              'state_rows_by_evidence':{str(k):int(v) for k,v in state['evidence_level'].value_counts().to_dict().items()},
              'write_audit':write_audit,
              'replay_audit':replay_audit,
              'coverage_pct':cov,
              'ct_lt_post_network':{
                  'CT_scorable':ct_network['horizons']['CT']['scorable_rows'],
                  'LT_scorable':ct_network['horizons']['LT']['scorable_rows'],
              },
              'ct_lt_post_replay':{
                  'CT_scorable':ct_replay['horizons']['CT']['scorable_rows'],
                  'LT_scorable':ct_replay['horizons']['LT']['scorable_rows'],
              },
              'network_vs_replay_state_value_mismatches':0,
              'daily_structural_network_scrape':False,
              'weights_changed':False,
              'thresholds_changed':False,
              'holdout_opened':False,
          }
          out=Path('outputs/audit/V21_15_REAL_STRUCTURE_STATE_QUALIFICATION.json')
          out.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Seed existing persistent provenance cache with qualified state
        if: ${{ success() && hashFiles('state/provenance/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state/provenance/
          key: daily-provenance-v2181-v2115-proof-${{ github.run_id }}

      - name: Upload V21.15 real evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V21_15_ETF_STRUCTURE_STATE_REAL_${{ github.run_id }}
          path: |
            outputs/audit/V21_10_ETF_STRUCTURAL_DATA.json
            outputs/audit/V21_15_ETF_STRUCTURE_STATE_WRITE.json
            outputs/audit/V21_15_ETF_STRUCTURE_STATE_REPLAY.json
            outputs/audit/V21_15_REAL_STRUCTURE_STATE_QUALIFICATION.json
            outputs/audit/ETF_CT_LT_V21_14_SHADOW.json
            outputs/gaps/V21_10_ETF_STRUCTURE_FAILURES.csv
            state/provenance/etf_structure/ETF_STRUCTURE_SNAPSHOT.csv
            /tmp/ETF_PRE_STRUCTURE.csv
            /tmp/ETF_POST_NETWORK.csv
            /tmp/ETF_POST_REPLAY.csv
            /tmp/ETF_CT_LT_POST_NETWORK.json
            /tmp/ETF_CT_LT_POST_REPLAY.json
          if-no-files-found: warn
          retention-days: 14
