name: V18.2 Full Preproduction Audit

on:
  push:
    branches:
      - fix/v18-2-waves-resilience
      - feature/v18-2-consensus-momentum
      - audit/v18-2-consensus-momentum-final
      - audit/v18-2-marketbeat-consensus-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18-2-full-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validated dependency set
        run: pip install -c constraints-ci.txt -e .[test]

      - name: Static and regression preflight
        run: |
          python -m pip check
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 src tests
          pytest -q

      - name: MarketBeat live forecast schema smoke
        env:
          MARKETBEAT_API_KEY: ${{ secrets.MARKETBEAT_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from v182.sources.marketbeat_parse import MarketBeatParseClient, parse_forecast
          key = os.environ.get('MARKETBEAT_API_KEY', '').strip()
          assert key, 'MARKETBEAT_API_KEY_MISSING'
          client = MarketBeatParseClient(key, min_interval_seconds=0)
          payload = client.get_stock_forecast('SNY', 'NASDAQ')
          fields = parse_forecast(payload)
          assert fields.get('mb_target_price') is not None, fields
          assert fields.get('mb_target_change_1m_pct') is not None, fields
          assert fields.get('mb_consensus_score_100') is not None, fields
          print('MARKETBEAT_FORECAST_SMOKE_OK', fields.get('mb_consensus_rating'), fields.get('mb_target_currency'))
          PY

      - name: Execute full V18.2 pipeline
        env:
          V182_RUN_ID: full-audit-${{ github.run_id }}-${{ github.run_attempt }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m v182.reporting.run

      - name: Audit residual OHLCV gaps
        run: python -m v182.audit.ohlcv_gaps

      - name: Ensure committee scenario coverage
        run: python -m v182.decision.scenario_fallback

      - name: Compute baseline analyst momentum
        run: python -m v182.decision.analyst_momentum

      - name: Apply selective MarketBeat cross-check
        env:
          MARKETBEAT_API_KEY: ${{ secrets.MARKETBEAT_API_KEY }}
        run: python -m v182.decision.marketbeat_overlay

      - name: Finalize committee target fields
        run: python -m v182.decision.committee_finalize

      - name: Validate complete outputs and invariants
        run: |
          test -s outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv
          test -s outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
          test -s outputs/V18.2_PEA_ACTIONS_ACTUALISE.xlsx
          test -s outputs/V18.2_PEA_ETF_ACTUALISE.xlsx
          test -s outputs/V18.2_RUN_REPORT.xlsx
          test -s outputs/V18.2_COMMITTEE_ANALYST_MOMENTUM.csv
          test -s outputs/history/V18.2_CONSENSUS_SNAPSHOTS.csv
          test -s outputs/history/V18.2_ANALYST_REVISIONS.csv
          test -s outputs/audit/V18.2_ANALYST_MOMENTUM_METRICS.json
          test -s outputs/audit/V18.2_SCENARIO_METRICS.json
          test -s outputs/audit/V18.2_OHLCV_GAP_METRICS.json
          test -s outputs/gaps/V18.2_OHLCV_ACTION_GAPS.csv
          test -s outputs/gaps/V18.2_OHLCV_ETF_GAPS.csv
          test -s outputs/audit/V18.2_QUALITY_GATES.json
          test -s outputs/audit/V18.2_COVERAGE_BEFORE_AFTER.json
          test -s outputs/audit/V18.2_SOURCE_FALLBACK_METRICS.json
          test -s outputs/context/V18.2_MACRO_CONTEXT.json
          test -s outputs/context/V18.2_ENERGY_CONTEXT.json
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          q = json.loads(Path('outputs/audit/V18.2_QUALITY_GATES.json').read_text())
          assert q['passed'], q
          assert not [c for c in q['checks'] if not c['passed']], q['checks']

          actions = pd.read_csv('outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv', sep=';', encoding='utf-8-sig', dtype=str)
          etf = pd.read_csv('outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv', sep=';', encoding='utf-8-sig', dtype=str)
          committee = pd.read_csv('outputs/V18.2_COMMITTEE_ANALYST_MOMENTUM.csv', sep=';', encoding='utf-8-sig', dtype=str)
          history = pd.read_csv('outputs/history/V18.2_CONSENSUS_SNAPSHOTS.csv', sep=';', encoding='utf-8-sig', dtype=str)
          assert len(actions) == 1486, len(actions)
          assert len(etf) == 102, len(etf)
          assert actions['isin'].nunique() == 1486
          assert etf['isin'].nunique() == 102
          assert actions['yahoo_ticker'].notna().all()
          assert etf['yahoo_ticker'].notna().all()
          assert len(committee) > 0, 'EMPTY_COMMITTEE_ANALYST_OUTPUT'

          required_analyst = {
              'target_upside_abs', 'target_upside_pct', 'target_change_run_abs',
              'target_change_run_pct', 'target_change_1m_abs', 'target_change_1m_pct',
              'target_change_3m_abs', 'target_change_3m_pct',
              'target_change_12m_abs', 'target_change_12m_pct',
              'consensus_score_100', 'consensus_delta_run', 'consensus_delta_1m',
              'consensus_delta_3m', 'target_source_canonical', 'consensus_source_canonical',
              'target_revision_acceleration', 'analyst_momentum_score',
              'analyst_momentum_score_pre_marketbeat', 'target_revision_signal_pct',
              'consensus_change_signal', 'marketbeat_confirmation_state',
              'marketbeat_risk_revision_pct', 'committee_analyst_signal',
              'committee_analyst_gate', 'committee_review_required',
              'committee_score_with_analyst_momentum',
          }
          assert required_analyst.issubset(set(actions.columns)), required_analyst - set(actions.columns)
          assert 'target_change_12m_abs' in committee.columns
          assert {'target_source', 'consensus_source'}.issubset(set(history.columns))

          gap = json.loads(Path('outputs/audit/V18.2_OHLCV_GAP_METRICS.json').read_text())
          assert int(gap['actions_total']) == 1486, gap
          assert int(gap['etf_total']) == 102, gap
          assert float(gap['actions_last_close_coverage_pct']) >= 90.0, gap
          assert float(gap['etf_last_close_coverage_pct']) >= 90.0, gap
          assert gap['status'] == 'ACTIONABLE_RESIDUAL_GAPS', gap

          scenario = json.loads(Path('outputs/audit/V18.2_SCENARIO_METRICS.json').read_text())
          assert scenario['execution_gate'] == 'SHADOW_BLOCKED', scenario
          assert int(scenario.get('selected_rows', 0)) > 0, scenario
          assert int(scenario.get('scenario_isins', 0)) > 0, scenario
          assert int(scenario.get('scenario_observations', 0)) >= int(scenario.get('scenario_isins', 0)) * 5, scenario

          analyst_metrics = json.loads(Path('outputs/audit/V18.2_ANALYST_MOMENTUM_METRICS.json').read_text())
          assert analyst_metrics['execution_gate'] == 'SHADOW_BLOCKED'
          assert float(analyst_metrics['overall_weight']) == 0.15
          assert int(analyst_metrics.get('committee_rows', 0)) == len(committee), analyst_metrics
          assert analyst_metrics.get('committee_selection_basis') in {
              'EXPLICIT_COMMITTEE_WATCH', 'TOP_300_SCORE_BRUT_FALLBACK', 'FIRST_300_FALLBACK'
          }, analyst_metrics
          mb = analyst_metrics.get('marketbeat') or {}
          assert mb.get('enabled') is True, mb
          assert mb.get('key_present') is True, mb
          assert mb.get('success') is True, mb
          assert int(mb.get('selected', 0)) > 0, mb
          assert int(mb.get('api_calls', 0)) > 0, mb
          assert int(mb.get('successful', 0)) >= 1, mb
          assert int(mb.get('observations', 0)) > 0, mb
          assert int(mb.get('quarantined', 0)) == 0, mb
          overlay = analyst_metrics.get('marketbeat_overlay') or {}
          assert int(overlay.get('committee_rows', 0)) == len(committee), overlay
          assert int(overlay.get('rows', 0)) >= 1, overlay

          metrics = json.loads(Path('outputs/audit/V18.2_SOURCE_FALLBACK_METRICS.json').read_text())
          for key in ('wave01_actions', 'wave02_etf'):
              wave = metrics[key]
              assert wave['requested'] > 0
              assert wave['successful'] / wave['requested'] >= 0.90, wave
              sources = wave.get('source_counts') or {}
              assert sum(int(v or 0) for v in sources.values()) == int(wave['successful']), (key, sources, wave)
          assert 'wave04_alpha' not in metrics, 'obsolete Alpha fundamentals path survived'

          openfigi = metrics['openfigi']
          assert float(openfigi.get('coverage_pct', 0)) >= 70.0, openfigi
          fundamentals = metrics['wave04_yfinance']
          consensus = metrics['wave05_finnhub']
          assert float(fundamentals.get('available_pct', 0)) >= 90.0, fundamentals
          assert float(consensus.get('available_pct', 0)) >= 90.0, consensus

          macro = json.loads(Path('outputs/context/V18.2_MACRO_CONTEXT.json').read_text())
          energy = json.loads(Path('outputs/context/V18.2_ENERGY_CONTEXT.json').read_text())
          assert macro.get('source') == 'FRED'
          assert macro.get('macro_as_of')
          assert energy.get('source') == 'EIA'
          assert energy.get('energy_as_of')

          quarantine_path = Path('outputs/gaps/V18.2_QUARANTINE.csv')
          if quarantine_path.exists() and quarantine_path.stat().st_size > 0:
              quarantine = pd.read_csv(quarantine_path, sep=';', encoding='utf-8-sig', dtype=str)
              macro_conflicts = quarantine[
                  (quarantine.get('field') == 'macro_curve_10y2y') &
                  (quarantine.get('reason') == 'CONFLICT_EQUAL_EVIDENCE')
              ]
              assert len(macro_conflicts) == 0, f'MASS_FRED_FALSE_CONFLICTS={len(macro_conflicts)}'

          assert '_field_provenance_json' in actions.columns
          assert '_field_provenance_json' in etf.columns
          print('FULL_AUDIT_INVARIANTS_OK')
          PY

      - name: Generate exact-SHA release evidence
        env:
          V182_REQUIRE_RELEASE_READY: "1"
        run: python -m v182.audit.release_evidence

      - name: Produce audit summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = {'run_id': '${{ github.run_id }}', 'head_sha': '${{ github.sha }}'}
          for name, path in {
              'quality': 'outputs/audit/V18.2_QUALITY_GATES.json',
              'coverage': 'outputs/audit/V18.2_COVERAGE_BEFORE_AFTER.json',
              'sources': 'outputs/audit/V18.2_SOURCE_FALLBACK_METRICS.json',
              'ohlcv_gaps': 'outputs/audit/V18.2_OHLCV_GAP_METRICS.json',
              'scenarios': 'outputs/audit/V18.2_SCENARIO_METRICS.json',
              'analyst_momentum': 'outputs/audit/V18.2_ANALYST_MOMENTUM_METRICS.json',
              'release_evidence': 'outputs/release/V18.2_RELEASE_EVIDENCE.json',
              'macro': 'outputs/context/V18.2_MACRO_CONTEXT.json',
              'energy': 'outputs/context/V18.2_ENERGY_CONTEXT.json',
          }.items():
              p = Path(path)
              summary[name] = json.loads(p.read_text()) if p.exists() else {'missing': True}
          Path('outputs/audit/V18.2_FULL_AUDIT_SUMMARY.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          PY

      - name: Upload full audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: V18.2-full-audit-${{ github.run_id }}
          path: |
            outputs/**
            state/**
            config/V18.2_OPENFIGI_MASTER_MAP.csv
            config/V18.2_MARKETSTACK_SYMBOL_MAP.csv
            config/V18.2_ALPHA_SYMBOL_MAP.csv
            config/V18.2_FINNHUB_SYMBOL_MAP.csv
            config/V18.2_MARKETBEAT_SYMBOL_MAP.csv
          retention-days: 30