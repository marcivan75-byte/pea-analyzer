name: V21.18 TEMP real ETF benchmark proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v21-18-etf-benchmark-proof-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  real-benchmark-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PEA_PROVENANCE_PATH: /tmp/V21_18_PROVENANCE.csv
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e ".[test]"

      - name: Targeted V21.18 validation
        run: |
          python -m compileall -q src/v182/sources/etf_structural_data.py src/v182/audit/etf_benchmark_tracking_v21_18.py
          ruff check src/v182/sources/etf_structural_data.py src/v182/audit/etf_benchmark_tracking_v21_18.py tests/test_etf_benchmark_tracking_v21_18.py tests/test_etf_benchmark_parser_v21_18.py
          pytest -q tests/test_etf_structural_data_v21_10.py tests/test_etf_benchmark_tracking_v21_18.py tests/test_etf_benchmark_parser_v21_18.py tests/test_etf_structure_state_v21_15.py

      - name: Collect 102 ETF benchmark evidence and prove isolated replay
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import pandas as pd

          os.environ['PEA_PROVENANCE_PATH']='/tmp/V21_18_PROVENANCE.csv'

          from v182.audit.etf_benchmark_tracking_v21_18 import classify_master, load_config
          from v182.io.frames import apply_observations, is_missing
          from v182.reporting.etf_structure_refresh import _governed_structural_observations
          from v182.sources.etf_structural_data import collect_etf_structural_data
          from v182.state.etf_structure_state import load_replay_observations, load_state_config, write_structural_state_snapshot

          root=Path('.')
          master=pd.read_csv(root/'inputs/V18.2_PEA_ETF_MASTER.csv',sep=';',encoding='utf-8-sig',low_memory=False)
          assert len(master)==102
          before=int((~master['official_benchmark'].apply(is_missing)).sum()) if 'official_benchmark' in master else 0

          raw,failures,metrics=collect_etf_structural_data(master,delay_seconds=0.03)
          benchmark_raw=[row for row in raw if row.get('field')=='official_benchmark']
          governed=_governed_structural_observations(benchmark_raw)
          accepted=[row for row in governed if row.get('validation_status')=='ISIN_MATCHED']
          enriched,quarantine=apply_observations(master,accepted)
          after=int((~enriched['official_benchmark'].apply(is_missing)).sum()) if 'official_benchmark' in enriched else 0

          state_cfg=load_state_config(root/'config/ETF_STRUCTURE_STATE_V21_15.json')
          state_path=Path('/tmp/V21_18_ETF_STRUCTURE_SNAPSHOT.csv')
          provenance_path=Path('/tmp/V21_18_PROVENANCE.csv')
          state_write=write_structural_state_snapshot(
              enriched,state_cfg,root=root,state_path=state_path,provenance_path=provenance_path
          )
          replay,replay_diag=load_replay_observations(
              state_cfg,root=root,state_path=state_path
          )
          replay_benchmark=[row for row in replay if row.get('field')=='official_benchmark']

          tracking_cfg=load_config(root/'config/ETF_BENCHMARK_TRACKING_V21_18.json')
          readiness_rows,readiness=classify_master(enriched,{},tracking_cfg)
          assert readiness['tracking_error_computation_enabled'] is False
          assert readiness['decision_influence']==0.0
          assert readiness['verified_benchmark_price_mapping_rows']==0
          assert all(not bool(value) for value in readiness_rows['tracking_error_computation_enabled'])
          assert len(quarantine)==0
          assert len(replay_benchmark)==int(sum(1 for row in accepted if not is_missing(row.get('value'))))

          evidence=pd.DataFrame(accepted)
          out=root/'outputs/audit'
          out.mkdir(parents=True,exist_ok=True)
          evidence.to_csv(out/'V21_18_REAL_BENCHMARK_EVIDENCE.csv',sep=';',index=False,encoding='utf-8-sig')
          summary={
              'version':'V21.18_REAL_ETF_BENCHMARK_PROOF',
              'status':'SUCCESS',
              'etf_rows':102,
              'master_benchmark_before':before,
              'raw_benchmark_observations':len(benchmark_raw),
              'accepted_exact_isin_benchmarks':len(accepted),
              'unique_benchmark_isins':len({str(row.get('isin')) for row in accepted}),
              'evidence_a_benchmarks':sum(row.get('evidence_level')=='A' for row in accepted),
              'evidence_b_benchmarks':sum(row.get('evidence_level')=='B' for row in accepted),
              'master_benchmark_after':after,
              'benchmark_coverage_after_pct':round(100.0*after/102,2),
              'collector_failures':len(failures),
              'benchmark_merge_quarantine':len(quarantine),
              'state_write':state_write,
              'benchmark_replay_rows':len(replay_benchmark),
              'state_replay':replay_diag,
              'tracking_readiness':readiness,
              'benchmark_price_map_verified_rows':0,
              'tracking_error_computation_enabled':False,
              'decision_influence':0.0,
              'weights_changed':False,
              'thresholds_changed':False,
              't1_t2_scope_changed':False,
              'holdout_opened':False,
              'production_state_modified':False,
          }
          (out/'V21_18_REAL_ETF_BENCHMARK_PROOF.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2,default=str))
          PY

      - name: Upload V21.18 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V21_18_REAL_ETF_BENCHMARK_${{ github.run_id }}
          path: |
            outputs/audit/V21_18_REAL_ETF_BENCHMARK_PROOF.json
            outputs/audit/V21_18_REAL_BENCHMARK_EVIDENCE.csv
          if-no-files-found: warn
          retention-days: 14
