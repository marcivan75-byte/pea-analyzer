name: Research PIT V15 Qualification Contract

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/pit_v15.py
      - src/v182/backtest/coverage_v15.py
      - src/v182/backtest/benchmark_pit_v15.py
      - src/v182/backtest/pit_source_registry_v15.py
      - tests/test_pit_v15_contract.py
      - tests/test_pit_v15_benchmark.py
      - tests/test_pit_v15_source_registry.py
      - docs/PIT_V15_DATA_CONTRACT.md
      - .github/workflows/research_pit_v15_qualification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pit-v15-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run PIT V15 locked-contract tests
        run: |
          python -m unittest tests.test_pit_v15_contract -v
          python -m unittest tests.test_pit_v15_benchmark -v
          python -m unittest tests.test_pit_v15_source_registry -v
      - name: Verify no performance optimization is coupled to qualification
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/v182/backtest/pit_v15.py').read_text()
          b=Path('src/v182/backtest/benchmark_pit_v15.py').read_text()
          s=Path('src/v182/backtest/pit_source_registry_v15.py').read_text()
          d=Path('docs/PIT_V15_DATA_CONTRACT.md').read_text()
          assert 'performance_backtest_authorized' in p
          assert 'NO_GO_DATA_COVERAGE' in p
          assert 'P1_FACTSET' in p and 'P2_EPS' in p and 'P3_MODEL' in p
          assert 'TARGET_THRESHOLD_PCT = 20.0' in p
          assert 'pea_eligible_of_record' in b
          assert 'performance_backtest_authorized_by_this_module' in b
          assert 'primary_source_documentation_ready' in s
          assert 'Pas d\'optimisation technique' in d
          print('PIT_V15_DATA_QUALIFICATION_CONTRACT_OK')
          PY
