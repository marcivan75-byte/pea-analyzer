name: TABPORT capitulation confirmation development-only

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - 'v182/hebdo/tabport_capitulation_confirmation_development.py'
      - 'tests/test_tabport_capitulation_confirmation_development.py'
      - '.github/workflows/tabport_capitulation_confirmation_dev_only.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cap-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONNOUSERSITE: '1'
      GH_TOKEN: ${{ github.token }}
      PRE2023_ARTIFACT_ID: '9817322742'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Restore governed holdout
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Restore governed PRE2023
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/pre2023
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRE2023_ARTIFACT_ID}/zip" > /tmp/pre2023.zip
          unzip -oq /tmp/pre2023.zip -d inputs/pre2023
          test -s inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet
          test -s inputs/pre2023/PRE2023_YAHOO_CORPUS_MANIFEST.json
          test -n "$(find data/cache/actions -name 'history_*.parquet' -print -quit)"
      - name: Install runtime
        run: |
          python -m pip install --prefer-binary -r requirements-runtime.txt
          python -m pip install pytest scikit-learn scipy
      - name: Validate focused chain
        run: |
          set -euo pipefail
          test -f v182/__init__.py
          test -f v182/hebdo/__init__.py
          test -f v182/hebdo/tabport_capitulation_confirmation_development.py
          python - <<'PY'
          import importlib.util, pathlib, v182
          root = pathlib.Path.cwd().resolve()
          actual = pathlib.Path(v182.__file__).resolve()
          expected = root / 'v182' / '__init__.py'
          print('v182_file=', actual)
          assert actual == expected, (actual, expected)
          assert importlib.util.find_spec('v182.hebdo') is not None
          assert importlib.util.find_spec('v182.backtests') is not None
          PY
          python -m py_compile v182/hebdo/tabport_capitulation_confirmation_development.py
          # pyproject has pythonpath=["src","."], which shadows root/v182 with
          # src/v182. HEBDO META lives in root/v182, so override it explicitly.
          python -m pytest -q -o pythonpath=. tests/test_tabport_capitulation_confirmation_development.py tests/test_backtest_B_v2.py tests/test_hebdo_at_meta.py tests/test_tabport_meta.py tests/test_tabport_historical_meta.py
      - name: Run capitulation-confirmation study
        run: |
          python -m v182.hebdo.tabport_capitulation_confirmation_development \
            --pre2023 inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet \
            --manifest inputs/pre2023/PRE2023_YAHOO_CORPUS_MANIFEST.json \
            --holdout-cache data/cache/actions \
            --output-dir outputs/tabport_cap_confirm
      - name: Validate and print comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('outputs/tabport_cap_confirm')
          s=json.loads((root/'TABPORT_CAP_CONFIRM_SUMMARY.json').read_text(encoding='utf-8'))
          assert s['status']=='SUCCESS'
          assert s['governance']['holdout_used_for_threshold_selection'] is False
          assert s['governance']['candidate_family_frozen_before_holdout'] is True
          assert s['governance']['j1_features_timestamp']=='CONFIRMATION_CLOSE_BEFORE_NEXT_SESSION_ENTRY'
          df=pd.read_csv(root/'TABPORT_CAP_CONFIRM_SEGMENTS.csv')
          assert set(df['segment'])=={'DEVELOPMENT_2010_2022','HOLDOUT_2023_2026'}
          print(json.dumps(s,indent=2,default=str))
          print('---SEGMENTS---'); print(df.to_csv(index=False))
          print('---YEARLY---'); print(pd.read_csv(root/'TABPORT_CAP_CONFIRM_YEARLY.csv').to_csv(index=False))
          PY
      - name: Upload capitulation-confirmation package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TABPORT-CAP-CONFIRM-${{ github.run_id }}
          path: outputs/tabport_cap_confirm/
          if-no-files-found: warn
          retention-days: 30
