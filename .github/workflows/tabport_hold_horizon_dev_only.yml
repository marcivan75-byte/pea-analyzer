name: TABPORT hold-horizon frozen longitudinal

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - 'v182/hebdo/tabport_hold_horizon_development.py'
      - 'tests/test_tabport_hold_horizon_development.py'
      - '.github/workflows/tabport_hold_horizon_dev_only.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  hold-horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONNOUSERSITE: '1'
      GH_TOKEN: ${{ github.token }}
      PRE2023_ARTIFACT_ID: '9817322742'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Restore governed holdout
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Restore governed PRE2023
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/pre2023
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRE2023_ARTIFACT_ID}/zip" > /tmp/pre2023.zip
          unzip -oq /tmp/pre2023.zip -d inputs/pre2023
          test -s inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet
          test -s inputs/pre2023/PRE2023_YAHOO_CORPUS_MANIFEST.json
          test -n "$(find data/cache/actions -name 'history_*.parquet' -print -quit)"
      - name: Install runtime
        run: |
          python -m pip install --prefer-binary -r requirements-runtime.txt
          python -m pip install pytest scikit-learn scipy
      - name: Validate focused chain
        run: |
          python -m py_compile v182/hebdo/tabport_hold_horizon_development.py
          python -m pytest -q -o pythonpath=. tests/test_tabport_hold_horizon_development.py tests/test_backtest_B_v2.py tests/test_hebdo_at_meta.py tests/test_tabport_meta.py tests/test_tabport_historical_meta.py
      - name: Run frozen hold-horizon study
        run: |
          python -m v182.hebdo.tabport_hold_horizon_development \
            --pre2023 inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet \
            --manifest inputs/pre2023/PRE2023_YAHOO_CORPUS_MANIFEST.json \
            --holdout-cache data/cache/actions \
            --output-dir outputs/tabport_hold_horizon
      - name: Validate and print comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('outputs/tabport_hold_horizon')
          s=json.loads((root/'TABPORT_HOLD_HORIZON_SUMMARY.json').read_text(encoding='utf-8'))
          assert s['status']=='SUCCESS'
          assert s['governance']['holdout_used_for_horizon_selection'] is False
          assert s['governance']['common_signal_cohort'] is True
          assert s['governance']['per_ticker_full_maturity_required'] is True
          assert all(v==0 for v in s['eop_exit_counts'].values())
          df=pd.read_csv(root/'TABPORT_HOLD_HORIZON_SEGMENTS.csv')
          assert set(df['segment'])=={'DEVELOPMENT_2010_2022','HOLDOUT_2023_2026'}
          print(json.dumps(s,indent=2,default=str))
          print('---SEGMENTS---'); print(df.to_csv(index=False))
          print('---YEARLY---'); print(pd.read_csv(root/'TABPORT_HOLD_HORIZON_YEARLY.csv').to_csv(index=False))
          PY
      - name: Upload hold-horizon package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TABPORT-HOLD-HORIZON-${{ github.run_id }}
          path: outputs/tabport_hold_horizon/
          if-no-files-found: warn
          retention-days: 30
