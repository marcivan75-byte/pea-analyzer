name: V20.4.2 Fast Committee - Actions and ETF CT MT LT Short

on:
  workflow_dispatch:
  push:
    branches: [feature/smart-money-v1]
    paths:
      - '.github/workflows/V20.4.2_specialized_committee.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: v2042-fast-committee
  cancel-in-progress: true

jobs:
  committee:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies only
        run: pip install -c constraints-ci.txt -e .

      - name: Reuse latest validated Actions and ETF snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p outputs /tmp/v2042

          # V20.4: reuse the latest successful validated 1829 Actions + 266 ETF decision pack.
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts|sort_by(.created_at)|reverse|.[]|select(.expired==false)|select(.name|startswith("V20.4-Total-1829-266-"))|[.id,.workflow_run.id]|@tsv' > /tmp/v2042/v204.tsv
          FOUND=0
          while IFS=$'\t' read -r ART RUN; do
            [ -n "$ART" ] || continue
            C=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}" --jq '.conclusion // ""' 2>/dev/null || true)
            [ "$C" = success ] || continue
            rm -rf /tmp/v2042/v204; mkdir -p /tmp/v2042/v204
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" > /tmp/v2042/v204.zip
            unzip -oq /tmp/v2042/v204.zip -d /tmp/v2042/v204
            A=$(find /tmp/v2042/v204 -name V20.4_GITOK_ACTIONS_1829_DECISIONS.csv -print -quit)
            E266=$(find /tmp/v2042/v204 -name V20.4_GITOK_ETF_266_DECISIONS.csv -print -quit)
            [ -n "$A" ] && [ -n "$E266" ] || continue
            cp "$A" outputs/V20.4_GITOK_ACTIONS_1829_DECISIONS.csv
            cp "$E266" outputs/V20.4_GITOK_ETF_266_DECISIONS.csv
            echo "V204_SOURCE_RUN=$RUN" >> "$GITHUB_ENV"
            FOUND=1; break
          done < /tmp/v2042/v204.tsv
          test "$FOUND" = 1

          # V20.4.2 ETF specialized committee: also reuse the compact 102-ETF validated master.
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts|sort_by(.created_at)|reverse|.[]|select(.expired==false)|select(.name|startswith("V18.2-full-audit-"))|[.id,.workflow_run.id]|@tsv' > /tmp/v2042/etf102.tsv
          FOUND=0
          while IFS=$'\t' read -r ART RUN; do
            [ -n "$ART" ] || continue
            C=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}" --jq '.conclusion // ""' 2>/dev/null || true)
            [ "$C" = success ] || continue
            rm -rf /tmp/v2042/e102; mkdir -p /tmp/v2042/e102
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" > /tmp/v2042/e102.zip
            unzip -oq /tmp/v2042/e102.zip -d /tmp/v2042/e102
            E102=$(find /tmp/v2042/e102 -name V18.2_PEA_ETF_MASTER_ENRICHED.csv -print -quit)
            [ -n "$E102" ] || continue
            cp "$E102" outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
            echo "ETF102_SOURCE_RUN=$RUN" >> "$GITHUB_ENV"
            FOUND=1; break
          done < /tmp/v2042/etf102.tsv
          test "$FOUND" = 1

      - name: Fast recompute only
        run: |
          python -m v182.decision.v2041_corrective_reweight
          python -m v182.decision.v2042_specialized_committee

      - name: Compact quality gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          a=pd.read_csv('outputs/V20.4.2_ACTIONS_SPECIALIZED_DECISIONS.csv',sep=';',dtype=object,encoding='utf-8-sig')
          e=pd.read_csv('outputs/V20.4.2_ETF_SPECIALIZED_DECISIONS.csv',sep=';',dtype=object,encoding='utf-8-sig')
          au=json.loads(Path('outputs/audit/V20.4.2_SPECIALIZED_AUDIT.json').read_text(encoding='utf-8'))
          assert len(a)==1829 and a['isin'].nunique()==1829
          assert len(e)==102 and e['isin'].nunique()==102
          required={'score_ct','score_mt','score_lt','score_short','decision_ct','decision_mt','decision_lt','decision_short','selection_ct','selection_mt','selection_lt','selection_short','execution'}
          assert required.issubset(a.columns) and required.issubset(e.columns)
          assert au.get('passed') is True
          assert au.get('smart_money_enabled') is False
          assert au.get('live_order_execution_enabled') is False
          assert a.execution.astype(str).str.upper().eq('RESEARCH_ONLY').all()
          assert e.execution.astype(str).str.upper().eq('RESEARCH_ONLY').all()
          print('V20_4_2_FAST_GATES_OK')
          PY

      - name: Committee summary
        run: |
          cat outputs/V20.4.2_COMMITTEE_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "V20.4 Actions+ETF266 source run: ${V204_SOURCE_RUN}" >> "$GITHUB_STEP_SUMMARY"
          echo "ETF102 source run: ${ETF102_SOURCE_RUN}" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: FAST_RECOMPUTE_NO_API_REFRESH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compact decision pack
        uses: actions/upload-artifact@v6
        with:
          name: V20.4.2-Fast-Committee-${{ github.run_id }}
          path: |
            outputs/V20.4.2_ACTIONS_SPECIALIZED_DECISIONS.csv
            outputs/V20.4.2_ETF_SPECIALIZED_DECISIONS.csv
            outputs/V20.4.2_COMMITTEE_SUMMARY.md
            outputs/audit/V20.4.2_SPECIALIZED_AUDIT.json
            data/reference/V20.4.2_SCORING_CONFIG.json
          if-no-files-found: error
          retention-days: 14
