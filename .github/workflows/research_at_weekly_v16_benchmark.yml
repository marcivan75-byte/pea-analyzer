name: Research AT Weekly V16 Benchmark

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/at_weekly_benchmark_v16.py
      - .github/workflows/research_at_weekly_v16_benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v16-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-at-weekly-v16-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install benchmark runtime
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow yfinance
      - name: Validate locked protective stop contract
        run: python -m unittest tests.test_at_weekly_protective_stop_contract -v
      - name: Run V16 stock-picking vs CAC truth test
        run: python -m v182.backtest.at_weekly_benchmark_v16
      - name: Validate V16 controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/backtest/AT_WEEKLY_BENCHMARK_V16.json').read_text())
          assert x['status']=='SUCCESS'
          assert x['portfolio_contract']['initial_capital_eur']==60000
          assert x['portfolio_contract']['max_live_positions']==12
          assert x['portfolio_contract']['nominal_per_title_eur']==4000
          assert x['portfolio_contract']['max_entries_per_year']==30
          assert x['benchmark_sources']['CAC40_GR']=='Yahoo Finance PX1GR.PA'
          assert x['pit_growth_gate_status']=='V15_NO_GO_DATA_COVERAGE_NOT_BYPASSED'
          print('V16_CONTROLS_OK',x['decision'])
          PY
      - name: Publish V16 result
        if: always()
        run: |
          F=outputs/backtest/AT_WEEKLY_BENCHMARK_V16.md
          if [ -f "$F" ]; then cat "$F" >> "$GITHUB_STEP_SUMMARY"; cat "$F"; fi
      - name: Upload V16 artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-weekly-v16-benchmark-${{ github.run_id }}
          path: |
            outputs/backtest/AT_WEEKLY_BENCHMARK_V16.json
            outputs/backtest/AT_WEEKLY_BENCHMARK_V16.csv
            outputs/backtest/AT_WEEKLY_BENCHMARK_V16.md
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
