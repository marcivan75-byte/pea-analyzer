name: TABPORT convex exit diagnostic

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - 'v182/hebdo/tabport_convex_exit_publish.py'
      - 'tests/test_tabport_convex_exit.py'
      - '.github/workflows/tabport_convex_exit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabport-convex-exit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Require governed cache
        run: test -n "$(find data/cache/actions -name 'history_*.parquet' -print -quit)"
      - name: Install runtime
        run: |
          python -m pip install --prefer-binary -r requirements-runtime.txt
          python -m pip install pytest scikit-learn scipy
      - name: Test convex exit engine
        run: python -m pytest -q tests/test_tabport_convex_exit.py tests/test_tabport_adaptive_stop.py tests/test_tabport_meta.py
      - name: Run PIT convex exit diagnostic
        run: python -m v182.hebdo.tabport_convex_exit_publish --cache data/cache/actions --output-dir outputs/tabport_convex_exit
      - name: Validate contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs/tabport_convex_exit'); d=json.loads((root/'TABPORT_CONVEX_EXIT_DIAGNOSTIC.json').read_text())
          assert d['status']=='PUBLISHED' and d['holdout_unlocked'] is False and d['retuning'] is False, d
          assert d['decision'] in {'PROMOTE_CONVEX_EXIT','REJECT_KEEP_TIME126'}, d
          for name in ['TABPORT_CONVEX_EXIT_COMPARISON.csv','TABPORT_CONVEX_EXIT_YEAR_STABILITY.csv','TABPORT_CONVEX_EXIT_ATTRIBUTION.csv','TABPORT_CONVEX_EXIT_DIAGNOSTIC.json']:
              p=root/name; assert p.exists() and p.stat().st_size>0, name
          print(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TABPORT-CONVEX-EXIT-${{ github.run_id }}
          path: outputs/tabport_convex_exit/
          if-no-files-found: error
          retention-days: 30
