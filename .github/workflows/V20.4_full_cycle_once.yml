name: V20.4 GitOK Full Cycle Validation

on:
  push:
    branches:
      - feature/smart-money-v1
    paths:
      - ".github/workflows/V20.4_full_cycle_once.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -c constraints-ci.txt -e .[test]

      - name: Preflight and tests
        run: |
          python -m pip check
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 src tests
          pytest -q

      - name: Full market data refresh
        env:
          V182_RUN_ID: v204-full-${{ github.run_id }}-${{ github.run_attempt }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m v182.reporting.run

      - name: Committee processing
        env:
          MARKETBEAT_API_KEY: ${{ secrets.MARKETBEAT_API_KEY }}
        run: |
          python -m v182.audit.ohlcv_gaps
          python -m v182.decision.scenario_fallback
          python -m v182.decision.analyst_momentum
          python -m v182.decision.marketbeat_overlay_runner
          python -m v182.decision.committee_finalize
          python -m v182.decision.committee_decision_policy

      - name: Validate quality and decisions
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          q = Path('outputs/audit/V18.2_QUALITY_GATES.json')
          d = Path('outputs/V20.4_GITOK_COMMITTEE_DECISIONS.csv')
          s = Path('outputs/V20.4_GITOK_COMMITTEE_SUMMARY.md')
          assert q.exists() and d.exists() and s.exists()
          quality = json.loads(q.read_text())
          assert quality.get('passed') is True, quality
          decisions = pd.read_csv(d, sep=';')
          assert decisions['decision'].astype(str).isin(['BUY_CANDIDATE','WATCH','REVIEW']).any()
          assert not decisions['execution'].astype(str).isin(['LIVE','ORDER','EXECUTE']).any()
          print(decisions['decision'].value_counts(dropna=False).to_dict())
          PY

      - name: Publish committee summary
        run: cat outputs/V20.4_GITOK_COMMITTEE_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full committee package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: V20.4-GitOK-full-cycle-${{ github.run_id }}
          path: |
            outputs/audit/**
            outputs/gaps/**
            outputs/context/**
            outputs/history/**
            outputs/*.csv
            outputs/*.parquet
            outputs/*.xlsx
            outputs/V20.4_GITOK_COMMITTEE_SUMMARY.md
          if-no-files-found: warn
          retention-days: 30
