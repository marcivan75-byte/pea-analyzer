name: V21.17 TEMP real Action listing evidence

on:
  push:
    branches:
      - data/action-listing-evidence-v21-17
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v21-17-action-listing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-real-listing-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/
          key: v21-17-ohlcv-proof-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project and test toolchain
        run: python -m pip install -e '.[test]'

      - name: Collect exact-ISIN Euronext evidence
        run: |
          python - <<'PY'
          from datetime import date, datetime, timezone
          from pathlib import Path
          import json

          import pandas as pd

          from v182.sources.action_listing_evidence import (
              collect_action_listing_evidence,
              load_frozen_listing_evidence,
              load_worklist,
          )

          root = Path('.')
          worklist = load_worklist(root / 'config/V21_17_ACTION_SHORT_HISTORY_WORKLIST.csv')
          frozen = load_frozen_listing_evidence(root / 'config/V21_17_ACTION_LISTING_EVIDENCE_A.csv')
          assert len(worklist) == 157
          assert worklist['isin'].nunique() == 157
          assert len(frozen) == 6
          assert frozen['isin'].nunique() == 6

          accepted, quarantine, metrics = collect_action_listing_evidence(
              worklist_path=root / 'config/V21_17_ACTION_SHORT_HISTORY_WORKLIST.csv',
              start=date(2023, 1, 1),
              end=date(2026, 8, 20),
              timeout=30,
          )
          assert metrics['requested_targets'] == 157
          assert metrics['accepted_exact_isin'] == 6
          assert metrics['quarantine_rows'] == 4
          assert metrics['unresolved_targets'] == 147
          assert metrics['synthetic_history_created'] is False
          assert metrics['calibration_eligibility_changed'] is False
          assert {row['isin'] for row in accepted} == set(frozen['isin'])

          out = root / 'outputs/audit/v21_17_action_listing'
          out.mkdir(parents=True, exist_ok=True)
          pd.DataFrame(accepted).to_csv(
              out / 'ACTION_LISTING_EVIDENCE_ACCEPTED.csv', sep=';', index=False, encoding='utf-8-sig'
          )
          pd.DataFrame(quarantine).to_csv(
              out / 'ACTION_LISTING_EVIDENCE_QUARANTINE.csv', sep=';', index=False, encoding='utf-8-sig'
          )
          payload = {
              **metrics,
              'version': 'V21.17_REAL_ACTION_LISTING_EVIDENCE',
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'worklist_rows': int(len(worklist)),
              'worklist_unique_isins': int(worklist['isin'].nunique()),
              'frozen_evidence_rows': int(len(frozen)),
              'as_of': '2026-08-20',
          }
          (out / 'ACTION_LISTING_EVIDENCE_SUMMARY.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Prove frozen evidence on real OHLCV cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          from v182.audit.ohlcv_history_depth import run
          from v182.sources.action_listing_evidence import load_frozen_listing_evidence

          root = Path('.')
          action_cache = root / 'data/cache/actions'
          cache_files = list(action_cache.glob('history_*.parquet'))
          assert cache_files, 'V21_17_REAL_OHLCV_CACHE_NOT_RESTORED'

          summary = run(root, as_of='2026-08-20')
          audit = pd.read_csv(
              root / 'outputs/audit/OHLCV_PRIMARY_HISTORY_DEPTH.csv',
              sep=';', encoding='utf-8-sig', dtype=str, low_memory=False,
          )
          evidence = load_frozen_listing_evidence(
              root / 'config/V21_17_ACTION_LISTING_EVIDENCE_A.csv'
          )
          target = audit[
              audit['asset_class'].eq('ACTION') & audit['isin'].isin(set(evidence['isin']))
          ].copy()
          assert len(target) == 6, f'V21_17_ACCEPTED_ROWS_MISSING:{len(target)}'
          statuses = target.set_index('isin')['primary_status'].to_dict()
          assert set(statuses.values()) == {'POST_ANCHOR_INCEPTION_CONFIRMED'}, statuses
          eligible = target['primary_calibration_eligible'].astype(str).str.lower()
          assert not eligible.isin({'true', '1'}).any()
          assert not target['primary_status'].eq('PRIMARY_FULL_FROM_ANCHOR').any()
          assert summary['inception_evidence_changes_calibration_eligibility'] is False
          assert summary['missing_or_short_history_imputation_allowed'] is False

          out = root / 'outputs/audit/v21_17_action_listing'
          target.to_csv(
              out / 'ACTION_LISTING_OHLCV_REAL_PROOF.csv',
              sep=';', index=False, encoding='utf-8-sig'
          )
          proof = {
              'status': 'SUCCESS',
              'real_ohlcv_cache_files': len(cache_files),
              'accepted_exact_isin_checked': len(target),
              'primary_status': 'POST_ANCHOR_INCEPTION_CONFIRMED',
              'primary_calibration_eligible_count': 0,
              'synthetic_history_created': False,
              'calibration_gate_changed': False,
          }
          (out / 'ACTION_LISTING_OHLCV_REAL_PROOF.json').write_text(
              json.dumps(proof, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(proof, ensure_ascii=False, indent=2))
          PY

      - name: Run V21.17 regressions
        run: pytest -q tests/test_action_listing_evidence_v21_17.py tests/test_ohlcv_history_depth_v21_13.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V21_17_REAL_ACTION_LISTING_${{ github.run_id }}
          path: |
            outputs/audit/v21_17_action_listing/
            outputs/audit/OHLCV_PRIMARY_HISTORY_DEPTH_SUMMARY.json
          if-no-files-found: error
          retention-days: 14
