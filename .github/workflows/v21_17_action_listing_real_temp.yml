name: V21.17 TEMP real Action listing evidence

on:
  push:
    branches:
      - data/action-listing-evidence-v21-17

permissions:
  contents: read

concurrency:
  group: v21-17-action-listing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-real-listing-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Collect exact-ISIN Euronext evidence
        run: |
          python - <<'PY'
          from datetime import date, datetime, timezone
          from pathlib import Path
          import json

          import pandas as pd

          from v182.sources.action_listing_evidence import (
              collect_action_listing_evidence,
              load_worklist,
          )

          root = Path('.')
          worklist = load_worklist(root / 'config/V21_17_ACTION_SHORT_HISTORY_WORKLIST.csv')
          assert len(worklist) == 157
          assert worklist['isin'].nunique() == 157

          accepted, quarantine, metrics = collect_action_listing_evidence(
              worklist_path=root / 'config/V21_17_ACTION_SHORT_HISTORY_WORKLIST.csv',
              start=date(2023, 1, 1),
              end=date(2026, 8, 20),
              timeout=30,
          )
          assert metrics['requested_targets'] == 157
          assert metrics['synthetic_history_created'] is False
          assert metrics['calibration_eligibility_changed'] is False

          out = root / 'outputs/audit/v21_17_action_listing'
          out.mkdir(parents=True, exist_ok=True)
          pd.DataFrame(accepted).to_csv(
              out / 'ACTION_LISTING_EVIDENCE_ACCEPTED.csv', sep=';', index=False, encoding='utf-8-sig'
          )
          pd.DataFrame(quarantine).to_csv(
              out / 'ACTION_LISTING_EVIDENCE_QUARANTINE.csv', sep=';', index=False, encoding='utf-8-sig'
          )
          payload = {
              **metrics,
              'version': 'V21.17_REAL_ACTION_LISTING_EVIDENCE',
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'worklist_rows': int(len(worklist)),
              'worklist_unique_isins': int(worklist['isin'].nunique()),
              'as_of': '2026-08-20',
          }
          (out / 'ACTION_LISTING_EVIDENCE_SUMMARY.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V21_17_REAL_ACTION_LISTING_${{ github.run_id }}
          path: outputs/audit/v21_17_action_listing/
          if-no-files-found: error
          retention-days: 14
