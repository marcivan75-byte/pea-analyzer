name: ETF Fund Flows V1 Shadow Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "45 21 * * 1-5"

concurrency:
  group: etf-fund-flows-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fund-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Restore ETF fund flow PIT history
        uses: actions/cache/restore@v4
        with:
          path: state/etf_fund_flows/
          key: etf-fund-flow-v1-${{ github.run_id }}
          restore-keys: |
            etf-fund-flow-v1-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: pip install -e ".[test]"
      - name: Validate Fund Flow V1 engine
        run: |
          python -m compileall -q src/v182/features/etf_fund_flows_v1.py src/v182/sources/etf_fund_flows.py src/v182/reporting/etf_fund_flows_shadow_run.py
          pytest -q tests/test_etf_fund_flows_v1.py
      - name: Collect and compute ETF Fund Flows V1 SHADOW
        run: python -m v182.reporting.etf_fund_flows_shadow_run
      - name: Show Fund Flow governance audit
        if: always()
        run: |
          if [ -f outputs/audit/ETF_FUND_FLOW_V1_SHADOW.json ]; then cat outputs/audit/ETF_FUND_FLOW_V1_SHADOW.json; fi
      - name: Publish mobile Fund Flow shadow summary
        if: always()
        run: |
          if [ -f outputs/mobile/ETF_FUND_FLOWS_SHADOW.md ]; then cat outputs/mobile/ETF_FUND_FLOWS_SHADOW.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save ETF fund flow PIT history
        if: ${{ always() && hashFiles('state/etf_fund_flows/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state/etf_fund_flows/
          key: etf-fund-flow-v1-${{ github.run_id }}
      - name: Upload compact Fund Flow shadow outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-fund-flows-v1-${{ github.run_id }}
          path: |
            outputs/etf_fund_flows/
            outputs/mobile/ETF_FUND_FLOWS_SHADOW.md
            outputs/audit/ETF_FUND_FLOW_V1_SHADOW.json
            outputs/gaps/ETF_FUND_FLOW_COLLECTION_FAILURES.csv
          if-no-files-found: warn
          retention-days: 14
