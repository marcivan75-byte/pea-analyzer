name: V21.8 integrated Committee smoke

on:
  push:
    branches:
      - agent/v21-6-3-cdc-postselection
    paths:
      - "config/V21_8_ENTRY_EXIT_GOVERNANCE.json"
      - "src/v182/risk/entry_exit_governance_v21_8.py"
      - "src/v182/reporting/unified_runner.py"
      - "tests/test_entry_exit_governance_v21_8.py"
      - ".github/workflows/v21_8_integrated_smoke.yml"
  workflow_dispatch:
    inputs:
      run_live_diagnostic:
        description: "Run the full live-data unified pipeline diagnostic (slow/external-data dependent)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: v21-8-integrated-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile and focused governance tests
        run: |
          python -m compileall -q src tests
          python -m pytest -q tests/test_entry_exit_governance_v21_8.py tests/test_tct_exact_v24_1_7.py
      - name: Assert integrated wiring statically
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('src/v182/reporting/unified_runner.py').read_text(encoding='utf-8')
          required=[
            'entry_exit_governance',
            'beta_correlation_risk',
            'SKIPPED_GOVERNANCE',
            'No fixed take-profit is operational in V21.8.',
            'Legacy fixed-stop assumptions',
            'No new hard stop is promoted',
            'TCT challenger entry requires exact T2 confirmation',
            'HOLD -> PROTECT -> EXIT',
            'Beta/correlation RISK_V1.1 remains context-only',
            'No real orders are emitted',
          ]
          missing=[x for x in required if x not in text]
          assert not missing, f'Missing integrated V21.8 wiring markers: {missing}'
          print('Static integrated V21.8 wiring assertions PASS')
          PY
      - name: Deterministic downstream V21.8 execution smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          import pandas as pd
          from v182.risk import entry_exit_governance_v21_8

          root=Path('tmp/v21_8_smoke')
          (root/'config').mkdir(parents=True, exist_ok=True)
          (root/'outputs/committee_master').mkdir(parents=True, exist_ok=True)
          shutil.copy2('config/V21_8_ENTRY_EXIT_GOVERNANCE.json', root/'config/V21_8_ENTRY_EXIT_GOVERNANCE.json')
          rows=[
            {'isin':'FR0000000001','asset_class':'ACTION','horizon':'TCT','decision':'ACTION','score':85,'dist_sma50':0.02,'dist_sma200':0.10,'momentum_accel':0.03,'vol20':0.20,'t2_confirmed':False},
            {'isin':'FR0000000002','asset_class':'ACTION','horizon':'TCT','decision':'ACTION','score':85,'dist_sma50':0.02,'dist_sma200':0.10,'momentum_accel':0.03,'vol20':0.20,'t2_confirmed':True},
            {'isin':'FR0000000003','asset_class':'ACTION','horizon':'CT','decision':'ACTION','score':82,'dist_sma50':-0.02,'dist_sma200':0.05,'slope_sma50_20d':-0.01,'ret_21d':-0.03,'return_since_entry':0.08,'max_return_since_entry':0.12},
            {'isin':'FR0000000004','asset_class':'ACTION','horizon':'MT','decision':'ACTION','score':84,'dist_sma50':-0.03,'dist_sma200':-0.02,'slope_sma50_20d':-0.01,'ret_21d':-0.04,'previous_v21_8_position_state':'PROTECT','return_since_entry':0.12,'max_return_since_entry':0.20},
          ]
          pd.DataFrame(rows).to_csv(root/'outputs/committee_master/COMMITTEE_DECISIONS.csv',sep=';',index=False,encoding='utf-8-sig')
          payload=entry_exit_governance_v21_8.run(root)
          assert payload['status']=='SUCCESS'
          out=pd.read_csv(root/'outputs/committee_master/V21_8_ENTRY_EXIT_CHALLENGER.csv',sep=';',encoding='utf-8-sig')
          assert out.loc[out['isin']=='FR0000000001','v21_8_entry_state'].iloc[0]=='WAIT'
          assert out.loc[out['isin']=='FR0000000002','v21_8_entry_state'].iloc[0]=='ACTION'
          assert out.loc[out['isin']=='FR0000000003','v21_8_position_state'].iloc[0]=='PROTECT'
          assert out.loc[out['isin']=='FR0000000004','v21_8_position_state'].iloc[0]=='EXIT'
          assert not out['v21_8_fixed_take_profit'].astype(bool).any()
          assert not out['v21_8_legacy_fixed_stop_engine'].astype(bool).any()
          assert not out['v21_8_new_hard_stop_promoted'].astype(bool).any()
          assert not out['v21_8_real_order'].astype(bool).any()
          audit=json.loads((root/'outputs/audit/V21_8_ENTRY_EXIT_GOVERNANCE.json').read_text())
          assert audit['tct_requires_exact_t2_confirmation'] is True
          assert audit['exit_requires_temporal_confirmation'] is True
          print('Deterministic V21.8 downstream execution smoke PASS')
          PY
      - name: Optional live integrated data-quality diagnostic
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_diagnostic }}
        continue-on-error: true
        timeout-minutes: 20
        run: python -m v182.reporting.unified_runner
      - name: Upload deterministic smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-8-integrated-smoke-${{ github.run_id }}
          path: |
            tmp/v21_8_smoke/outputs/committee_master/V21_8_ENTRY_EXIT_CHALLENGER.csv
            tmp/v21_8_smoke/outputs/audit/V21_8_ENTRY_EXIT_GOVERNANCE.json
            outputs/unified/
          if-no-files-found: warn
          retention-days: 14
