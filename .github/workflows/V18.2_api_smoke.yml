name: V18.2 API Smoke Audit

on:
  push:
    branches:
      - fix/v18-2-waves-resilience
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[api-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: OpenFIGI production mapping smoke test
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from v182.mapping.etf_isin_resolver import resolve_isins, pick_best_match
          key = os.environ.get('OPENFIGI_API_KEY', '').strip()
          assert key, 'OPENFIGI_API_KEY_MISSING'
          isin = 'FR0000120073'
          result = resolve_isins(
              [isin], api_key=key, mic_by_isin={isin: 'XPAR'},
              batch_size=1, delay_seconds=0, max_retries=1,
          )
          raw = result.get(isin)
          assert raw is not None, 'OPENFIGI_API_TRANSPORT_OR_AUTH_FAILURE'
          best = pick_best_match(raw)
          assert best is not None, f'OPENFIGI_NO_EQUITY_MATCH: {raw[:2]}'
          print('OPENFIGI_SMOKE_OK', best.get('ticker'), best.get('figi'))
          PY
      - name: Marketstack production resolver and EOD smoke test
        env:
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
        run: |
          python - <<'PY'
          import os, tempfile
          from pathlib import Path
          import pandas as pd
          from v182.sources.marketstack_symbols import resolve_marketstack_symbols
          from v182.sources.marketstack_eod import fetch_eod_history

          key = os.environ.get('MARKETSTACK_API_KEY', '').strip()
          assert key, 'MARKETSTACK_API_KEY_MISSING'
          row = pd.DataFrame([{
              'isin': 'FR0000120578',
              'name': 'Sanofi',
              'yahoo_ticker': 'SAN.PA',
          }])
          with tempfile.TemporaryDirectory() as tmp:
              cache = Path(tmp) / 'marketstack_symbols.csv'
              resolved = resolve_marketstack_symbols(
                  row, 'ACTION', cache, key,
                  max_new_resolutions=1, min_confidence=0.72,
                  delay_seconds=0,
              )
              assert resolved.api_attempted == 1, resolved
              assert resolved.api_successful == 1, f'MARKETSTACK_RESOLVER_FAILED: {resolved.failures}'
              symbol = resolved.resolved.get('SAN.PA')
              assert symbol == 'SAN.PA', f'UNEXPECTED_MARKETSTACK_SYMBOL: {symbol}'
              print('MARKETSTACK_RESOLVER_OK', symbol)

              eod = fetch_eod_history(
                  [{'canonical_ticker': 'SAN.PA', 'symbol': symbol, 'expected_mic': 'XPAR'}],
                  api_key=key, history_days=120, max_symbols=1,
                  min_rows=20, delay_seconds=0,
              )
              assert eod.attempted == 1, eod
              assert eod.successful == 1, f'MARKETSTACK_EOD_FAILED: {eod.failures}'
              frame = eod.frames['SAN.PA']
              assert len(frame) >= 20
              print('MARKETSTACK_EOD_SMOKE_OK', len(frame), frame.index.max())
          PY
