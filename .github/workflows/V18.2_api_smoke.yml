name: V18.2 API Smoke Audit

on:
  push:
    branches:
      - fix/v18-2-waves-resilience
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[api-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: OpenFIGI authenticated mapping smoke test
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from v182.mapping.etf_isin_resolver import resolve_isins, pick_best_match
          key = os.environ.get('OPENFIGI_API_KEY', '').strip()
          assert key, 'OPENFIGI_API_KEY_MISSING'
          isin = 'FR0000120073'
          result = resolve_isins(
              [isin], api_key=key, mic_by_isin={isin: 'XPAR'},
              batch_size=1, delay_seconds=0, max_retries=1,
          )
          raw = result.get(isin)
          assert raw is not None, 'OPENFIGI_API_TRANSPORT_OR_AUTH_FAILURE'
          best = pick_best_match(raw)
          assert best is not None, f'OPENFIGI_NO_EQUITY_MATCH: {raw[:2]}'
          print('OPENFIGI_SMOKE_OK', best.get('ticker'), best.get('figi'))
          PY
      - name: Marketstack ticker resolver Euronext Paris diagnostic
        env:
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          key = os.environ.get('MARKETSTACK_API_KEY', '').strip()
          assert key, 'MARKETSTACK_API_KEY_MISSING'
          response = requests.get(
              'https://api.marketstack.com/v2/tickers',
              params={'access_key': key, 'search': 'Sanofi', 'exchange': 'XPAR', 'limit': 10},
              timeout=30,
          )
          response.raise_for_status()
          body = response.json()
          assert not body.get('error'), body.get('error')
          rows = body.get('data') or []
          print('MARKETSTACK_TICKER_ROWS', [
              {'symbol': r.get('symbol'), 'name': r.get('name'), 'mic': (r.get('stock_exchange') or {}).get('mic')}
              for r in rows
          ])
          matches = [r for r in rows if str((r.get('stock_exchange') or {}).get('mic') or '').upper() == 'XPAR']
          assert matches, f'MARKETSTACK_NO_XPAR_SANOFI: {rows}'
          print('MARKETSTACK_RESOLVER_OK', matches[0].get('symbol'), matches[0].get('name'))
          PY
