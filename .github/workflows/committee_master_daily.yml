name: PEA Weekly Heavy Committee V4.4

on:
  workflow_dispatch:
    inputs:
      run_validation:
        description: "Run compile, static and referential validation already covered by CI"
        required: false
        type: boolean
        default: false
      maintenance_full_refresh:
        description: "LIVE refresh of slow fundamentals (maintenance only)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 18 * * 5"
      timezone: "Europe/Paris"

concurrency:
  group: committee-weekly-heavy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

jobs:
  committee-master:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PEA_SLOW_SOURCE_MODE: ${{ inputs.maintenance_full_refresh == true && 'LIVE' || 'CACHE_PREFERRED' }}
      PEA_WEEKLY_CRITICAL_ONLY: "1"
      PEA_PROVENANCE_PATH: state/provenance/OBSERVATION_PROVENANCE.csv
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore persistent OHLCV cache
        id: ohlcv_cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            data/cache/actions/
            data/cache/etf/
          key: ohlcv-v4-${{ github.run_id }}
          restore-keys: |
            ohlcv-v4-
            ohlcv-v3-

      - name: Record OHLCV cache restore
        if: always()
        run: |
          mkdir -p outputs/audit
          printf '{"cache_hit":%s,"matched_key":"%s","source":"actions-cache"}\n' \
            '${{ steps.ohlcv_cache.outputs.cache-hit || false }}' \
            '${{ steps.ohlcv_cache.outputs.cache-matched-key }}' \
            > outputs/audit/OHLCV_CACHE_RESTORE.json
          cat outputs/audit/OHLCV_CACHE_RESTORE.json

      - name: Restore consolidated tactical decision state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/
          key: decision-state-v1-${{ github.run_id }}
          restore-keys: |
            decision-state-v1-

      - name: Restore consolidated weekly research state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/sector_rotation_v2/
            state/etf_fund_flows/
            state/objectives_risk/
          key: weekly-research-state-v1-${{ github.run_id }}
          restore-keys: |
            weekly-research-state-v1-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-runtime.txt

      - name: Install production runtime
        run: pip install --prefer-binary -r requirements-runtime.txt

      - name: Prepare writable yfinance runtime
        run: |
          mkdir -p data/cache/.yfinance-runtime state/runtime_tmp
          echo "YF_CACHE=$GITHUB_WORKSPACE/data/cache/.yfinance-runtime" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$GITHUB_WORKSPACE/data/cache/.yfinance-runtime" >> "$GITHUB_ENV"
          echo "TMPDIR=$GITHUB_WORKSPACE/state/runtime_tmp" >> "$GITHUB_ENV"

      - name: Full Python compile and static safety gate
        if: ${{ inputs.run_validation }}
        run: |
          python -m compileall -q src
          python -m v182.audit.static_code_audit --root . --output outputs/audit/PYTHON_STATIC_AUDIT.json --fail-high

      - name: Validate exhaustive referentials and real Action input
        if: ${{ inputs.run_validation }}
        run: python -m compileall -q src

      - name: Publish Action identity hydration worklist
        run: python -m v182.audit.identity_hydration

      - name: Run unified weekly operational runner V4.4
        run: python -m v182.reporting.weekly_operational_runner_v4_4

      - name: Show unified summary
        if: always()
        run: |
          if [ -f outputs/audit/WEEKLY_OPERATIONAL_RUNTIME_V4_4.json ]; then cat outputs/audit/WEEKLY_OPERATIONAL_RUNTIME_V4_4.json; fi
          if [ -f outputs/audit/WEEKLY_UNIFIED_SUPER_RUNTIME_V22_2_3.json ]; then cat outputs/audit/WEEKLY_UNIFIED_SUPER_RUNTIME_V22_2_3.json; fi
          if [ -f outputs/audit/WEEKLY_RUN_SYNTHESIS.json ]; then cat outputs/audit/WEEKLY_RUN_SYNTHESIS.json; fi
          if [ -f outputs/audit/WEEKLY_TAIL_SUPER_RUNTIME_V21_16_0.json ]; then cat outputs/audit/WEEKLY_TAIL_SUPER_RUNTIME_V21_16_0.json; fi

      - name: Publish CI, CI LIGHT and online synthesis
        if: always()
        run: |
          for f in outputs/mobile/WEEKLY_RUN_SYNTHESIS.md outputs/mobile/CI_AND_CI_LIGHT_CHALLENGER_V2.md outputs/mobile/ANDROID_CI_CONTROL_CENTER.md outputs/decision_brief/DECISION_BRIEF.md; do
            if [ -f "$f" ]; then
              printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Publish O/R HEBDO reports
        if: always()
        run: |
          for f in outputs/mobile/OR_HEBDO_REPORT.md outputs/mobile/ANDROID_OR_HEBDO_SHADOW.md outputs/mobile/ANDROID_OBJECTIVES_RISK_SHADOW_V1.md outputs/mobile/ETF_FUND_FLOWS_SHADOW.md; do
            if [ -f "$f" ]; then
              printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Validate OHLCV cache checkpoint
        if: always()
        shell: bash
        run: |
          rm -f state/OHLCV_CACHE_VALIDATED
          mkdir -p outputs/audit state
          actions_ok=0
          etf_ok=0
          if [ -s data/cache/actions/history_manifest.json ]; then actions_ok=1; fi
          if [ -s data/cache/etf/history_manifest.json ]; then etf_ok=1; fi
          if [ "$actions_ok" = 1 ] && [ "$etf_ok" = 1 ]; then
            printf 'validated\n' > state/OHLCV_CACHE_VALIDATED
            status=SAVED_MANIFESTS_PRESENT
          else
            status=SKIPPED_MISSING_MANIFEST
          fi
          printf '{"status":"%s","actions_manifest":%s,"etf_manifest":%s,"quality_gate_required":false}\n' \
            "$status" "$actions_ok" "$etf_ok" > outputs/audit/OHLCV_CACHE_CHECKPOINT.json
          cat outputs/audit/OHLCV_CACHE_CHECKPOINT.json

      - name: Save persistent OHLCV cache
        if: ${{ always() && hashFiles('state/OHLCV_CACHE_VALIDATED') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            data/cache/actions/
            data/cache/etf/
          key: ohlcv-v4-${{ github.run_id }}

      - name: Save consolidated tactical decision state
        if: ${{ always() && (hashFiles('state/TCT_V24_1_7_T1_STATE.json', 'state/tct_context/**', 'state/action_ct/**', 'state/action_ct_v22_1/**', 'state/provenance/**') != '') }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/
          key: decision-state-v1-${{ github.run_id }}

      - name: Save consolidated weekly research state
        if: ${{ always() && (hashFiles('state/sector_rotation_v2/**', 'state/etf_fund_flows/**', 'state/objectives_risk/**') != '') }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/sector_rotation_v2/
            state/etf_fund_flows/
            state/objectives_risk/
          key: weekly-research-state-v1-${{ github.run_id }}

      - name: Upload complete weekly Committee V4.4 results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: committee-weekly-v4-4-${{ github.run_id }}
          path: |
            outputs/unified/
            outputs/decision_brief/
            outputs/committee_master/
            outputs/etf_mt_v2081/
            outputs/etf_fund_flows/
            outputs/sector_rotation/
            outputs/risk/
            outputs/mobile/
            outputs/data_audit/
            outputs/audit/
            outputs/gaps/
            outputs/V21_3_SECTOR_ROTATION.csv
            outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv
            outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
            data/cache/actions/history_manifest.json
            data/cache/etf/history_manifest.json
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/sector_rotation_v2/
            state/etf_fund_flows/
            state/objectives_risk/
            state/provenance/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14
