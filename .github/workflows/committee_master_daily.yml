name: Committee Master V21.3 unified scoring

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/COMMITTEE_MASTER_V21.json"
      - "config/V18.2_MASTER_CONFIG.json"
      - "config/V21_ACTIONS_CRITERIA_REGISTRY.json"
      - "config/V20_7_1_ETF_CRITERIA_REGISTRY.json"
      - "config/V20.8.2_ETF_MT_DYNAMIC.json"
      - "config/COMMITTEE_VIRTUAL_MONEY_MANAGEMENT.json"
      - "config/GOLD_V1_1_102_CRITERIA.json"
      - "config/FULL_REFERENTIAL_INTEGRITY.json"
      - "config/TCT_V24_1_7_SHADOW.json"
      - "config/V21_3_ACTION_UNIVERSE_1829_ISINS.parts/**"
      - "src/v182/audit/**"
      - "src/v182/sources/**"
      - "src/v182/features/**"
      - "src/v182/reporting/**"
      - "src/v182/decision/**"
      - "pyproject.toml"
      - ".github/workflows/committee_master_daily.yml"
  schedule:
    - cron: "15 18 * * 1-5"

permissions:
  contents: read

jobs:
  committee-master:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore TCT V24.1.7 T1 state
        uses: actions/cache/restore@v4
        with:
          path: state/TCT_V24_1_7_T1_STATE.json
          key: tct-v2417-state-${{ github.run_id }}
          restore-keys: |
            tct-v2417-state-
      - name: Restore GOLD V1.1 shadow history
        uses: actions/cache/restore@v4
        with:
          path: state/GOLD_V1_1_SHADOW_HISTORY.csv
          key: gold-v11-history-${{ github.run_id }}
          restore-keys: |
            gold-v11-history-
      - name: Restore Committee BUY performance state
        uses: actions/cache/restore@v4
        with:
          path: state/committee_performance/
          key: committee-performance-${{ github.run_id }}
          restore-keys: |
            committee-performance-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Validate exhaustive referentials
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v182.audit.canonical_universe import load_compressed_isins
          from v182.decision.tct_baseline_v24_1_8 import NORMALIZATION_POLICY
          from v182.decision.tct_timing_exact_v24_1_7 import FORMULA_VERSION, T1_WEIGHTS, T2_WEIGHTS
          a=json.loads(Path("config/V21_ACTIONS_CRITERIA_REGISTRY.json").read_text())
          e=json.loads(Path("config/V20_7_1_ETF_CRITERIA_REGISTRY.json").read_text())
          ed=json.loads(Path("config/V20.8.2_ETF_MT_DYNAMIC.json").read_text())
          g=json.loads(Path("config/GOLD_V1_1_102_CRITERIA.json").read_text())
          integrity=json.loads(Path("config/FULL_REFERENTIAL_INTEGRITY.json").read_text())
          tct=json.loads(Path("config/TCT_V24_1_7_SHADOW.json").read_text())
          assert a["criteria_count"] == 633 == integrity["actions"]["criteria_count"]
          assert integrity["actions"]["universe_count"] == 1829
          assert e["criteria_count"] == 268 == integrity["etf"]["criteria_count"]
          assert len(load_compressed_isins("config/V21_3_ACTION_UNIVERSE_1829_ISINS.parts")) == 1829
          for h in ("CT","MT","LT","SHORT","TOP_DOWN"):
              assert abs(sum(a["weights"][h].values())-1.0) < 1e-6
          assert a["governance"]["t1_t2_scope"] == "ACTION_TCT_ONLY"
          assert e["governance"]["t1_t2_forbidden"] is True
          assert NORMALIZATION_POLICY == "ACTIVE_AVAILABLE_PILLARS_RENORMALIZED_TO_100_SETUP_EXCLUDED"
          assert tct["scope"]["t1_t2_actions_tct_only"] is True
          assert tct["score_influence"] == 0.0
          assert tct["formula_version"] == FORMULA_VERSION
          assert abs(sum(T1_WEIGHTS.values())-1.0) < 1e-12
          assert abs(sum(T2_WEIGHTS.values())-1.0) < 1e-12
          assert ed["missing_policy"] == "AVAILABLE_CRITERIA_RENORMALIZED_TO_100_PERCENT"
          assert ed["historical_performance_attribution"] == "NONE_UNTIL_DEDICATED_PIT_BACKTEST"
          assert g["governance"]["criteria_count"] == len(g["criteria"]) == 102
          assert g["governance"]["contribution_blocks"] == 11
          assert g["governance"]["t1_t2_forbidden"] is True
          assert g["live_orders_enabled"] is False
          print("Referential integrity OK: Actions 1829/633, ETF 102/268 + dynamic MT challenger, TCT V24.1.8, GOLD 102/11")
          PY
      - name: Run unified Committee pipeline
        run: python -m v182.reporting.unified_runner
      - name: Show unified summary
        run: cat outputs/unified/UNIFIED_SUMMARY_LATEST.json
      - name: Show committee summary
        if: always()
        run: |
          if [ -f outputs/committee_master/SUMMARY.json ]; then cat outputs/committee_master/SUMMARY.json; fi
      - name: Show performance summary
        if: always()
        run: |
          if [ -f state/committee_performance/nav.csv ]; then tail -5 state/committee_performance/nav.csv; fi
      - name: Show GOLD V1.1 decision
        if: always()
        run: |
          if [ -f outputs/gold_v1_1/GOLD_V1_1_DECISION.json ]; then cat outputs/gold_v1_1/GOLD_V1_1_DECISION.json; fi
      - name: Save TCT V24.1.7 T1 state
        if: ${{ always() && hashFiles('state/TCT_V24_1_7_T1_STATE.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state/TCT_V24_1_7_T1_STATE.json
          key: tct-v2417-state-${{ github.run_id }}
      - name: Save GOLD V1.1 shadow history
        if: ${{ always() && hashFiles('state/GOLD_V1_1_SHADOW_HISTORY.csv') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state/GOLD_V1_1_SHADOW_HISTORY.csv
          key: gold-v11-history-${{ github.run_id }}
      - name: Save Committee BUY performance state
        if: ${{ always() && hashFiles('state/committee_performance/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state/committee_performance/
          key: committee-performance-${{ github.run_id }}
      - name: Upload complete Committee V21.3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: committee-master-v21-3-${{ github.run_id }}
          path: |
            outputs/unified/
            outputs/committee_master/
            outputs/etf_mt_v2081/
            outputs/gold_v1_1/
            outputs/data_audit/
            outputs/performance/
            outputs/audit/
            outputs/gaps/
            outputs/V21_3_SECTOR_ROTATION.csv
            outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv
            outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
            state/TCT_V24_1_7_T1_STATE.json
            state/GOLD_V1_1_SHADOW_HISTORY.csv
            state/committee_performance/
          if-no-files-found: warn
          retention-days: 30
