name: PEA Weekly Heavy Committee V21.8.1

on:
  workflow_dispatch:
    inputs:
      run_validation:
        description: "Run compile, static and referential validation already covered by CI"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "40 20 * * 5"

concurrency:
  group: committee-weekly-heavy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

jobs:
  committee-master:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PEA_SLOW_SOURCE_MODE: LIVE
      PEA_PROVENANCE_PATH: state/provenance/OBSERVATION_PROVENANCE.csv
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/cache/
          key: ohlcv-v3-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - name: Restore consolidated tactical decision state
        id: decision-state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/
          key: decision-state-v1-${{ github.run_id }}
          restore-keys: |
            decision-state-v1-

      - name: Restore legacy TCT state during cache migration
        if: steps.decision-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/TCT_V24_1_7_T1_STATE.json
          key: tct-v2417-state-${{ github.run_id }}
          restore-keys: |
            daily-tct-state-
            tct-v2417-state-

      - name: Restore legacy next-session catalyst state during cache migration
        if: steps.decision-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/tct_context/
          key: tct-context-${{ github.run_id }}
          restore-keys: |
            tct-context-

      - name: Restore legacy Action CT V22.0 state during cache migration
        if: steps.decision-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/action_ct/
          key: action-ct-v22-${{ github.run_id }}
          restore-keys: |
            action-ct-v22-

      - name: Restore legacy Action CT V22.1 state during cache migration
        if: steps.decision-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/action_ct_v22_1/
          key: action-ct-v221-${{ github.run_id }}
          restore-keys: |
            action-ct-v221-

      - name: Restore legacy provenance state during cache migration
        if: steps.decision-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/provenance/
          key: provenance-v2181-${{ github.run_id }}
          restore-keys: |
            daily-provenance-v2181-
            provenance-v2161-
            provenance-v216-
            provenance-v215-
            provenance-v214-

      - name: Restore consolidated weekly research state
        id: weekly-research-state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/sector_rotation_v2/
            state/etf_fund_flows/
          key: weekly-research-state-v1-${{ github.run_id }}
          restore-keys: |
            weekly-research-state-v1-

      - name: Restore legacy Sector Rotation V2 state during cache migration
        if: steps.weekly-research-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/sector_rotation_v2/
          key: sector-rotation-v2-${{ github.run_id }}
          restore-keys: |
            sector-rotation-v2-

      - name: Restore legacy ETF Fund Flow V1 state during cache migration
        if: steps.weekly-research-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/etf_fund_flows/
          key: etf-fund-flow-v1-${{ github.run_id }}
          restore-keys: |
            etf-fund-flow-v1-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-runtime.txt

      - name: Install production runtime
        run: pip install --prefer-binary -r requirements-runtime.txt

      - name: Full Python compile and static safety gate
        if: ${{ inputs.run_validation }}
        run: |
          python -m compileall -q src
          python -m v182.audit.static_code_audit --root . --output outputs/audit/PYTHON_STATIC_AUDIT.json --fail-high

      - name: Validate exhaustive referentials and real Action input
        if: ${{ inputs.run_validation }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from v182.audit.canonical_universe import load_compressed_isins, filter_actions
          from v182.decision.tct_baseline_v24_1_8 import NORMALIZATION_POLICY
          from v182.decision.tct_timing_exact_v24_1_7 import FORMULA_VERSION, T1_WEIGHTS, T2_WEIGHTS
          a=json.loads(Path("config/V21_ACTIONS_CRITERIA_REGISTRY.json").read_text())
          e=json.loads(Path("config/V20_7_1_ETF_CRITERIA_REGISTRY.json").read_text())
          ed=json.loads(Path("config/V20.8.2_ETF_MT_DYNAMIC.json").read_text())
          integrity=json.loads(Path("config/FULL_REFERENTIAL_INTEGRITY.json").read_text())
          tct=json.loads(Path("config/TCT_V24_1_7_SHADOW.json").read_text())
          sr=json.loads(Path("config/SECTOR_ROTATION_V2_SHADOW.json").read_text())
          srp=json.loads(Path("config/SECTOR_ROTATION_V2_PIT_OOS_PROTOCOL.json").read_text())
          risk=json.loads(Path("config/BETA_CORRELATION_RISK_ENGINE.json").read_text())
          risk_validation=json.loads(Path("config/BETA_RISK_ROBUST_VALIDATION_STATUS.json").read_text())
          ff=json.loads(Path("config/ETF_FUND_FLOW_V1_SHADOW.json").read_text())
          assert a["criteria_count"] == 633 == integrity["actions"]["criteria_count"]
          assert integrity["actions"]["universe_count"] == 1829
          assert e["criteria_count"] == 268 == integrity["etf"]["criteria_count"]
          assert len(load_compressed_isins("config/V21_3_ACTION_UNIVERSE_1829_ISINS.parts")) == 1829
          legacy=pd.read_csv("inputs/V18.2_PEA_ACTIONS_MASTER.csv",sep=";",encoding="utf-8-sig",dtype=str,low_memory=False)
          materialized=filter_actions(legacy,"config/V21_3_ACTION_UNIVERSE_1829_ISINS.parts")
          assert len(materialized.included)==1829
          assert materialized.included["isin"].nunique()==1829
          for h in ("CT","MT","SHORT","TOP_DOWN"):
              assert abs(sum(a["weights"][h].values())-1.0) < 1e-6
          assert "LT" not in a["weights"] and "LT" not in e["weights"]
          assert a["governance"]["positive_unvalidated_overlay_can_create_buy"] is False
          assert a["governance"]["total_return_composite_active_weight"] is False
          assert a["governance"]["t1_t2_scope"] == "ACTION_TCT_ONLY"
          assert e["governance"]["t1_t2_forbidden"] is True
          assert NORMALIZATION_POLICY == "ACTIVE_AVAILABLE_PILLARS_RENORMALIZED_TO_100_SETUP_EXCLUDED"
          assert tct["scope"]["t1_t2_actions_tct_only"] is True
          assert tct["score_influence"] == 0.0
          assert tct["formula_version"] == FORMULA_VERSION
          assert abs(sum(T1_WEIGHTS.values())-1.0) < 1e-12
          assert abs(sum(T2_WEIGHTS.values())-1.0) < 1e-12
          assert ed["missing_policy"] == "AVAILABLE_CRITERIA_RENORMALIZED_TO_100_PERCENT"
          assert ed["historical_performance_attribution"] == "NONE_UNTIL_DEDICATED_PIT_BACKTEST"
          assert sr["mode"] == "SHADOW_ONLY"
          assert sr["version"] == "SECTOR_ROTATION_V2.0_SHADOW"
          assert sr["governance"]["changes_action_scores"] is False
          assert sr["governance"]["changes_etf_scores"] is False
          assert sr["governance"]["can_trigger_orders"] is False
          assert sr["governance"]["can_trigger_sales"] is False
          assert abs(sum(sr["score_weights"]["RLS"].values())-1.0) < 1e-9
          assert abs(sum(sr["score_weights"]["AVCR"].values())-1.0) < 1e-9
          assert abs(sum(sr["score_weights"]["RARS_OPPORTUNITY"].values())-1.0) < 1e-9
          assert abs(sum(sr["score_weights"]["DQS"].values())-1.0) < 1e-9
          assert srp["locked_before_results"] is True
          assert srp["model_version_lock"] == sr["version"]
          assert srp["primary_horizon_days"] == 60
          assert srp["outcomes"]["entry_rule"] == "FIRST_TRADING_SESSION_STRICTLY_AFTER_SIGNAL_DATE"
          assert srp["governance"]["same_day_close_execution_forbidden"] is True
          assert srp["governance"]["no_score_weight_changes"] is True
          assert srp["governance"]["no_threshold_retuning"] is True
          assert srp["governance"]["no_real_orders"] is True
          assert srp["governance"]["final_holdout_locked"] is True
          assert risk["enabled"] is True
          assert risk["benchmark"]["label"] == "PEA_ACTION_ROBUST_EQUAL_WEIGHT_PROXY_V2"
          assert risk["benchmark"]["fail_closed"] is True
          assert risk["governance"]["decision_influence"] == 0.0
          assert risk["governance"]["score_influence"] == 0.0
          assert risk["governance"]["sizing_execution_influence"] == 0.0
          assert risk["governance"]["stop_loss_influence"] == 0.0
          assert risk["governance"]["real_orders_enabled"] is False
          assert risk_validation["status"] == "ROBUST_VALIDATED_CONTEXT_ONLY_KEEP_ALL_SIZING_SHADOW"
          assert risk_validation["final_holdout_opened"] is False
          assert risk_validation["production_policy"]["beta_only_position_sizing_promoted"] is False
          assert risk_validation["production_policy"]["regime_v1_1_sizing_promoted"] is False
          assert risk_validation["production_policy"]["regime_v1_2_sizing_promoted"] is False
          assert ff["mode"] == "SHADOW_ONLY"
          assert ff["governance"]["decision_influence"] == 0.0
          assert ff["governance"]["etf_mt_reference_score_influence"] == 0.0
          assert ff["governance"]["sector_rotation_v2_score_influence"] == 0.0
          assert ff["governance"]["can_trigger_orders"] is False
          assert ff["governance"]["can_trigger_sales"] is False
          assert ff["anti_false_signal"]["mixed_currency_absolute_aggregation_forbidden"] is True
          print(f"V21.8.1 integrity OK: Actions 1829/633, ETF 102/268, no LT/Gold/Crypto/IPO runtime, TCT, Sector Rotation V2 PIT/OOS shadow, Fund Flows V1 PEA-only, RISK V1.1 context-only, Entry/Exit V21.8 baseline (identity-only={materialized.materialized_missing_count})")
          PY

      - name: Publish Action identity hydration worklist
        run: python -m v182.audit.identity_hydration

      - name: Run weekly unified Committee pipeline
        run: python -m v182.reporting.unified_runner

      - name: Replay governed ETF structural state V21.15 for Friday tactical outputs
        continue-on-error: true
        run: python -m v182.reporting.etf_structure_state_replay

      - name: Friday TCT CT scoring and V21.8
        run: python -m v182.reporting.daily_tct_ct_runner

      - name: Action CT V22.0 V22.1 + TCT V24.3.1 Friday shared-parquet SHADOW
        continue-on-error: true
        run: python -m v182.reporting.tactical_shadow_bundle_run

      - name: Friday POSTMARKET V24.4.2 OHLC + catalyst + lineage + validator single-process
        continue-on-error: true
        run: python -m v182.reporting.tct_postmarket_bundle_run

      - name: Build synthetic decision brief
        if: always()
        run: python -m v182.reporting.decision_brief

      - name: Run ETF Fund Flows V1 SHADOW context
        continue-on-error: true
        run: python -m v182.reporting.etf_fund_flows_shadow_run

      - name: Audit criteria governance
        run: python -m v182.reporting.criteria_governance_audit

      - name: Show unified summary
        if: always()
        run: |
          if [ -f outputs/unified/UNIFIED_SUMMARY_LATEST.json ]; then cat outputs/unified/UNIFIED_SUMMARY_LATEST.json; fi
          if [ -f outputs/audit/UNIFIED_RUNTIME_V21_13_7.json ]; then cat outputs/audit/UNIFIED_RUNTIME_V21_13_7.json; fi
          if [ -f outputs/audit/ACTION_CT_SHARED_HISTORY_RUNTIME_V21_13_10.json ]; then cat outputs/audit/ACTION_CT_SHARED_HISTORY_RUNTIME_V21_13_10.json; fi
          if [ -f outputs/audit/TACTICAL_SHARED_PARQUET_RUNTIME_V21_13_11.json ]; then cat outputs/audit/TACTICAL_SHARED_PARQUET_RUNTIME_V21_13_11.json; fi
          if [ -f outputs/audit/POSTMARKET_BUNDLE_RUNTIME_V21_13_12.json ]; then cat outputs/audit/POSTMARKET_BUNDLE_RUNTIME_V21_13_12.json; fi

      - name: Show committee summary
        if: always()
        run: |
          if [ -f outputs/committee_master/SUMMARY.json ]; then cat outputs/committee_master/SUMMARY.json; fi

      - name: Show V21.8 Entry/Exit governance
        if: always()
        run: |
          if [ -f outputs/audit/V21_8_ENTRY_EXIT_GOVERNANCE.json ]; then cat outputs/audit/V21_8_ENTRY_EXIT_GOVERNANCE.json; fi

      - name: Show criteria governance audit
        if: always()
        run: |
          if [ -f outputs/audit/CRITERIA_GOVERNANCE_AUDIT.json ]; then cat outputs/audit/CRITERIA_GOVERNANCE_AUDIT.json; fi

      - name: Show Sector Rotation V2 shadow summary
        if: always()
        run: |
          if [ -f outputs/audit/V2_SECTOR_ROTATION_SHADOW.json ]; then cat outputs/audit/V2_SECTOR_ROTATION_SHADOW.json; fi

      - name: Show Sector Rotation V2 PIT OOS status
        if: always()
        run: |
          if [ -f outputs/audit/V2_SECTOR_ROTATION_PIT_OOS_STATUS.json ]; then cat outputs/audit/V2_SECTOR_ROTATION_PIT_OOS_STATUS.json; fi

      - name: Show ETF Fund Flows V1 shadow audit
        if: always()
        run: |
          if [ -f outputs/audit/ETF_FUND_FLOW_V1_SHADOW.json ]; then cat outputs/audit/ETF_FUND_FLOW_V1_SHADOW.json; fi

      - name: Show RISK V1.1 audit
        if: always()
        run: |
          if [ -f outputs/audit/BETA_CORRELATION_RISK_ENGINE.json ]; then cat outputs/audit/BETA_CORRELATION_RISK_ENGINE.json; fi

      - name: Publish synthetic decision brief
        if: always()
        run: |
          if [ -f outputs/decision_brief/DECISION_BRIEF.md ]; then
            cat outputs/decision_brief/DECISION_BRIEF.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish full Committee Android summary
        if: always()
        run: |
          if [ -f outputs/mobile/ANDROID_CI_CONTROL_CENTER.md ]; then
            cat outputs/mobile/ANDROID_CI_CONTROL_CENTER.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f outputs/mobile/RISK_V1_1_CONTROL_CENTER.md ]; then
            cat outputs/mobile/RISK_V1_1_CONTROL_CENTER.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/mobile/ETF_FUND_FLOWS_SHADOW.md ]; then
            printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/mobile/ETF_FUND_FLOWS_SHADOW.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md ]; then
            printf '\n\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save persistent OHLCV cache
        if: ${{ success() && hashFiles('data/cache/**') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/cache/
          key: ohlcv-v3-${{ github.run_id }}

      - name: Save consolidated tactical decision state
        if: ${{ always() && (hashFiles('state/TCT_V24_1_7_T1_STATE.json', 'state/tct_context/**', 'state/action_ct/**', 'state/action_ct_v22_1/**', 'state/provenance/**') != '') }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/
          key: decision-state-v1-${{ github.run_id }}

      - name: Save consolidated weekly research state
        if: ${{ always() && (hashFiles('state/sector_rotation_v2/**', 'state/etf_fund_flows/**') != '') }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/sector_rotation_v2/
            state/etf_fund_flows/
          key: weekly-research-state-v1-${{ github.run_id }}

      - name: Upload complete weekly Committee V21.8.1 results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: committee-weekly-v21-8-1-${{ github.run_id }}
          path: |
            outputs/unified/
            outputs/decision_brief/
            outputs/committee_master/
            outputs/etf_mt_v2081/
            outputs/etf_fund_flows/
            outputs/sector_rotation/
            outputs/risk/
            outputs/mobile/
            outputs/data_audit/
            outputs/audit/
            outputs/gaps/
            outputs/V21_3_SECTOR_ROTATION.csv
            outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv
            outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
            data/cache/actions/history_manifest.json
            data/cache/etf/history_manifest.json
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/sector_rotation_v2/
            state/etf_fund_flows/
            state/provenance/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14