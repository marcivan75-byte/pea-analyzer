name: ETF GROK2 Alpha Entry Research V4

on:
  push:
    branches:
      - research/grok2-exit-refactor
    paths:
      - 'config/ETF_GROK2_ALPHA_ENTRY_RESEARCH_V4.json'
      - 'src/v182/backtest/etf_grok2_alpha_entry_research_v4.py'
      - '.github/workflows/etf_grok2_alpha_entry_research_v4.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - name: Compile
        run: python -m py_compile src/v182/backtest/etf_grok2_alpha_entry_research_v4.py
      - name: Build hardened ETF base
        run: python -m v182.backtest.etf_backtest_base_v1
      - name: Build PIT evidence layer
        run: python -m v182.backtest.etf_pit_membership_v2
      - name: Run alpha entry research
        run: python -m v182.backtest.etf_grok2_alpha_entry_research_v4
      - name: Validate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/etf_grok2_alpha_entry_research_v4/SUMMARY.json')
          x=json.loads(p.read_text())
          assert x['fixed_take_profit_used'] is False
          assert x['same_close_signal_execution_used'] is False
          assert x['rotation_used'] is False
          assert x['survivorship_bias_resolved'] is False
          assert x['promotion_eligible'] is False
          assert x['real_orders_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ETF_GROK2_ALPHA_ENTRY_RESEARCH_V4
          path: outputs/etf_grok2_alpha_entry_research_v4/
          retention-days: 90
