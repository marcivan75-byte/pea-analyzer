name: TradingView V22.2.3 bounded probe

on:
  pull_request:
    paths:
      - "src/v182/sources/tradingview_technical.py"
      - "tests/test_tradingview_technical_v22_2_3.py"
      - ".github/workflows/tradingview_probe_v22_2_3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    env:
      PYTHONPATH: src
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bounded probe dependencies
        run: python -m pip install -c constraints-ci.txt requests beautifulsoup4 lxml pandas
      - name: Probe five exchange-qualified TradingView pages
        shell: bash
        run: |
          python - <<'PY'
          import json
          import requests
          from v182.sources.tradingview_technical import parse_technical_summary_html

          symbols = [
              "EURONEXT:AIR",
              "EURONEXT:CAP",
              "EURONEXT:BNP",
              "EURONEXT:RNO",
              "MIL:STLAM",
          ]
          results = []
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; PEA-Analyzer/22.2.3; bounded-probe)",
              "Accept-Language": "en-US,en;q=0.8",
          }
          for symbol in symbols:
              exchange, ticker = symbol.split(":", 1)
              url = f"https://www.tradingview.com/symbols/{exchange}-{ticker}/technicals/"
              item = {"symbol": symbol, "url": url}
              try:
                  response = requests.get(url, headers=headers, timeout=20, allow_redirects=True)
                  item["http_status"] = response.status_code
                  item["bytes"] = len(response.content)
                  item["identity_proven"] = f"/chart/?symbol={symbol}" in response.text
                  fields = parse_technical_summary_html(response.text)
                  item["daily"] = fields.get("tradingview_daily_signal")
                  item["weekly"] = fields.get("tradingview_weekly_signal")
                  item["monthly"] = fields.get("tradingview_monthly_signal")
                  item["complete"] = bool(fields.get("tradingview_technical_complete"))
              except Exception as exc:
                  item["error"] = f"{type(exc).__name__}: {str(exc)[:160]}"
              results.append(item)
          print(json.dumps(results, ensure_ascii=False, indent=2))
          valid = [item for item in results if item.get("http_status") == 200 and item.get("identity_proven") and item.get("complete")]
          if len(valid) != len(symbols):
              raise SystemExit(f"TRADINGVIEW_PROBE_INCOMPLETE:{len(valid)}/{len(symbols)}")
          PY

