name: OPS - Disable obsolete workflows V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_ops_disable_obsolete_workflows_v2.yml'

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disable obsolete workflow records
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          repo=os.environ['REPO']; token=os.environ['TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'workflow-cleanup-v2'}
          keep={'.github/workflows/V20.7_etf102_only.yml','.github/workflows/V21.0_actions1429_only.yml'}
          self_path='.github/workflows/_ops_disable_obsolete_workflows_v2.yml'
          def call(url,method='GET'):
              req=urllib.request.Request(url,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      b=r.read(); return r.status, json.loads(b) if b else None
              except urllib.error.HTTPError as e:
                  print('HTTP',e.code,method,url,e.read().decode('utf-8','replace'))
                  return e.code,None
          code,p=call(f'https://api.github.com/repos/{repo}/actions/workflows?per_page=100')
          assert code==200 and p is not None
          self_id=None; failures=[]; disabled=[]
          for w in p['workflows']:
              wid,path,state=w['id'],w.get('path',''),w.get('state','')
              if path in keep:
                  print('KEEP',wid,path,state); continue
              if path==self_path:
                  self_id=wid; print('SELF',wid,state); continue
              if state=='active':
                  c,_=call(f'https://api.github.com/repos/{repo}/actions/workflows/{wid}/disable','PUT')
                  print('DISABLE',wid,path,c)
                  if c==204: disabled.append(wid)
                  else: failures.append((wid,path,c))
              else:
                  print('NONACTIVE',wid,path,state)
          if failures: raise SystemExit(f'FAILURES={failures}')
          print('DISABLED_COUNT',len(disabled))
          if self_id:
              c,_=call(f'https://api.github.com/repos/{repo}/actions/workflows/{self_id}/disable','PUT')
              print('DISABLE_SELF',self_id,c)
              if c!=204: raise SystemExit(f'SELF_DISABLE_FAILED={c}')
          print('CLEANUP_OK')
          PY
