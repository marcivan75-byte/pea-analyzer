name: TABPORT decisive benchmark

on:
  workflow_dispatch:
  push:
    branches: [hebdo-at-meta]
    paths:
      - 'v182/hebdo/tabport_decisive_benchmark.py'
      - 'tests/test_tabport_decisive_benchmark.py'
      - '.github/workflows/tabport_decisive_benchmark.yml'

permissions:
  contents: read
  actions: read

jobs:
  decisive:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONNOUSERSITE: '1'
      GH_TOKEN: ${{ github.token }}
      PRE2023_ARTIFACT_ID: '9817322742'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Restore governed holdout
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Restore governed PRE2023
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/pre2023
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRE2023_ARTIFACT_ID}/zip" > /tmp/pre2023.zip
          unzip -oq /tmp/pre2023.zip -d inputs/pre2023
          test -s inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet
          test -s inputs/pre2023/PRE2023_YAHOO_CORPUS_MANIFEST.json
          test -n "$(find data/cache/actions -name 'history_*.parquet' -print -quit)"
      - name: Install runtime
        run: |
          python -m pip install --prefer-binary -r requirements-runtime.txt
          python -m pip install pytest scikit-learn scipy
      - name: Validate focused chain
        run: |
          python -m py_compile v182/hebdo/tabport_decisive_benchmark.py
          python -m pytest -q -o pythonpath=. \
            tests/test_tabport_decisive_benchmark.py \
            tests/test_hebdo_at_meta.py \
            tests/test_backtest_B_v2.py \
            tests/test_tabport_meta.py \
            tests/test_tabport_historical_meta.py
      - name: Run decisive campaign
        run: |
          python -m v182.hebdo.tabport_decisive_benchmark \
            --pre2023 inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet \
            --manifest inputs/pre2023/PRE2023_YAHOO_CORPUS_MANIFEST.json \
            --holdout-cache data/cache/actions \
            --output-dir outputs/decisive_benchmark
      - name: Validate governance and print results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('outputs/decisive_benchmark')
          s=json.loads((root/'TABPORT_DECISIVE_SUMMARY.json').read_text())
          assert s['status']=='SUCCESS'
          assert s['production_promotion'] is False
          assert s['governance']['holdout_used_for_tuning'] is False
          assert s['governance']['new_predictive_features'] is False
          assert s['governance']['new_ml'] is False
          assert s['governance']['new_stop_tuning'] is False
          assert s['benchmark']=='CW8.PA'
          c=pd.read_csv(root/'TABPORT_DECISIVE_COMPARISON.csv')
          assert {'CW8_BUY_HOLD','BASELINE','TOP1','TOP2','CORE75_CW8_SAT25_TOP1','CORE75_CW8_SAT25_TOP2'} <= set(c['model'])
          print(json.dumps(s,indent=2))
          print('---COMPARISON---')
          print(c.to_csv(index=False))
          print('---DECISIONS---')
          print(pd.read_csv(root/'TABPORT_DECISIVE_DECISIONS.csv').to_csv(index=False))
          PY
      - name: Upload decisive package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TABPORT-DECISIVE-BENCHMARK-${{ github.run_id }}
          path: outputs/decisive_benchmark/
          retention-days: 30
