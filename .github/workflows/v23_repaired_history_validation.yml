name: V23 repaired history validation

on:
  push:
    branches: [v23/tabport-reset-benchmark-first]
    paths:
      - scripts/v23_build_repaired_history_overlay.py
      - .github/workflows/v23_repaired_history_validation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install minimal runtime
        run: python -m pip install --prefer-binary 'pandas>=2.2' 'numpy>=2.0' 'pyarrow>=17' 'yfinance>=0.2.54'
      - name: Download frozen master history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input_history
          curl -L --fail --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9758563012/zip" \
            -o input_history/history.zip
          unzip -q input_history/history.zip -d input_history/unpacked
          PARQUET=$(find input_history/unpacked -type f -name 'PEA_OHLCV_2010_2026_CONSOLIDATED.parquet' | head -1)
          test -n "$PARQUET"
          echo "HISTORY_PARQUET=$PARQUET" >> "$GITHUB_ENV"
      - name: Build fail-closed repair overlay
        run: python scripts/v23_build_repaired_history_overlay.py --history "$HISTORY_PARQUET" --out-dir outputs/v23_repaired_history
      - name: Re-run frozen tradability audit on repaired overlay
        run: python scripts/v23_momentum_tradability_audit.py --history outputs/v23_repaired_history/PEA_CLOSE_PRE2023_REPAIRED_OVERLAY.parquet --out-dir outputs/v23_repaired_tradability
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v23-repaired-history-validation-${{ github.run_id }}
          path: |
            outputs/v23_repaired_history/
            outputs/v23_repaired_tradability/
          retention-days: 90
