name: OPS - Finalize cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_ops_finalize_cleanup.yml'

permissions:
  actions: write
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Force-cancel and delete zombie runs
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, time, json, urllib.request, urllib.error
          repo=os.environ['REPO']; token=os.environ['TOKEN']
          run_ids=[31164734905,31164711529,31164688784,31164672077,31164657786]
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10','User-Agent':'final-cleanup'}
          def call(url,method='GET'):
              req=urllib.request.Request(url,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      b=r.read(); return r.status, (json.loads(b) if b else None)
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  print('HTTP',e.code,method,url,body)
                  return e.code,None
          for rid in run_ids:
              base=f'https://api.github.com/repos/{repo}/actions/runs/{rid}'
              code,data=call(base)
              print('BEFORE',rid,code,(data or {}).get('status'),(data or {}).get('conclusion'))
              if code==404: continue
              for endpoint in ('cancel','force-cancel'):
                  c,_=call(base+'/'+endpoint,'POST')
                  print(endpoint.upper(),rid,c)
              time.sleep(1)
              code,data=call(base)
              print('AFTER_CANCEL',rid,code,(data or {}).get('status'),(data or {}).get('conclusion'))
              d,_=call(base,'DELETE')
              print('DELETE',rid,d)
          print('FINAL_CLEANUP_ATTEMPT_COMPLETE')
          PY
