name: BACKTEST 10 Elements V1 - History Enrichment and Audit

on:
  workflow_dispatch:
    inputs:
      candidate_count:
        description: "Weight combinations tested independently per element"
        required: false
        default: "1000"
        type: string
      artifact_limit:
        description: "Maximum recent source artifacts inspected"
        required: false
        default: "100"
        type: string
  schedule:
    - cron: "30 19 * * 5"
  push:
    branches:
      - feature/backtest-optimizer-v1
    paths:
      - ".github/workflows/BACKTEST_10_ELEMENT_LAUNCHER_V1.yml"
      - "config/BACKTEST_10_ELEMENT_V1.json"
      - "src/v182/backtest_optimizer/**"
      - "tests/test_backtest_10_element_v1.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: backtest-10-elements-v1
  cancel-in-progress: true

jobs:
  history-backtest-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validated dependency set
        run: pip install -c constraints-ci.txt -e .[test]

      - name: Validate launcher and optimizer
        run: |
          set -euo pipefail
          python -m pip check
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 src/v182/backtest_optimizer tests/test_backtest_optimizer_v1.py tests/test_backtest_10_element_v1.py
          pytest -q tests/test_backtest_optimizer_v1.py tests/test_backtest_10_element_v1.py

      - name: Restore latest rolling point-in-time history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-history
          HISTORY_ARTIFACT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | map(select(.expired == false and (.name | startswith("BACKTEST-10-ELEMENT-HISTORY-")))) | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -n "${HISTORY_ARTIFACT:-}" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORY_ARTIFACT}/zip" > /tmp/previous-history/history.zip
            unzip -oq /tmp/previous-history/history.zip -d /tmp/previous-history/extract
            echo "RESTORED_HISTORY_ARTIFACT=${HISTORY_ARTIFACT}" >> "$GITHUB_ENV"
          else
            mkdir -p /tmp/previous-history/extract
            echo "RESTORED_HISTORY_ARTIFACT=NONE" >> "$GITHUB_ENV"
          fi

      - name: Recover validated ETF and Action committee snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_LIMIT: ${{ inputs.artifact_limit || '100' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw-history /tmp/source-artifacts
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired == false) | select((.name | startswith("V21.0-Actions-PEA-1429-Reference-")) or (.name | startswith("V20.7-ETF-PEA-102-Committee-")) or (.name | startswith("V20.4-GitOK-end-to-end-")) or (.name | startswith("V20.4-GitOK-full-cycle-")) or (.name | startswith("V20.4-GitOK-reference-"))) | [.id,.workflow_run.id,.created_at,.name] | @tsv' \
            | head -n "${ARTIFACT_LIMIT}" > /tmp/source-artifacts/candidates.tsv || true
          while IFS=$'\t' read -r ARTIFACT_ID RUN_ID CREATED_AT ARTIFACT_NAME; do
            [ -n "${ARTIFACT_ID:-}" ] || continue
            CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""' 2>/dev/null || true)
            [ "$CONCLUSION" = "success" ] || continue
            SNAPSHOT_DATE="${CREATED_AT:0:10}"
            DEST="/tmp/raw-history/${SNAPSHOT_DATE}__${RUN_ID}"
            mkdir -p "$DEST" /tmp/source-artifacts/unpack
            rm -rf /tmp/source-artifacts/unpack/*
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/source-artifacts/source.zip || continue
            unzip -oq /tmp/source-artifacts/source.zip -d /tmp/source-artifacts/unpack || continue
            find /tmp/source-artifacts/unpack -type f -name 'V21.0_ACTIONS_PEA_1429_COMMITTEE.csv' -exec cp '{}' "$DEST/" ';'
            find /tmp/source-artifacts/unpack -type f -name 'V20.4_GITOK_ACTIONS_3609_DECISIONS.csv' -exec cp '{}' "$DEST/" ';'
            find /tmp/source-artifacts/unpack -type f -name 'V20.7_ETF102_COMMITTEE.csv' -exec cp '{}' "$DEST/" ';'
          done < /tmp/source-artifacts/candidates.tsv
          echo "Recovered V21 Action snapshots: $(find /tmp/raw-history -type f -name 'V21.0_ACTIONS_PEA_1429_COMMITTEE.csv' | wc -l)"
          echo "Recovered legacy Action snapshots: $(find /tmp/raw-history -type f -name '*ACTIONS_3609_DECISIONS*.csv' | wc -l)"
          echo "Recovered ETF snapshots: $(find /tmp/raw-history -type f -name '*V20.7_ETF102_COMMITTEE*.csv' | wc -l)"

      - name: Enrich rolling point-in-time history and realized outcomes
        run: |
          set -euo pipefail
          mkdir -p outputs/backtest_history
          python -m v182.backtest_optimizer.history \
            --raw /tmp/raw-history \
            --previous /tmp/previous-history/extract \
            --output outputs/backtest_history \
            --config config/BACKTEST_10_ELEMENT_V1.json

      - name: Run 10 consecutive independent backtests
        env:
          CANDIDATE_COUNT: ${{ inputs.candidate_count || '1000' }}
        run: |
          set -euo pipefail
          python -m v182.backtest_optimizer.ten_element \
            --history outputs/backtest_history \
            --config config/BACKTEST_10_ELEMENT_V1.json \
            --output outputs/backtest_10_elements \
            --candidate-count "$CANDIDATE_COUNT"

      - name: Final audit hard gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          p=Path('outputs/backtest_10_elements')
          a=json.loads((p/'MASTER_AUDIT.json').read_text(encoding='utf-8'))
          r=pd.read_csv(p/'MASTER_RESULTS.csv')
          w=pd.read_csv(p/'OPTIMIZATION_RECOMMENDATIONS.csv')
          assert a['element_count']==10 and a['expected_element_count']==10, a
          assert len(r)==10 and r['element'].nunique()==10
          assert (r['asset_class']=='ETF').sum()==5 and (r['asset_class']=='ACTION').sum()==5
          assert not a['fatal_errors'], a['fatal_errors']
          assert a['production_weights_modified'] is False
          assert set(r['status']) <= {'ROBUST_RECOMMENDATION','NO_ROBUST_IMPROVEMENT','INSUFFICIENT_HISTORY','INSUFFICIENT_FEATURES'}
          assert not w.empty
          assert set(w['asset_class']) <= {'ETF','ACTION'}
          h=json.loads(Path('outputs/backtest_history/HISTORY_AUDIT.json').read_text(encoding='utf-8'))
          assert h['production_weights_modified'] is False
          assert h['lookahead_policy'].startswith('features preserved')
          assert h['asset_classes']['ETF']['rows'] >= 100, h['asset_classes']['ETF']
          assert h['asset_classes']['ACTION']['rows'] >= 1000, h['asset_classes']['ACTION']
          assert h['asset_classes']['ACTION']['restored_component_score_columns'] >= 60, h['asset_classes']['ACTION']
          print('BACKTEST_10_ELEMENT_AUDIT_OK',a['statuses'])
          PY

      - name: Publish final audit and recommendations
        if: always()
        run: |
          if [ -s outputs/backtest_10_elements/MASTER_AUDIT.md ]; then
            cat outputs/backtest_10_elements/MASTER_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Historique roulant" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact restauré : ${RESTORED_HISTORY_ARTIFACT:-NONE}" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('outputs/backtest_history/HISTORY_AUDIT.json')
          if p.exists():
              a=json.loads(p.read_text())
              for asset,d in a.get('asset_classes',{}).items():
                  print(f"- {asset}: {d.get('snapshots',0)} snapshots / {d.get('rows',0)} lignes / {d.get('columns',0)} colonnes / {d.get('first_snapshot')} -> {d.get('last_snapshot')}")
                  print(f"  - Component scores restaurés: {d.get('restored_component_score_columns',0)}")
          PY

      - name: Upload rolling history for next launcher run
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: BACKTEST-10-ELEMENT-HISTORY-${{ github.run_id }}
          path: |
            outputs/backtest_history/*.parquet
            outputs/backtest_history/HISTORY_AUDIT.json
            config/BACKTEST_10_ELEMENT_V1.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload ten-element backtest and audit pack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: BACKTEST-10-ELEMENT-RESULTS-${{ github.run_id }}
          path: |
            outputs/backtest_10_elements/**
            outputs/backtest_history/HISTORY_AUDIT.json
            config/BACKTEST_10_ELEMENT_V1.json
          if-no-files-found: warn
          retention-days: 90
