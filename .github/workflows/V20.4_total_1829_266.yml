name: V20.4 Total Committee 1829 Actions + 266 ETF

on:
  workflow_dispatch:
  push:
    branches: [feature/smart-money-v1]
    paths:
      - '.github/workflows/V20.4_total_1829_266.yml'
      - 'src/v182/decision/actions_universe_1829_committee.py'
      - 'state/v20.4_total_1829_266.trigger'

permissions:
  contents: read
  actions: read

concurrency:
  group: v204-total-1829-266
  cancel-in-progress: true

jobs:
  total-committee:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validated dependency set
        run: pip install -c constraints-ci.txt -e .[test]
      - name: Preflight
        run: |
          python -m pip check
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 src tests
      - name: Reuse final 1829 Actions reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/total/actions outputs
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts|sort_by(.created_at)|reverse|.[]|select(.expired==false)|select(.name|startswith("V20.4-Actions-PEA-Final-Reference-"))|[.id,.workflow_run.id]|@tsv' > /tmp/total/actions.tsv
          FOUND=0
          while IFS=$'\t' read -r ART RUN; do
            [ -n "$ART" ] || continue
            C=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}" --jq '.conclusion // ""' 2>/dev/null || true)
            [ "$C" = success ] || continue
            rm -rf /tmp/total/actions/*; gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" > /tmp/total/a.zip
            unzip -oq /tmp/total/a.zip -d /tmp/total/actions
            SRC=$(find /tmp/total/actions -name V20.4_ACTIONS_PEA_FINAL_REFERENCE_ENRICHED.csv -print -quit)
            [ -n "$SRC" ] || continue
            cp "$SRC" outputs/V20.4_ACTIONS_PEA_FINAL_REFERENCE_ENRICHED.csv
            echo "ACTIONS_REFERENCE_RUN=$RUN" >> "$GITHUB_ENV"; FOUND=1; break
          done < /tmp/total/actions.tsv
          test "$FOUND" = 1
      - name: Reuse latest validated daily ETF dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/total/daily
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts|sort_by(.created_at)|reverse|.[]|select(.expired==false)|select((.name|startswith("V20.4-GitOK-end-to-end-")) or (.name|startswith("V20.4-GitOK-reference-")) or (.name|startswith("V20.4-GitOK-full-cycle-")))|[.id,.workflow_run.id]|@tsv' > /tmp/total/daily.tsv
          FOUND=0
          while IFS=$'\t' read -r ART RUN; do
            [ -n "$ART" ] || continue
            C=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}" --jq '.conclusion // ""' 2>/dev/null || true)
            [ "$C" = success ] || continue
            rm -rf /tmp/total/daily/*; gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" > /tmp/total/d.zip
            unzip -oq /tmp/total/d.zip -d /tmp/total/daily
            SRC=$(find /tmp/total/daily -name V18.2_PEA_ETF_MASTER_ENRICHED.csv -print -quit)
            Q=$(find /tmp/total/daily -name V18.2_QUALITY_GATES.json -print -quit)
            [ -n "$SRC" ] && [ -n "$Q" ] || continue
            cp "$SRC" outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
            mkdir -p outputs/audit; cp "$Q" outputs/audit/V18.2_QUALITY_GATES.json
            echo "DAILY_DATASET_RUN=$RUN" >> "$GITHUB_ENV"; FOUND=1; break
          done < /tmp/total/daily.tsv
          test "$FOUND" = 1
      - name: Validate source quality gates
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          a=pd.read_csv('outputs/V20.4_ACTIONS_PEA_FINAL_REFERENCE_ENRICHED.csv',sep=';',dtype=object,encoding='utf-8-sig')
          assert len(a)==1829 and a['isin'].nunique()==1829 and len(a.columns)>=272
          assert a['canonical_execution_guard'].eq('NO_LIVE_EXECUTION').all()
          q=json.loads(Path('outputs/audit/V18.2_QUALITY_GATES.json').read_text(encoding='utf-8'))
          assert q.get('passed') is True,q
          print('TOTAL_SOURCE_GATES_OK',len(a),len(a.columns))
          PY
      - name: Build 1829 Actions committee
        run: python -m v182.decision.actions_universe_1829_committee
      - name: Build 266 ETF committee
        run: python -m v182.decision.etf_universe_266_policy
      - name: Total decision quality gates
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          a=pd.read_csv('outputs/V20.4_GITOK_ACTIONS_1829_DECISIONS.csv',sep=';',dtype=object,encoding='utf-8-sig')
          e=pd.read_csv('outputs/V20.4_GITOK_ETF_266_DECISIONS.csv',sep=';',dtype=object,encoding='utf-8-sig')
          assert len(a)==1829 and a['isin'].nunique()==1829
          assert len(e)==266 and e['ISIN'].astype(str).nunique()==266
          req={'score_short_term','score_medium_term','score_long_term','short_thesis_score','committee_score_1829','T0','T1_1_4w','T2_1_3m','T3_3_6m','T4_6_12m','T5_12_24m','T1_entry_low','T1_entry_high','T1_target','T1_invalidation','decision','execution','identity_method','identity_confidence'}
          assert req.issubset(a.columns),req-set(a.columns)
          live={'LIVE','ORDER','EXECUTE','BROKER','REAL_ORDER','LIVE_ORDER'}
          assert not a.execution.astype(str).str.upper().isin(live).any()
          assert not e.execution.astype(str).str.upper().isin(live).any()
          conf=pd.to_numeric(a.identity_confidence,errors='coerce').fillna(0)
          assert not ((a.decision=='BUY_CANDIDATE')&(conf<.92)).any()
          aa=json.loads(Path('outputs/audit/V20.4_ACTIONS_1829_COMMITTEE_AUDIT.json').read_text())
          assert aa['passed'] is True and aa['smart_money_enabled'] is False and aa['live_order_execution_enabled'] is False
          print('TOTAL_COMMITTEE_OK','actions',a.decision.value_counts().to_dict(),'etf',e.decision.value_counts().to_dict())
          PY
      - name: Publish committee summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,pandas as pd
          from pathlib import Path
          a=pd.read_csv('outputs/V20.4_GITOK_ACTIONS_1829_DECISIONS.csv',sep=';',dtype=object,encoding='utf-8-sig')
          e=pd.read_csv('outputs/V20.4_GITOK_ETF_266_DECISIONS.csv',sep=';',dtype=object,encoding='utf-8-sig')
          au=json.loads(Path('outputs/audit/V20.4_ACTIONS_1829_COMMITTEE_AUDIT.json').read_text())
          print('## V20.4 Total Committee — 1829 Actions + 266 ETF')
          print(f'- Actions reference run: {__import__("os").environ.get("ACTIONS_REFERENCE_RUN")}')
          print(f'- Daily ETF dataset run: {__import__("os").environ.get("DAILY_DATASET_RUN")}')
          print(f'- Actions: {len(a)}; >77: {au["selected_above_77"]}; score {au["score_min"]}–{au["score_max"]}')
          print(f'- Action decisions: {a.decision.value_counts().to_dict()}')
          print(f'- ETF: {len(e)}; decisions: {e.decision.value_counts().to_dict()}')
          print('- Smart Money: NOT integrated / disabled')
          print('- Live/order execution: disabled')
          PY
      - name: Upload total committee evidence
        uses: actions/upload-artifact@v6
        with:
          name: V20.4-Total-1829-266-${{ github.run_id }}
          path: |
            outputs/V20.4_ACTIONS_PEA_FINAL_REFERENCE_ENRICHED.csv
            outputs/V20.4_GITOK_ACTIONS_1829_DECISIONS.csv
            outputs/V20.4_GITOK_ACTIONS_1829_ABOVE_77.xlsx
            outputs/V20.4_GITOK_ETF_266_DECISIONS.csv
            outputs/audit/V20.4_ACTIONS_1829_COMMITTEE_AUDIT.json
            outputs/audit/V18.2_QUALITY_GATES.json
          if-no-files-found: error
          retention-days: 30
