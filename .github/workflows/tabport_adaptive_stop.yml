name: TABPORT adaptive stop diagnostic

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - 'v182/hebdo/tabport_adaptive_stop_publish.py'
      - '.github/workflows/tabport_adaptive_stop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabport-adaptive-stop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Restore governed historical OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Require governed cache
        run: |
          test -d data/cache/actions
          test -n "$(find data/cache/actions -name 'history_*.parquet' -print -quit)"
      - name: Install runtime
        run: |
          python -m pip install --prefer-binary -r requirements-runtime.txt
          python -m pip install scikit-learn scipy
      - name: Compile adaptive audit
        run: python -m compileall -q v182/hebdo/tabport_adaptive_stop_publish.py
      - name: Run PIT ATR adaptive stop ablation
        run: python -m v182.hebdo.tabport_adaptive_stop_publish --cache data/cache/actions --output-dir outputs/tabport_adaptive_stop
      - name: Validate adaptive stop contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs/tabport_adaptive_stop')
          d=json.loads((root/'TABPORT_ADAPTIVE_STOP_DIAGNOSTIC.json').read_text())
          assert d['status']=='PUBLISHED' and d['holdout_unlocked'] is False, d
          assert d['rules']==['FIXED_09','ATR2_CAP13','ATR2_CAP15','ATR2_5_CAP15'], d
          assert d['selection_changed'] is False and d['ranking_changed'] is False, d
          assert d['decision'] in {'PROMOTE_ATR2_5_CAP15_RISK_PARITY','REJECT_KEEP_FIXED_09'}, d
          assert 'ATR2_5_CAP15_RISK_PARITY' in d['robustness_attribution'], d
          for f in ['TABPORT_ADAPTIVE_STOP_CONFIRMED.csv','TABPORT_ADAPTIVE_STOP_COMPARISON.csv','TABPORT_ADAPTIVE_STOP_DIAGNOSTIC.json','TABPORT_ADAPTIVE_STOP_YEAR_STABILITY.csv','TABPORT_ADAPTIVE_STOP_EXTREME_BAR_AUDIT.csv','TABPORT_ATR2_5_CAP15_ATTRIBUTION.csv','TABPORT_ATR2_5_CAP15_RISK_PARITY_ATTRIBUTION.csv']:
              p=root/f; assert p.exists() and p.stat().st_size>0, f
          print(json.dumps(d,indent=2))
          PY
      - name: Upload adaptive stop diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TABPORT-ADAPTIVE-STOP-${{ github.run_id }}
          path: outputs/tabport_adaptive_stop/
          if-no-files-found: error
          retention-days: 30
