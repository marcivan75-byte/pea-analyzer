name: TABPORT META PIT walk-forward research

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - 'v182/hebdo/tabport_meta_walkforward_research.py'
      - 'tests/test_tabport_meta_walkforward_research.py'
      - '.github/workflows/tabport_meta_walkforward_research.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  meta-walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONNOUSERSITE: '1'
      GH_TOKEN: ${{ github.token }}
      PRE2023_ARTIFACT_ID: '9817322742'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Restore governed holdout
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Restore governed PRE2023
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/pre2023
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRE2023_ARTIFACT_ID}/zip" > /tmp/pre2023.zip
          unzip -oq /tmp/pre2023.zip -d inputs/pre2023
          test -s inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet
          test -s inputs/pre2023/PRE2023_YAHOO_CORPUS_MANIFEST.json
          test -n "$(find data/cache/actions -name 'history_*.parquet' -print -quit)"
      - name: Install runtime
        run: |
          python -m pip install --prefer-binary -r requirements-runtime.txt
          python -m pip install pytest scikit-learn scipy
      - name: Validate focused chain
        run: |
          python -m py_compile v182/hebdo/tabport_meta_walkforward_research.py
          python -m pytest -q -o pythonpath=. tests/test_tabport_meta_walkforward_research.py tests/test_hebdo_at_meta.py tests/test_backtest_B_v2.py tests/test_tabport_meta.py tests/test_tabport_historical_meta.py
      - name: Run PIT walk-forward research
        run: |
          python -m v182.hebdo.tabport_meta_walkforward_research \
            --pre2023 inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet \
            --manifest inputs/pre2023/PRE2023_YAHOO_CORPUS_MANIFEST.json \
            --holdout-cache data/cache/actions \
            --output-dir outputs/meta_walkforward
      - name: Validate governance and print results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('outputs/meta_walkforward')
          s=json.loads((root/'TABPORT_META_WF_SUMMARY.json').read_text())
          assert s['status']=='SUCCESS'
          assert s['production_promotion'] is False
          assert s['governance']['holdout_training_frozen_before_2023'] is True
          assert s['governance']['holdout_used_for_tuning'] is False
          c=pd.read_csv(root/'TABPORT_META_WF_COMPARISON.csv')
          assert set(c['model'])=={'BASELINE_UNTRAINED','META_WALKFORWARD'}
          print(json.dumps(s,indent=2))
          print('---COMPARISON---'); print(c.to_csv(index=False))
          print('---TRAIN---'); print(pd.read_csv(root/'TABPORT_META_WF_TRAIN_AUDIT.csv').to_csv(index=False))
          PY
      - name: Upload research package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TABPORT-META-WALKFORWARD-${{ github.run_id }}
          path: outputs/meta_walkforward/
          if-no-files-found: warn
          retention-days: 30
