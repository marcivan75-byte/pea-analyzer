name: OPS - Delete zombie workflow runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_ops_delete_zombie_runs.yml'

permissions:
  contents: read
  actions: write

jobs:
  delete-zombies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete known zombie queued runs
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error
          repo=os.environ['REPO']; token=os.environ['TOKEN']
          run_ids=[31164734905,31164711529,31164688784,31164672077,31164657786]
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10','User-Agent':'zombie-run-cleaner'}
          results=[]
          for rid in run_ids:
              url=f'https://api.github.com/repos/{repo}/actions/runs/{rid}'
              req=urllib.request.Request(url,method='DELETE',headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      code=r.status
              except urllib.error.HTTPError as e:
                  code=e.code
                  print(f'RUN {rid} DELETE HTTP {code}: {e.read().decode("utf-8","replace")}')
              else:
                  print(f'RUN {rid} DELETE HTTP {code}')
              results.append((rid,code))
          print('DELETE_RESULTS',results)
          print('DELETED_COUNT',sum(1 for _,c in results if c==204))
          PY
