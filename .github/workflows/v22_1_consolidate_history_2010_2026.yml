name: V22.1 consolidate historical 2010-2026

on:
  push:
    branches:
      - v22/pit-mae-mfe-preopen
    paths:
      - "scripts/consolidate_audit_ohlcv_2010_2026.py"
      - ".github/workflows/v22_1_consolidate_history_2010_2026.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pea-history-2010-2026
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
  GH_TOKEN: ${{ github.token }}

jobs:
  consolidate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install runtime
        run: python -m pip install --prefer-binary -r requirements-runtime.txt
      - name: Resolve latest governed source runs
        id: src
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${{ github.repository }}/actions/runs?status=success&per_page=100")"
          canonical="$(jq -r '[.workflow_runs[] | select(.name=="V22.1 CI corrections + canonical 2010-2019 data")][0].id // empty' <<<"$runs")"
          recent="$(jq -r '[.workflow_runs[] | select(.name=="V22.1 prepare historical data")][0].id // empty' <<<"$runs")"
          test -n "$canonical" || { echo "BLOCK_DATA: canonical successful run missing"; exit 1; }
          test -n "$recent" || { echo "BLOCK_DATA: recent historical successful run missing"; exit 1; }
          echo "canonical=$canonical" >> "$GITHUB_OUTPUT"
          echo "recent=$recent" >> "$GITHUB_OUTPUT"
      - name: Download governed historical artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs_history/canonical inputs_history/recent
          c="${{ steps.src.outputs.canonical }}"; r="${{ steps.src.outputs.recent }}"
          cname="$(gh api "repos/${{ github.repository }}/actions/runs/$c/artifacts" --jq '.artifacts[0].name')"
          rname="$(gh api "repos/${{ github.repository }}/actions/runs/$r/artifacts" --jq '.artifacts[0].name')"
          test -n "$cname" && test "$cname" != "null" || { echo "BLOCK_DATA: canonical artifact missing"; exit 1; }
          test -n "$rname" && test "$rname" != "null" || { echo "BLOCK_DATA: recent artifact missing"; exit 1; }
          gh run download "$c" -n "$cname" -D inputs_history/canonical
          gh run download "$r" -n "$rname" -D inputs_history/recent
      - name: Consolidate and audit 2010-2026
        run: python scripts/consolidate_audit_ohlcv_2010_2026.py --inputs inputs_history --out outputs/history_2010_2026
      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          for f in outputs/history_2010_2026/PEA_OHLCV_2010_2026_AUDIT.json outputs/history_2010_2026/MANIFEST.json; do
            if [ -f "$f" ]; then echo "## $f" >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload consolidated audited history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pea-history-2010-2026-${{ github.run_id }}
          path: outputs/history_2010_2026/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
