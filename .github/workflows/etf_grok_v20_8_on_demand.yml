name: ETF GROK V20.8 clone on-demand diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

concurrency:
  group: etf-grok-v20-8-diagnostic
  cancel-in-progress: true

jobs:
  score-etf-grok:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Validate ETF GROK configuration
        run: |
          python -m json.tool config/V20.8_ETF_GROK_HIGH_PRECISION.json >/dev/null
          python -m json.tool config/V20.8.2_ETF_GROK_DYNAMIC.json >/dev/null

      - name: Run ETF GROK clone tests
        run: pytest -q tests/test_etf_grok_clone.py

      - name: Run ETF GROK operational scoring
        env:
          ETF_GROK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m v182.reporting.etf_grok_v2081_run

      - name: Display decision summary
        if: always()
        run: |
          if [ -f outputs/etf_grok_v2081/V20.8.2_ETF_GROK_DYNAMIC_SUMMARY.json ]; then
            cat outputs/etf_grok_v2081/V20.8.2_ETF_GROK_DYNAMIC_SUMMARY.json
          fi

      - name: Publish ETF GROK diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ETF_GROK_V20_8_${{ github.run_id }}
          path: outputs/etf_grok_v2081/
          if-no-files-found: error
          retention-days: 7
