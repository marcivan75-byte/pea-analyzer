name: TCT Next-Session Catalyst V24.4.2

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Snapshot phase"
        required: false
        type: choice
        options:
          - PREOPEN
          - POSTMARKET
      run_validation:
        description: "Run compile validation already covered by CI"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "40 6 * * 1-5"

concurrency:
  group: pea-tct-next-session-context
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

jobs:
  catalyst-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      TCT_CATALYST_PHASE: ${{ github.event.inputs.phase }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore consolidated tactical state for ACTIVE PREOPEN
        id: decision-state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/tct_context/
          key: decision-state-v1-${{ github.run_id }}
          restore-keys: |
            decision-state-v1-

      - name: Restore legacy TCT catalyst context
        if: steps.decision-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/tct_context/
          key: tct-context-${{ github.run_id }}
          restore-keys: |
            tct-context-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-catalyst.txt

      - name: Install minimal catalyst runtime
        run: pip install --prefer-binary -r requirements-catalyst.txt

      - name: Compile V24.4.2 catalyst runtime
        if: ${{ inputs.run_validation }}
        run: |
          python -m py_compile \
            src/v182/sources/tct_catalyst_news_v24_4_2.py \
            src/v182/sources/global_market_snapshot.py \
            src/v182/features/tct_catalyst_context_v24_4_2.py \
            src/v182/reporting/tct_next_session_catalyst_engine.py \
            src/v182/reporting/tct_next_session_catalyst_run_v24_4_2.py \
            src/v182/reporting/tct_v24_4_2_pit_lineage.py \
            src/v182/reporting/tct_v24_4_2_pit_validator.py \
            src/v182/tct/preopen_enricher.py

      - name: ACTIVE bounded TCT CT PREOPEN enrichment
        run: python -m v182.tct.preopen_enricher --root . --max-tct 20 --max-ct 20

      - name: Run one next-session catalyst snapshot V24.4.2
        run: python -m v182.reporting.tct_next_session_catalyst_run_v24_4_2

      - name: Apply fail-closed V24.4.2 PIT OHLC lineage
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python -m v182.reporting.tct_v24_4_2_pit_lineage

      - name: Validate accumulated V24.4.2 PIT ledger
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python -m v182.reporting.tct_v24_4_2_pit_validator

      - name: Publish catalyst summary
        if: always()
        run: |
          for mobile in \
            outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md \
            outputs/mobile/ANDROID_TCT_V24_4_2_PIT_VALIDATION.md; do
            if [ -f "$mobile" ]; then
              printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
              cat "$mobile" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          for audit in \
            outputs/audit/TCT_PREOPEN_ENRICHER_ACTIVE_AUDIT.json \
            outputs/audit/TCT_NEXT_SESSION_CATALYST_V24_4_2_AUDIT.json \
            outputs/audit/TCT_V24_4_2_PIT_LINEAGE_AUDIT.json \
            outputs/audit/TCT_V24_4_2_PIT_VALIDATION.json; do
            if [ -f "$audit" ]; then
              printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
              cat "$audit" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Save TCT catalyst context
        if: ${{ always() && hashFiles('state/tct_context/**') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/tct_context/
          key: tct-context-${{ github.run_id }}

      - name: Upload compact catalyst artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tct-next-session-catalyst-v24-4-2-${{ github.run_id }}
          path: |
            outputs/daily_tct_ct/TCT_PREOPEN_ENRICHED_ACTIVE.csv
            outputs/daily_tct_ct/TCT_NEXT_SESSION_CATALYST_V24_4_2.csv
            outputs/daily_tct_ct/TCT_V24_4_2_PIT_SLICES.csv
            outputs/daily_tct_ct/TCT_V24_4_2_PREOPEN_POSTMARKET_CHANGES.csv
            outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md
            outputs/mobile/ANDROID_TCT_V24_4_2_PIT_VALIDATION.md
            outputs/audit/TCT_PREOPEN_ENRICHER_ACTIVE_AUDIT.json
            outputs/audit/TCT_NEXT_SESSION_CATALYST_V24_4_2_AUDIT.json
            outputs/audit/TCT_V24_4_2_PIT_LINEAGE_AUDIT.json
            outputs/audit/TCT_V24_4_2_PIT_VALIDATION.json
            state/tct_context/TCT_CT_PREOPEN_CANDIDATES_LATEST.csv
            state/tct_context/TCT_V24_4_2_CATALYST_LEDGER.csv
            state/tct_context/TCT_DAILY_OHLC_LEDGER.csv
            state/tct_context/TCT_V24_4_2_NEWS_CACHE.json
          if-no-files-found: warn
          retention-days: 14
