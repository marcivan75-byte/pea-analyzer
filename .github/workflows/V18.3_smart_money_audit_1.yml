name: V18.3 Smart Money Audit 1 - Unit Data Quality

on:
  workflow_dispatch:
  push:
    branches:
      - feature/smart-money-v1
    paths:
      - "src/v183/smart_money/**"
      - "tests/test_smart_money_v183.py"
      - "config/V18.3_SMART_MONEY_CONFIG.json"
      - "schemas/V18.3_smart_money_event.schema.json"
      - ".github/workflows/V18.3_smart_money_audit_1.yml"

permissions:
  contents: read

concurrency:
  group: v18-3-smart-money-audit-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-data-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validated dependency set
        run: pip install -c constraints-ci.txt -e .[test]

      - name: Smart Money static and unit tests
        run: |
          python -m pip check
          python -m compileall -q src/v183 tests/test_smart_money_v183.py
          ruff check --select E9,F63,F7,F82 src/v183 tests/test_smart_money_v183.py
          pytest -q tests/test_smart_money_v183.py

      - name: Validate Smart Money data-quality contract
        run: |
          mkdir -p outputs/audit
          python - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path("config/V18.3_SMART_MONEY_CONFIG.json").read_text())
          schema = json.loads(Path("schemas/V18.3_smart_money_event.schema.json").read_text())

          checks = {
              "shadow_mode": cfg.get("shadow_mode") is True,
              "shadow_only_score_application": cfg.get("score_application") == "SHADOW_ONLY",
              "amf_short_source_a": (
                  cfg["sources"]["amf_short_open_data"].get("enabled") is True
                  and cfg["sources"]["amf_short_open_data"].get("evidence") == "A"
              ),
              "amf_bdif_fail_closed": (
                  cfg["sources"]["amf_bdif_official_import"].get("mode")
                  == "FAIL_CLOSED_NORMALIZED_OFFICIAL_IMPORT"
              ),
              "finnhub_ownership_disabled": (
                  cfg["sources"]["finnhub_ownership"].get("enabled") is False
              ),
              "aum_change_alone_forbidden": (
                  cfg["etf_flows"].get("aum_change_alone_forbidden") is True
              ),
              "no_lookahead_required": (
                  cfg["smart_money_quality_gates"].get("no_lookahead_required") is True
              ),
              "event_isin_valid_min_pct_ge_99": (
                  float(cfg["smart_money_quality_gates"].get("event_isin_valid_min_pct", 0)) >= 99.0
              ),
              "duplicate_event_max_zero": (
                  int(cfg["smart_money_quality_gates"].get("duplicate_event_max", -1)) == 0
              ),
              "event_schema_object": schema.get("type") == "object",
          }
          report = {
              "audit": "1/4",
              "scope": "unit_data_quality",
              "shadow_only": True,
              "checks": [{"name": k, "passed": bool(v)} for k, v in checks.items()],
          }
          report["passed"] = all(c["passed"] for c in report["checks"])
          Path("outputs/audit/V18.3_SMART_MONEY_AUDIT_1.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          assert report["passed"], report
          print("SMART_MONEY_AUDIT_1_OK")
          PY

      - name: Upload audit 1 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: V18.3-smart-money-audit-1-${{ github.run_id }}
          path: |
            outputs/audit/V18.3_SMART_MONEY_AUDIT_1.json
            config/V18.3_SMART_MONEY_CONFIG.json
            schemas/V18.3_smart_money_event.schema.json
          retention-days: 30
