name: PEA Daily Collect + TCT CT V21.8.1

on:
  workflow_dispatch:
    inputs:
      run_validation:
        description: "Run compile validation already covered by CI"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 21 * * 1-4"

concurrency:
  group: pea-daily-tct-ct
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

jobs:
  daily-tactical:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PEA_RUN_PROFILE: DAILY_TACTICAL
      PEA_SLOW_SOURCE_MODE: CACHE_PREFERRED
      PEA_PROVENANCE_PATH: state/provenance/OBSERVATION_PROVENANCE.csv
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/cache/
          key: ohlcv-v3-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - name: Purge obsolete intraday cache
        run: rm -rf data/cache/actions_intraday_5m

      - name: Restore TCT state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/TCT_V24_1_7_T1_STATE.json
          key: daily-tct-state-${{ github.run_id }}
          restore-keys: |
            daily-tct-state-
            tct-v2417-state-

      - name: Restore next-session catalyst state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/tct_context/
          key: tct-context-${{ github.run_id }}
          restore-keys: |
            tct-context-

      - name: Restore Action CT V22.0 parent state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/action_ct/
          key: action-ct-v22-${{ github.run_id }}
          restore-keys: |
            action-ct-v22-

      - name: Restore Action CT V22.1 enriched state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/action_ct_v22_1/
          key: action-ct-v221-${{ github.run_id }}
          restore-keys: |
            action-ct-v221-

      - name: Restore provenance, V21.8 state and source caches
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/provenance/
          key: daily-provenance-v2181-${{ github.run_id }}
          restore-keys: |
            daily-provenance-v2181-
            provenance-v2181-
            provenance-v2161-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e .

      - name: Compile tactical runtime
        if: ${{ inputs.run_validation }}
        run: python -m compileall -q src

      - name: Daily collection and enrichment
        run: python -m v182.reporting.run

      - name: Replay governed ETF structural state V21.15
        continue-on-error: true
        run: python -m v182.reporting.etf_structure_state_replay

      - name: Daily TCT CT scoring and V21.8
        run: python -m v182.reporting.daily_tct_ct_runner

      - name: Action CT V22.0 parent daily weekly SHADOW
        continue-on-error: true
        run: python -m v182.reporting.action_ct_shadow_run_v22_0

      - name: Action CT V22.1.1 enriched performance observability SHADOW
        continue-on-error: true
        run: python -m v182.reporting.action_ct_shadow_run_v22_1

      - name: TCT V24.3.1 robust daily weekly trader-tools shadow
        continue-on-error: true
        run: python -m v182.reporting.tct_daily_trader_shadow_run_v24_3_1

      - name: Persist compact daily OHLC for V24.4.2 PIT
        continue-on-error: true
        run: python -m v182.reporting.tct_pit_ohlc_ledger_v24_4_2

      - name: Run consolidated POSTMARKET catalyst snapshot V24.4.2
        continue-on-error: true
        env:
          TCT_CATALYST_PHASE: POSTMARKET
        run: python -m v182.reporting.tct_next_session_catalyst_run_v24_4_2

      - name: Apply POSTMARKET V24.4.2 PIT OHLC lineage
        continue-on-error: true
        run: python -m v182.reporting.tct_v24_4_2_pit_lineage

      - name: Validate POSTMARKET V24.4.2 PIT ledger
        continue-on-error: true
        run: python -m v182.reporting.tct_v24_4_2_pit_validator

      - name: Publish Android tactical summaries
        if: always()
        run: |
          if [ -f outputs/mobile/ANDROID_DAILY_TCT_CT.md ]; then
            cat outputs/mobile/ANDROID_DAILY_TCT_CT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/mobile/ANDROID_ACTION_CT_V22_1_SHADOW.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/mobile/ANDROID_ACTION_CT_V22_1_SHADOW.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f outputs/mobile/ANDROID_ACTION_CT_V22_SHADOW.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/mobile/ANDROID_ACTION_CT_V22_SHADOW.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/mobile/ANDROID_ACTION_CT_V22_PIT_VALIDATION.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/mobile/ANDROID_ACTION_CT_V22_PIT_VALIDATION.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/mobile/ANDROID_TCT_DAILY_TRADER_SHADOW.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/mobile/ANDROID_TCT_DAILY_TRADER_SHADOW.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show daily audit
        if: always()
        run: |
          if [ -f outputs/audit/DAILY_TCT_CT_AUDIT.json ]; then cat outputs/audit/DAILY_TCT_CT_AUDIT.json; fi
          if [ -f outputs/audit/ACTION_CT_V22_0_0_AUDIT.json ]; then cat outputs/audit/ACTION_CT_V22_0_0_AUDIT.json; fi
          if [ -f outputs/audit/ACTION_CT_V22_1_0_AUDIT.json ]; then cat outputs/audit/ACTION_CT_V22_1_0_AUDIT.json; fi
          if [ -f outputs/audit/ACTION_CT_V22_1_0_CONTEXT.json ]; then cat outputs/audit/ACTION_CT_V22_1_0_CONTEXT.json; fi
          if [ -f outputs/audit/ACTION_CT_V22_1_0_RUNTIME.json ]; then cat outputs/audit/ACTION_CT_V22_1_0_RUNTIME.json; fi
          if [ -f outputs/audit/ACTION_CT_V22_1_0_ERRORS.json ]; then cat outputs/audit/ACTION_CT_V22_1_0_ERRORS.json; fi
          if [ -f outputs/audit/ACTION_CT_V22_1_0_PIT_VALIDATION.json ]; then cat outputs/audit/ACTION_CT_V22_1_0_PIT_VALIDATION.json; fi
          if [ -f outputs/audit/V21_15_ETF_STRUCTURE_STATE_REPLAY.json ]; then cat outputs/audit/V21_15_ETF_STRUCTURE_STATE_REPLAY.json; fi
          if [ -f outputs/audit/TCT_DAILY_TRADER_V24_3_1_AUDIT.json ]; then cat outputs/audit/TCT_DAILY_TRADER_V24_3_1_AUDIT.json; fi
          if [ -f outputs/audit/TCT_V24_4_2_PIT_OHLC_LEDGER_AUDIT.json ]; then cat outputs/audit/TCT_V24_4_2_PIT_OHLC_LEDGER_AUDIT.json; fi
          if [ -f outputs/audit/TCT_NEXT_SESSION_CATALYST_V24_4_2_AUDIT.json ]; then cat outputs/audit/TCT_NEXT_SESSION_CATALYST_V24_4_2_AUDIT.json; fi
          if [ -f outputs/audit/TCT_V24_4_2_PIT_LINEAGE_AUDIT.json ]; then cat outputs/audit/TCT_V24_4_2_PIT_LINEAGE_AUDIT.json; fi
          if [ -f outputs/audit/TCT_V24_4_2_PIT_VALIDATION.json ]; then cat outputs/audit/TCT_V24_4_2_PIT_VALIDATION.json; fi
          if [ -f outputs/audit/FINNHUB_CONSENSUS_CACHE_V1.json ]; then cat outputs/audit/FINNHUB_CONSENSUS_CACHE_V1.json; fi
          if [ -f outputs/audit/PIPELINE_RUNTIME_V21_13_7.json ]; then cat outputs/audit/PIPELINE_RUNTIME_V21_13_7.json; fi
          if [ -f data/cache/actions/history_manifest.json ]; then cat data/cache/actions/history_manifest.json; fi

      - name: Save persistent OHLCV cache
        if: ${{ success() && hashFiles('data/cache/**') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/cache/
          key: ohlcv-v3-${{ github.run_id }}

      - name: Save TCT state
        if: ${{ always() && hashFiles('state/TCT_V24_1_7_T1_STATE.json') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/TCT_V24_1_7_T1_STATE.json
          key: daily-tct-state-${{ github.run_id }}

      - name: Save next-session catalyst state
        if: ${{ always() && hashFiles('state/tct_context/**') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/tct_context/
          key: tct-context-${{ github.run_id }}

      - name: Save Action CT V22.0 parent state
        if: ${{ always() && hashFiles('state/action_ct/**') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/action_ct/
          key: action-ct-v22-${{ github.run_id }}

      - name: Save Action CT V22.1 enriched state
        if: ${{ always() && hashFiles('state/action_ct_v22_1/**') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/action_ct_v22_1/
          key: action-ct-v221-${{ github.run_id }}

      - name: Save provenance, V21.8 state and source caches
        if: ${{ always() && hashFiles('state/provenance/**') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/provenance/
          key: daily-provenance-v2181-${{ github.run_id }}

      - name: Upload compact daily tactical artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pea-daily-tct-ct-${{ github.run_id }}
          path: |
            outputs/daily_tct_ct/
            outputs/mobile/ANDROID_DAILY_TCT_CT.md
            outputs/mobile/ANDROID_ACTION_CT_V22_1_SHADOW.md
            outputs/mobile/ANDROID_ACTION_CT_V22_SHADOW.md
            outputs/mobile/ANDROID_ACTION_CT_V22_PIT_VALIDATION.md
            outputs/mobile/ANDROID_TCT_DAILY_TRADER_SHADOW.md
            outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md
            outputs/mobile/ANDROID_TCT_V24_4_2_PIT_VALIDATION.md
            outputs/daily_tct_ct/TCT_NEXT_SESSION_CATALYST_V24_4_2.csv
            outputs/daily_tct_ct/TCT_V24_4_2_PIT_SLICES.csv
            outputs/daily_tct_ct/TCT_V24_4_2_PREOPEN_POSTMARKET_CHANGES.csv
            outputs/audit/DAILY_TCT_CT_AUDIT.json
            outputs/audit/ACTION_CT_V22_0_0_AUDIT.json
            outputs/audit/ACTION_CT_V22_0_0_PIT_VALIDATION.json
            outputs/audit/ACTION_CT_V22_1_0_AUDIT.json
            outputs/audit/ACTION_CT_V22_1_0_CONTEXT.json
            outputs/audit/ACTION_CT_V22_1_0_RUNTIME.json
            outputs/audit/ACTION_CT_V22_1_0_ERRORS.json
            outputs/audit/ACTION_CT_V22_1_0_DIVERGENCES.csv
            outputs/audit/ACTION_CT_V22_1_0_PIT_VALIDATION.json
            outputs/audit/V21_15_ETF_STRUCTURE_STATE_REPLAY.json
            outputs/audit/TCT_DAILY_TRADER_V24_3_1_AUDIT.json
            outputs/audit/TCT_V24_4_2_PIT_OHLC_LEDGER_AUDIT.json
            outputs/audit/TCT_NEXT_SESSION_CATALYST_V24_4_2_AUDIT.json
            outputs/audit/TCT_V24_4_2_PIT_LINEAGE_AUDIT.json
            outputs/audit/TCT_V24_4_2_PIT_VALIDATION.json
            outputs/audit/FINNHUB_CONSENSUS_CACHE_V1.json
            outputs/audit/PIPELINE_RUNTIME_V21_13_7.json
            outputs/audit/PIPELINE_RUNTIME_V21_13_7.csv
            outputs/data_audit/COLLECTION_DATA_AVAILABILITY_LATEST.xlsx
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/etf_structure/ETF_STRUCTURE_SNAPSHOT.csv
            state/tct_context/TCT_DAILY_TRADER_LATEST.csv
            state/tct_context/TCT_DAILY_OHLC_LEDGER.csv
            state/tct_context/TCT_V24_4_2_CATALYST_LEDGER.csv
            state/tct_context/TCT_V24_4_2_NEWS_CACHE.json
            data/cache/actions/history_manifest.json
            data/cache/etf/history_manifest.json
          if-no-files-found: warn
          retention-days: 7
