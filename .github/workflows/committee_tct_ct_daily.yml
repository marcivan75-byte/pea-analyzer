name: PEA Daily Fast TCT CT V21.16

on:
  workflow_dispatch:
    inputs:
      run_validation:
        description: "Run compile validation already covered by CI"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 21 * * 1-4"

concurrency:
  group: pea-daily-fast-tct-ct
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

jobs:
  daily-tactical:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PEA_RUN_PROFILE: DAILY_TACTICAL
      PEA_SLOW_SOURCE_MODE: CACHE_PREFERRED
      PEA_YF_INCREMENTAL_PERIOD: "5d"
      PEA_DAILY_BASELINE_MAX_AGE_DAYS: "8"
      PEA_PROVENANCE_PATH: state/provenance/OBSERVATION_PROVENANCE.csv
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/cache/
          key: ohlcv-v3-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - name: Purge obsolete intraday cache
        run: rm -rf data/cache/actions_intraday_5m

      - name: Restore tactical decision and source state
        id: decision-state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/
          key: decision-state-v1-${{ github.run_id }}
          restore-keys: |
            decision-state-v1-

      - name: Restore legacy TCT state during cache migration
        if: steps.decision-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/TCT_V24_1_7_T1_STATE.json
          key: daily-tct-state-${{ github.run_id }}
          restore-keys: |
            daily-tct-state-
            tct-v2417-state-

      - name: Restore legacy next-session catalyst state during cache migration
        if: steps.decision-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/tct_context/
          key: tct-context-${{ github.run_id }}
          restore-keys: |
            tct-context-

      - name: Restore legacy provenance state during cache migration
        if: steps.decision-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/provenance/
          key: daily-provenance-v2181-${{ github.run_id }}
          restore-keys: |
            daily-provenance-v2181-
            provenance-v2181-
            provenance-v2161-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-runtime.txt

      - name: Install production runtime
        run: pip install --prefer-binary -r requirements-runtime.txt

      - name: Compile tactical runtime
        if: ${{ inputs.run_validation }}
        run: python -m compileall -q src

      - name: Fast daily market refresh from weekly enriched baseline
        run: python -m v182.reporting.daily_fast_collection

      - name: Daily TCT CT scoring and V21.8
        run: python -m v182.reporting.daily_tct_ct_runner

      - name: Selected POSTMARKET V24.4.2 context
        continue-on-error: true
        run: python -m v182.reporting.tct_postmarket_bundle_run

      - name: Publish Android tactical summary
        if: always()
        run: |
          if [ -f outputs/mobile/ANDROID_DAILY_TCT_CT.md ]; then
            cat outputs/mobile/ANDROID_DAILY_TCT_CT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show fast daily audit
        if: always()
        run: |
          if [ -f outputs/audit/DAILY_FAST_COLLECTION.json ]; then cat outputs/audit/DAILY_FAST_COLLECTION.json; fi
          if [ -f outputs/audit/DAILY_TCT_CT_AUDIT.json ]; then cat outputs/audit/DAILY_TCT_CT_AUDIT.json; fi
          if [ -f outputs/audit/POSTMARKET_BUNDLE_RUNTIME_V21_13_12.json ]; then cat outputs/audit/POSTMARKET_BUNDLE_RUNTIME_V21_13_12.json; fi
          if [ -f outputs/audit/TCT_NEXT_SESSION_CATALYST_V24_4_2_AUDIT.json ]; then cat outputs/audit/TCT_NEXT_SESSION_CATALYST_V24_4_2_AUDIT.json; fi
          if [ -f data/cache/actions/history_manifest.json ]; then cat data/cache/actions/history_manifest.json; fi

      - name: Save persistent OHLCV cache
        if: ${{ success() && hashFiles('data/cache/**') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/cache/
          key: ohlcv-v3-${{ github.run_id }}

      - name: Save tactical decision and source state
        if: ${{ always() && (hashFiles('state/TCT_V24_1_7_T1_STATE.json', 'state/tct_context/**', 'state/action_ct/**', 'state/action_ct_v22_1/**', 'state/provenance/**') != '') }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/
          key: decision-state-v1-${{ github.run_id }}

      - name: Upload compact daily tactical artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pea-daily-fast-tct-ct-${{ github.run_id }}
          path: |
            outputs/daily_tct_ct/
            outputs/source_context/
            outputs/mobile/ANDROID_DAILY_TCT_CT.md
            outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md
            outputs/audit/DAILY_FAST_COLLECTION.json
            outputs/audit/DAILY_TCT_CT_AUDIT.json
            outputs/audit/POSTMARKET_BUNDLE_RUNTIME_V21_13_12.json
            outputs/audit/TCT_NEXT_SESSION_CATALYST_V24_4_2_AUDIT.json
            outputs/audit/TCT_V24_4_2_PIT_LINEAGE_AUDIT.json
            outputs/audit/TCT_V24_4_2_PIT_VALIDATION.json
            state/provenance/daily_fast/BASELINE_META.json
            data/cache/actions/history_manifest.json
            data/cache/etf/history_manifest.json
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
