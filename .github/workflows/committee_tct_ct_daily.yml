name: PEA Daily Fast TCT CT V21.16.3

on:
  workflow_dispatch:
    inputs:
      run_validation:
        description: "Run compile validation already covered by CI"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 21 * * 1-4"

concurrency:
  group: pea-daily-fast-tct-ct
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

jobs:
  daily-tactical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PEA_RUN_PROFILE: DAILY_TACTICAL
      PEA_SLOW_SOURCE_MODE: CACHE_PREFERRED
      PEA_YF_INCREMENTAL_PERIOD: "5d"
      PEA_DAILY_BASELINE_MAX_AGE_DAYS: "8"
      PEA_PROVENANCE_PATH: state/provenance/OBSERVATION_PROVENANCE.csv
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start end-to-end runtime clock
        run: date +%s > .runtime_job_start_epoch

      - name: Restore consolidated runtime cache
        uses: ./.github/actions/runtime-cache-restore

      - name: Purge obsolete intraday cache
        run: rm -rf data/cache/actions_intraday_5m

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-daily-fast.txt

      - name: Install production runtime
        run: pip install --prefer-binary -r requirements-daily-fast.txt

      - name: Compile tactical runtime
        if: ${{ inputs.run_validation }}
        run: python -m compileall -q src

      - name: Run daily fast collection TCT CT and postmarket bundle
        run: python -m v182.reporting.daily_fast_bundle_v21_16

      - name: Publish Android tactical summary and audit
        if: always()
        run: |
          if [ -f outputs/mobile/ANDROID_DAILY_TCT_CT.md ]; then
            cat outputs/mobile/ANDROID_DAILY_TCT_CT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in \
            outputs/audit/DAILY_FAST_BUNDLE_V21_16.json \
            outputs/audit/DAILY_FAST_COLLECTION.json \
            outputs/audit/DAILY_TCT_CT_AUDIT.json \
            outputs/audit/POSTMARKET_BUNDLE_RUNTIME_V21_13_12.json \
            outputs/audit/TCT_NEXT_SESSION_CATALYST_V24_4_2_AUDIT.json \
            data/cache/actions/history_manifest.json; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              cat "$f"
            fi
          done

      - name: Save consolidated runtime cache
        if: ${{ success() && (hashFiles('data/cache/**', 'state/**') != '') }}
        uses: ./.github/actions/runtime-cache-save

      - name: Upload compact daily tactical artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pea-daily-fast-tct-ct-v21-16-3-${{ github.run_id }}
          path: |
            outputs/daily_tct_ct/
            outputs/source_context/
            outputs/mobile/ANDROID_DAILY_TCT_CT.md
            outputs/mobile/ANDROID_TCT_NEXT_SESSION_CATALYST_V24_4_2.md
            outputs/audit/DAILY_FAST_BUNDLE_V21_16.json
            outputs/audit/DAILY_FAST_COLLECTION.json
            outputs/audit/DAILY_TCT_CT_AUDIT.json
            outputs/audit/POSTMARKET_BUNDLE_RUNTIME_V21_13_12.json
            outputs/audit/TCT_NEXT_SESSION_CATALYST_V24_4_2_AUDIT.json
            state/provenance/DAILY_SOURCE_PREWARM_V1.csv
            state/provenance/daily_fast/BASELINE_META.json
            data/cache/actions/history_manifest.json
            data/cache/etf/history_manifest.json
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7

      - name: Finalize end-to-end runtime budget
        if: always()
        continue-on-error: true
        run: python -m v182.reporting.runtime_job_summary_v21_16 --profile DAILY_TACTICAL
