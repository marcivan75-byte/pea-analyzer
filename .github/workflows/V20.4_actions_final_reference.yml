name: V20.4 Actions PEA Final Reference

on:
  push:
    branches: [feature/smart-money-v1]
    paths:
      - '.github/workflows/V20.4_actions_final_reference.yml'
      - 'src/v182/decision/actions_final_reference_1829.py'
      - 'src/v182/decision/actions_final_reference_publish.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v204-actions-final-reference
  cancel-in-progress: true

jobs:
  build-final-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -c constraints-ci.txt -e .[test]

      - name: Reuse latest canonical 1429 master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/final/base outputs
          ART=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired==false) | select(.name|startswith("V20.4-Actions1429-Committee-")) | .id' | head -1)
          test -n "$ART"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" > /tmp/final/base.zip
          unzip -oq /tmp/final/base.zip -d /tmp/final/base
          SRC=$(find /tmp/final/base -name V20.4_GITOK_ACTIONS_1429_MASTER_ENRICHED.csv -print -quit)
          test -n "$SRC"
          cp "$SRC" outputs/V20.4_GITOK_ACTIONS_1429_MASTER_ENRICHED.csv

      - name: Reuse validated 400 quarantine candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/final/q
          ART=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired==false) | select(.name|startswith("V20.4-Actions506-Quarantine-")) | .id' | head -1)
          test -n "$ART"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" > /tmp/final/q.zip
          unzip -oq /tmp/final/q.zip -d /tmp/final/q
          SRC=$(find /tmp/final/q -name V20.4_ACTIONS_506_CANDIDATES_TO_INTEGRATE.csv -print -quit)
          test -n "$SRC"
          cp "$SRC" outputs/V20.4_ACTIONS_506_CANDIDATES_TO_INTEGRATE.csv

      - name: Enrich 400 candidates and build final reference
        run: python -m v182.decision.actions_final_reference_publish

      - name: Final quality gates
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          p=Path('outputs/V20.4_ACTIONS_PEA_FINAL_REFERENCE_ENRICHED.csv')
          x=Path('outputs/V20.4_ACTIONS_PEA_FINAL_REFERENCE_ENRICHED.xlsx')
          a=Path('outputs/audit/V20.4_ACTIONS_PEA_FINAL_REFERENCE_AUDIT.json')
          assert p.exists() and x.exists() and a.exists()
          df=pd.read_csv(p,sep=';',dtype=object,encoding='utf-8-sig')
          assert len(df)==1829
          assert df['isin'].nunique()==1829
          assert len(df.columns)>=272
          assert df['canonical_execution_guard'].eq('NO_LIVE_EXECUTION').all()
          assert (df['final_reference_origin']=='CANONICAL_1429').sum()==1429
          assert (df['final_reference_origin']=='QUARANTINE_506').sum()==400
          forbidden={'LIVE','ORDER','EXECUTE','BROKER','REAL_ORDER','LIVE_ORDER'}
          assert not df['execution'].astype(str).str.upper().isin(forbidden).any()
          audit=json.loads(a.read_text(encoding='utf-8'))
          assert audit['passed'] is True
          assert audit['smart_money_enabled'] is False
          assert audit['live_order_execution_enabled'] is False
          print('FINAL_REFERENCE_OK',audit)
          PY

      - name: Publish summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          a=json.loads(Path('outputs/audit/V20.4_ACTIONS_PEA_FINAL_REFERENCE_AUDIT.json').read_text())
          print('## V20.4 Actions PEA Final Reference')
          print(f"- Rows / unique ISIN: {a['rows']} / {a['unique_isin']}")
          print(f"- Columns: {a['columns']}")
          print(f"- Canonical retained: {a['canonical_retained']}")
          print(f"- Quarantine integrated: {a['quarantine_integrated']}")
          print(f"- Remaining review: {a['quarantine_remaining_review']}")
          print(f"- Excluded: {a['quarantine_excluded']}")
          print(f"- Candidate enrichment mean: {a['candidate_enrichment_quality_mean_pct']}%")
          print('- Smart Money: disabled')
          print('- Live/order execution: disabled')
          PY

      - name: Upload final PEA reference
        uses: actions/upload-artifact@v6
        with:
          name: V20.4-Actions-PEA-Final-Reference-${{ github.run_id }}
          path: |
            outputs/V20.4_ACTIONS_PEA_FINAL_REFERENCE_ENRICHED.csv
            outputs/V20.4_ACTIONS_PEA_FINAL_REFERENCE_ENRICHED.xlsx
            outputs/audit/V20.4_ACTIONS_PEA_FINAL_REFERENCE_AUDIT.json
          if-no-files-found: error
          retention-days: 30
