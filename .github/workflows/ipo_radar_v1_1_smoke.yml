name: IPO Radar V1.4 live smoke

on:
  pull_request:
    paths:
      - "config/IPO_RADAR_V1.json"
      - "src/v182/decision/ipo_*.py"
      - "src/v182/reporting/ipo_dd_gaps_run.py"
      - "src/v182/sources/sec_ipo*.py"
      - "src/v182/sources/euronext_ipo*.py"
      - "src/v182/sources/ipo_peers*.py"
      - "tests/test_ipo_*.py"
      - ".github/workflows/ipo_radar_v1_1_smoke.yml"
  push:
    branches: [main]
    paths:
      - "config/IPO_RADAR_V1.json"
      - "src/v182/decision/ipo_*.py"
      - "src/v182/reporting/ipo_dd_gaps_run.py"
      - "src/v182/sources/sec_ipo*.py"
      - "src/v182/sources/euronext_ipo*.py"
      - "src/v182/sources/ipo_peers*.py"
      - ".github/workflows/ipo_radar_v1_1_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run IPO V1.4, DD planner and PIT calibration
        run: |
          python -m v182.decision.ipo_radar_v1_4
          python -m v182.reporting.ipo_dd_gaps_run
          python -m v182.decision.ipo_outcomes_v1_2
      - name: Validate V1.4 governance and evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root=Path('.')
          summary=json.loads((root/'outputs/ipo_radar/IPO_SUMMARY.json').read_text())
          calibration=json.loads((root/'outputs/ipo_radar/IPO_CALIBRATION_STATUS.json').read_text())
          assert summary['module_version']=='IPO_RADAR_V1.4'
          assert summary['mode']=='SHADOW_ADVISORY_ONLY'
          assert summary['live_orders_enabled'] is False
          assert summary['can_create_buy'] is False
          assert summary['regulated_news_layer']=='EURONEXT_GDELT_DISCOVERY_OFFICIAL_PAGE_FACTS_V1.4'
          assert summary['regulated_news_policy']=='SHADOW_FACTS_ONLY_NO_ACTIVE_SCORE_NO_BUY'
          assert summary['regulated_news_evidence']['active_score_influence']==0.0
          assert calibration['promotion_ready'] is False
          for relative in (
              'outputs/ipo_radar/IPO_RANKING.csv',
              'outputs/ipo_radar/IPO_V1_3_EVIDENCE.csv',
              'outputs/ipo_radar/IPO_EURONEXT_NEWS_EVIDENCE_V1_4.csv',
              'outputs/ipo_radar/IPO_DD_GAPS.csv',
              'outputs/ipo_radar/IPO_CALIBRATION_STATUS.json',
              'state/ipo_radar/IPO_HISTORY.csv',
          ):
              assert (root/relative).exists(), relative
          ranking=pd.read_csv(root/'outputs/ipo_radar/IPO_RANKING.csv')
          news=pd.read_csv(root/'outputs/ipo_radar/IPO_EURONEXT_NEWS_EVIDENCE_V1_4.csv')
          assert len(news)==len(ranking)
          if not ranking.empty:
              assert not ranking['live_order_allowed'].astype(bool).any()
          if not news.empty:
              assert not news['live_order_allowed'].astype(bool).any()
              assert {'euronext_news_discovery_status','euronext_news_demand_signal_shadow','euronext_news_evidence_policy'}.issubset(news.columns)
              active_score_columns={'opportunity_bookbuilding_demand','risk_dilution_secondary','opportunity_insider_alignment'}
              assert active_score_columns.isdisjoint(set(news.columns))
          print(json.dumps({
              'status':summary['operational_status'],
              'candidate_count':summary['candidate_count'],
              'decision_counts':summary['decision_counts'],
              'v1_3_evidence':summary['v1_3_evidence'],
              'regulated_news_evidence':summary['regulated_news_evidence'],
              'source_status':summary['source_status'],
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload IPO V1.4 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-radar-v1-4-smoke-${{ github.run_id }}
          path: |
            outputs/ipo_radar/
            state/ipo_radar/
          if-no-files-found: warn
          retention-days: 30
