name: IPO Radar V1.2 live smoke

on:
  pull_request:
    paths:
      - "config/IPO_RADAR_V1.json"
      - "src/v182/decision/ipo_*.py"
      - "src/v182/reporting/ipo_dd_gaps_run.py"
      - "src/v182/sources/sec_ipo*.py"
      - "src/v182/sources/__init__.py"
      - "tests/test_ipo_*.py"
      - ".github/workflows/ipo_radar_v1_1_smoke.yml"
  push:
    branches: [main]
    paths:
      - "config/IPO_RADAR_V1.json"
      - "src/v182/decision/ipo_*.py"
      - "src/v182/reporting/ipo_dd_gaps_run.py"
      - "src/v182/sources/sec_ipo*.py"
      - "src/v182/sources/__init__.py"
      - ".github/workflows/ipo_radar_v1_1_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run live IPO Radar V1.2 deep DD, DD planner and PIT calibration
        run: |
          python -m v182.decision.ipo_radar_v1_2
          python -m v182.reporting.ipo_dd_gaps_run
          python -m v182.decision.ipo_outcomes_v1_2
      - name: Validate V1.2 evidence governance PIT and DD actions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root=Path('.')
          summary=json.loads((root/'outputs/ipo_radar/IPO_SUMMARY.json').read_text())
          calibration=json.loads((root/'outputs/ipo_radar/IPO_CALIBRATION_STATUS.json').read_text())
          assert summary['mode']=='SHADOW_ADVISORY_ONLY'
          assert summary['module_version']=='IPO_RADAR_V1.2'
          assert summary['deep_dd_layer']=='INLINE_XBRL_OFFER_TERMS_PRO_FORMA_V1.2'
          assert summary['financial_evidence_policy']=='PROSPECTUS_INLINE_XBRL_FIRST_COMPANYFACTS_FALLBACK'
          assert summary['peer_valuation_policy']=='DO_NOT_INFER_PEER_RELATIVE_SCORE_FROM_ABSOLUTE_MULTIPLE'
          assert summary['runtime_layer']=='IPO_RADAR_OPERATIONAL_V1.1'
          assert summary['history_policy']=='FULL_PIT_EVIDENCE_SNAPSHOT'
          assert 'ALPHA_VANTAGE' in summary['calendar_redundancy']
          assert summary['live_orders_enabled'] is False
          assert summary['can_create_buy'] is False
          assert summary['operational_status'] in {'SUCCESS','DEGRADED'}
          assert calibration['validation_layer']=='IPO_OUTCOMES_V1.2_PIT_SAFE'
          assert calibration['promotion_ready'] is False
          if calibration.get('sample_count',0):
              assert calibration['pit_snapshot_policy']=='STRICTLY_BEFORE_ACTUAL_FIRST_TRADING_DATE'
          statuses={row['source']:row['status'] for row in summary['source_status']}
          assert 'SEC_EDGAR' in statuses
          assert 'ALPHA_VANTAGE' in statuses
          assert any(status in {'SUCCESS','PARTIAL'} for status in statuses.values())
          for relative in (
              'outputs/ipo_radar/IPO_RANKING.csv',
              'outputs/ipo_radar/IPO_SOURCE_STATUS.csv',
              'outputs/ipo_radar/IPO_SEC_DD_STATUS.csv',
              'outputs/ipo_radar/IPO_ALERTS.csv',
              'outputs/ipo_radar/IPO_COMMITTEE_BRIEF.json',
              'outputs/ipo_radar/IPO_DEEP_DD_EVIDENCE.csv',
              'outputs/ipo_radar/IPO_DEEP_DD_BRIEF.json',
              'outputs/ipo_radar/IPO_DD_GAPS.csv',
              'outputs/ipo_radar/IPO_VALIDATION_STATUS.json',
              'outputs/ipo_radar/IPO_CALIBRATION_STATUS.json',
              'state/ipo_radar/IPO_HISTORY.csv',
          ):
              assert (root/relative).exists(), relative
          ranking=pd.read_csv(root/'outputs/ipo_radar/IPO_RANKING.csv')
          history=pd.read_csv(root/'state/ipo_radar/IPO_HISTORY.csv')
          gaps=pd.read_csv(root/'outputs/ipo_radar/IPO_DD_GAPS.csv')
          evidence=pd.read_csv(root/'outputs/ipo_radar/IPO_DEEP_DD_EVIDENCE.csv')
          assert {'identity_key','candidate_id','decision','live_order_allowed'}.issubset(history.columns)
          assert len(gaps)==len(ranking)
          assert len(evidence)==len(ranking)
          if not gaps.empty:
              assert not gaps['live_order_allowed'].astype(bool).any()
              assert {'missing_criteria_count','priority_1_action','dd_status'}.issubset(gaps.columns)
              assert gaps['missing_weight_total_pct'].fillna(0).between(0,100).all()
          if not evidence.empty:
              assert not evidence['live_order_allowed'].astype(bool).any()
              assert {'sec_financial_source','sec_offer_terms_confidence_pct','deep_dd_warnings'}.issubset(evidence.columns)
          if not ranking.empty:
              assert not ranking['live_order_allowed'].astype(bool).any()
              assert set(ranking['decision']).issubset({
                  'PRIORITY_DD','DEEP_DD','WATCH','WATCH_EARLY_FILING','WATCH_IDENTITY_CONFLICT','WATCH_DATA_GAP',
                  'AVOID_OR_LOW_EDGE','AVOID_HIGH_RISK','AVOID_HARD_BLOCK','AVOID_WITHDRAWN'
              })
          print(json.dumps({
              'operational_status':summary['operational_status'],
              'candidate_count':summary['candidate_count'],
              'decision_counts':summary['decision_counts'],
              'source_status':summary['source_status'],
              'deep_dd':summary['deep_dd'],
              'calibration_status':calibration['calibration_status'],
              'calibration_sample_count':calibration.get('sample_count',0),
              'dd_action_required':int((gaps['dd_status']=='ACTION_REQUIRED').sum()) if not gaps.empty else 0,
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload IPO V1.2 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-radar-v1-2-smoke-${{ github.run_id }}
          path: |
            outputs/ipo_radar/
            state/ipo_radar/
          if-no-files-found: warn
          retention-days: 30
