name: V18.2 Completeness First

on:
  schedule:
    - cron: "15 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: v18-2-completeness
  cancel-in-progress: false

jobs:
  completeness:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore persistent consensus history
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: outputs/history
          key: v182-consensus-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            v182-consensus-history-${{ github.ref_name }}-
            v182-consensus-history-
      - name: Install validated dependency set
        run: pip install -c constraints-ci.txt -e .[test]
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run critical Ruff correctness checks
        run: ruff check --select E9,F63,F7,F82 src tests
      - name: Run unit and regression tests
        run: pytest -q
      - name: Execute completeness waves
        env:
          V182_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m v182.reporting.run
      - name: Compute baseline analyst momentum
        run: python -m v182.decision.analyst_momentum
      - name: Apply selective MarketBeat consensus cross-check
        env:
          MARKETBEAT_API_KEY: ${{ secrets.MARKETBEAT_API_KEY }}
        run: python -m v182.decision.marketbeat_overlay
      - name: Finalize committee target fields
        run: python -m v182.decision.committee_finalize
      - name: Verify required outputs
        run: |
          test -s outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv
          test -s outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
          test -s outputs/V18.2_PEA_ACTIONS_ACTUALISE.xlsx
          test -s outputs/V18.2_PEA_ETF_ACTUALISE.xlsx
          test -s outputs/V18.2_RUN_REPORT.xlsx
          test -s outputs/V18.2_COMMITTEE_ANALYST_MOMENTUM.csv
          test -s outputs/history/V18.2_CONSENSUS_SNAPSHOTS.csv
          test -s outputs/history/V18.2_ANALYST_REVISIONS.csv
          test -s outputs/audit/V18.2_ANALYST_MOMENTUM_METRICS.json
          test -s outputs/audit/V18.2_SOURCE_FALLBACK_METRICS.json
          test -s outputs/context/V18.2_MACRO_CONTEXT.json
          test -s outputs/context/V18.2_ENERGY_CONTEXT.json
          test -s config/V18.2_OPENFIGI_MASTER_MAP.csv
          test -s config/V18.2_MARKETSTACK_SYMBOL_MAP.csv
          python - <<'PY'
          import json
          import pandas as pd
          q=json.load(open('outputs/audit/V18.2_QUALITY_GATES.json'))
          assert q['passed'], q
          actions = pd.read_csv('outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv', sep=';', encoding='utf-8-sig')
          committee = pd.read_csv('outputs/V18.2_COMMITTEE_ANALYST_MOMENTUM.csv', sep=';', encoding='utf-8-sig')
          assert len(committee) > 0, 'EMPTY_COMMITTEE_ANALYST_OUTPUT'
          required = {
              'target_change_12m_abs', 'target_change_12m_pct',
              'target_revision_signal_pct', 'consensus_change_signal',
              'marketbeat_confirmation_state', 'marketbeat_risk_revision_pct',
              'analyst_momentum_score_pre_marketbeat',
          }
          assert required.issubset(actions.columns), required - set(actions.columns)
          assert 'target_change_12m_abs' in committee.columns
          metrics=json.load(open('outputs/audit/V18.2_ANALYST_MOMENTUM_METRICS.json'))
          assert int(metrics.get('committee_rows', 0)) == len(committee), metrics
          mb = metrics.get('marketbeat') or {}
          assert mb.get('enabled') is True, mb
          assert mb.get('key_present') is True, mb
          assert mb.get('success') is True, mb
          PY
      - name: Upload Excel and audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: V18.2-refresh-${{ github.run_id }}
          path: |
            outputs/*.xlsx
            outputs/*.csv
            outputs/history/**
            outputs/audit/**
            outputs/context/**
            outputs/gaps/**
            state/runs/**
            config/V18.2_ALPHA_SYMBOL_MAP.csv
            config/V18.2_FINNHUB_SYMBOL_MAP.csv
            config/V18.2_OPENFIGI_MASTER_MAP.csv
            config/V18.2_MARKETSTACK_SYMBOL_MAP.csv
            config/V18.2_MARKETBEAT_SYMBOL_MAP.csv
          retention-days: 30
      - name: Create controlled refresh pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/v18-2-refresh-${{ github.run_id }}
          delete-branch: true
          commit-message: "V18.2 completeness refresh ${{ github.run_id }}"
          title: "V18.2 automated data refresh ${{ github.run_id }}"
          body: |
            Automated V18.2 refresh. Quality gates passed.
            Identifier caches, API context files, analyst-momentum history, MarketBeat cross-check and fallback diagnostics are included.
            Review coverage, target revisions in value/% and committee analyst gates before merging.
          add-paths: |
            state/runs/**
            outputs/**
            config/V18.2_ETF_TICKER_MAP.csv
            config/V18.2_ALPHA_SYMBOL_MAP.csv
            config/V18.2_FINNHUB_SYMBOL_MAP.csv
            config/V18.2_OPENFIGI_MASTER_MAP.csv
            config/V18.2_MARKETSTACK_SYMBOL_MAP.csv
            config/V18.2_MARKETBEAT_SYMBOL_MAP.csv
