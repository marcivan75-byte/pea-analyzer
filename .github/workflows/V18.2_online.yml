name: V18.2 Legacy Completeness Refresh (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18-2-legacy-manual
  cancel-in-progress: true

jobs:
  legacy-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Legacy workflow disabled for scheduled use
        run: |
          echo "The former heavy scheduled V18.2 refresh is intentionally manual-only."
          echo "Use V20.4.2 Daily Efficient Ingestion for scheduled data refreshes."
          echo "This avoids unit/regression test suites and automatic PR creation on every daily refresh."
