name: ETF MT V20.8.1 on-demand diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

concurrency:
  group: etf-mt-v20-8-diagnostic
  cancel-in-progress: true

jobs:
  score-etf-mt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Validate V20.8.1 configuration
        run: python -m json.tool config/V20.8_ETF_MT_HIGH_PRECISION.json >/dev/null

      - name: Run ETF MT V20.8.1 operational scoring
        env:
          V2081_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m v182.reporting.etf_mt_v2081_run

      - name: Display decision summary
        if: always()
        run: |
          if [ -f outputs/etf_mt_v2081/V20.8.1_ETF_MT_SUMMARY.json ]; then
            cat outputs/etf_mt_v2081/V20.8.1_ETF_MT_SUMMARY.json
          fi

      - name: Publish ETF MT diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ETF_MT_V20_8_1_${{ github.run_id }}
          path: outputs/etf_mt_v2081/
          if-no-files-found: warn
          retention-days: 7
