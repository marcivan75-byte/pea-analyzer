name: Committee Master V21.3 validation

on:
  pull_request:
    paths:
      - "config/COMMITTEE_MASTER_V21.json"
      - "config/V18.2_MASTER_CONFIG.json"
      - "config/V21_ACTIONS_CRITERIA_REGISTRY.json"
      - "config/V20_7_1_ETF_CRITERIA_REGISTRY.json"
      - "config/V20.8.2_ETF_MT_DYNAMIC.json"
      - "config/COMMITTEE_VIRTUAL_MONEY_MANAGEMENT.json"
      - "config/GOLD_V1_1_102_CRITERIA.json"
      - "config/FULL_REFERENTIAL_INTEGRITY.json"
      - "config/TCT_V24_1_7_SHADOW.json"
      - "config/V21_3_ACTION_UNIVERSE_1829_ISINS.parts/**"
      - "src/v182/audit/**"
      - "src/v182/sources/**"
      - "src/v182/features/**"
      - "src/v182/reporting/**"
      - "src/v182/decision/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/committee_master_*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Compile V21.3 modules
        run: |
          python -m py_compile src/v182/audit/canonical_universe.py
          python -m py_compile src/v182/features/ohlcv_features.py
          python -m py_compile src/v182/features/sector_rotation.py
          python -m py_compile src/v182/features/action_decision_enhancements.py
          python -m py_compile src/v182/features/etf_mt_v2082_dynamic.py
          python -m py_compile src/v182/sources/morningstar_actions.py
          python -m py_compile src/v182/decision/effective_weights.py
          python -m py_compile src/v182/decision/action_overlays_v21_3.py
          python -m py_compile src/v182/decision/tct_baseline_v24_1_8.py
          python -m py_compile src/v182/decision/etf_mt_committee_v2082.py
          python -m py_compile src/v182/decision/gold_v1_1.py
          python -m py_compile src/v182/reporting/collection_audit.py
          python -m py_compile src/v182/reporting/committee_performance.py
          python -m py_compile src/v182/reporting/run.py
          python -m py_compile src/v182/reporting/etf_mt_v2081_run.py
          python -m py_compile src/v182/reporting/committee_master_run.py
          python -m py_compile src/v182/reporting/committee_master_gold_v1_1.py
          python -m py_compile src/v182/reporting/unified_runner.py
      - name: Referential integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from v182.audit.canonical_universe import load_compressed_isins, EXPECTED_SHA256
          from v182.decision.tct_baseline_v24_1_7 import WEIGHTS_V24_1_2, MAX_COVERAGE_WITH_SETUP_DISABLED
          from v182.decision.tct_baseline_v24_1_8 import ACTIVE_WEIGHT, NORMALIZATION_POLICY
          from v182.decision.tct_timing_exact_v24_1_7 import FORMULA_VERSION, T1_WEIGHTS, T2_WEIGHTS
          a=json.loads(Path("config/V21_ACTIONS_CRITERIA_REGISTRY.json").read_text())
          e=json.loads(Path("config/V20_7_1_ETF_CRITERIA_REGISTRY.json").read_text())
          ed=json.loads(Path("config/V20.8.2_ETF_MT_DYNAMIC.json").read_text())
          g=json.loads(Path("config/GOLD_V1_1_102_CRITERIA.json").read_text())
          t=json.loads(Path("config/TCT_V24_1_7_SHADOW.json").read_text())
          integrity=json.loads(Path("config/FULL_REFERENTIAL_INTEGRITY.json").read_text())
          master=json.loads(Path("config/V18.2_MASTER_CONFIG.json").read_text())
          assert a["criteria_count"] == 633 == integrity["actions"]["criteria_count"]
          assert integrity["actions"]["universe_count"] == 1829
          assert e["criteria_count"] == 268 == integrity["etf"]["criteria_count"]
          assert len(load_compressed_isins("config/V21_3_ACTION_UNIVERSE_1829_ISINS.parts")) == 1829
          assert EXPECTED_SHA256 == master["canonical_universe"]["actions_whitelist_sha256"]
          assert master["quality_gates"]["actions_min_rows"] == 1829
          assert master["dynamic_weighting"]["enabled"] is True
          assert master["collection_audit"]["after_each_wave"] is True
          for h in ("CT","MT","LT","SHORT","TOP_DOWN"):
              assert abs(sum(a["weights"][h].values())-1.0) < 1e-6
          assert a["weights"]["MT"]["morningstar_action_score"] > 0
          assert a["weights"]["LT"]["dividend_gt4_score"] > 0
          assert e["governance"]["t1_t2_forbidden"] is True
          assert a["governance"]["t1_t2_scope"] == "ACTION_TCT_ONLY"
          assert abs(sum(WEIGHTS_V24_1_2.values())-1.0) < 1e-12
          assert WEIGHTS_V24_1_2["setup"] == 0.16
          assert abs(MAX_COVERAGE_WITH_SETUP_DISABLED-0.84) < 1e-12
          assert abs(ACTIVE_WEIGHT-0.84) < 1e-12
          assert NORMALIZATION_POLICY == "ACTIVE_AVAILABLE_PILLARS_RENORMALIZED_TO_100_SETUP_EXCLUDED"
          assert t["promotion_governance"]["setup_component_active"] is False
          assert t["formula_version"] == FORMULA_VERSION
          assert abs(sum(T1_WEIGHTS.values())-1.0) < 1e-12
          assert abs(sum(T2_WEIGHTS.values())-1.0) < 1e-12
          assert ed["missing_policy"] == "AVAILABLE_CRITERIA_RENORMALIZED_TO_100_PERCENT"
          assert ed["historical_performance_attribution"] == "NONE_UNTIL_DEDICATED_PIT_BACKTEST"
          assert g["governance"]["criteria_count"] == len(g["criteria"]) == 102
          assert g["governance"]["contribution_blocks"] == 11
          assert g["governance"]["t1_t2_forbidden"] is True
          print("Integrity OK: Actions=1829/633, ETF=102/268 + V20.8.2 dynamic, TCT V24.1.8 dynamic, GOLD=102/11")
          PY
      - name: Unit tests
        run: |
          pytest -q \
            tests/test_committee_master.py \
            tests/test_committee_v21_enrichment.py \
            tests/test_topdown_v21.py \
            tests/test_tct_v24_1_7.py \
            tests/test_tct_baseline_v24_1_7.py \
            tests/test_tct_baseline_v24_1_8.py \
            tests/test_tct_exact_v24_1_7.py \
            tests/test_gold_v1_1.py \
            tests/test_canonical_universe_v21.py \
            tests/test_action_v21_3.py \
            tests/test_etf_mt_v2082_dynamic.py \
            tests/test_committee_performance.py \
            tests/test_etf_structural_overlay.py \
            tests/test_enrichment_dividends_funds.py
