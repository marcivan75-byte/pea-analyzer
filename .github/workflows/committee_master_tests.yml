name: Committee Master V21.8.1 data and code audit validation

on:
  pull_request:
    paths:
      - "config/**"
      - "inputs/*.csv"
      - "schemas/**"
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/committee_master_*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install complete test toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Compile every Python module and test
        run: python -m compileall -q src tests
      - name: Ruff safety lint
        run: ruff check src tests
      - name: Static Python safety audit
        run: python -m v182.audit.static_code_audit --root . --output outputs/audit/PYTHON_STATIC_AUDIT.json --fail-high
      - name: Master data integrity audit
        run: python -m v182.audit.master_data --root . --fail-fatal
      - name: Qualitative and quantitative coverage profile
        run: python -m v182.audit.master_data_profile
      - name: Referential and governance integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from v182.audit.canonical_universe import load_compressed_isins, EXPECTED_SHA256
          from v182.core.merge import ACCEPTED_VALIDATION_STATUSES
          from v182.decision.tct_baseline_v24_1_7 import WEIGHTS_V24_1_2, MAX_COVERAGE_WITH_SETUP_DISABLED
          from v182.decision.tct_baseline_v24_1_8 import ACTIVE_WEIGHT, NORMALIZATION_POLICY
          from v182.decision.tct_timing_exact_v24_1_7 import FORMULA_VERSION, T1_WEIGHTS, T2_WEIGHTS
          a=json.loads(Path("config/V21_ACTIONS_CRITERIA_REGISTRY.json").read_text())
          e=json.loads(Path("config/V20_7_1_ETF_CRITERIA_REGISTRY.json").read_text())
          ed=json.loads(Path("config/V20.8.2_ETF_MT_DYNAMIC.json").read_text())
          g=json.loads(Path("config/GOLD_V1_1_102_CRITERIA.json").read_text())
          t=json.loads(Path("config/TCT_V24_1_7_SHADOW.json").read_text())
          mm=json.loads(Path("config/COMMITTEE_VIRTUAL_MONEY_MANAGEMENT.json").read_text())
          sr=json.loads(Path("config/SECTOR_ROTATION_V2_SHADOW.json").read_text())
          integrity=json.loads(Path("config/FULL_REFERENTIAL_INTEGRITY.json").read_text())
          master=json.loads(Path("config/V18.2_MASTER_CONFIG.json").read_text())
          data_contract=json.loads(Path("config/MASTER_DATA_CONTRACT_V21_9.json").read_text())
          assert a["criteria_count"] == 633 == integrity["actions"]["criteria_count"]
          assert integrity["actions"]["universe_count"] == 1829
          assert e["criteria_count"] == 268 == integrity["etf"]["criteria_count"]
          assert len(load_compressed_isins("config/V21_3_ACTION_UNIVERSE_1829_ISINS.parts")) == 1829
          assert EXPECTED_SHA256 == master["canonical_universe"]["actions_whitelist_sha256"]
          assert master["quality_gates"]["actions_min_rows"] == 1829
          assert master["dynamic_weighting"]["enabled"] is True
          assert master["collection_audit"]["after_each_wave"] is True
          assert data_contract["universes"]["ACTION"]["expected_count"] == 1829
          assert data_contract["universes"]["ETF"]["expected_count"] == 102
          assert data_contract["backtest"]["look_ahead"] == "FAIL_CLOSED"
          assert data_contract["backtest"]["current_master_dynamic_values_for_historical_dates"] == "FORBIDDEN"
          for h in ("CT","MT","LT","SHORT","TOP_DOWN"):
              assert abs(sum(a["weights"][h].values())-1.0) < 1e-6
          assert a["governance"]["positive_unvalidated_overlay_can_create_buy"] is False
          assert a["governance"]["total_return_composite_active_weight"] is False
          assert all("total_return_potential_score" not in a["weights"][h] for h in ("CT","MT","LT"))
          assert all("target_upside_gt4_score" in a["weights"][h] for h in ("CT","MT","LT"))
          assert a["weights"]["MT"]["morningstar_action_score"] > 0
          assert a["weights"]["LT"]["dividend_gt4_score"] > 0
          assert "ATTRIBUTED" in ACCEPTED_VALIDATION_STATUSES
          assert e["governance"]["t1_t2_forbidden"] is True
          assert a["governance"]["t1_t2_scope"] == "ACTION_TCT_ONLY"
          assert abs(sum(WEIGHTS_V24_1_2.values())-1.0) < 1e-12
          assert WEIGHTS_V24_1_2["setup"] == 0.16
          assert abs(MAX_COVERAGE_WITH_SETUP_DISABLED-0.84) < 1e-12
          assert abs(ACTIVE_WEIGHT-0.84) < 1e-12
          assert NORMALIZATION_POLICY == "ACTIVE_AVAILABLE_PILLARS_RENORMALIZED_TO_100_SETUP_EXCLUDED"
          assert t["promotion_governance"]["setup_component_active"] is False
          assert t["formula_version"] == FORMULA_VERSION
          assert abs(sum(T1_WEIGHTS.values())-1.0) < 1e-12
          assert abs(sum(T2_WEIGHTS.values())-1.0) < 1e-12
          assert ed["missing_policy"] == "AVAILABLE_CRITERIA_RENORMALIZED_TO_100_PERCENT"
          assert ed["historical_performance_attribution"] == "NONE_UNTIL_DEDICATED_PIT_BACKTEST"
          assert g["governance"]["criteria_count"] == len(g["criteria"]) == 102
          assert g["governance"]["contribution_blocks"] == 11
          assert g["governance"]["t1_t2_forbidden"] is True
          assert mm["entry_execution_rule"] == "NEXT_RUN_OBSERVED_PRICE_AFTER_SIGNAL_DATE"
          assert mm["single_position_per_isin"] is True
          assert mm["max_instrument_exposure_pct"] <= mm["max_position_pct"]
          assert sr["version"] == "SECTOR_ROTATION_V2.0_SHADOW"
          assert sr["mode"] == "SHADOW_ONLY"
          assert sr["governance"]["changes_action_scores"] is False
          assert sr["governance"]["changes_etf_scores"] is False
          assert sr["governance"]["can_trigger_orders"] is False
          assert sr["governance"]["can_trigger_sales"] is False
          assert sr["governance"]["pit_required"] is True
          assert sr["governance"]["oos_validation_required_before_activation"] is True
          for key in ("RLS","AVCR","RARS_OPPORTUNITY","DQS"):
              assert abs(sum(sr["score_weights"][key].values())-1.0) < 1e-9
          assert sr["valuation_thresholds"]["promising_but_overvalued_avcr_min"] < sr["valuation_thresholds"]["no_chase_avcr_min"]
          print("V21.8.1 integrity OK: 1829/633 Actions, 102/268 ETF, exact TCT, Gold 102/11, Sector Rotation V2 shadow, PIT-safe master contract")
          PY
      - name: Full pytest suite
        run: pytest -q
      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: committee-master-audit-${{ github.run_id }}
          path: |
            outputs/audit/PYTHON_STATIC_AUDIT.json
            outputs/audit/MASTER_DATA_AUDIT.json
            outputs/audit/MASTER_DATA_AUDIT_ISSUES.csv
            outputs/audit/MASTER_DATA_PROFILE.json
            outputs/audit/MASTER_DATA_FIELD_COVERAGE.csv
          if-no-files-found: warn
          retention-days: 30
