name: Committee Master V21 validation

on:
  pull_request:
    paths:
      - "config/COMMITTEE_MASTER_V21.json"
      - "config/V21_ACTIONS_CRITERIA_REGISTRY.json"
      - "config/V20_7_1_ETF_CRITERIA_REGISTRY.json"
      - "config/FULL_REFERENTIAL_INTEGRITY.json"
      - "src/v182/audit/quality.py"
      - "src/v182/reporting/run.py"
      - "src/v182/decision/committee_master.py"
      - "src/v182/reporting/committee_master_run.py"
      - "tests/test_committee_master.py"
      - ".github/workflows/committee_master_*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Compile
        run: |
          python -m py_compile src/v182/audit/quality.py
          python -m py_compile src/v182/reporting/run.py
          python -m py_compile src/v182/decision/committee_master.py
          python -m py_compile src/v182/reporting/committee_master_run.py
      - name: Unit tests
        run: pytest -q tests/test_committee_master.py
