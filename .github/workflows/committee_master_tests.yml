name: Committee Master V21.1 validation

on:
  pull_request:
    paths:
      - "config/COMMITTEE_MASTER_V21.json"
      - "config/V18.2_MASTER_CONFIG.json"
      - "config/V21_ACTIONS_CRITERIA_REGISTRY.json"
      - "config/V20_7_1_ETF_CRITERIA_REGISTRY.json"
      - "config/FULL_REFERENTIAL_INTEGRITY.json"
      - "config/TCT_V24_1_7_SHADOW.json"
      - "config/V21_ACTION_UNIVERSE_ISINS.parts/**"
      - "src/v182/audit/**"
      - "src/v182/sources/**"
      - "src/v182/features/**"
      - "src/v182/reporting/**"
      - "src/v182/decision/**"
      - "tests/test_committee_master.py"
      - "tests/test_committee_v21_enrichment.py"
      - "tests/test_topdown_v21.py"
      - "tests/test_tct_v24_1_7.py"
      - "tests/test_canonical_universe_v21.py"
      - ".github/workflows/committee_master_*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Compile
        run: |
          python -m py_compile src/v182/audit/quality.py
          python -m py_compile src/v182/audit/canonical_universe.py
          python -m py_compile src/v182/sources/yfinance_bulk.py
          python -m py_compile src/v182/sources/yfinance_info.py
          python -m py_compile src/v182/sources/finnhub_consensus.py
          python -m py_compile src/v182/sources/gdelt_news.py
          python -m py_compile src/v182/sources/fred_macro.py
          python -m py_compile src/v182/features/ohlcv_features.py
          python -m py_compile src/v182/features/topdown_features.py
          python -m py_compile src/v182/decision/committee_master.py
          python -m py_compile src/v182/decision/tct_v24_1_7.py
          python -m py_compile src/v182/reporting/waves.py
          python -m py_compile src/v182/reporting/run.py
          python -m py_compile src/v182/reporting/committee_master_run.py
          python -m py_compile src/v182/reporting/unified_runner.py
      - name: Referential integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from v182.audit.canonical_universe import load_compressed_isins
          a=json.loads(Path("config/V21_ACTIONS_CRITERIA_REGISTRY.json").read_text())
          e=json.loads(Path("config/V20_7_1_ETF_CRITERIA_REGISTRY.json").read_text())
          integrity=json.loads(Path("config/FULL_REFERENTIAL_INTEGRITY.json").read_text())
          assert a["criteria_count"] == 633 == integrity["actions"]["criteria_count"]
          assert e["criteria_count"] == 268 == integrity["etf"]["criteria_count"]
          assert len(load_compressed_isins("config/V21_ACTION_UNIVERSE_ISINS.parts")) == 1429
          assert e["governance"]["t1_t2_forbidden"] is True
          assert a["governance"]["t1_t2_scope"] == "ACTION_TCT_ONLY"
          print("Integrity OK: Actions=1429/633 criteria, ETF=102/268 fields, T1/T2 Action TCT only")
          PY
      - name: Unit tests
        run: |
          pytest -q \
            tests/test_committee_master.py \
            tests/test_committee_v21_enrichment.py \
            tests/test_topdown_v21.py \
            tests/test_tct_v24_1_7.py \
            tests/test_canonical_universe_v21.py
