name: Committee Master V21.1 validation

on:
  pull_request:
    paths:
      - "config/COMMITTEE_MASTER_V21.json"
      - "config/V18.2_MASTER_CONFIG.json"
      - "config/V21_ACTIONS_CRITERIA_REGISTRY.json"
      - "config/V20_7_1_ETF_CRITERIA_REGISTRY.json"
      - "config/FULL_REFERENTIAL_INTEGRITY.json"
      - "config/TCT_V24_1_7_SHADOW.json"
      - "config/V21_ACTION_UNIVERSE_ISINS.parts/**"
      - "src/v182/audit/**"
      - "src/v182/sources/**"
      - "src/v182/features/**"
      - "src/v182/reporting/**"
      - "src/v182/decision/**"
      - "tests/test_committee_master.py"
      - "tests/test_committee_v21_enrichment.py"
      - "tests/test_topdown_v21.py"
      - "tests/test_tct_v24_1_7.py"
      - "tests/test_tct_baseline_v24_1_7.py"
      - "tests/test_tct_exact_v24_1_7.py"
      - "tests/test_canonical_universe_v21.py"
      - "tests/test_etf_structural_overlay.py"
      - "tests/test_enrichment_dividends_funds.py"
      - "pyproject.toml"
      - ".github/workflows/committee_master_*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Compile
        run: |
          python -m py_compile src/v182/audit/quality.py
          python -m py_compile src/v182/audit/canonical_universe.py
          python -m py_compile src/v182/sources/yfinance_bulk.py
          python -m py_compile src/v182/sources/yfinance_info.py
          python -m py_compile src/v182/sources/yfinance_funds.py
          python -m py_compile src/v182/sources/finnhub_consensus.py
          python -m py_compile src/v182/sources/gdelt_news.py
          python -m py_compile src/v182/sources/fred_macro.py
          python -m py_compile src/v182/features/ohlcv_features.py
          python -m py_compile src/v182/features/tct_v24_1_7_exact.py
          python -m py_compile src/v182/features/topdown_features.py
          python -m py_compile src/v182/decision/committee_master.py
          python -m py_compile src/v182/decision/tct_v24_1_7.py
          python -m py_compile src/v182/decision/tct_baseline_v24_1_7.py
          python -m py_compile src/v182/decision/tct_timing_exact_v24_1_7.py
          python -m py_compile src/v182/decision/etf_structural_overlay.py
          python -m py_compile src/v182/reporting/waves.py
          python -m py_compile src/v182/reporting/run.py
          python -m py_compile src/v182/reporting/etf_structure_refresh.py
          python -m py_compile src/v182/reporting/committee_master_run.py
          python -m py_compile src/v182/reporting/unified_runner.py
      - name: Referential integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import ta
          from v182.audit.canonical_universe import load_compressed_isins
          from v182.decision.tct_baseline_v24_1_7 import WEIGHTS_V24_1_2, MAX_COVERAGE_WITH_SETUP_DISABLED
          from v182.decision.tct_timing_exact_v24_1_7 import FORMULA_VERSION, T1_WEIGHTS, T2_WEIGHTS
          a=json.loads(Path("config/V21_ACTIONS_CRITERIA_REGISTRY.json").read_text())
          e=json.loads(Path("config/V20_7_1_ETF_CRITERIA_REGISTRY.json").read_text())
          t=json.loads(Path("config/TCT_V24_1_7_SHADOW.json").read_text())
          integrity=json.loads(Path("config/FULL_REFERENTIAL_INTEGRITY.json").read_text())
          assert a["criteria_count"] == 633 == integrity["actions"]["criteria_count"]
          assert e["criteria_count"] == 268 == integrity["etf"]["criteria_count"]
          assert len(load_compressed_isins("config/V21_ACTION_UNIVERSE_ISINS.parts")) == 1429
          assert e["governance"]["t1_t2_forbidden"] is True
          assert a["governance"]["t1_t2_scope"] == "ACTION_TCT_ONLY"
          assert abs(sum(WEIGHTS_V24_1_2.values())-1.0) < 1e-12
          assert WEIGHTS_V24_1_2["setup"] == 0.16
          assert t["promotion_governance"]["setup_component_active"] is False
          assert MAX_COVERAGE_WITH_SETUP_DISABLED == 0.84
          assert t["formula_version"] == FORMULA_VERSION
          assert abs(sum(T1_WEIGHTS.values())-1.0) < 1e-12
          assert abs(sum(T2_WEIGHTS.values())-1.0) < 1e-12
          assert t["state"]["persist_only_after_baseline_eligibility"] is True
          assert e["bonus_malus"]["morningstar_bonus"]["5"] == 0.0
          assert e["bonus_malus"]["morningstar_bonus"]["4"] == 3.0
          assert e["bonus_malus"]["morningstar_bonus"]["3"] == 1.0
          assert e["bonus_malus"]["risk_malus"]["6"] == -3.0
          assert e["bonus_malus"]["risk_malus"]["7"] == -3.0
          assert e["bonus_malus"]["positive_bonus_cannot_create_buy"] is True
          assert e["bonus_malus"]["mt_core_selection_unchanged"] is True
          print("Integrity OK: Actions=1429/633, ETF=102/268, exact TCT V24.1.7 source formulas/state, GitOK Morningstar/SRI rules")
          PY
      - name: Unit tests
        run: |
          pytest -q \
            tests/test_committee_master.py \
            tests/test_committee_v21_enrichment.py \
            tests/test_topdown_v21.py \
            tests/test_tct_v24_1_7.py \
            tests/test_tct_baseline_v24_1_7.py \
            tests/test_tct_exact_v24_1_7.py \
            tests/test_canonical_universe_v21.py \
            tests/test_etf_structural_overlay.py \
            tests/test_enrichment_dividends_funds.py
