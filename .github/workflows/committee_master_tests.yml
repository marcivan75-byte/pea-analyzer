name: Committee Master V21.6.3 full audit validation

on:
  pull_request:
    paths:
      - "config/**"
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/committee_master_*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install complete test toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Compile every Python module and test
        run: python -m compileall -q src tests
      - name: Ruff safety lint
        run: ruff check src tests
      - name: Static Python safety audit
        run: python -m v182.audit.static_code_audit --root . --output outputs/audit/PYTHON_STATIC_AUDIT.json --fail-high
      - name: Criterion-study governance gate
        run: python -m v182.audit.criteria_study_governance
      - name: Referential and governance integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from v182.audit.canonical_universe import load_compressed_isins, EXPECTED_SHA256
          from v182.core.merge import ACCEPTED_VALIDATION_STATUSES
          from v182.decision.tct_baseline_v24_1_7 import WEIGHTS_V24_1_2, MAX_COVERAGE_WITH_SETUP_DISABLED
          from v182.decision.tct_baseline_v24_1_8 import ACTIVE_WEIGHT, NORMALIZATION_POLICY
          from v182.decision.tct_timing_exact_v24_1_7 import FORMULA_VERSION, T1_WEIGHTS, T2_WEIGHTS
          a=json.loads(Path("config/V21_ACTIONS_CRITERIA_REGISTRY.json").read_text())
          e=json.loads(Path("config/V20_7_1_ETF_CRITERIA_REGISTRY.json").read_text())
          emt=json.loads(Path("config/V20.8_ETF_MT_HIGH_PRECISION.json").read_text())
          ed=json.loads(Path("config/V20.8.2_ETF_MT_DYNAMIC.json").read_text())
          g=json.loads(Path("config/GOLD_V1_1_102_CRITERIA.json").read_text())
          t=json.loads(Path("config/TCT_V24_1_7_SHADOW.json").read_text())
          mm=json.loads(Path("config/COMMITTEE_VIRTUAL_MONEY_MANAGEMENT.json").read_text())
          integrity=json.loads(Path("config/FULL_REFERENTIAL_INTEGRITY.json").read_text())
          master=json.loads(Path("config/V18.2_MASTER_CONFIG.json").read_text())
          study=json.loads(Path("config/V21_6_3_CRITERIA_STUDY_GOVERNANCE.json").read_text())
          assert master["version"] == "21.6.3"
          assert master["criteria_study_governance"]["enabled"] is True
          assert master["criteria_study_governance"]["actions_referential_criteria"] == 633
          assert master["criteria_study_governance"]["etf_referential_criteria"] == 268
          assert study["scope"]["actions_decision_candidates_to_optimize"] == 201
          assert study["scope"]["etf_decision_candidates_to_optimize"] == 62
          assert study["master_principles"]["family_budget_is_optimized_before_intra_family_weights"] is True
          assert study["master_principles"]["derived_reporting_components_never_receive_separate_alpha_weight"] is True
          assert master["cdc"]["finnhub_earnings_calendar"]["same_fiscal_period_revision_only"] is True
          assert master["cdc"]["finnhub_earnings_calendar"]["symbol_resolution"] == "EXACT_SUFFIX_FIRST_UNIQUE_ALIAS_ONLY"
          assert master["cdc"]["finnhub_earnings_calendar"]["ambiguous_alias_policy"] == "QUARANTINE"
          amf=master["cdc"]["amf_short_positions"]
          assert amf["semantic"] == "OPEN_PUBLIC_DISCLOSURE_PROXY_NOT_TRUE_CURRENT_SHORT_INTEREST"
          assert amf["publication_start_required"] is True
          assert amf["publication_end_required"] is True
          assert amf["latest_active_record_per_holder"] is True
          assert amf["observation_as_of_policy"] == "LATEST_RETAINED_PUBLIC_DISCLOSURE_DATE"
          assert amf["freshness_age_field"] == "amf_public_short_days_since_latest_publication"
          assert amf["absence_policy"] == "MISSING_NOT_ZERO"
          assert master["postselection_market_sheets"]["decision_influence"] == 0.0
          assert master["postselection_market_sheets"]["positive_confirmation_can_create_buy"] is False
          assert master["postselection_market_sheets"]["investing"]["timeframes"] == ["WEEKLY","MONTHLY"]
          assert master["boursorama_etf_category_rank"]["decision_influence"] == 0.0
          assert master["boursorama_etf_category_rank"]["mt_dynamic_38_unchanged"] is True
          assert master["boursorama_etf_category_rank"]["rank_format"] == "RAW_INTEGER_LOWER_IS_BETTER"
          assert master["boursorama_etf_category_rank"]["percentile_fabrication_forbidden"] is True
          assert master["etf_canonical_category_rank_trajectory"]["decision_influence"] == 0.0
          assert master["etf_canonical_category_rank_trajectory"]["canonical_semantic"] == "1_BEST_100_WORST"
          assert integrity["etf"]["boursorama_category_rank_v21_6_3"]["percentile_fabrication_forbidden"] is True
          cdc_visibility=integrity["actions"]["cdc_committee_visibility_v21_6_3"]
          assert cdc_visibility["decision_influence"] == 0.0
          assert cdc_visibility["amf_short_semantics"] == "OPEN_PUBLIC_DISCLOSURE_PROXY_NOT_TRUE_CURRENT_SHORT_INTEREST"
          assert cdc_visibility["amf_observation_as_of"] == "LATEST_RETAINED_PUBLIC_DISCLOSURE_DATE"
          assert cdc_visibility["amf_freshness_age_field"] == "amf_public_short_days_since_latest_publication"
          assert integrity["actions"]["cdc_identity_governance_v21_6_3"]["ambiguous_alias_policy"] == "QUARANTINE"
          assert a["criteria_count"] == 633 == integrity["actions"]["criteria_count"]
          assert a["version"] == "V21.7_ACTIONS_STUDY_HARDENED_2026_08_14"
          assert integrity["actions"]["universe_count"] == 1829
          assert e["criteria_count"] == 268 == integrity["etf"]["criteria_count"]
          assert len(emt["dynamic_criteria"]) == 38
          assert len(emt["structural_overlay"]) == 5
          assert study["etf_study_hardening"]["mt_target_composite_criteria_count"] == 43
          assert study["etf_study_hardening"]["mt_target_split"] == {"dynamic":0.69,"structural":0.31}
          assert len(load_compressed_isins("config/V21_3_ACTION_UNIVERSE_1829_ISINS.parts")) == 1829
          assert EXPECTED_SHA256 == master["canonical_universe"]["actions_whitelist_sha256"]
          assert master["quality_gates"]["actions_min_rows"] == 1829
          assert master["dynamic_weighting"]["enabled"] is True
          assert master["collection_audit"]["after_each_wave"] is True
          for h in ("CT","MT","LT","SHORT","TOP_DOWN"):
              assert abs(sum(a["weights"][h].values())-1.0) < 1e-6
              assert abs(sum(a["family_budgets"][h].values())-1.0) < 1e-6
          assert a["governance"]["positive_unvalidated_overlay_can_create_buy"] is False
          assert a["governance"]["total_return_composite_active_weight"] is False
          assert all("target_upside_gt4_score" not in a["weights"][h] for h in ("CT","MT","LT"))
          assert all("dividend_gt4_score" not in a["weights"][h] for h in ("CT","MT","LT"))
          assert all("morningstar_action_score" not in a["weights"][h] for h in ("CT","MT","LT"))
          assert all("sector_rotation_score" not in a["weights"][h] for h in ("CT","MT","LT"))
          assert all("action_catchup_score" not in a["weights"][h] for h in ("CT","MT","LT"))
          assert a["weights"]["MT"]["target_upside_pct_v21"] > 0
          assert a["weights"]["MT"]["dividend_yield_v21_pct"] > 0
          assert "ATTRIBUTED" in ACCEPTED_VALIDATION_STATUSES
          assert e["governance"]["t1_t2_forbidden"] is True
          assert a["governance"]["t1_t2_scope"] == "ACTION_TCT_ONLY"
          assert abs(sum(WEIGHTS_V24_1_2.values())-1.0) < 1e-12
          assert WEIGHTS_V24_1_2["setup"] == 0.16
          assert abs(MAX_COVERAGE_WITH_SETUP_DISABLED-0.84) < 1e-12
          assert abs(ACTIVE_WEIGHT-0.84) < 1e-12
          assert NORMALIZATION_POLICY == "ACTIVE_AVAILABLE_PILLARS_RENORMALIZED_TO_100_SETUP_EXCLUDED"
          assert t["promotion_governance"]["setup_component_active"] is False
          assert t["formula_version"] == FORMULA_VERSION
          assert abs(sum(T1_WEIGHTS.values())-1.0) < 1e-12
          assert abs(sum(T2_WEIGHTS.values())-1.0) < 1e-12
          assert ed["missing_policy"] == "AVAILABLE_CRITERIA_RENORMALIZED_TO_100_PERCENT"
          assert ed["historical_performance_attribution"] == "NONE_UNTIL_DEDICATED_PIT_BACKTEST"
          assert g["governance"]["criteria_count"] == len(g["criteria"]) == 102
          assert g["governance"]["contribution_blocks"] == 11
          assert g["governance"]["t1_t2_forbidden"] is True
          assert mm["entry_execution_rule"] == "NEXT_RUN_OBSERVED_PRICE_AFTER_SIGNAL_DATE"
          assert mm["single_position_per_isin"] is True
          assert mm["max_instrument_exposure_pct"] <= mm["max_position_pct"]
          print("V21.6.3 study-hardened integrity OK: 1829/633 Actions, 102/268 ETF, 43=38+5 MT target architecture, family budgets, CDC, postselection, TCT, Gold")
          PY
      - name: Full pytest suite
        run: pytest -q
      - name: Upload audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-and-criteria-audits-${{ github.run_id }}
          path: |
            outputs/audit/PYTHON_STATIC_AUDIT.json
            outputs/audit/CRITERIA_STUDY_GOVERNANCE.json
          if-no-files-found: warn
          retention-days: 30
