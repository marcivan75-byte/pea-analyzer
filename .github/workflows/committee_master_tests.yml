name: Committee Master fast PR validation

on:
  pull_request:
    paths:
      - "config/**"
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/committee_master_*.yml"
  workflow_dispatch:

concurrency:
  group: committee-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install lightweight lint tool only
        run: pip install ruff
      - name: Compile every Python module and test
        run: python -m compileall -q src tests
      - name: Ruff safety lint
        run: ruff check src tests
      - name: Validate critical JSON syntax
        run: |
          python -m json.tool config/V21_ACTIONS_CRITERIA_REGISTRY.json >/dev/null
          python -m json.tool config/V20_7_1_ETF_CRITERIA_REGISTRY.json >/dev/null
          python -m json.tool config/V20.8.2_ETF_MT_DYNAMIC.json >/dev/null
          python -m json.tool config/GOLD_V1_1_102_CRITERIA.json >/dev/null
          python -m json.tool config/TCT_V24_1_7_SHADOW.json >/dev/null
