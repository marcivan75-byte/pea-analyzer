name: ETF GROK Research Backtest

on:
  pull_request:
    paths:
      - 'src/v182/backtest/etf_grok_research_backtest.py'
      - 'tests/test_etf_grok_research_backtest.py'
      - '.github/workflows/etf_grok_research_backtest.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - name: Unit tests
        run: pytest -q tests/test_etf_grok_research_backtest.py tests/test_etf_backtest_base_v1.py
      - name: Build hardened ETF base
        run: python -m v182.backtest.etf_backtest_base_v1
      - name: Build PIT evidence layer
        run: python -m v182.backtest.etf_pit_membership_v2
      - name: GROK V1 operational research backtest
        run: python -m v182.backtest.etf_grok_research_backtest --start 2013-01-01
      - name: Validate output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/etf_grok_research_backtest/ETF_GROK_V1_SUMMARY.json')
          s=json.loads(p.read_text())
          assert s['pit_price_features'] is True
          assert s['pit_membership_complete'] is False
          assert s['promotion_eligible'] is False
          assert s['entry_execution'] == 'NEXT_SESSION_CLOSE'
          assert s['trades'] >= 0
          print(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ETF_GROK_V1_RESEARCH_BACKTEST
          path: |
            outputs/etf_grok_research_backtest/
            data/backtest/etf_base_v1/ETF_BACKTEST_INSTRUMENT_QUALITY.csv
            data/backtest/etf_base_v1/ETF_PIT_COVERAGE_REPORT.json
          retention-days: 7
