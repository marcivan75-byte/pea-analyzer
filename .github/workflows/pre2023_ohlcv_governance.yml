name: PRE2023 OHLCV governance

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - 'v182/data/__init__.py'
      - 'v182/data/pre2023_ohlcv_eodhd.py'
      - 'v182/data/pre2023_symbol_registry.py'
      - 'v182/data/pre2023_eodhd_inventory.py'
      - 'tests/test_pre2023_ohlcv_eodhd.py'
      - 'tests/test_pre2023_symbol_registry.py'
      - 'tests/test_pre2023_eodhd_inventory.py'
      - 'config/pre2023_eodhd_scope_probe.csv'
      - '.github/workflows/pre2023_ohlcv_governance.yml'
  workflow_dispatch:
    inputs:
      build_corpus:
        description: 'Build governed PRE-2023 corpus (requires EODHD_API_TOKEN and certified registry)'
        required: true
        default: false
        type: boolean
      registry_path:
        description: 'Certified historical registry CSV'
        required: false
        default: 'data/reference/pre2023_symbols.csv'
        type: string
      start:
        required: false
        default: '2010-01-01'
        type: string
      end:
        required: false
        default: '2022-12-31'
        type: string

permissions:
  contents: read

jobs:
  governance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install minimal runtime
        run: python -m pip install --prefer-binary pandas pyarrow pytest
      - name: Verify PRE2023 package import root
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          root=Path.cwd().resolve()
          assert str(root) in sys.path, f'BLOCK_PRE2023_IMPORT_ROOT: {root} absent from sys.path'
          import v182.data.pre2023_ohlcv_eodhd as collector
          import v182.data.pre2023_symbol_registry as registry
          import v182.data.pre2023_eodhd_inventory as inventory
          print(f'PRE2023_IMPORT_OK={collector.__file__}')
          print(f'PRE2023_REGISTRY_IMPORT_OK={registry.__file__}')
          print(f'PRE2023_INVENTORY_IMPORT_OK={inventory.__file__}')
          PY
      - name: Compile PRE2023 data governance modules
        run: python -m compileall -q v182/data/pre2023_ohlcv_eodhd.py v182/data/pre2023_symbol_registry.py v182/data/pre2023_eodhd_inventory.py
      - name: Run fail-closed governance tests
        run: python -m pytest --import-mode=importlib -q tests/test_pre2023_ohlcv_eodhd.py tests/test_pre2023_symbol_registry.py tests/test_pre2023_eodhd_inventory.py

  provider-inventory-probe:
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'probe(data-source):') }}
    needs: governance-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install probe runtime
        run: python -m pip install --prefer-binary pandas
      - name: Refuse missing EODHD secret
        shell: bash
        run: test -n "$EODHD_API_TOKEN" || { echo 'BLOCK_PRE2023_SECRET: EODHD_API_TOKEN missing'; exit 2; }
      - name: Fetch active plus delisted Paris common-stock inventory
        run: |
          python v182/data/pre2023_eodhd_inventory.py \
            --exchange-scope config/pre2023_eodhd_scope_probe.csv \
            --output data/dev_pre2023/provider_inventory_probe.csv
      - name: Validate probe composition
        run: |
          python - <<'PY'
          import pandas as pd
          p='data/dev_pre2023/provider_inventory_probe.csv'
          df=pd.read_csv(p,dtype=str).fillna('')
          if df.empty: raise SystemExit('BLOCK_PRE2023_PROVIDER_EMPTY')
          statuses=set(df['provider_status'])
          if statuses != {'active','delisted'}:
              raise SystemExit(f'BLOCK_PRE2023_PROVIDER_COMPOSITION: {sorted(statuses)}')
          if df['eodhd_symbol'].duplicated().any():
              raise SystemExit('BLOCK_PRE2023_PROVIDER_COLLISION')
          print(f'PRE2023_PROVIDER_PROBE_ROWS={len(df)}')
          print(f'PRE2023_PROVIDER_PROBE_ACTIVE={(df.provider_status=="active").sum()}')
          print(f'PRE2023_PROVIDER_PROBE_DELISTED={(df.provider_status=="delisted").sum()}')
          PY
      - name: Upload provider inventory probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PRE2023-EODHD-INVENTORY-PROBE-${{ github.run_id }}
          path: data/dev_pre2023/provider_inventory_probe.csv
          if-no-files-found: error
          retention-days: 7

  build-corpus:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_corpus }}
    needs: governance-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install collector runtime
        run: python -m pip install --prefer-binary pandas pyarrow
      - name: Refuse missing secret or registry
        shell: bash
        run: |
          test -n "$EODHD_API_TOKEN" || { echo 'BLOCK_PRE2023_SECRET: EODHD_API_TOKEN missing'; exit 2; }
          test -s "${{ inputs.registry_path }}" || { echo 'BLOCK_PRE2023_SYMBOLS: certified registry missing/empty'; exit 2; }
      - name: Validate certified historical registry and export collector mapping
        run: |
          python - <<'PY'
          from v182.data.pre2023_symbol_registry import validate_registry, export_collector_mapping
          registry = validate_registry("${{ inputs.registry_path }}")
          path = export_collector_mapping(registry, "data/dev_pre2023/collector_symbols.csv")
          print(f'PRE2023_REGISTRY_ROWS={len(registry)}')
          print(f'PRE2023_COLLECTOR_MAPPING={path}')
          PY
      - name: Build isolated PRE2023 corpus
        run: |
          python v182/data/pre2023_ohlcv_eodhd.py \
            --symbols data/dev_pre2023/collector_symbols.csv \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --output-dir data/dev_pre2023/eodhd
      - name: Assert no holdout contamination
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          files=list(Path('data/dev_pre2023/eodhd/bars').glob('*.parquet'))
          if not files: raise SystemExit('BLOCK_PRE2023_EMPTY: no parquet bars')
          max_date=max(pd.read_parquet(p,columns=['date'])['date'].max() for p in files)
          max_date=pd.Timestamp(max_date)
          max_date=max_date.tz_localize('UTC') if max_date.tzinfo is None else max_date.tz_convert('UTC')
          if max_date >= pd.Timestamp('2023-01-01',tz='UTC'):
              raise SystemExit(f'BLOCK_PRE2023_HOLDOUT_LEAK: max_date={max_date}')
          print(f'PRE2023_MAX_DATE={max_date}')
          PY
      - name: Upload governed PRE2023 corpus
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PRE2023-OHLCV-EODHD-${{ github.run_id }}
          path: data/dev_pre2023/
          if-no-files-found: error
          retention-days: 30
