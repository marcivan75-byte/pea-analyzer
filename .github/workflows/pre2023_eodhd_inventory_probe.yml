name: PRE2023 EODHD inventory probe

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - 'config/pre2023_eodhd_scope_probe.csv'
      - '.github/workflows/pre2023_eodhd_inventory_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install probe runtime
        run: python -m pip install --prefer-binary pandas
      - name: Refuse missing EODHD secret
        shell: bash
        run: |
          test -n "$EODHD_API_TOKEN" || { echo 'BLOCK_PRE2023_SECRET: EODHD_API_TOKEN missing'; exit 2; }
      - name: Fetch Paris active and delisted common stocks
        run: |
          python v182/data/pre2023_eodhd_inventory.py \
            --exchange-scope config/pre2023_eodhd_scope_probe.csv \
            --output data/dev_pre2023/provider_inventory_probe.csv
      - name: Validate provider composition
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv('data/dev_pre2023/provider_inventory_probe.csv', dtype=str).fillna('')
          if df.empty:
              raise SystemExit('BLOCK_PRE2023_PROVIDER_EMPTY')
          statuses = set(df['provider_status'])
          if statuses != {'active', 'delisted'}:
              raise SystemExit('BLOCK_PRE2023_PROVIDER_COMPOSITION: active+delisted required')
          if df['eodhd_symbol'].duplicated().any():
              raise SystemExit('BLOCK_PRE2023_PROVIDER_COLLISION')
          print('PRE2023_PROVIDER_PROBE_ROWS=' + str(len(df)))
          print('PRE2023_PROVIDER_PROBE_ACTIVE=' + str((df['provider_status'] == 'active').sum()))
          print('PRE2023_PROVIDER_PROBE_DELISTED=' + str((df['provider_status'] == 'delisted').sum()))
          PY
      - name: Upload provider inventory probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PRE2023-EODHD-INVENTORY-PROBE-${{ github.run_id }}
          path: data/dev_pre2023/provider_inventory_probe.csv
          if-no-files-found: error
          retention-days: 7
