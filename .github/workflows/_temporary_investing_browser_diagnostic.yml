name: Temporary Investing Browser Diagnostic

on:
  push:
    branches:
      - codex/runtime-boursorama-shared-limiter-v21-15-2
    paths:
      - .github/investing-browser-diagnostic-trigger

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install runtime
        run: pip install --prefer-binary -r requirements-runtime.txt
      - name: Probe Investing public pages with system Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || true
          command -v chromium || true
          python - <<'PY'
          import asyncio, json, re, shutil
          from playwright.async_api import async_playwright

          async def main():
              chrome = shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
              print('CHROME=', chrome)
              if not chrome:
                  raise SystemExit('NO_SYSTEM_CHROME')
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, executable_path=chrome, args=['--no-sandbox','--disable-dev-shm-usage'])
                  page = await browser.new_page(locale='fr-FR', user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36')
                  for url in [
                      'https://fr.investing.com/equities/nykode-therapeutics',
                      'https://fr.investing.com/equities/nykode-therapeutics-technical',
                  ]:
                      try:
                          resp = await page.goto(url, wait_until='domcontentloaded', timeout=25000)
                          await page.wait_for_timeout(2500)
                          text = await page.locator('body').inner_text(timeout=10000)
                          print('URL=', url)
                          print('STATUS=', resp.status if resp else None)
                          print('TITLE=', await page.title())
                          print('HAS_ISIN=', 'NO0010714785' in text.upper())
                          print('HAS_TECH=', bool(re.search(r'(Journalier|Daily).{0,100}(Achat|Buy|Vente|Sell|Neut)', text, re.I|re.S)))
                          print('TEXT_SAMPLE=', ' '.join(text.split())[:4000])
                      except Exception as exc:
                          print('ERROR=', url, type(exc).__name__, str(exc)[:500])
                  await browser.close()
          asyncio.run(main())
          PY
