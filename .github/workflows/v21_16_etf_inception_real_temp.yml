name: V21.16 TEMP real ETF inception qualification

on:
  push:
    branches:
      - data/etf-inception-evidence-v21-16

permissions:
  contents: read

concurrency:
  group: v21-16-etf-inception-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-real-inception:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PEA_PROVENANCE_PATH: state/provenance/OBSERVATION_PROVENANCE.csv
    steps:
      - uses: actions/checkout@v4

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/
          key: v21-16-etf-inception-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .[test]

      - name: Baseline real OHLCV classification before inception evidence
        run: |
          rm -f outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
          python -m v182.audit.ohlcv_history_depth --as-of 2026-08-20
          mkdir -p outputs/audit/v21_16_real
          cp outputs/audit/OHLCV_PRIMARY_HISTORY_DEPTH.csv outputs/audit/v21_16_real/BEFORE.csv
          cp outputs/audit/OHLCV_PRIMARY_HISTORY_DEPTH_SUMMARY.json outputs/audit/v21_16_real/BEFORE.json

      - name: Collect and persist exact-ISIN inception evidence
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          import json
          import pandas as pd

          from v182.io.frames import apply_observations
          from v182.reporting.etf_structure_refresh import _governed_structural_observations
          from v182.sources.etf_inception_data import collect_etf_inception_data
          from v182.state.etf_structure_state import load_state_config, write_structural_state_snapshot

          root = Path('.')
          master = pd.read_csv(
              root/'inputs/V18.2_PEA_ETF_MASTER.csv',
              sep=';', encoding='utf-8-sig', dtype=str, low_memory=False,
          )
          assert len(master) == 102 and master['isin'].nunique() == 102
          assert 'provider' in master.columns

          raw, failures, metrics = collect_etf_inception_data(
              master, today=date(2026, 8, 20), delay_seconds=0.01
          )
          governed = _governed_structural_observations(
              raw, now='2026-08-20T23:00:00Z'
          )
          accepted = [r for r in governed if r.get('validation_status') == 'ISIN_MATCHED']
          merged, quarantined = apply_observations(master, governed)
          out = root/'outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv'
          out.parent.mkdir(parents=True, exist_ok=True)
          merged.to_csv(out, sep=';', index=False, encoding='utf-8-sig')

          state_cfg = load_state_config(root/'config/ETF_STRUCTURE_STATE_V21_15.json')
          state_summary = write_structural_state_snapshot(
              merged,
              state_cfg,
              root=root,
              provenance_path=root/'state/provenance/OBSERVATION_PROVENANCE.csv',
              now='2026-08-20T23:00:00Z',
          )
          payload = {
              'metrics': metrics,
              'raw_observations': len(raw),
              'accepted_observations': len(accepted),
              'quarantined': len(quarantined),
              'failures': len(failures),
              'state_summary': state_summary,
              'fields': sorted({r['field'] for r in accepted}),
          }
          path = root/'outputs/audit/v21_16_real/INCEPTION_COLLECTION.json'
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          assert metrics['share_class_inception_observations'] > 0
          assert metrics['listing_or_launch_observations'] > 0
          assert len(accepted) > 0
          assert state_summary['rows'] > 0
          PY

      - name: Reclassify same OHLCV with inception evidence
        run: |
          python -m v182.audit.ohlcv_history_depth --as-of 2026-08-20
          cp outputs/audit/OHLCV_PRIMARY_HISTORY_DEPTH.csv outputs/audit/v21_16_real/AFTER.csv
          cp outputs/audit/OHLCV_PRIMARY_HISTORY_DEPTH_SUMMARY.json outputs/audit/v21_16_real/AFTER.json

      - name: Verify explanation gain without calibration promotion
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          root = Path('outputs/audit/v21_16_real')
          before = json.loads((root/'BEFORE.json').read_text(encoding='utf-8'))
          after = json.loads((root/'AFTER.json').read_text(encoding='utf-8'))
          before_rows = pd.read_csv(root/'BEFORE.csv', sep=';', encoding='utf-8-sig', dtype=str)
          after_rows = pd.read_csv(root/'AFTER.csv', sep=';', encoding='utf-8-sig', dtype=str)

          before_etf = before_rows[before_rows['asset_class'].eq('ETF')]
          after_etf = after_rows[after_rows['asset_class'].eq('ETF')]
          before_short = int(before_etf['primary_status'].eq('START_AFTER_ANCHOR_UNRESOLVED').sum())
          after_unresolved = int(after_etf['primary_status'].eq('START_AFTER_ANCHOR_UNRESOLVED').sum())
          post_anchor = int(after_etf['primary_status'].eq('POST_ANCHOR_INCEPTION_CONFIRMED').sum())
          pre_anchor_gap = int(after_etf['primary_status'].eq('PRE_ANCHOR_INCEPTION_HISTORY_GAP_CONFIRMED').sum())
          conflicts = int(after_etf['primary_status'].astype(str).str.startswith('INCEPTION_EVIDENCE_CONFLICT').sum())

          assert before_short > 0, before_short
          assert after_unresolved < before_short, (before_short, after_unresolved)
          assert post_anchor + pre_anchor_gap > 0
          assert before['primary_calibration_eligible_count'] == after['primary_calibration_eligible_count']
          assert after['inception_evidence_changes_calibration_eligibility'] is False
          assert float(after['stress_calibration_weight']) == 0.0

          short_after = after_etf[
              after_etf['primary_status'].isin([
                  'POST_ANCHOR_INCEPTION_CONFIRMED',
                  'PRE_ANCHOR_INCEPTION_HISTORY_GAP_CONFIRMED',
                  'START_AFTER_ANCHOR_UNRESOLVED',
                  'INCEPTION_EVIDENCE_CONFLICT_FUTURE',
                  'INCEPTION_EVIDENCE_CONFLICT_AFTER_FIRST_OBSERVATION',
              ])
          ].copy()
          short_after.to_csv(root/'ETF_SHORT_HISTORY_AFTER.csv', sep=';', index=False, encoding='utf-8-sig')
          result = {
              'status': 'SUCCESS',
              'before_etf_unresolved': before_short,
              'after_etf_unresolved': after_unresolved,
              'post_anchor_inception_confirmed': post_anchor,
              'pre_anchor_inception_history_gap_confirmed': pre_anchor_gap,
              'inception_conflicts': conflicts,
              'primary_calibration_eligible_before': before['primary_calibration_eligible_count'],
              'primary_calibration_eligible_after': after['primary_calibration_eligible_count'],
              'synthetic_history_created': False,
              'stress_calibration_weight': 0.0,
          }
          (root/'RESULT.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result, indent=2))
          PY

      - name: Upload V21.16 real evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V21_16_REAL_ETF_INCEPTION_${{ github.run_id }}
          path: |
            outputs/audit/v21_16_real/
            state/provenance/etf_structure/ETF_STRUCTURE_SNAPSHOT.csv
          if-no-files-found: error
          retention-days: 14
