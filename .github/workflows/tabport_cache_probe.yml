name: TABPORT historical cache probe

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - '.github/workflows/tabport_cache_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore governed historical OHLCV cache
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Install parquet reader
        run: python -m pip install --prefer-binary pandas numpy pyarrow
      - name: Inventory and validate restored cache
        run: |
          echo "CACHE_HIT=${{ steps.cache.outputs.cache-hit }}"
          echo "CACHE_MATCHED_KEY=${{ steps.cache.outputs.cache-matched-key }}"
          if [ ! -d data/cache ]; then
            echo "BLOCK_CACHE_MISS: data/cache absent"
            exit 2
          fi
          find data/cache -type f -printf '%p\t%s bytes\n' | sort | tee /tmp/tabport_cache_files.txt
          if [ ! -s /tmp/tabport_cache_files.txt ]; then
            echo "BLOCK_CACHE_MISS: cache restored without files"
            exit 2
          fi
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          rows=[]
          parquet_rows=[]
          for p in sorted(Path('data/cache').rglob('*')):
              if not p.is_file():
                  continue
              rec={'path':str(p),'size':p.stat().st_size,'suffix':p.suffix.lower()}
              try:
                  if p.suffix.lower() in {'.parquet','.pq'}:
                      df=pd.read_parquet(p)
                      rec.update(rows=int(len(df)), columns=list(map(str,df.columns)))
                      if len(df):
                          idx=pd.to_datetime(df.index,errors='coerce',utc=True)
                          valid_idx=idx[~idx.isna()]
                          rec['index_name']=str(df.index.name)
                          rec['index_dtype']=str(df.index.dtype)
                          rec['index_valid_dates']=int(len(valid_idx))
                          if len(valid_idx):
                              rec['index_min']=str(valid_idx.min())
                              rec['index_max']=str(valid_idx.max())
                              rec['index_span_days']=int((valid_idx.max()-valid_idx.min()).days)
                              rec['index_monotonic']=bool(valid_idx.is_monotonic_increasing)
                              rec['index_duplicates']=int(valid_idx.duplicated().sum())
                      parquet_rows.append(rec)
                  elif p.suffix.lower()=='.csv':
                      df=pd.read_csv(p,nrows=5)
                      rec.update(columns=list(map(str,df.columns)))
              except Exception as exc:
                  rec['inspect_error']=repr(exc)
              rows.append(rec)

          failures=[]
          if not parquet_rows:
              failures.append('no parquet history found')
          for rec in parquet_rows:
              if rec.get('inspect_error'):
                  failures.append(f"{rec['path']}: inspect_error")
                  continue
              if rec.get('rows',0) < 700:
                  failures.append(f"{rec['path']}: insufficient rows={rec.get('rows')}")
              if rec.get('index_valid_dates',0) != rec.get('rows',0):
                  failures.append(f"{rec['path']}: non-date index values")
              if not rec.get('index_monotonic',False):
                  failures.append(f"{rec['path']}: non-monotonic chronology")
              if rec.get('index_duplicates',0) != 0:
                  failures.append(f"{rec['path']}: duplicate dates={rec.get('index_duplicates')}")
              if rec.get('index_span_days',0) < 900:
                  failures.append(f"{rec['path']}: historical span too short={rec.get('index_span_days')}d")

          summary={
              'parquet_files':len(parquet_rows),
              'min_rows':min((r.get('rows',0) for r in parquet_rows),default=0),
              'max_rows':max((r.get('rows',0) for r in parquet_rows),default=0),
              'global_index_min':min((r.get('index_min') for r in parquet_rows if r.get('index_min')),default=None),
              'global_index_max':max((r.get('index_max') for r in parquet_rows if r.get('index_max')),default=None),
              'failures':failures,
          }
          Path('/tmp/tabport_cache_inventory.json').write_text(json.dumps(rows,indent=2,default=str),encoding='utf-8')
          Path('/tmp/tabport_cache_summary.json').write_text(json.dumps(summary,indent=2,default=str),encoding='utf-8')
          print(json.dumps(summary,indent=2,default=str))
          if failures:
              raise SystemExit('BLOCK_HISTORICAL_CACHE_VALIDATION: '+ '; '.join(failures[:20]))
          PY
      - name: Smoke-test TABPORT parser on real governed cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from v182.hebdo.tabport_historical import _read_ohlc_source

          checks={}
          for name in ('actions','etf'):
              root=Path('data/cache')/name
              if not root.exists():
                  raise SystemExit(f'BLOCK_CACHE_LAYOUT: missing {root}')
              df, files=_read_ohlc_source(root)
              required={'date','ticker','open','high','low','close'}
              if set(df.columns) != required:
                  raise SystemExit(f'BLOCK_CACHE_LAYOUT: {name} columns={list(df.columns)}')
              if df.empty:
                  raise SystemExit(f'BLOCK_CACHE_LAYOUT: {name} normalized empty')
              if df.duplicated(['date','ticker']).any():
                  raise SystemExit(f'BLOCK_CACHE_LAYOUT: {name} duplicate bars')
              checks[name]={
                  'source_files':len(files),
                  'normalized_rows':int(len(df)),
                  'tickers':int(df['ticker'].nunique()),
                  'min_date':str(df['date'].min()),
                  'max_date':str(df['date'].max()),
              }
          Path('/tmp/tabport_cache_parser_smoke.json').write_text(json.dumps(checks,indent=2),encoding='utf-8')
          print(json.dumps(checks,indent=2))
          PY
      - name: Upload cache audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tabport-cache-inventory-${{ github.run_id }}
          path: |
            /tmp/tabport_cache_files.txt
            /tmp/tabport_cache_inventory.json
            /tmp/tabport_cache_summary.json
            /tmp/tabport_cache_parser_smoke.json
          if-no-files-found: warn
          retention-days: 14
