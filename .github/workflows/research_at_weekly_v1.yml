name: Research AT Weekly V1

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/at_weekly_v1.py
      - .github/workflows/research_at_weekly_v1.yml

permissions:
  contents: read

jobs:
  at-weekly-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-at-weekly-v1-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install backtest runtime
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow

      - name: Audit restored cache schema
        run: |
          echo "=== CACHE FILES ==="
          find data/cache -maxdepth 3 -type f -printf '%p\t%s bytes\n' 2>/dev/null | sort | head -80
          echo "=== CACHE SCHEMAS ==="
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          for p in sorted(Path('data/cache').rglob('*')):
              if not p.is_file() or p.suffix.lower() not in {'.parquet','.csv'}:
                  continue
              print(f'FILE={p} SIZE={p.stat().st_size}')
              try:
                  if p.suffix.lower()=='.parquet':
                      df=pd.read_parquet(p)
                  else:
                      df=pd.read_csv(p, nrows=5)
                  print('SHAPE', df.shape)
                  print('INDEX', type(df.index).__name__, getattr(df.index,'name',None))
                  print('COLS', [str(c) for c in df.columns[:30]])
                  print('DTYPES', {str(k):str(v) for k,v in df.dtypes.head(12).items()})
                  print('HEAD', df.head(2).to_dict(orient='records'))
              except Exception as e:
                  print('ERROR', type(e).__name__, str(e)[:300])
          PY

      - name: Run AT Weekly V1 backtest
        run: python -m v182.backtest.at_weekly_v1

      - name: Show summary
        if: always()
        run: cat outputs/backtest/AT_WEEKLY_V1_SUMMARY.json || true

      - name: Upload AT Weekly V1 results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-weekly-v1-${{ github.run_id }}
          path: |
            outputs/backtest/AT_WEEKLY_V1_SUMMARY.json
            outputs/backtest/AT_WEEKLY_V1_SUMMARY.md
            outputs/backtest/AT_WEEKLY_V1_TRADES.csv
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
