name: Research AT Weekly V1

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/at_weekly_v1.py
      - src/v182/backtest/at_weekly_v1_fixed.py
      - .github/workflows/research_at_weekly_v1.yml

permissions:
  contents: read

jobs:
  at-weekly-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-at-weekly-v1-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install backtest runtime
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow

      - name: Audit restored cache
        run: |
          echo "Parquet blocks: $(find data/cache -type f -name '*.parquet' 2>/dev/null | wc -l)"
          du -sh data/cache 2>/dev/null || true

      - name: Run corrected AT Weekly V1 backtest
        run: python -m v182.backtest.at_weekly_v1_fixed

      - name: Validate backtest actually used data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('outputs/backtest/AT_WEEKLY_V1_SUMMARY.json').read_text())
          assert p['status']=='SUCCESS', p
          assert p['scopes']['TOTAL']['valid_instruments'] > 0, p['scopes']['TOTAL']
          assert p['data_window']['first_completed_week'], p['data_window']
          print('VALID_INSTRUMENTS',p['scopes']['TOTAL']['valid_instruments'])
          print('TRADES',p['scopes']['TOTAL']['completed_trades'])
          print('RUNTIME_SECONDS',p['runtime_seconds'])
          PY

      - name: Show summary
        if: always()
        run: cat outputs/backtest/AT_WEEKLY_V1_SUMMARY.json || true

      - name: Upload AT Weekly V1 results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-weekly-v1-${{ github.run_id }}
          path: |
            outputs/backtest/AT_WEEKLY_V1_SUMMARY.json
            outputs/backtest/AT_WEEKLY_V1_SUMMARY.md
            outputs/backtest/AT_WEEKLY_V1_TRADES.csv
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
