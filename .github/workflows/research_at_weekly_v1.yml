name: Research AT Weekly V1

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/at_weekly_weight_bank_v3_local_opt.py
      - src/v182/backtest/at_weekly_exit_bench_v1.py
      - src/v182/backtest/at_weekly_exit_opt_v2.py
      - src/v182/backtest/at_weekly_exit_opt_v3.py
      - src/v182/backtest/at_weekly_exit_opt_v4_false_positive.py
      - src/v182/backtest/at_weekly_exit_opt_v5_delayed_failure.py
      - src/v182/backtest/at_weekly_exit_opt_v6_confirmed_fp.py
      - src/v182/backtest/at_weekly_exit_opt_v7_protective_stop.py
      - src/v182/backtest/at_weekly_exit_opt_v8_profit_reversal_blocks.py
      - src/v182/backtest/at_weekly_exit_opt_v9_overheat_block_e.py
      - tests/test_at_weekly_protective_stop_contract.py
      - docs/research/AT_WEEKLY_BACKTEST_CONTRACT_V1.md
      - docs/research/AT_WEEKLY_DECISION_REGISTRY_V1.md
      - .github/workflows/research_at_weekly_v1.yml

permissions:
  contents: read

jobs:
  at-weekly-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-at-weekly-v1-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install backtest runtime
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow

      - name: Validate protective stop execution contract
        run: python -m unittest tests.test_at_weekly_protective_stop_contract -v

      - name: Run V8 profit reversal block bench
        run: python -m v182.backtest.at_weekly_exit_opt_v8_profit_reversal_blocks

      - name: Validate V8 architecture and controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/backtest/AT_WEEKLY_EXIT_OPT_V8_PROFIT_REVERSAL_BLOCKS.json').read_text())
          assert x['status']=='SUCCESS'
          assert x['valid_actions'] > 0
          assert len(x['entries_fixed']) == 2
          assert x['protective_stop_pct_locked'] == 9.0
          assert x['models_tested'] >= 100
          assert x['best_risk_first'] is not None
          c=x['lookahead_controls']
          assert c['entry_models_fixed'] is True
          assert c['protective_stop_locked_9'] is True
          assert c['fixed_stop_known_before_bar'] is True
          assert c['strategic_signals']=='completed_week_only'
          assert c['strategic_execution']=='next_week_open'
          assert c['daily_j1_used_only_as_completed_week_evidence'] is True
          assert c['endpoint_mark_is_execution'] is False
          PY

      - name: Run V9 Block E overheating bench
        run: python -m v182.backtest.at_weekly_exit_opt_v9_overheat_block_e

      - name: Validate V9 locked decisions and Block E controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/backtest/AT_WEEKLY_EXIT_OPT_V9_OVERHEAT_BLOCK_E.json').read_text())
          assert x['status']=='SUCCESS'
          assert x['valid_actions'] > 0
          assert x['locked']['entries_fixed'] is True
          assert x['locked']['protective_stop_pct'] == 9.0
          assert x['locked']['false_positive_block_fixed'] is True
          assert x['locked']['D01_anchor_fixed']['activation_pct'] == 5.0
          assert x['locked']['D01_anchor_fixed']['score'] == 1
          assert x['locked']['D01_anchor_fixed']['daily_drop_pct'] == 4.0
          assert x['models_tested'] >= 100
          assert x['best_risk_first'] is not None
          assert x['lookahead_controls']['completed_week_signals_only'] is True
          assert x['lookahead_controls']['strategic_execution']=='next_week_open'
          assert x['lookahead_controls']['high52_uses_prior_window_only'] is True
          assert x['lookahead_controls']['endpoint_mark_is_execution'] is False
          print('D01_CONTROL',x['D01_control']['combined']['ALL'],x['D01_control']['robust'])
          b=x['best_risk_first']
          print('BEST_E',b['exit_model'],b['config'],b['combined']['ALL'],b['robust'],b['e_metrics'],b.get('delta_vs_D01'))
          PY

      - name: Show V9 summary
        if: always()
        run: cat outputs/backtest/AT_WEEKLY_EXIT_OPT_V9_OVERHEAT_BLOCK_E.json || true

      - name: Upload V9 Block E overheating bench
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-weekly-exit-opt-v9-overheat-block-e-${{ github.run_id }}
          path: outputs/backtest/AT_WEEKLY_EXIT_OPT_V9_OVERHEAT_BLOCK_E.json
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
