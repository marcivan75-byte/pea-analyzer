name: Research AT Weekly V1

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/at_weekly_selection_portfolio_v10.py
      - src/v182/backtest/at_weekly_selection_diagnostic_v9_p2.py
      - src/v182/backtest/at_weekly_selection_quality_v8_top30.py
      - src/v182/backtest/at_weekly_selection_capacity_v7_top30.py
      - src/v182/backtest/at_weekly_growth_potential_pit_v5_regime.py
      - src/v182/backtest/at_weekly_growth_potential_pit_v6_regime_stress.py
      - src/v182/backtest/at_weekly_quarterly_study_v1.py
      - tests/test_at_weekly_protective_stop_contract.py
      - docs/research/AT_WEEKLY_DECISION_REGISTRY_V1.md
      - .github/workflows/research_at_weekly_v1.yml
  workflow_dispatch:
    inputs:
      stage:
        description: Research stage to execute
        required: true
        default: v10_portfolio
        type: choice
        options:
          - v10_portfolio
          - v9_p2_diagnostic
          - v8_top30_quality
          - v7_top30
          - v5_regime
          - v6_regime_stress

permissions:
  contents: read
  actions: write

jobs:
  at-weekly-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'v10_portfolio' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-at-weekly-v1-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install backtest runtime
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow
      - name: Validate locked protective stop contract
        run: python -m unittest tests.test_at_weekly_protective_stop_contract -v
      - name: Validate locked architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          from v182.backtest.at_weekly_quarterly_study_v1 import STOP_PCT,D_CFG
          reg=Path('docs/research/AT_WEEKLY_DECISION_REGISTRY_V1.md').read_text()
          assert STOP_PCT==9.0
          assert D_CFG['activation_pct']==5.0 and D_CFG['score']==1 and D_CFG['daily_drop_pct']==4.0
          assert 'ENTRY-01 | LOCKED' in reg and 'STOP-01 | LOCKED' in reg
          assert 'E-01 | LOCKED-NOT-EXECUTION' in reg
          assert 'F-TRAIL-01 | LOCKED-REJECTED' in reg
          assert 'EXIT-LOOP-01 | LOCKED' in reg
          print('LOCKED_ARCHITECTURE_OK')
          PY
      - name: Run selected research stage
        run: |
          set -euo pipefail
          echo "STAGE=$STAGE"
          case "$STAGE" in
            v10_portfolio) python -m v182.backtest.at_weekly_selection_portfolio_v10 ;;
            v9_p2_diagnostic) python -m v182.backtest.at_weekly_selection_diagnostic_v9_p2 ;;
            v8_top30_quality) python -m v182.backtest.at_weekly_selection_quality_v8_top30 ;;
            v7_top30) python -m v182.backtest.at_weekly_selection_capacity_v7_top30 ;;
            v5_regime) python -m v182.backtest.at_weekly_growth_potential_pit_v5_regime ;;
            v6_regime_stress) python -m v182.backtest.at_weekly_growth_potential_pit_v6_regime_stress ;;
            *) echo "Unknown stage: $STAGE" >&2; exit 2 ;;
          esac
      - name: Validate stage controls
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          stage=os.environ['STAGE']
          p={
            'v10_portfolio':Path('outputs/backtest/AT_WEEKLY_SELECTION_PORTFOLIO_V10.json'),
            'v9_p2_diagnostic':Path('outputs/backtest/AT_WEEKLY_SELECTION_DIAGNOSTIC_V9_P2.json'),
            'v8_top30_quality':Path('outputs/backtest/AT_WEEKLY_SELECTION_QUALITY_V8_TOP30.json'),
            'v7_top30':Path('outputs/backtest/AT_WEEKLY_SELECTION_CAPACITY_V7_TOP30.json'),
            'v5_regime':Path('outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V5_REGIME.json'),
            'v6_regime_stress':Path('outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V6_REGIME_STRESS.json'),
          }[stage]
          x=json.loads(p.read_text())
          assert x['status']=='SUCCESS',x.get('validation_errors')
          assert not x['validation_errors']
          c=x['lookahead_controls']
          assert c['completed_week_features_only'] and c['feature_timestamp_le_signal']
          assert c['locked_trade_ledger_reused'] and c['locked_entry_exit_unchanged']
          if stage=='v10_portfolio':
              assert x['primary_objective']=='MEAN_CALENDAR_YEAR_NET_PORTFOLIO_RETURN_GT_15_PCT'
              assert x['secondary_objective']=='REWARD_RISK_GT_3_3'
              assert x['portfolio_assumptions']['annual_entry_cap']==30
              assert x['portfolio_assumptions']['weekly_entry_cap']==1
              assert c['future_signals_not_used_for_current_ranking'] and c['outcome_not_used_in_candidate_score']
          elif stage=='v9_p2_diagnostic':
              assert x['trades']==28 and x['stops']==15 and x['d_reversal']==11
              assert c['p2_thresholds_unchanged'] and c['diagnostic_only_no_rule_fitted']
          elif stage=='v8_top30_quality':
              assert c['future_signals_not_used_for_current_ranking']
              assert c['outcome_not_used_in_score_or_rejection']
          elif stage=='v7_top30':
              assert x['capacity_rule']['annual_max_entries']==30
              assert x['capacity_rule']['weekly_max_entries']==1
              assert x['capacity_rule']['sequential_no_future_year_ranking']
              assert c['future_signals_not_used_for_current_ranking']
              assert c['outcome_not_used_in_candidate_score']
          else:
              assert c['regime_uses_only_bars_le_signal']
              assert c['threshold_optimization'] is False
          print('STAGE_VALIDATED',stage)
          PY
      - name: Publish result/comments immediately to GitHub job summary
        if: always()
        run: |
          case "$STAGE" in
            v10_portfolio) F=outputs/backtest/AT_WEEKLY_SELECTION_PORTFOLIO_V10.md ;;
            v9_p2_diagnostic) F=outputs/backtest/AT_WEEKLY_SELECTION_DIAGNOSTIC_V9_P2.md ;;
            v8_top30_quality) F=outputs/backtest/AT_WEEKLY_SELECTION_QUALITY_V8_TOP30.md ;;
            v7_top30) F=outputs/backtest/AT_WEEKLY_SELECTION_CAPACITY_V7_TOP30.md ;;
            v5_regime) F=outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V5_REGIME.md ;;
            v6_regime_stress) F=outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V6_REGIME_STRESS.md ;;
          esac
          if [ -f "$F" ]; then cat "$F" >> "$GITHUB_STEP_SUMMARY"; cat "$F"; fi
      - name: Upload research result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-weekly-${{ env.STAGE }}-${{ github.run_id }}
          path: |
            outputs/backtest/AT_WEEKLY_SELECTION_PORTFOLIO_V10.json
            outputs/backtest/AT_WEEKLY_SELECTION_PORTFOLIO_V10.csv
            outputs/backtest/AT_WEEKLY_SELECTION_PORTFOLIO_V10_TRADES.csv
            outputs/backtest/AT_WEEKLY_SELECTION_PORTFOLIO_V10_EQUITY.csv
            outputs/backtest/AT_WEEKLY_SELECTION_PORTFOLIO_V10.md
            outputs/backtest/AT_WEEKLY_SELECTION_DIAGNOSTIC_V9_P2.json
            outputs/backtest/AT_WEEKLY_SELECTION_DIAGNOSTIC_V9_P2.csv
            outputs/backtest/AT_WEEKLY_SELECTION_DIAGNOSTIC_V9_P2_TRADES.csv
            outputs/backtest/AT_WEEKLY_SELECTION_DIAGNOSTIC_V9_P2.md
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
      - name: Decision boundary
        if: success()
        run: |
          echo "V10 promotion requires economic value first: mean annual net portfolio return >15%, RR >3.3, PF >=1.8, lower stop rate, and annual stability. No automatic promotion on RR alone." >> "$GITHUB_STEP_SUMMARY"
