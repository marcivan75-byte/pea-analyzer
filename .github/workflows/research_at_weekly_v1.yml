name: Research AT Weekly V1

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/at_weekly_v1.py
      - .github/workflows/research_at_weekly_v1.yml

permissions:
  contents: read

jobs:
  at-weekly-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-at-weekly-v1-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install backtest runtime
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow

      - name: Audit restored cache schema
        run: |
          mkdir -p outputs/backtest
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          def scalar(v):
              if v is None:
                  return None
              if isinstance(v, (str, int, float, bool)):
                  return v
              return str(v)

          records=[]
          for p in sorted(Path('data/cache').rglob('*')):
              if not p.is_file() or p.suffix.lower() not in {'.parquet','.csv'}:
                  continue
              rec={'path':str(p),'size_bytes':p.stat().st_size,'suffix':p.suffix.lower()}
              try:
                  if p.suffix.lower()=='.parquet':
                      df=pd.read_parquet(p)
                  else:
                      df=pd.read_csv(p, nrows=8)
                  rec['shape']=[int(df.shape[0]),int(df.shape[1])]
                  rec['index_type']=type(df.index).__name__
                  rec['index_name']=scalar(getattr(df.index,'name',None))
                  rec['columns']=[str(c) for c in df.columns[:50]]
                  rec['dtypes']={str(k):str(v) for k,v in df.dtypes.head(20).items()}
                  rec['head']=[{str(k):scalar(v) for k,v in row.items()} for row in df.head(3).to_dict(orient='records')]
                  if isinstance(df.columns,pd.MultiIndex):
                      rec['multiindex_levels']=[[scalar(x) for x in level[:20]] for level in df.columns.levels]
                  rec['status']='OK'
              except Exception as e:
                  rec['status']='ERROR'
                  rec['error']=f'{type(e).__name__}: {str(e)[:500]}'
              records.append(rec)
          payload={'file_count':len(records),'records':records}
          Path('outputs/backtest/AT_CACHE_SCHEMA_AUDIT.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False,default=str)+'\n',encoding='utf-8')
          print(json.dumps({'file_count':len(records),'paths':[r['path'] for r in records]},indent=2))
          PY

      - name: Run AT Weekly V1 backtest
        run: python -m v182.backtest.at_weekly_v1

      - name: Show summary
        if: always()
        run: cat outputs/backtest/AT_WEEKLY_V1_SUMMARY.json || true

      - name: Upload AT Weekly V1 results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-weekly-v1-${{ github.run_id }}
          path: |
            outputs/backtest/AT_CACHE_SCHEMA_AUDIT.json
            outputs/backtest/AT_WEEKLY_V1_SUMMARY.json
            outputs/backtest/AT_WEEKLY_V1_SUMMARY.md
            outputs/backtest/AT_WEEKLY_V1_TRADES.csv
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
