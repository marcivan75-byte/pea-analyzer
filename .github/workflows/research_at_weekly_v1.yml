name: Research AT Weekly V1

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/at_weekly_growth_potential_pit_v5_regime.py
      - src/v182/backtest/at_weekly_growth_potential_pit_v6_regime_stress.py
      - src/v182/backtest/at_weekly_quarterly_study_v1.py
      - tests/test_at_weekly_protective_stop_contract.py
      - docs/research/AT_WEEKLY_DECISION_REGISTRY_V1.md
      - .github/workflows/research_at_weekly_v1.yml
  workflow_dispatch:
    inputs:
      stage:
        description: Research stage to execute
        required: true
        default: v5_regime
        type: choice
        options:
          - v5_regime
          - v6_regime_stress

permissions:
  contents: read
  actions: write

jobs:
  at-weekly-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'v5_regime' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-at-weekly-v1-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install backtest runtime
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow
      - name: Validate locked protective stop contract
        run: python -m unittest tests.test_at_weekly_protective_stop_contract -v
      - name: Validate locked architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          from v182.backtest.at_weekly_quarterly_study_v1 import STOP_PCT,D_CFG
          reg=Path('docs/research/AT_WEEKLY_DECISION_REGISTRY_V1.md').read_text()
          assert STOP_PCT==9.0
          assert D_CFG['activation_pct']==5.0 and D_CFG['score']==1 and D_CFG['daily_drop_pct']==4.0
          assert 'ENTRY-01 | LOCKED' in reg and 'STOP-01 | LOCKED' in reg
          assert 'E-01 | LOCKED-NOT-EXECUTION' in reg
          assert 'F-TRAIL-01 | LOCKED-REJECTED' in reg
          assert 'EXIT-LOOP-01 | LOCKED' in reg
          print('LOCKED_ARCHITECTURE_OK')
          PY
      - name: Run selected research stage
        run: |
          set -euo pipefail
          echo "STAGE=$STAGE"
          case "$STAGE" in
            v5_regime)
              python -m v182.backtest.at_weekly_growth_potential_pit_v5_regime
              ;;
            v6_regime_stress)
              python -m v182.backtest.at_weekly_growth_potential_pit_v6_regime_stress
              ;;
            *)
              echo "Unknown stage: $STAGE" >&2
              exit 2
              ;;
          esac
      - name: Validate stage controls
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          stage=os.environ['STAGE']
          p={
            'v5_regime':Path('outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V5_REGIME.json'),
            'v6_regime_stress':Path('outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V6_REGIME_STRESS.json'),
          }[stage]
          x=json.loads(p.read_text())
          assert x['status']=='SUCCESS',x.get('validation_errors')
          assert not x['validation_errors']
          c=x['lookahead_controls']
          assert c['completed_week_features_only'] and c['feature_timestamp_le_signal']
          assert c['regime_uses_only_bars_le_signal']
          assert c['locked_trade_ledger_reused'] and c['locked_entry_exit_unchanged']
          assert c['threshold_optimization'] is False
          print('STAGE_VALIDATED',stage,x.get('next_stage'))
          PY
      - name: Publish result/comments immediately to GitHub job summary
        if: always()
        run: |
          if [ "$STAGE" = "v5_regime" ] && [ -f outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V5_REGIME.md ]; then
            cat outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V5_REGIME.md >> "$GITHUB_STEP_SUMMARY"
            cat outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V5_REGIME.md
          elif [ "$STAGE" = "v6_regime_stress" ] && [ -f outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V6_REGIME_STRESS.md ]; then
            cat outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V6_REGIME_STRESS.md >> "$GITHUB_STEP_SUMMARY"
            cat outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V6_REGIME_STRESS.md
          fi
      - name: Upload research result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-weekly-${{ env.STAGE }}-${{ github.run_id }}
          path: |
            outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V5_REGIME.json
            outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V5_REGIME.csv
            outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V5_REGIME.md
            outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V6_REGIME_STRESS.json
            outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V6_REGIME_STRESS.csv
            outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V6_REGIME_STRESS.md
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
      - name: Immediate autonomous continuation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEXT="STOP"
          if [ "$STAGE" = "v5_regime" ]; then
            NEXT=$(python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V5_REGIME.json').read_text())
          print(x.get('next_stage','STOP'))
          PY
            )
          fi
          echo "NEXT_STAGE=$NEXT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$NEXT" = "v6_regime_stress" ]; then
            echo "Dispatching next research stage immediately: $NEXT"
            gh api --method POST \
              repos/${{ github.repository }}/actions/workflows/research_at_weekly_v1.yml/dispatches \
              -f ref=research/at-weekly-v1-20260829 \
              -f 'inputs[stage]=v6_regime_stress'
          else
            echo "Autonomous loop stops at this decision boundary: $NEXT"
          fi
