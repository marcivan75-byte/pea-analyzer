name: Research AT Weekly V1

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/at_weekly_exit_opt_v7_protective_stop.py
      - src/v182/backtest/at_weekly_exit_opt_v8_profit_reversal_blocks.py
      - src/v182/backtest/at_weekly_exit_opt_v9_overheat_block_e.py
      - src/v182/backtest/at_weekly_exit_opt_v10_overheat_weight_bank.py
      - src/v182/backtest/at_weekly_exit_opt_v11_overheat_core_refine.py
      - src/v182/backtest/at_weekly_exit_opt_v12_trailing_reversal.py
      - src/v182/backtest/at_weekly_quarterly_study_v1.py
      - tests/test_at_weekly_protective_stop_contract.py
      - docs/research/AT_WEEKLY_BACKTEST_CONTRACT_V1.md
      - docs/research/AT_WEEKLY_DECISION_REGISTRY_V1.md
      - docs/research/AT_WEEKLY_QUARTERLY_STUDY_SPEC_V1.md
      - .github/workflows/research_at_weekly_v1.yml

permissions:
  contents: read

jobs:
  at-weekly-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-at-weekly-v1-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install backtest runtime
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow
      - name: Validate locked protective stop contract
        run: python -m unittest tests.test_at_weekly_protective_stop_contract -v
      - name: Validate locked exit architecture before quarterly study
        run: |
          python - <<'PY'
          from pathlib import Path
          from v182.backtest.at_weekly_quarterly_study_v1 import STOP_PCT,D_CFG
          reg=Path('docs/research/AT_WEEKLY_DECISION_REGISTRY_V1.md').read_text()
          assert STOP_PCT==9.0
          assert D_CFG['activation_pct']==5.0 and D_CFG['score']==1 and D_CFG['daily_drop_pct']==4.0
          assert 'ENTRY-01 | LOCKED' in reg and 'STOP-01 | LOCKED' in reg
          assert 'E-01 | LOCKED-NOT-EXECUTION' in reg
          assert 'F-TRAIL-01 | LOCKED-REJECTED' in reg
          assert 'EXIT-LOOP-01 | LOCKED' in reg
          print('LOCKED_EXIT_ARCHITECTURE_OK')
          PY
      - name: Run quarterly study since 2023
        run: python -m v182.backtest.at_weekly_quarterly_study_v1
      - name: Validate quarterly study reconciliations and no-lookahead controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/backtest/AT_WEEKLY_QUARTERLY_STUDY_V1.json').read_text())
          assert x['status']=='SUCCESS',x.get('validation_errors')
          assert not x['validation_errors']
          assert x['nominal_per_trade_eur']==5000.0
          l=x['locked']
          assert l['protective_stop_pct']==9.0
          assert l['block_e']=='LOCKED_DIAGNOSTIC_NOT_EXECUTION'
          assert l['trailing']=='LOCKED_REJECTED'
          assert l['strategic_signals']=='completed_week_only' and l['strategic_execution']=='next_week_open'
          assert l['endpoint_mark_is_execution'] is False
          assert len(x['quarters'])>0
          for r in x['quarters']:
            cats=r['early_false_positives_eliminated']+r['protective_stop_invalidations']+r['other_invalidations']+r['take_profit_reversal_D']+r['take_profit_overheat_E']+r['take_profit_D_plus_E_joint']
            assert cats==r['realised_closed_exits']
            assert r['winning_trades']+r['losing_trades']+r['zero_return_trades']==r['realised_closed_exits']
          print('QUARTERS',len(x['quarters']))
          print('CONSOLIDATED',json.dumps(x['consolidated'],sort_keys=True))
          PY
      - name: Show quarterly summary
        if: always()
        run: |
          if [ -f outputs/backtest/AT_WEEKLY_QUARTERLY_STUDY_V1.md ]; then cat outputs/backtest/AT_WEEKLY_QUARTERLY_STUDY_V1.md; fi
      - name: Upload quarterly study
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-weekly-quarterly-study-v1-${{ github.run_id }}
          path: |
            outputs/backtest/AT_WEEKLY_QUARTERLY_STUDY_V1.json
            outputs/backtest/AT_WEEKLY_QUARTERLY_STUDY_V1.csv
            outputs/backtest/AT_WEEKLY_QUARTERLY_STUDY_V1_TRADES.csv
            outputs/backtest/AT_WEEKLY_QUARTERLY_STUDY_V1.md
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
