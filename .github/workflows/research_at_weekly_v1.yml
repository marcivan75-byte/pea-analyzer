name: Research AT Weekly V1

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/at_weekly_weight_bank_v3_local_opt.py
      - src/v182/backtest/at_weekly_exit_bench_v1.py
      - .github/workflows/research_at_weekly_v1.yml

permissions:
  contents: read

jobs:
  at-weekly-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-at-weekly-v1-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install backtest runtime
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow

      - name: Run broad exit bench
        run: python -m v182.backtest.at_weekly_exit_bench_v1

      - name: Validate exit bench
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/backtest/AT_WEEKLY_EXIT_BENCH_V1.json').read_text())
          assert x['status']=='SUCCESS'
          assert x['valid_actions'] > 0
          assert len(x['entries_fixed']) == 2
          assert x['exit_models_tested'] >= 40
          assert x['best_exit_model'] is not None
          assert x['lookahead_controls']['signals']=='completed_week_only'
          assert x['lookahead_controls']['execution']=='next_week_open'
          assert x['lookahead_controls']['intrabar_stop_assumption'] is False
          print('VALID_ACTIONS',x['valid_actions'],'EXIT_MODELS',x['exit_models_tested'])
          print('BEST_EXIT',x['best_exit_model'])
          PY

      - name: Show exit summary
        if: always()
        run: cat outputs/backtest/AT_WEEKLY_EXIT_BENCH_V1.json || true

      - name: Upload exit bench results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-weekly-exit-bench-v1-${{ github.run_id }}
          path: outputs/backtest/AT_WEEKLY_EXIT_BENCH_V1.json
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
