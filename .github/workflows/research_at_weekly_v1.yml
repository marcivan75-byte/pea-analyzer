name: Research AT Weekly V1

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/at_weekly_v1.py
      - src/v182/backtest/at_weekly_v1_fixed.py
      - src/v182/backtest/at_weekly_entry_filters_v1.py
      - src/v182/backtest/at_weekly_adx_filter_v1.py
      - .github/workflows/research_at_weekly_v1.yml

permissions:
  contents: read

jobs:
  at-weekly-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-at-weekly-v1-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install backtest runtime
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow

      - name: Audit restored cache
        run: |
          echo "Parquet blocks: $(find data/cache -type f -name '*.parquet' 2>/dev/null | wc -l)"
          du -sh data/cache 2>/dev/null || true

      - name: Run corrected AT Weekly V1 baseline
        run: python -m v182.backtest.at_weekly_v1_fixed

      - name: Run action entry-filter comparison
        run: python -m v182.backtest.at_weekly_entry_filters_v1

      - name: Run ADX entry-filter comparison
        run: python -m v182.backtest.at_weekly_adx_filter_v1

      - name: Validate backtests actually used data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('outputs/backtest/AT_WEEKLY_V1_SUMMARY.json').read_text())
          q=json.loads(Path('outputs/backtest/AT_WEEKLY_ENTRY_FILTERS_V1.json').read_text())
          a=json.loads(Path('outputs/backtest/AT_WEEKLY_ADX_FILTER_V1.json').read_text())
          assert p['status']=='SUCCESS' and p['scopes']['TOTAL']['valid_instruments'] > 0
          assert q['status']=='SUCCESS' and q['valid_actions'] > 0
          assert q['results']['BASELINE']['ALL']['trades'] > 0
          assert a['status']=='SUCCESS' and a['valid_actions'] > 0
          assert a['results']['BASELINE']['ALL']['trades'] > 0
          print('VALID_INSTRUMENTS',p['scopes']['TOTAL']['valid_instruments'])
          print('ACTION_FILTER_TESTS',q['valid_actions'])
          print('ADX_FILTER_TESTS',a['valid_actions'])
          print('BASELINE_TRADES',a['results']['BASELINE']['ALL']['trades'])
          print('ADX20_TRADES',a['results']['ADX_GE_20']['ALL']['trades'])
          print('ADX25_TRADES',a['results']['ADX_GE_25']['ALL']['trades'])
          print('ADX30_TRADES',a['results']['ADX_GE_30']['ALL']['trades'])
          PY

      - name: Show ADX summary
        if: always()
        run: cat outputs/backtest/AT_WEEKLY_ADX_FILTER_V1.json || true

      - name: Upload AT Weekly research results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-weekly-v1-${{ github.run_id }}
          path: |
            outputs/backtest/AT_WEEKLY_V1_SUMMARY.json
            outputs/backtest/AT_WEEKLY_V1_SUMMARY.md
            outputs/backtest/AT_WEEKLY_V1_TRADES.csv
            outputs/backtest/AT_WEEKLY_ENTRY_FILTERS_V1.json
            outputs/backtest/AT_WEEKLY_ENTRY_FILTERS_V1_TRADES.csv
            outputs/backtest/AT_WEEKLY_ADX_FILTER_V1.json
            outputs/backtest/AT_WEEKLY_ADX_FILTER_V1_TRADES.csv
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
