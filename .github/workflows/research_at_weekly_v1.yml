name: Research AT Weekly V1

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/at_weekly_weight_bank_v3_local_opt.py
      - src/v182/backtest/at_weekly_exit_bench_v1.py
      - src/v182/backtest/at_weekly_exit_opt_v2.py
      - src/v182/backtest/at_weekly_exit_opt_v3.py
      - src/v182/backtest/at_weekly_exit_opt_v4_false_positive.py
      - src/v182/backtest/at_weekly_exit_opt_v5_delayed_failure.py
      - src/v182/backtest/at_weekly_exit_opt_v6_confirmed_fp.py
      - src/v182/backtest/at_weekly_exit_opt_v7_protective_stop.py
      - .github/workflows/research_at_weekly_v1.yml

permissions:
  contents: read

jobs:
  at-weekly-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-at-weekly-v1-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install backtest runtime
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow

      - name: Run V7 protective stop tail-risk audit
        run: python -m v182.backtest.at_weekly_exit_opt_v7_protective_stop

      - name: Validate V7 protective stop tail-risk audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/backtest/AT_WEEKLY_EXIT_OPT_V7_PROTECTIVE_STOP.json').read_text())
          assert x['status']=='SUCCESS'
          assert x['valid_actions'] > 0
          assert len(x['entries_fixed']) == 2
          assert len(x['models']) == 5
          assert x['best_protected_risk_first'] is not None
          assert x['lookahead_controls']['entry_models_fixed'] is True
          assert x['lookahead_controls']['strategic_signals']=='completed_week_only'
          assert x['lookahead_controls']['strategic_execution']=='next_week_open'
          assert x['lookahead_controls']['fixed_stop_known_before_bar'] is True
          assert x['lookahead_controls']['gap_fill']=='actual_week_open'
          assert x['lookahead_controls']['intrabar_trailing_assumption'] is False
          print('VALID_ACTIONS',x['valid_actions'])
          for z in x['models']:
              print(z['exit_model'],z['protective_stop_pct'],z['combined']['ALL'],z['tail_counts'],z['delta_vs_anchor_ALL'])
              print('WORST3',z['worst_15_trades'][:3])
          print('BEST_RISK_FIRST',x['best_protected_risk_first']['exit_model'],x['best_protected_risk_first']['combined']['ALL'])
          PY

      - name: Show V7 summary
        if: always()
        run: cat outputs/backtest/AT_WEEKLY_EXIT_OPT_V7_PROTECTIVE_STOP.json || true

      - name: Upload V7 protective stop tail-risk audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-weekly-exit-opt-v7-protective-stop-${{ github.run_id }}
          path: outputs/backtest/AT_WEEKLY_EXIT_OPT_V7_PROTECTIVE_STOP.json
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
