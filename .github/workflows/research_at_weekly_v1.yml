name: Research AT Weekly V1

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/at_weekly_growth_potential_pit_v1.py
      - src/v182/backtest/at_weekly_growth_potential_pit_v2.py
      - src/v182/backtest/at_weekly_growth_potential_pit_v3_combo.py
      - src/v182/backtest/at_weekly_growth_potential_pit_v4_frozen_mom40.py
      - src/v182/backtest/at_weekly_quarterly_study_v1.py
      - tests/test_at_weekly_protective_stop_contract.py
      - docs/research/AT_WEEKLY_DECISION_REGISTRY_V1.md
      - docs/research/AT_WEEKLY_GROWTH_POTENTIAL_PIT_SPEC_V1.md
      - .github/workflows/research_at_weekly_v1.yml

permissions:
  contents: read

jobs:
  at-weekly-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-at-weekly-v1-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install backtest runtime
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow
      - name: Validate locked protective stop contract
        run: python -m unittest tests.test_at_weekly_protective_stop_contract -v
      - name: Validate locked architecture before PIT growth V4
        run: |
          python - <<'PY'
          from pathlib import Path
          from v182.backtest.at_weekly_quarterly_study_v1 import STOP_PCT,D_CFG
          reg=Path('docs/research/AT_WEEKLY_DECISION_REGISTRY_V1.md').read_text()
          assert STOP_PCT==9.0
          assert D_CFG['activation_pct']==5.0 and D_CFG['score']==1 and D_CFG['daily_drop_pct']==4.0
          assert 'ENTRY-01 | LOCKED' in reg and 'STOP-01 | LOCKED' in reg
          assert 'E-01 | LOCKED-NOT-EXECUTION' in reg
          assert 'F-TRAIL-01 | LOCKED-REJECTED' in reg
          assert 'EXIT-LOOP-01 | LOCKED' in reg
          print('LOCKED_ARCHITECTURE_OK')
          PY
      - name: Run frozen MOM12>=40 temporal stress V4
        run: python -m v182.backtest.at_weekly_growth_potential_pit_v4_frozen_mom40
      - name: Validate PIT growth V4 controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V4_FROZEN_MOM40.json').read_text())
          assert x['status']=='SUCCESS',x.get('validation_errors')
          assert not x['validation_errors']
          assert x['frozen_candidate']['feature']=='momentum_12w_pct'
          assert x['frozen_candidate']['threshold']==40.0
          assert x['hypothesis_status']=='FROZEN_AFTER_V3_BUT_NOT_CLEAN_OOS'
          c=x['lookahead_controls']
          assert c['completed_week_features_only'] and c['feature_timestamp_le_signal']
          assert c['locked_trade_ledger_reused'] and c['locked_entry_exit_unchanged']
          assert c['threshold_reoptimized_in_v4'] is False
          assert x['realised_trades']>0
          print('PIT_GROWTH_V4_VALIDATED',x['realised_trades'])
          PY
      - name: Show PIT growth V4 summary
        if: always()
        run: |
          if [ -f outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V4_FROZEN_MOM40.md ]; then cat outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V4_FROZEN_MOM40.md; fi
      - name: Upload PIT growth V4
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-weekly-growth-potential-pit-v4-frozen-mom40-${{ github.run_id }}
          path: |
            outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V4_FROZEN_MOM40.json
            outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V4_FROZEN_MOM40.csv
            outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_PIT_V4_FROZEN_MOM40.md
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
