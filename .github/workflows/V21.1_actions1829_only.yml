name: V21.1 PEA Actions 1829 - Collection to Committee

# 1829 UNIVERSE CONTRACT — manual-only until explicit reactivation.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v211-actions1829-only
  cancel-in-progress: true

jobs:
  actions1829:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -c constraints-ci.txt -e .[test]

      - name: Static 1829 contract preflight
        run: |
          set -euo pipefail
          python -m pip check
          python -m compileall -q src
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/reference/V21.0_ACTIONS_PEA_CONFIG.json').read_text())
          f=json.loads(Path('data/reference/V21.1_FREE_CAPTURE_CONFIG.json').read_text())
          assert c['canonical_universe_size']==1829
          assert c['source_universe_size']==1486
          assert c['excluded_isin_count']==57
          assert c['validated_additions_count']==400
          assert 1486-57+400==1829
          assert c['source_contract']['active_canonical_actions']==1829
          assert c['source_contract']['decision_universe_actions']==1829
          assert f['canonical_universe_size']==1829
          assert f['source_reference_scope']['active_actions_canonical']==1829
          assert Path('data/reference/PEA_ACTIONS_400_VALIDATED_ADDITIONS.csv.gz.b64').exists()
          assert c['execution_mode']=='RESEARCH_ONLY'
          print('V21_1_ACTIONS_1829_STATIC_CONTRACT_OK')
          PY

      - name: Restore V20.4 source universe 1486
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/base1486 outputs
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/V20.4_gitok_end_to_end.yml/runs?status=success&branch=feature%2Fsmart-money-v1&per_page=20" --jq '.workflow_runs[].id' > /tmp/base1486/runs.txt
          FOUND=0
          while read -r RUN; do
            [ -n "$RUN" ] || continue
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/artifacts?per_page=100" --jq '.artifacts[]|select(.expired==false)|[.id,.name]|@tsv' > /tmp/base1486/arts.tsv || continue
            while IFS=$'\t' read -r ART NAME; do
              case "$NAME" in V20.4-GitOK-Full-*) ;; *) continue ;; esac
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" > /tmp/base1486/a.zip || continue
              rm -rf /tmp/base1486/unpack && mkdir -p /tmp/base1486/unpack
              unzip -oq /tmp/base1486/a.zip -d /tmp/base1486/unpack || continue
              SRC=$(find /tmp/base1486/unpack -name V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv -print -quit)
              [ -n "$SRC" ] || continue
              cp "$SRC" outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv
              FOUND=1
              echo "BASE1486_RUN=$RUN" >> "$GITHUB_ENV"
              break 2
            done < /tmp/base1486/arts.tsv
          done < /tmp/base1486/runs.txt
          test "$FOUND" = 1
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv',sep=';',dtype=object,encoding='utf-8-sig',low_memory=False)
          assert len(d)==1486 and d['isin'].astype(str).nunique()==1486
          print('SOURCE_1486_OK')
          PY

      - name: Materialize persistent validated 400 additions
        run: |
          set -euo pipefail
          mkdir -p outputs
          base64 -d data/reference/PEA_ACTIONS_400_VALIDATED_ADDITIONS.csv.gz.b64 | gzip -dc > outputs/V20.4_ACTIONS_506_CANDIDATES_TO_INTEGRATE.csv
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('outputs/V20.4_ACTIONS_506_CANDIDATES_TO_INTEGRATE.csv',sep=';',dtype=object,encoding='utf-8-sig',low_memory=False)
          assert len(d)==400 and d['isin'].astype(str).nunique()==400
          assert d['status'].astype(str).eq('INTEGRER').all()
          assert pd.to_numeric(d['identity_confidence'],errors='coerce').ge(.95).all()
          assert pd.to_numeric(d['pea_confidence'],errors='coerce').ge(.90).all()
          print('PERSISTENT_VALIDATED_ADDITIONS_400_OK')
          PY

      - name: Restore Smart Money shadow when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sm outputs
          FOUND=0
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=success&branch=feature%2Fsmart-money-v1&per_page=50" --jq '.workflow_runs[].id' > /tmp/sm/runs.txt || true
          while read -r RUN; do
            [ -n "$RUN" ] || continue
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/artifacts?per_page=100" --jq '.artifacts[]|select(.expired==false)|[.id,.name]|@tsv' > /tmp/sm/arts.tsv || continue
            while IFS=$'\t' read -r ART NAME; do
              case "$NAME" in *Smart*Money*|*SMART*MONEY*) ;; *) continue ;; esac
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" > /tmp/sm/a.zip || continue
              rm -rf /tmp/sm/unpack && mkdir -p /tmp/sm/unpack
              unzip -oq /tmp/sm/a.zip -d /tmp/sm/unpack || continue
              SRC=$(find /tmp/sm/unpack -name V18.3_PEA_ACTIONS_SMART_MONEY_SHADOW.csv -print -quit)
              if [ -n "$SRC" ]; then cp "$SRC" outputs/V18.3_PEA_ACTIONS_SMART_MONEY_SHADOW.csv; FOUND=1; echo "SMART_MONEY_RUN=$RUN" >> "$GITHUB_ENV"; break 2; fi
            done < /tmp/sm/arts.tsv
          done < /tmp/sm/runs.txt
          echo "SMART_MONEY_RESTORED=$FOUND"

      - name: Restore latest V21.1 free capture cache when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/free outputs/free_capture
          RESTORED=0
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/V21.1_free_capture.yml/runs?status=success&branch=feature%2Fsmart-money-v1&per_page=20" --jq '.workflow_runs[].id' > /tmp/free/runs.txt || true
          while read -r RUN; do
            [ -n "$RUN" ] || continue
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/artifacts?per_page=100" --jq '.artifacts[]|select(.expired==false)|[.id,.name]|@tsv' > /tmp/free/arts.tsv || continue
            while IFS=$'\t' read -r ART NAME; do
              case "$NAME" in V21.1-Free-Capture-*) ;; *) continue ;; esac
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" > /tmp/free/a.zip || continue
              rm -rf /tmp/free/unpack && mkdir -p /tmp/free/unpack
              unzip -oq /tmp/free/a.zip -d /tmp/free/unpack || continue
              OLD=$(find /tmp/free/unpack -type d -path '*/outputs/free_capture' -print -quit)
              if [ -n "$OLD" ]; then cp -a "$OLD/." outputs/free_capture/; RESTORED=1; echo "FREE_CAPTURE_RUN=$RUN" >> "$GITHUB_ENV"; break 2; fi
            done < /tmp/free/arts.tsv
          done < /tmp/free/runs.txt
          echo "FREE_CAPTURE_RESTORED=$RESTORED" >> "$GITHUB_ENV"

      - name: Prepare canonical 1829 Actions
        run: python -m v182.decision.actions_v210_prepare

      - name: Propagate V21.1 free facts into 1829 when cache available
        if: env.FREE_CAPTURE_RESTORED == '1'
        run: python -m v182.free_capture.propagate --target outputs/V21.0_ACTIONS_PEA_1829_PREPARED.csv --free-root outputs/free_capture --expected-rows 1829

      - name: Direct Yahoo market and technical enrichment
        run: python -m v182.decision.actions_v210_enrichment

      - name: Prepare backfill schema
        run: python -m v182.decision.actions_v210_pre_backfill_schema

      - name: Yahoo missing-only backfill
        run: python -m v182.decision.actions_v210_yahoo_backfill

      - name: Finnhub missing-only enrichment
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_MAX_SYMBOLS_PER_RUN: '750'
          FINNHUB_METRIC_MAX_SYMBOLS_PER_RUN: '450'
          FINNHUB_DELAY_SECONDS: '1.05'
        run: python -m v182.decision.actions_v210_finnhub_backfill_v2

      - name: Top Down context 1829
        run: python -m v182.sources.actions_funnel_v210

      - name: Precommittee audit
        run: python -m v182.decision.actions_v210_audit

      - name: Coverage certification
        run: python -m v182.decision.actions_v210_coverage_certification

      - name: Committee 1829
        run: python -m v182.decision.actions_v210_committee

      - name: Apply data-quality gate
        run: python -m v182.decision.actions_v210_apply_data_quality_gate

      - name: Publish exhaustive Actions reference 1829
        run: python -m v182.decision.actions_v210_reference

      - name: Hard 1829 integrity gate
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          cfg=json.loads(Path('data/reference/V21.0_ACTIONS_PEA_CONFIG.json').read_text())
          assert cfg['canonical_universe_size']==1829
          for p in ['outputs/V21.0_ACTIONS_PEA_1829_PREPARED.csv','outputs/V21.0_ACTIONS_PEA_1829_COMMITTEE.csv','outputs/V21.0_ACTIONS_PEA_REFERENCE_MASTER.csv']:
              d=pd.read_csv(p,sep=';',dtype=object,encoding='utf-8-sig',low_memory=False)
              assert len(d)==1829 and d['isin'].astype(str).nunique()==1829, (p,len(d),d['isin'].astype(str).nunique())
              assert d['canonical_universe'].astype(str).eq('PEA_ACTIONS_1829').all(), p
              assert d['execution'].astype(str).eq('RESEARCH_ONLY').all(), p
          prep=json.loads(Path('outputs/audit/V21.0_ACTIONS_PREPARE_AUDIT.json').read_text())
          assert prep['base_after_exclusions']==1429 and prep['validated_additions']==400 and prep['rows']==1829
          print('V21_1_ACTIONS_1829_HARD_GATE_OK')
          PY

      - name: Publish summary
        run: |
          echo '# V21.1 PEA Actions 1829' >> "$GITHUB_STEP_SUMMARY"
          echo '- Active Actions PEA universe: **1829 / 1829**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Composition: 1429 canonical validated + 400 persistent previously validated additions' >> "$GITHUB_STEP_SUMMARY"
          echo '- Scoring weights: unchanged' >> "$GITHUB_STEP_SUMMARY"
          echo '- Smart Money: shadow / negative gate only where data exists; no positive imputation for the added 400' >> "$GITHUB_STEP_SUMMARY"
          echo '- Execution: RESEARCH_ONLY' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V21.1 Actions 1829 reference
        uses: actions/upload-artifact@v6
        with:
          name: V21.1-Actions-PEA-1829-Reference-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            data/reference/V21.0_ACTIONS_PEA_CONFIG.json
            data/reference/V21.1_ACTIONS_PEA_REFERENCE_PUBLISHED.json
            data/reference/PEA_ACTIONS_400_VALIDATED_ADDITIONS.csv.gz.b64
            outputs/V20.4_ACTIONS_506_CANDIDATES_TO_INTEGRATE.csv
            outputs/V21.0_ACTIONS_PEA_1829_PREPARED.csv
            outputs/V21.0_ACTIONS_PEA_1829_COMMITTEE.csv
            outputs/V21.0_ACTIONS_PEA_REFERENCE_MASTER.csv
            outputs/V21.0_ACTIONS_PEA_REFERENCE_COMPLETE.csv
            outputs/V21.0_ACTIONS_PEA_REFERENCE_COVERAGE.csv
            outputs/V21.0_ACTIONS_PEA_REFERENCE_GAPS.csv
            outputs/V21.0_ACTIONS_PEA_CRITERIA_DICTIONARY.csv
            outputs/V21.0_ACTIONS_PEA_WEIGHTS.csv
            outputs/V21.0_ACTIONS_COMMITTEE_SUMMARY.md
            outputs/audit/V21.0_ACTIONS_*.json
