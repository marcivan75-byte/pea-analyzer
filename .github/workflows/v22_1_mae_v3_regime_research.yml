name: V22.1 MAE v3 regime research

on:
  push:
    branches:
      - v22/pit-mae-mfe-preopen
    paths:
      - '.github/workflows/v22_1_mae_v3_regime_research.yml'
      - 'scripts/v22_1_mae_v3_regime_research.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  mae-v3-regime-research:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install research runtime
        run: python -m pip install --prefer-binary "pandas>=2.2" "numpy>=2.0" "scikit-learn>=1.8"
      - name: Resolve latest successful governed historical backtest
        id: history
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=success&branch=v22/pit-mae-mfe-preopen&per_page=100")"
          run_id="$(jq -r '[.workflow_runs[] | select(.name=="V22.1 historical weekly PIT backtest 2010-2026")][0].id // empty' <<<"$runs")"
          test -n "$run_id" || { echo "BLOCK_DATA_MAE_V3: no successful historical backtest"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download validated historical backtest evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs
          run_id='${{ steps.history.outputs.run_id }}'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.name | startswith("v22-1-historical-weekly-backtest-")) | .name' | head -n1)"
          test -n "$artifact" || { echo "BLOCK_DATA_MAE_V3: historical artifact missing"; exit 1; }
          gh run download "$run_id" -n "$artifact" -D inputs
          test -f inputs/V22_1_TRAIN.csv && test -f inputs/V22_1_HOLDOUT.csv || { echo "BLOCK_DATA_MAE_V3: train/holdout evidence missing"; exit 1; }
      - name: Run regime-adaptive MAE v3 research
        run: |
          python scripts/v22_1_mae_v3_regime_research.py \
            --input-dir inputs \
            --out-dir outputs/mae_v3
      - name: Publish summary
        shell: bash
        run: |
          echo '## V22.1 MAE v3 regime research' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/mae_v3/V22_1_MAE_V3_REGIME_RESEARCH.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v22-1-mae-v3-regime-research-${{ github.run_id }}
          path: outputs/mae_v3/
          if-no-files-found: error
          retention-days: 30
