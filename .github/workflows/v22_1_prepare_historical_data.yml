name: V22.1 prepare historical data

on:
  push:
    branches:
      - v22/pit-mae-mfe-preopen
    paths:
      - "tools/v22_1_data/**"
      - ".github/workflows/v22_1_prepare_historical_data.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

jobs:
  prepare-historical-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install data preparation runtime
        run: python -m pip install --prefer-binary pandas numpy pyarrow yfinance
      - name: Restore prior OHLCV cache when available
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-v22-1-prepare-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-
      - name: Download missing OHLCV and reconstruct technical PIT
        run: python tools/v22_1_data/prepare_historical_data.py --root . --batch-size 80
      - name: Validate non-price PIT evidence fail-closed
        run: python tools/v22_1_data/validate_readiness.py
      - name: Publish readiness summary
        if: always()
        run: |
          F=outputs/hebdo/data_v22_1/V22_1_DATA_READINESS.json
          if [ -f "$F" ]; then
            cat "$F"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$F" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload prepared historical data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v22-1-historical-data-${{ github.run_id }}
          path: |
            outputs/hebdo/data_v22_1/V22_1_VALIDATED_IDENTITIES.csv
            outputs/hebdo/data_v22_1/V22_1_OHLCV_2018_2025.parquet
            outputs/hebdo/data_v22_1/V22_1_TECHNICAL_PIT_2019_2024.parquet
            outputs/hebdo/data_v22_1/V22_1_DOWNLOAD_FAILURES.json
            outputs/hebdo/data_v22_1/V22_1_DATA_READINESS.json
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14
