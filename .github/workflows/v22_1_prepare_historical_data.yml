name: V22.1 prepare historical data

on:
  push:
    branches:
      - v22/pit-mae-mfe-preopen
    paths:
      - "tools/v22_1_data/**"
      - "src/v182/hebdo/backtest_v22_1.py"
      - "src/v182/hebdo/hebdo_at_chat_v22.py"
      - "src/v182/hebdo/hebdo_at_chat_v22_1.py"
      - "src/v182/hebdo/mae_predictor.py"
      - "src/v182/scoring/ic_lasso_selector.py"
      - "src/v182/backtest/v21_8_1_backtest_B_v2.py"
      - "tests/test_v22_1_liquidity_pit.py"
      - ".github/workflows/v22_1_prepare_historical_data.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}

jobs:
  prepare-historical-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install data preparation and model runtime
        run: python -m pip install --prefer-binary -r requirements-runtime.txt
      - name: Run liquidity PIT unit tests
        run: python -m pytest -q tests/test_v22_1_liquidity_pit.py
      - name: Restore prior OHLCV cache when available
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-v22-1-prepare-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-
      - name: Download missing OHLCV and reconstruct technical PIT
        run: python tools/v22_1_data/prepare_historical_data.py --root . --batch-size 80
      - name: Persist historical ADV20 liquidity in PIT
        run: |
          python tools/v22_1_data/enrich_liquidity_pit.py \
            --pit outputs/hebdo/data_v22_1/V22_1_TECHNICAL_PIT_2019_2024.parquet \
            --ohlcv outputs/hebdo/data_v22_1/V22_1_OHLCV_2018_2025.parquet \
            --min-adv-eur 800000 \
            --report outputs/hebdo/data_v22_1/V22_1_LIQUIDITY_PIT_REPORT.json \
            --liquid-output outputs/hebdo/data_v22_1/V22_1_TECHNICAL_PIT_2019_2024_LIQUID.parquet
      - name: Validate non-price PIT evidence fail-closed
        run: python tools/v22_1_data/validate_readiness.py
      - name: Run true-PnL PIT technical-core fixed -9pct benchmark
        run: |
          python -m v182.hebdo.backtest_v22_1 \
            --features outputs/hebdo/data_v22_1/V22_1_TECHNICAL_PIT_2019_2024.parquet \
            --ohlcv outputs/hebdo/data_v22_1/V22_1_OHLCV_2018_2025.parquet \
            --feature-set technical-core \
            --stop-policy fixed \
            --start 2019-01-01 \
            --end 2024-12-31 \
            --holdout-start 2024-01-01 \
            --out-dir outputs/hebdo/backtest_v22_1/fixed
      - name: Run true-PnL PIT technical-core ATR challenger
        run: |
          python -m v182.hebdo.backtest_v22_1 \
            --features outputs/hebdo/data_v22_1/V22_1_TECHNICAL_PIT_2019_2024.parquet \
            --ohlcv outputs/hebdo/data_v22_1/V22_1_OHLCV_2018_2025.parquet \
            --feature-set technical-core \
            --stop-policy atr \
            --start 2019-01-01 \
            --end 2024-12-31 \
            --holdout-start 2024-01-01 \
            --out-dir outputs/hebdo/backtest_v22_1/atr
      - name: Run liquid-universe fixed -9pct challenger
        run: |
          python -m v182.hebdo.backtest_v22_1 \
            --features outputs/hebdo/data_v22_1/V22_1_TECHNICAL_PIT_2019_2024_LIQUID.parquet \
            --ohlcv outputs/hebdo/data_v22_1/V22_1_OHLCV_2018_2025.parquet \
            --feature-set technical-core \
            --stop-policy fixed \
            --start 2019-01-01 \
            --end 2024-12-31 \
            --holdout-start 2024-01-01 \
            --out-dir outputs/hebdo/backtest_v22_1/fixed_liquid
      - name: Run liquid-universe ATR challenger
        run: |
          python -m v182.hebdo.backtest_v22_1 \
            --features outputs/hebdo/data_v22_1/V22_1_TECHNICAL_PIT_2019_2024_LIQUID.parquet \
            --ohlcv outputs/hebdo/data_v22_1/V22_1_OHLCV_2018_2025.parquet \
            --feature-set technical-core \
            --stop-policy atr \
            --start 2019-01-01 \
            --end 2024-12-31 \
            --holdout-start 2024-01-01 \
            --out-dir outputs/hebdo/backtest_v22_1/atr_liquid
      - name: Publish readiness, liquidity and stop-policy comparison
        if: always()
        run: |
          for F in \
            outputs/hebdo/data_v22_1/V22_1_DATA_READINESS.json \
            outputs/hebdo/data_v22_1/V22_1_LIQUIDITY_PIT_REPORT.json \
            outputs/hebdo/backtest_v22_1/fixed/V22_1_BACKTEST_REPORT.json \
            outputs/hebdo/backtest_v22_1/atr/V22_1_BACKTEST_REPORT.json \
            outputs/hebdo/backtest_v22_1/fixed_liquid/V22_1_BACKTEST_REPORT.json \
            outputs/hebdo/backtest_v22_1/atr_liquid/V22_1_BACKTEST_REPORT.json \
            outputs/hebdo/backtest_v22_1/fixed/V22_1_GOVERNED_WEIGHTS.json; do
            if [ -f "$F" ]; then
              echo "## $F" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$F" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "$F"
            fi
          done
      - name: Upload prepared historical data and technical-core results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v22-1-historical-data-${{ github.run_id }}
          path: |
            outputs/hebdo/data_v22_1/V22_1_VALIDATED_IDENTITIES.csv
            outputs/hebdo/data_v22_1/V22_1_OHLCV_2018_2025.parquet
            outputs/hebdo/data_v22_1/V22_1_TECHNICAL_PIT_2019_2024.parquet
            outputs/hebdo/data_v22_1/V22_1_TECHNICAL_PIT_2019_2024_LIQUID.parquet
            outputs/hebdo/data_v22_1/V22_1_LIQUIDITY_PIT_REPORT.json
            outputs/hebdo/data_v22_1/V22_1_DOWNLOAD_FAILURES.json
            outputs/hebdo/data_v22_1/V22_1_DATA_READINESS.json
            outputs/hebdo/backtest_v22_1/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14
