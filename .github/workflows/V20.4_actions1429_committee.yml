name: V20.4 Actions 1429 Committee

on:
  workflow_dispatch:
  push:
    branches:
      - feature/smart-money-v1
    paths:
      - ".github/workflows/V20.4_actions1429_committee.yml"
      - "src/v182/decision/actions_universe_1429_master.py"
      - "src/v182/decision/actions_universe_1429_committee.py"
      - "data/reference/PEA_ACTIONS_1429_EXCLUSIONS.csv"
      - "state/v20.4_actions1429_committee.trigger"

permissions:
  contents: read
  actions: read

concurrency:
  group: v204-actions1429-committee
  cancel-in-progress: true

jobs:
  committee:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -c constraints-ci.txt -e .[test]

      - name: Reuse latest successful validated V20.4 dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v204-bootstrap outputs
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired == false) | select((.name | startswith("V20.4-GitOK-end-to-end-")) or (.name | startswith("V20.4-GitOK-full-cycle-")) or (.name | startswith("V20.4-GitOK-reference-"))) | [.id, .workflow_run.id, .name] | @tsv' > /tmp/v204-bootstrap/candidates.tsv
          FOUND=0
          while IFS=$'\t' read -r ARTIFACT_ID SOURCE_RUN ARTIFACT_NAME; do
            [ -n "${ARTIFACT_ID:-}" ] || continue
            CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.conclusion // ""' 2>/dev/null || true)
            [ "$CONCLUSION" = "success" ] || continue
            rm -rf /tmp/v204-bootstrap/extract && mkdir -p /tmp/v204-bootstrap/extract
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/v204-bootstrap/artifact.zip || continue
            unzip -oq /tmp/v204-bootstrap/artifact.zip -d /tmp/v204-bootstrap/extract || continue
            SRC=$(find /tmp/v204-bootstrap/extract -name V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv -print -quit)
            [ -n "$SRC" ] || continue
            cp "$SRC" outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv
            echo "SOURCE_RUN=$SOURCE_RUN" >> "$GITHUB_ENV"
            echo "SOURCE_ARTIFACT=$ARTIFACT_NAME" >> "$GITHUB_ENV"
            FOUND=1
            break
          done < /tmp/v204-bootstrap/candidates.tsv
          test "$FOUND" = "1" || { echo "NO_VALIDATED_V20.4_DATASET"; exit 1; }

      - name: Build canonical 1429 master
        run: python -m v182.decision.actions_universe_1429_master

      - name: Build multi-horizon 1429 committee and Excel pack
        run: python -m v182.decision.actions_universe_1429_committee

      - name: Validate committee outputs and no-live guard
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path('outputs/V20.4_GITOK_ACTIONS_1429_DECISIONS.csv')
          x=Path('outputs/V20.4_GITOK_ACTIONS_1429_ABOVE_77.xlsx')
          a=Path('outputs/audit/V20.4_ACTIONS_1429_COMMITTEE_AUDIT.json')
          assert p.exists() and x.exists() and a.exists()
          df=pd.read_csv(p,sep=';',dtype=object,encoding='utf-8-sig')
          assert len(df)==1429
          assert df['isin'].astype(str).nunique()==1429
          req={'score_short_term','score_medium_term','score_long_term','short_thesis_score','committee_score_1429','T0','T1_1_4w','T2_1_3m','T3_3_6m','T4_6_12m','T5_12_24m','T1_entry_low','T1_entry_high','T1_target','T1_invalidation','decision','execution','identity_method','identity_confidence','committee_comment'}
          assert req.issubset(df.columns), req-set(df.columns)
          assert df['execution'].eq('RESEARCH_ONLY').all()
          assert not df['execution'].astype(str).str.upper().isin({'LIVE','ORDER','EXECUTE','BROKER','REAL_ORDER','LIVE_ORDER'}).any()
          conf=pd.to_numeric(df['identity_confidence'],errors='coerce').fillna(0)
          assert not ((df['decision']=='BUY_CANDIDATE') & (conf<0.92)).any()
          audit=json.loads(a.read_text(encoding='utf-8'))
          assert audit['passed'] is True
          assert audit['smart_money_enabled'] is False
          assert audit['live_order_execution_enabled'] is False
          assert audit['selected_above_77']==int((pd.to_numeric(df['committee_score_1429'],errors='coerce')>77).sum())
          print('ACTIONS1429_COMMITTEE_OK', audit)
          PY

      - name: Publish committee summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          a=json.loads(Path('outputs/audit/V20.4_ACTIONS_1429_COMMITTEE_AUDIT.json').read_text(encoding='utf-8'))
          print('## V20.4 Actions 1429 Committee')
          print(f"- Source run: ${{ env.SOURCE_RUN }}")
          print(f"- Rows: {a['rows']}")
          print(f"- Output columns: {a['output_columns']}")
          print(f"- Actions >77: {a['selected_above_77']}")
          print(f"- Score range: {a['score_min']} to {a['score_max']}")
          print('- Smart Money: disabled')
          print('- Live/order execution: disabled')
          PY

      - name: Upload 1429 committee pack
        uses: actions/upload-artifact@v6
        with:
          name: V20.4-Actions1429-Committee-${{ github.run_id }}
          path: |
            outputs/V20.4_GITOK_ACTIONS_1429_MASTER_ENRICHED.csv
            outputs/V20.4_GITOK_ACTIONS_1429_DECISIONS.csv
            outputs/V20.4_GITOK_ACTIONS_1429_ABOVE_77.xlsx
            outputs/audit/V20.4_ACTIONS_1429_MASTER_AUDIT.json
            outputs/audit/V20.4_ACTIONS_1429_COMMITTEE_AUDIT.json
          if-no-files-found: error
          retention-days: 30
