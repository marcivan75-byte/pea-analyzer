name: V20.4 Actions 506 Quarantine Validation

on:
  push:
    branches: [feature/smart-money-v1]
    paths:
      - ".github/workflows/V20.4_actions506_quarantine.yml"
      - "src/v182/decision/actions_quarantine_506_validator.py"
      - "data/reference/PEA_ACTIONS_506_QUARANTINE_ISIN.csv"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v204-actions506-quarantine
  cancel-in-progress: true

jobs:
  validate-quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -c constraints-ci.txt -e .[test]
      - name: Validate 506 quarantine actions with Yahoo/yfinance
        run: python -m v182.decision.actions_quarantine_506_validator
      - name: Quality gates
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          p=Path('outputs/V20.4_ACTIONS_506_QUARANTINE_VALIDATION.csv')
          a=Path('outputs/audit/V20.4_ACTIONS_506_QUARANTINE_AUDIT.json')
          df=pd.read_csv(p,sep=';',dtype=object,encoding='utf-8-sig')
          assert len(df)==506
          assert df['isin'].nunique()==506
          assert set(df['status']).issubset({'INTEGRER','A_REVOIR','EXCLURE'})
          audit=json.loads(a.read_text())
          assert audit['passed'] is True
          assert audit['smart_money_enabled'] is False
          assert audit['live_order_execution_enabled'] is False
          print(audit)
          PY
      - name: Upload quarantine audit
        uses: actions/upload-artifact@v6
        with:
          name: V20.4-Actions506-Quarantine-${{ github.run_id }}
          path: |
            outputs/V20.4_ACTIONS_506_QUARANTINE_VALIDATION.csv
            outputs/V20.4_ACTIONS_506_CANDIDATES_TO_INTEGRATE.csv
            outputs/audit/V20.4_ACTIONS_506_QUARANTINE_AUDIT.json
          if-no-files-found: error
          retention-days: 30
