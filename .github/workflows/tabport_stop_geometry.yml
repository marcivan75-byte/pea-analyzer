name: TABPORT stop geometry diagnostic

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - 'v182/hebdo/tabport_stop_geometry_publish.py'
      - '.github/workflows/tabport_stop_geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabport-stop-geometry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Restore governed historical OHLCV cache
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Require governed cache
        run: |
          test -d data/cache/actions
          test -n "$(find data/cache/actions -name 'history_*.parquet' -print -quit)"
      - name: Install runtime
        run: |
          python -m pip install --prefer-binary -r requirements-runtime.txt
          python -m pip install scikit-learn scipy
      - name: Compile stop audit
        run: python -m compileall -q v182/hebdo/tabport_stop_geometry_publish.py
      - name: Run stop geometry and width ablation
        run: python -m v182.hebdo.tabport_stop_geometry_publish --cache data/cache/actions --output-dir outputs/tabport_stop_geometry
      - name: Validate stop diagnostic contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs/tabport_stop_geometry')
          diag=json.loads((root/'TABPORT_STOP_GEOMETRY_DIAGNOSTIC.json').read_text())
          assert diag['status']=='PUBLISHED' and diag['baseline_stop']==0.09, diag
          assert diag['stop_grid']==[0.07,0.09,0.11,0.13,0.15], diag
          assert diag['selection_changed'] is False and diag['ranking_changed'] is False and diag['holdout_unlocked'] is False, diag
          for f in ['TABPORT_STOP_WIDTH_COMPARISON.csv','TABPORT_STOP_POST_TRAJECTORY.csv','TABPORT_STOP_CONFIRMED_SIGNALS.csv','TABPORT_STOP_GEOMETRY_DIAGNOSTIC.json']:
              p=root/f; assert p.exists() and p.stat().st_size>0, f
          print(json.dumps(diag,indent=2))
          PY
      - name: Upload stop diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TABPORT-STOP-GEOMETRY-${{ github.run_id }}
          path: outputs/tabport_stop_geometry/
          if-no-files-found: error
          retention-days: 30
