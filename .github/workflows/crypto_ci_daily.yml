name: Crypto CI V1.6.1 Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Europe/Paris"

concurrency:
  group: crypto-ci-daily
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crypto-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: modules/crypto-ci/pyproject.toml

      - name: Restore Crypto cache and T1/T2 state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            modules/crypto-ci/data/cache/
            modules/crypto-ci/state/
          key: crypto-ci-v1-${{ github.run_id }}
          restore-keys: |
            crypto-ci-v1-

      - name: Install Crypto CI V1.6.1
        run: python -m pip install -e modules/crypto-ci

      - name: Validate governed Crypto configuration
        run: crypto-ci validate --root modules/crypto-ci

      - name: Run Crypto TCT/CT Top 100
        run: crypto-ci run --root modules/crypto-ci

      - name: Run Crypto audits
        if: always()
        run: |
          crypto-ci audit --root modules/crypto-ci
          crypto-ci performance-audit --root modules/crypto-ci

      - name: Publish Crypto summary
        if: always()
        run: |
          if [ -f modules/crypto-ci/outputs/ci/CI_CRYPTO.md ]; then
            cat modules/crypto-ci/outputs/ci/CI_CRYPTO.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save Crypto cache and T1/T2 state
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            modules/crypto-ci/data/cache/
            modules/crypto-ci/state/
          key: crypto-ci-v1-${{ github.run_id }}

      - name: Upload Crypto CI results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crypto-ci-v1-6-1-${{ github.run_id }}
          path: modules/crypto-ci/outputs/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14
