name: PEA Weekly Heavy Committee V22 TEST

on:
  workflow_dispatch:
    inputs:
      run_validation:
        description: "Run targeted V22 regression tests before the representative run"
        required: false
        type: boolean
        default: true
  pull_request:
    branches:
      - main

concurrency:
  group: committee-weekly-v22-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

jobs:
  committee-v22-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PEA_SLOW_SOURCE_MODE: LIVE
      PEA_PROVENANCE_PATH: state/provenance/OBSERVATION_PROVENANCE.csv
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/cache/
          key: ohlcv-v3-v22-test-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - name: Restore consolidated tactical decision state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/
          key: decision-state-v1-v22-test-${{ github.run_id }}
          restore-keys: |
            decision-state-v1-

      - name: Restore consolidated weekly research state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/sector_rotation_v2/
            state/etf_fund_flows/
          key: weekly-research-state-v1-v22-test-${{ github.run_id }}
          restore-keys: |
            weekly-research-state-v1-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-runtime.txt

      - name: Install production runtime
        run: pip install --prefer-binary -r requirements-runtime.txt

      - name: Validate V22 targeted regressions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_validation }}
        run: |
          pip install pytest
          python -m compileall -q src/v182/reporting/weekly_unified_super_runner_v22.py
          pytest -q tests/test_weekly_v22_no_wave09.py

      - name: Run Weekly V22 baseline without WAVE09
        run: python -m v182.reporting.weekly_unified_super_runner_v22

      - name: Run Friday tactical, Postmarket and weekly finalization DAG
        run: python -m v182.reporting.weekly_tail_super_runner_v21_16_0

      - name: Show V22 runtime summary
        if: always()
        run: |
          if [ -f outputs/audit/WEEKLY_UNIFIED_SUPER_RUNTIME_V22.json ]; then cat outputs/audit/WEEKLY_UNIFIED_SUPER_RUNTIME_V22.json; fi
          if [ -f outputs/audit/UNIFIED_RUNTIME_V21_13_7.json ]; then cat outputs/audit/UNIFIED_RUNTIME_V21_13_7.json; fi
          if [ -f outputs/audit/PIPELINE_RUNTIME_V21_13_7.json ]; then cat outputs/audit/PIPELINE_RUNTIME_V21_13_7.json; fi
          if [ -f outputs/audit/WEEKLY_TAIL_SUPER_RUNTIME_V21_16_0.json ]; then cat outputs/audit/WEEKLY_TAIL_SUPER_RUNTIME_V21_16_0.json; fi
          if [ -f outputs/audit/CI_EXPLAINABILITY_AUDIT.json ]; then cat outputs/audit/CI_EXPLAINABILITY_AUDIT.json; fi

      - name: Validate OHLCV cache checkpoint
        if: always()
        shell: bash
        run: |
          rm -f state/OHLCV_CACHE_VALIDATED
          if [ -f outputs/audit/V18.2_QUALITY_GATES.json ] \
             && grep -Eq '"passed"[[:space:]]*:[[:space:]]*true' outputs/audit/V18.2_QUALITY_GATES.json \
             && [ -f data/cache/actions/history_manifest.json ] \
             && [ -f data/cache/etf/history_manifest.json ]; then
            printf 'validated\n' > state/OHLCV_CACHE_VALIDATED
          fi

      - name: Save persistent OHLCV cache
        if: ${{ always() && hashFiles('state/OHLCV_CACHE_VALIDATED') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/cache/
          key: ohlcv-v3-${{ github.run_id }}

      - name: Save consolidated tactical decision state
        if: ${{ always() && (hashFiles('state/TCT_V24_1_7_T1_STATE.json', 'state/tct_context/**', 'state/action_ct/**', 'state/action_ct_v22_1/**', 'state/provenance/**') != '') }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/
          key: decision-state-v1-${{ github.run_id }}

      - name: Save consolidated weekly research state
        if: ${{ always() && (hashFiles('state/sector_rotation_v2/**', 'state/etf_fund_flows/**') != '') }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            state/sector_rotation_v2/
            state/etf_fund_flows/
          key: weekly-research-state-v1-${{ github.run_id }}

      - name: Upload V22 test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: committee-weekly-v22-test-${{ github.run_id }}
          path: |
            outputs/unified/
            outputs/decision_brief/
            outputs/committee_master/
            outputs/etf_mt_v2081/
            outputs/etf_fund_flows/
            outputs/sector_rotation/
            outputs/risk/
            outputs/mobile/
            outputs/data_audit/
            outputs/audit/
            outputs/gaps/
            outputs/V21_3_SECTOR_ROTATION.csv
            outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv
            outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
            data/cache/actions/history_manifest.json
            data/cache/etf/history_manifest.json
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/sector_rotation_v2/
            state/etf_fund_flows/
            state/provenance/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14
