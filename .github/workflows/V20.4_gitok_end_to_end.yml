name: V20.4 GitOK End-to-End Committee

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Force a fresh V18.2 market-data collection"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 16 * * 5"
  push:
    branches:
      - feature/smart-money-v1
    paths:
      - ".github/workflows/V20.4_gitok_end_to_end.yml"
      - "state/v20.4_end_to_end.trigger"
      - "src/v182/decision/committee_decision_policy.py"
      - "src/v182/decision/etf_universe_266_policy.py"
      - "data/reference/ETF_PEA_UNIVERSE_266_COMMITTEE.csv.gz.b64"
      - "tests/test_committee_decision_policy.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: v204-gitok-end-to-end
  cancel-in-progress: true

jobs:
  end-to-end-committee:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validated dependency set
        run: pip install -c constraints-ci.txt -e .[test]

      - name: Preflight and tests
        run: |
          python -m pip check
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 src tests
          pytest -q

      - name: Reuse latest successful validated dataset
        id: bootstrap
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data != true) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v204-bootstrap outputs
          echo "ready=false" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired == false) | select((.name | startswith("V20.4-GitOK-end-to-end-")) or (.name | startswith("V20.4-GitOK-full-cycle-")) or (.name | startswith("V20.4-GitOK-reference-"))) | [.id, .workflow_run.id, .name] | @tsv' \
            > /tmp/v204-bootstrap/candidates.tsv
          while IFS=$'\t' read -r ARTIFACT_ID SOURCE_RUN ARTIFACT_NAME; do
            [ -n "${ARTIFACT_ID:-}" ] || continue
            [ "${SOURCE_RUN}" != "${GITHUB_RUN_ID}" ] || continue
            CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.conclusion // ""' 2>/dev/null || true)
            [ "$CONCLUSION" = "success" ] || continue
            rm -rf /tmp/v204-bootstrap/extract
            mkdir -p /tmp/v204-bootstrap/extract
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/v204-bootstrap/artifact.zip || continue
            unzip -oq /tmp/v204-bootstrap/artifact.zip -d /tmp/v204-bootstrap/extract || continue
            rm -rf outputs && mkdir -p outputs
            if [ -d /tmp/v204-bootstrap/extract/outputs ]; then
              cp -a /tmp/v204-bootstrap/extract/outputs/. outputs/
            else
              cp -a /tmp/v204-bootstrap/extract/. outputs/
            fi
            if [ -s outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv ] && [ -s outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv ] && [ -s outputs/audit/V18.2_QUALITY_GATES.json ]; then
              if python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('outputs/audit/V18.2_QUALITY_GATES.json').read_text(encoding='utf-8'))
          raise SystemExit(0 if q.get('passed') is True else 1)
          PY
              then
                echo "ready=true" >> "$GITHUB_OUTPUT"
                echo "source_run=${SOURCE_RUN}" >> "$GITHUB_OUTPUT"
                echo "source_artifact=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          done < /tmp/v204-bootstrap/candidates.tsv
          echo "NO_REUSABLE_VALIDATED_DATASET"

      - name: Require reusable dataset for fast recompute
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data != true) }}
        run: |
          test "${{ steps.bootstrap.outputs.ready }}" = "true" || { echo "No validated daily dataset available; use refresh_data=true"; exit 1; }

      - name: Apply bounded retry policy for explicit refresh
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data == true) }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('config/V18.2_MASTER_CONFIG.json')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          cfg.setdefault('yfinance',{}).update({'history_retry_count':1,'history_retry_backoff_seconds':10,'history_serial_rescue_attempts':1,'history_serial_rescue_backoff_seconds':20,'info_max_retries':1,'info_rate_limit_backoff_seconds':10})
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Collect and enrich V18.2 data on explicit refresh only
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data == true) }}
        env:
          PYTHONUNBUFFERED: "1"
          V182_RUN_ID: v204-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: timeout --signal=TERM --kill-after=2m 35m python -m v182.reporting.run

      - name: Validate data quality gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('outputs/audit/V18.2_QUALITY_GATES.json').read_text(encoding='utf-8'))
          assert q.get('passed') is True, q
          print('QUALITY_GATES_OK')
          PY

      - name: Build action and 266 ETF committee decisions
        env:
          MARKETBEAT_API_KEY: ${{ secrets.MARKETBEAT_API_KEY }}
        run: |
          python -m v182.audit.ohlcv_gaps
          python -m v182.decision.scenario_fallback
          python -m v182.decision.analyst_momentum
          python -m v182.decision.marketbeat_overlay_runner
          python -m v182.decision.committee_finalize
          python -m v182.decision.committee_decision_policy
          python -m v182.decision.etf_universe_266_policy

      - name: Validate action and 266 ETF decisions and execution guard
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          action=pd.read_csv('outputs/V20.4_GITOK_COMMITTEE_DECISIONS.csv',sep=';')
          etf=pd.read_csv('outputs/V20.4_GITOK_ETF_266_DECISIONS.csv',sep=';')
          assert len(etf)==266, len(etf)
          assert etf['ISIN'].astype(str).nunique()==266
          live={'LIVE','ORDER','EXECUTE','BROKER','REAL_ORDER','LIVE_ORDER'}
          for label,df in [('ACTION',action),('ETF266',etf)]:
            assert {'decision','execution'}.issubset(df.columns)
            assert not df['execution'].astype(str).str.upper().isin(live).any(), label
          assert etf['decision'].isin(['BUY_CANDIDATE','WATCH','STRUCTURAL_CANDIDATE','REVIEW','REJECT']).all()
          assert etf['decision'].isin(['BUY_CANDIDATE','STRUCTURAL_CANDIDATE']).any()
          assert Path('outputs/V20.4_GITOK_COMMITTEE_SUMMARY.md').exists()
          print('ETF266_COUNTS',etf['decision'].value_counts().to_dict())
          print('ACTION_ETF266_EXECUTION_GUARD_OK')
          PY

      - name: Publish operational audit snapshot
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,pandas as pd
          from pathlib import Path
          q=json.loads(Path('outputs/audit/V18.2_QUALITY_GATES.json').read_text(encoding='utf-8'))
          etf=pd.read_csv('outputs/V20.4_GITOK_ETF_266_DECISIONS.csv',sep=';')
          print('## Operational audit')
          print(f"- Quality gates daily layer: {'PASS' if q.get('passed') is True else 'FAIL'}")
          print(f"- ETF master universe: {len(etf)}")
          print(f"- Exact daily technical matches: {int(etf['daily_match'].astype(str).str.lower().eq('true').sum())}")
          print(f"- Structural candidates: {int((etf['decision']=='STRUCTURAL_CANDIDATE').sum())}")
          print('- Live-order execution: disabled')
          PY

      - name: Publish committee summary
        run: |
          {
            echo "## Dataset"
            if [ "${{ steps.bootstrap.outputs.ready }}" = "true" ]; then
              echo "Fast recompute using validated daily dataset from run ${{ steps.bootstrap.outputs.source_run }}."
            else
              echo "Explicit fresh V18.2 daily collection performed in this run."
            fi
            echo "ETF universe master: 266 ETFs from the user-provided 9-pillar file."
            echo
            cat outputs/V20.4_GITOK_COMMITTEE_SUMMARY.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V20.4 GitOK committee evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: V20.4-GitOK-end-to-end-${{ github.run_id }}
          path: |
            outputs/audit/**
            outputs/gaps/**
            outputs/context/**
            outputs/history/**
            outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv
            outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
            outputs/V18.2_COMMITTEE_ANALYST_MOMENTUM.csv
            outputs/V20.4_GITOK_COMMITTEE_DECISIONS.csv
            outputs/V20.4_GITOK_ETF_266_DECISIONS.csv
            outputs/V20.4_GITOK_COMMITTEE_SUMMARY.md
          if-no-files-found: warn
          retention-days: 30
