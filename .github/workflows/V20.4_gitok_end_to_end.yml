name: V20.4 GitOK End-to-End Committee

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Force a fresh V18.2 market-data collection"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 16 * * 5"
  push:
    branches:
      - feature/smart-money-v1
    paths:
      - ".github/workflows/V20.4_gitok_end_to_end.yml"
      - "state/v20.4_end_to_end.trigger"
      - "src/v182/decision/committee_decision_policy.py"
      - "src/v182/decision/etf_decision_policy.py"
      - "tests/test_committee_decision_policy.py"
      - "tests/test_etf_decision_policy.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: v204-gitok-end-to-end
  cancel-in-progress: true

jobs:
  end-to-end-committee:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validated dependency set
        run: pip install -c constraints-ci.txt -e .[test]

      - name: Preflight and tests
        run: |
          python -m pip check
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 src tests
          pytest -q

      - name: Reuse latest successful validated dataset
        id: bootstrap
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data != true) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v204-bootstrap outputs
          echo "ready=false" >> "$GITHUB_OUTPUT"

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired == false) | select((.name | startswith("V20.4-GitOK-end-to-end-")) or (.name | startswith("V20.4-GitOK-full-cycle-")) or (.name | startswith("V20.4-GitOK-reference-"))) | [.id, .workflow_run.id, .name] | @tsv' \
            > /tmp/v204-bootstrap/candidates.tsv

          while IFS=$'\t' read -r ARTIFACT_ID SOURCE_RUN ARTIFACT_NAME; do
            [ -n "${ARTIFACT_ID:-}" ] || continue
            [ "${SOURCE_RUN}" != "${GITHUB_RUN_ID}" ] || continue
            CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.conclusion // ""' 2>/dev/null || true)
            [ "$CONCLUSION" = "success" ] || continue

            rm -rf /tmp/v204-bootstrap/extract
            mkdir -p /tmp/v204-bootstrap/extract
            if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/v204-bootstrap/artifact.zip; then
              continue
            fi
            if ! unzip -oq /tmp/v204-bootstrap/artifact.zip -d /tmp/v204-bootstrap/extract; then
              continue
            fi

            rm -rf outputs
            mkdir -p outputs
            if [ -d /tmp/v204-bootstrap/extract/outputs ]; then
              cp -a /tmp/v204-bootstrap/extract/outputs/. outputs/
            else
              cp -a /tmp/v204-bootstrap/extract/. .
            fi

            if [ -s outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv ] \
               && [ -s outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv ] \
               && [ -s outputs/audit/V18.2_QUALITY_GATES.json ]; then
              if python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/audit/V18.2_QUALITY_GATES.json')
          q = json.loads(p.read_text(encoding='utf-8'))
          raise SystemExit(0 if q.get('passed') is True else 1)
          PY
              then
                echo "ready=true" >> "$GITHUB_OUTPUT"
                echo "source_run=${SOURCE_RUN}" >> "$GITHUB_OUTPUT"
                echo "source_artifact=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
                echo "REUSED_VALIDATED_DATASET run=${SOURCE_RUN} artifact=${ARTIFACT_NAME}"
                exit 0
              fi
            fi
          done < /tmp/v204-bootstrap/candidates.tsv

          echo "NO_REUSABLE_VALIDATED_DATASET"

      - name: Require reusable dataset for fast recompute
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data != true) }}
        run: |
          if [ "${{ steps.bootstrap.outputs.ready }}" != "true" ]; then
            echo "ERROR: no previously validated V20.4 dataset was reusable."
            echo "Fast recompute never falls back silently to a full collection."
            echo "Run workflow_dispatch with refresh_data=true to perform an explicit refresh."
            exit 1
          fi
          echo "FAST_RECOMPUTE_DATASET_READY source_run=${{ steps.bootstrap.outputs.source_run }}"

      - name: Collect and enrich V18.2 data on explicit refresh only
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data == true) }}
        env:
          PYTHONUNBUFFERED: "1"
          V182_RUN_ID: v204-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          echo "FULL_REFRESH_EXPLICITLY_ENABLED"
          timeout --signal=TERM --kill-after=2m 35m python -m v182.reporting.run

      - name: Validate data quality gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/audit/V18.2_QUALITY_GATES.json')
          assert p.exists(), p
          quality = json.loads(p.read_text(encoding='utf-8'))
          assert quality.get('passed') is True, quality
          print('QUALITY_GATES_OK')
          PY

      - name: Build action and ETF committee decisions
        env:
          MARKETBEAT_API_KEY: ${{ secrets.MARKETBEAT_API_KEY }}
        run: |
          python -m v182.audit.ohlcv_gaps
          python -m v182.decision.scenario_fallback
          python -m v182.decision.analyst_momentum
          python -m v182.decision.marketbeat_overlay_runner
          python -m v182.decision.committee_finalize
          python -m v182.decision.committee_decision_policy
          python -m v182.decision.etf_decision_policy

      - name: Validate action and ETF decisions and execution guard
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          action_path = Path('outputs/V20.4_GITOK_COMMITTEE_DECISIONS.csv')
          etf_path = Path('outputs/V20.4_GITOK_ETF_DECISIONS.csv')
          summary_path = Path('outputs/V20.4_GITOK_COMMITTEE_SUMMARY.md')
          assert action_path.exists(), action_path
          assert etf_path.exists(), etf_path
          assert summary_path.exists(), summary_path

          live_values = {'LIVE','ORDER','EXECUTE','BROKER','REAL_ORDER','LIVE_ORDER'}
          for label, path in [('ACTION', action_path), ('ETF', etf_path)]:
              decisions = pd.read_csv(path, sep=';')
              assert {'decision','execution'}.issubset(decisions.columns)
              assert not decisions['execution'].astype(str).str.upper().isin(live_values).any(), label
              assert decisions['decision'].astype(str).isin(['BUY_CANDIDATE','WATCH','REVIEW']).any(), label
              print(label, decisions['decision'].value_counts(dropna=False).to_dict())

          text = summary_path.read_text(encoding='utf-8')
          assert 'ETF PEA' in text
          print('ACTION_ETF_EXECUTION_GUARD_OK')
          PY

      - name: Publish committee summary
        run: |
          {
            echo "## Dataset"
            if [ "${{ steps.bootstrap.outputs.ready }}" = "true" ]; then
              echo "Fast recompute using validated dataset from run ${{ steps.bootstrap.outputs.source_run }}."
            else
              echo "Explicit fresh V18.2 collection performed in this run."
            fi
            echo
            cat outputs/V20.4_GITOK_COMMITTEE_SUMMARY.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V20.4 GitOK committee evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: V20.4-GitOK-end-to-end-${{ github.run_id }}
          path: |
            outputs/audit/**
            outputs/gaps/**
            outputs/context/**
            outputs/history/**
            outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv
            outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
            outputs/V18.2_COMMITTEE_ANALYST_MOMENTUM.csv
            outputs/V20.4_GITOK_COMMITTEE_DECISIONS.csv
            outputs/V20.4_GITOK_ETF_DECISIONS.csv
            outputs/V20.4_GITOK_COMMITTEE_SUMMARY.md
          if-no-files-found: warn
          retention-days: 30
