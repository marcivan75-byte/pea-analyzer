name: CI LIGHT V22.2.3 limited Boursorama TradingView

on:
  pull_request:
    paths:
      - "src/v182/reporting/ci_light_v22_2_3.py"
      - "src/v182/reporting/selected_source_enrichment.py"
      - "src/v182/sources/tradingview_technical.py"
      - ".github/workflows/ci_light_v22_2_3_limited.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ci-light-limited:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
      BASELINE_ARTIFACT_ID: "9516854863"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install limited runtime
        run: python -m pip install -c constraints-ci.txt requests beautifulsoup4 lxml pandas openpyxl
      - name: Restore last successful V22.2 candidate artifact
        shell: bash
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" > baseline.zip
          unzip -q baseline.zip
          test -s outputs/committee_master/CI_ENTRY_WATCH_V22_2.csv
          cp outputs/committee_master/CI_ENTRY_WATCH_V22_2.csv outputs/committee_master/CI_ENTRY_WATCH_V22_2_1.csv
          test "$(python - <<'PY'
          import pandas as pd
          frame = pd.read_csv('outputs/committee_master/CI_ENTRY_WATCH_V22_2_1.csv', sep=';')
          print(len(frame))
          PY
          )" = "15"
      - name: Run CI LIGHT Boursorama and TradingView only
        run: python -m v182.reporting.ci_light_v22_2_3
      - name: Validate and publish summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('outputs/audit/CI_LIGHT_V22_2_3.json').read_text(encoding='utf-8'))
          assert audit['status'] == 'SUCCESS', audit
          assert audit['input_rows'] == 15, audit
          assert audit['investing_disabled_for_light'] is True, audit
          assert audit['source_context']['investing']['status'] == 'DISABLED_FOR_PROFILE', audit
          assert audit['source_context']['profile'] == 'CI_LIGHT_V22_2_3', audit
          summary = {
              'status': audit['status'],
              'input_rows': audit['input_rows'],
              'selected': audit['selected'],
              'rejected': audit['rejected'],
              'selected_by_horizon': audit['selected_by_horizon'],
              'boursorama_actions': audit['source_context']['boursorama_actions'],
              'boursorama_etfs': audit['source_context']['boursorama_etfs'],
              'tradingview': audit['tradingview_context'],
              'investing': audit['source_context']['investing'],
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          Path('outputs/audit/CI_LIGHT_LIMITED_PUBLISHED_SUMMARY.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY
      - name: Upload published CI LIGHT
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-light-v22-2-3-limited-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            outputs/committee_master/CI_LIGHT_V22_2_3.csv
            outputs/committee_master/CI_LIGHT_REJECTED_V22_2_3.csv
            outputs/committee_master/CI_LIGHT_V22_2_3.xlsx
            outputs/mobile/ANDROID_CI_LIGHT_V22_2_3.md
            outputs/audit/CI_LIGHT_V22_2_3.json
            outputs/audit/CI_LIGHT_LIMITED_PUBLISHED_SUMMARY.json
            outputs/audit/CI_LIGHT_V22_2_3_SELECTED_SOURCE_CONTEXT.json
            outputs/source_context/CI_LIGHT_V22_2_3_SOURCE_OBSERVATIONS.csv
            outputs/source_context/CI_LIGHT_V22_2_3_SOURCE_FAILURES.csv

