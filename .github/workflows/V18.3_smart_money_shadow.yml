name: V18.3 RC1 Shadow Run - Smart Money Disabled
# manual decision refresh: 2026-08-08T15:48+02:00

on:
  workflow_dispatch:
  push:
    branches:
      - feature/smart-money-v1
    paths:
      - ".github/workflows/V18.3_smart_money_shadow.yml"

permissions:
  contents: read

concurrency:
  group: v18-3-rc1-baseline-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rc1-shadow-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validated dependency set
        run: pip install -c constraints-ci.txt -e .[test]

      - name: RC1 baseline preflight
        run: |
          python -m pip check
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 src tests
          pytest -q
          git diff --exit-code a4175f8b263aee35c76c4b362dfee567ba8bd792 HEAD -- src/v182

      - name: Execute validated V18.2 pipeline
        env:
          V182_RUN_ID: v183-rc1-nosmart-${{ github.run_id }}-${{ github.run_attempt }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m v182.reporting.run

      - name: Complete V18.2 decision layers
        env:
          MARKETBEAT_API_KEY: ${{ secrets.MARKETBEAT_API_KEY }}
        run: |
          python -m v182.audit.ohlcv_gaps
          python -m v182.decision.scenario_fallback
          python -m v182.decision.analyst_momentum
          python -m v182.decision.marketbeat_overlay_runner
          python -m v182.decision.committee_finalize

      - name: Validate baseline outputs and invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit = Path('outputs/audit')
          quality_path = audit / 'V18.2_QUALITY_GATES.json'
          assert quality_path.exists(), quality_path
          quality = json.loads(quality_path.read_text())
          assert quality.get('passed') is True, quality
          print('V18_3_RC1_NO_SMART_MONEY_BASELINE_OK', quality.get('status', 'passed'))
          PY

      - name: Upload RC1 baseline shadow evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: V18.3-rc1-no-smart-money-${{ github.run_id }}
          path: |
            outputs/audit/V18.2_QUALITY_GATES.json
            outputs/gaps/**
            outputs/*.csv
            outputs/*.parquet
          if-no-files-found: warn
          retention-days: 30
