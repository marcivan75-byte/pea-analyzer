# Trigger broad TCT pattern search v1
name: TCT Reverse Engineering Pattern Search

on:
  push:
    branches: [research/tct-reverse-engineering-patterns-v1]
    paths:
      - 'tools/tct_reverse_engineering/pattern_analysis.py'
      - '.github/workflows/tct_reverse_engineering_patterns.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PRE2023_ARTIFACT_ID: '9817322742'

jobs:
  patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Restore governed post-2022 OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Restore PRE2023 governed development corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/pre2023
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRE2023_ARTIFACT_ID}/zip" > /tmp/pre2023.zip
          unzip -oq /tmp/pre2023.zip -d inputs/pre2023
          test -s inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet
          test -n "$(find data/cache/actions -name 'history_*.parquet' -print -quit)"
      - name: Install analysis runtime
        run: python -m pip install --prefer-binary pandas numpy pyarrow
      - name: Rebuild strict event inventory on same corpus
        run: python tools/tct_reverse_engineering/event_inventory.py
      - name: Search multivariable pre-rally patterns
        run: python tools/tct_reverse_engineering/pattern_analysis.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('outputs/tct_reverse_engineering_patterns_v1/TCT_PATTERN_SUMMARY.json').read_text())
          assert p['status']=='SUCCESS', p
          assert p['positive_rows'] > 5000, p
          assert p['feature_columns'] >= 250, p
          print(json.dumps(p,indent=2))
          PY
      - name: Upload TCT pattern search
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TCT-REVERSE-ENGINEERING-PATTERNS-${{ github.run_id }}
          path: |
            outputs/tct_reverse_engineering_v1/
            outputs/tct_reverse_engineering_patterns_v1/
          if-no-files-found: warn
          retention-days: 30
