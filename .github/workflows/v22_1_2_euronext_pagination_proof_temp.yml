name: V22.1.2 TEMP Euronext pagination proof

on:
  push:
    branches:
      - data/euronext-ipo-pagination-v22-1-2
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v22-1-2-euronext-pagination-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-real-action-listing-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Replay V21.17 worklist with paginated Euronext history
        run: |
          python - <<'PY'
          from datetime import date, datetime, timezone
          from pathlib import Path
          import hashlib
          import json

          import pandas as pd

          from v182.sources.action_listing_evidence import collect_action_listing_evidence

          accepted, quarantine, metrics = collect_action_listing_evidence(
              start=date(2023, 1, 1),
              end=date(2026, 8, 21),
              timeout=20,
          )
          accepted_df = pd.DataFrame(accepted)
          quarantine_df = pd.DataFrame(quarantine)
          accepted_isins = set(accepted_df.get('isin', pd.Series(dtype=str)).astype(str))
          source_metrics = metrics.get('source_metrics') or {}

          outdir = Path('outputs/audit/v22_1_2')
          outdir.mkdir(parents=True, exist_ok=True)
          accepted_path = outdir / 'EURONEXT_PAGINATED_ACCEPTED.csv'
          quarantine_path = outdir / 'EURONEXT_PAGINATED_QUARANTINE.csv'
          accepted_df.to_csv(accepted_path, sep=';', index=False, encoding='utf-8-sig')
          quarantine_df.to_csv(quarantine_path, sep=';', index=False, encoding='utf-8-sig')

          payload = {
              'status': metrics.get('status'),
              'version': 'V22.1.2_REAL_EURONEXT_PAGINATION_PROOF',
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'requested_targets': int(metrics.get('requested_targets', 0)),
              'accepted_exact_isin': int(metrics.get('accepted_exact_isin', 0)),
              'quarantine_rows': int(metrics.get('quarantine_rows', 0)),
              'unresolved_targets': int(metrics.get('unresolved_targets', 0)),
              'source_metrics': source_metrics,
              'known_recovered_isins': sorted(accepted_isins.intersection({
                  'IT0005528937', 'IT0005531238', 'IT0005527616',
              })),
              'synthetic_history_created': False,
              'calibration_eligibility_changed': False,
              'weight_or_threshold_changes': False,
              'real_orders_enabled': False,
              'accepted_csv_sha256': hashlib.sha256(accepted_path.read_bytes()).hexdigest(),
              'quarantine_csv_sha256': hashlib.sha256(quarantine_path.read_bytes()).hexdigest(),
          }
          summary_path = outdir / 'EURONEXT_PAGINATION_PROOF.json'
          summary_path.write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(json.dumps(payload, indent=2))

          assert metrics['status'] == 'SUCCESS', metrics
          assert source_metrics.get('status') == 'SUCCESS', source_metrics
          assert int(source_metrics.get('pages_fetched', 0)) > 1, source_metrics
          assert source_metrics.get('date_parse_policy') == 'EURONEXT_DD_MM_YYYY_DAY_FIRST', source_metrics
          assert source_metrics.get('detail_enrichment_enabled') is False, source_metrics
          assert int(metrics.get('accepted_exact_isin', 0)) > 6, metrics
          assert int(metrics.get('unresolved_targets', 157)) < 147, metrics
          assert 'IT0005528937' in accepted_isins, 'DEODATO.GALLERY not recovered'
          assert 'IT0005531238' in accepted_isins, 'TMP GROUP not recovered'
          assert 'IT0005527616' in accepted_isins, 'EUROGROUP LAMINATIONS not recovered'
          PY

      - name: Upload real proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V22_1_2_REAL_EURONEXT_PAGINATION_${{ github.run_id }}
          path: outputs/audit/v22_1_2/
          if-no-files-found: error
          retention-days: 14
