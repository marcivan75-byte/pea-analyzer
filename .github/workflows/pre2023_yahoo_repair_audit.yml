name: PRE2023 Yahoo repair audit

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - '.github/workflows/pre2023_yahoo_repair_audit.yml'
      - 'scripts/pre2023_yahoo_repair_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore governed current OHLCV cache for identities only
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Install dependencies
        run: python -m pip install --prefer-binary pandas numpy pyarrow yfinance
      - name: Compile diagnostic
        run: python -m py_compile scripts/pre2023_yahoo_repair_audit.py
      - name: Compare Yahoo raw vs repaired
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/pre2023_yahoo_repair_audit.py
      - name: Validate governance contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/pre2023_yahoo_repair_audit/PRE2023_YAHOO_REPAIR_AUDIT.json')
          s=json.loads(p.read_text())
          if s.get('purpose')!='SOURCE_QUALITY_DIAGNOSTIC_ONLY':
              raise SystemExit('BLOCK_YAHOO_REPAIR_CONTRACT')
          required_false=('repair_promoted','historical_universe_certified','survivorship_safe','retuning','holdout_accessed_for_prices')
          if any(s.get(k) is not False for k in required_false):
              raise SystemExit('BLOCK_YAHOO_REPAIR_GOVERNANCE')
          if s.get('new_invalid_after_repair',0)>0:
              raise SystemExit('BLOCK_YAHOO_REPAIR_CREATED_INVALID_BARS')
          print('PRE2023_YAHOO_REPAIR_AUDIT_CONTRACT_OK')
          PY
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre2023-yahoo-repair-audit-${{ github.run_id }}
          path: outputs/pre2023_yahoo_repair_audit/
          if-no-files-found: warn
          retention-days: 14
