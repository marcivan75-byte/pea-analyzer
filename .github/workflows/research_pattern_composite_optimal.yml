name: Research Pattern Composite Optimal

on:
  push:
    branches: [research/retro-5d-scope226]
    paths:
      - 'research/backtest_pattern_composite_optimal.py'
      - '.github/workflows/research_pattern_composite_optimal.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  composite-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --prefer-binary pandas numpy pyarrow yfinance
      - name: Restore governed 2023-2026 holdout cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Download PRE2023 physical corpus
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9817322742'
        run: |
          mkdir -p inputs/pre2023
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/pre2023.zip
          unzip -q /tmp/pre2023.zip -d inputs/pre2023
      - name: Compile backtest
        run: python -m py_compile research/backtest_pattern_composite_optimal.py
      - name: Run composite pattern
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python research/backtest_pattern_composite_optimal.py
      - name: Upload complete results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pattern-composite-optimal-${{ github.run_id }}
          path: outputs/pattern_composite_optimal/
          if-no-files-found: warn
          retention-days: 30
