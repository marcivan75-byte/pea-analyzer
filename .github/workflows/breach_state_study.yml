name: ETF breach-state recovery study

on:
  workflow_dispatch:
  push:
    branches: [agent/v21-8-entry-exit-governance]
    paths:
      - ".github/workflows/breach_state_study.yml"
      - "src/v182/backtest/etf_breach_state_study.py"

permissions:
  contents: read

jobs:
  breach-state:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run breach-state recovery study
        run: python -m v182.backtest.etf_breach_state_study
      - name: Show summary
        if: always()
        run: |
          if [ -f outputs/research/etf_breach_state_2026_08_15/ETF_BREACH_STATE_SUMMARY.json ]; then
            cat outputs/research/etf_breach_state_2026_08_15/ETF_BREACH_STATE_SUMMARY.json
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-breach-state-${{ github.run_id }}
          path: outputs/research/etf_breach_state_2026_08_15/
          if-no-files-found: warn
          retention-days: 30
