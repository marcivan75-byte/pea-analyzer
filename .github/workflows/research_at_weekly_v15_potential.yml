name: Research AT Weekly V15 Potential Gate

on:
  push:
    branches:
      - research/at-weekly-v1-20260829
    paths:
      - src/v182/backtest/at_weekly_growth_potential_gate_v15.py
      - .github/workflows/research_at_weekly_v15_potential.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v15-potential-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-at-weekly-v15-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install backtest runtime
        run: python -m pip install --disable-pip-version-check pandas numpy pyarrow
      - name: Validate locked protective stop contract
        run: python -m unittest tests.test_at_weekly_protective_stop_contract -v
      - name: Run V15 growth-potential gate audit
        run: python -m v182.backtest.at_weekly_growth_potential_gate_v15
      - name: Validate V15 controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_GATE_V15.json')
          x=json.loads(p.read_text())
          assert x['status']=='SUCCESS',x.get('validation_errors')
          assert not x['validation_errors']
          r=x['preselection_rule']; c=x['lookahead_controls']; a=x['historical_data_audit']
          assert r['growth_potential_pct_strictly_gt']==20
          assert r['below_or_equal_20_rejected']
          assert r['technical_proxy_cannot_satisfy_gate']
          assert r['current_consensus_backfill_forbidden']
          assert c['feature_timestamp_le_signal_required']
          assert c['current_consensus_backfill_forbidden']
          assert c['future_trade_outcome_not_used']
          assert c['locked_trade_ledger_reused']
          assert c['technical_growth_score_not_treated_as_growth_upside']
          assert a['minimum_coverage_pct_for_historical_gate_backtest']==80
          print('V15_CONTROLS_OK',a['decision'])
          PY
      - name: Publish V15 result
        if: always()
        run: |
          F=outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_GATE_V15.md
          if [ -f "$F" ]; then cat "$F" >> "$GITHUB_STEP_SUMMARY"; cat "$F"; fi
      - name: Upload V15 artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: at-weekly-v15-potential-gate-${{ github.run_id }}
          path: |
            outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_GATE_V15.json
            outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_GATE_V15.csv
            outputs/backtest/AT_WEEKLY_GROWTH_POTENTIAL_GATE_V15.md
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
