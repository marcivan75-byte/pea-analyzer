name: V22.1 historical weekly PIT backtest 2010-2026

on:
  workflow_dispatch:
  push:
    branches:
      - v22/pit-mae-mfe-preopen
    paths:
      - "src/v182/hebdo/backtest_v22_1.py"
      - "src/v182/hebdo/backtest_v22_1_fast.py"
      - "tests/test_hebdo_backtest_v22_1_fast.py"
      - ".github/workflows/v22_1_historical_backtest_2010_2026.yml"

permissions:
  actions: read
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: v22-1-historical-weekly-pit-backtest
  cancel-in-progress: true

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install minimal backtest runtime
        run: |
          python -m pip install --prefer-binary \
            "pandas>=2.2" "numpy>=2.0" "pyarrow>=17" \
            "scipy>=1.17" "scikit-learn>=1.8" "pytest==9.1.1"

      - name: Prove fast engine equivalence
        run: python -m pytest -q tests/test_hebdo_backtest_v22_1_fast.py

      - name: Resolve latest governed repaired history
        id: source
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=success&branch=v22/pit-mae-mfe-preopen&per_page=100")"
          run_id="$(jq -r '[.workflow_runs[] | select(.name=="V22.1 consolidate historical 2010-2026")][0].id // empty' <<<"$runs")"
          test -n "$run_id" || { echo "BLOCK_DATA_BACKTEST: no successful governed consolidated-history run"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download governed repaired history artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs_history
          run_id="${{ steps.source.outputs.run_id }}"
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.name | startswith("pea-history-2010-2026-")) | .name' | head -n1)"
          test -n "$artifact" || { echo "BLOCK_DATA_BACKTEST: governed history artifact missing"; exit 1; }
          gh run download "$run_id" -n "$artifact" -D inputs_history

      - name: Validate history governance gate
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find inputs_history -name MANIFEST.json -print -quit)"
          test -n "$manifest" || { echo "BLOCK_DATA_BACKTEST: MANIFEST.json missing"; exit 1; }
          jq -e '.audit.status == "PASS"' "$manifest" >/dev/null || { echo "BLOCK_DATA_BACKTEST: historical audit not PASS"; exit 1; }
          jq -e '.audit.mae_mfe_ready == true' "$manifest" >/dev/null || { echo "BLOCK_DATA_BACKTEST: history is not MAE/MFE ready"; exit 1; }
          jq -e '.audit.future_returns_embedded == false' "$manifest" >/dev/null || { echo "BLOCK_LOOKAHEAD_BACKTEST: future returns embedded in historical features"; exit 1; }
          jq -e '.audit.current_fundamentals_used_as_history == false' "$manifest" >/dev/null || { echo "BLOCK_LOOKAHEAD_BACKTEST: current fundamentals backfilled historically"; exit 1; }

      - name: Run optimized embargoed technical PIT holdout 2023-2026
        shell: bash
        run: |
          set -euo pipefail
          features="$(find inputs_history -name PEA_TECHNICAL_PIT_2010_2026.parquet -print -quit)"
          ohlcv="$(find inputs_history -name PEA_OHLCV_2010_2026_CONSOLIDATED.parquet -print -quit)"
          test -n "$features" && test -n "$ohlcv" || { echo "BLOCK_DATA_BACKTEST: required repaired PIT files missing"; exit 1; }
          time python -m v182.hebdo.backtest_v22_1_fast \
            --features "$features" \
            --ohlcv "$ohlcv" \
            --out-dir outputs/hebdo/backtest_v22_1_history \
            --start 2010-01-01 \
            --end 2026-08-31 \
            --holdout-start 2023-01-01 \
            --feature-set technical-core \
            --stop-policy fixed \
            --fixed-stop-pct 0.09

      - name: Publish validated model summary
        if: always()
        shell: bash
        run: |
          report="outputs/hebdo/backtest_v22_1_history/V22_1_BACKTEST_REPORT.json"
          if [ -f "$report" ]; then
            echo '## V22.1 historical weekly PIT backtest' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload historical backtest evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v22-1-historical-weekly-backtest-${{ github.run_id }}
          path: outputs/hebdo/backtest_v22_1_history/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
