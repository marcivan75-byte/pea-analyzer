name: V18.2 PR Audit

on:
  push:
    branches:
      - fix/v18-2-waves-resilience
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v18-2-pr-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validated dependency set
        run: pip install -c constraints-ci.txt -e .[test]
      - name: Check dependency consistency
        run: python -m pip check
      - name: Validate Python syntax
        run: python -m compileall -q src tests
      - name: Run critical Ruff correctness checks
        run: ruff check --select E9,F63,F7,F82 src tests
      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('config').glob('*.json')) + sorted(Path('schemas').glob('*.json')):
              json.loads(path.read_text(encoding='utf-8-sig'))
              print(f'OK {path}')
          PY
      - name: Run unit and regression tests
        run: pytest -q
