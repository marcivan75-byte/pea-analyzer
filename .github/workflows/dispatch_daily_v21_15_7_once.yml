name: OPS dispatch Daily V21.15.7 once

on:
  push:
    branches:
      - codex/runtime-boursorama-shared-limiter-v21-15-2
    paths:
      - RUN_DAILY_V21_15_7_NOW.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch optimized Daily V21.15.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run committee_tct_ct_daily.yml --repo "${GITHUB_REPOSITORY}" --ref codex/runtime-boursorama-shared-limiter-v21-15-2 -f run_validation=false
          sleep 4
          gh run list --repo "${GITHUB_REPOSITORY}" --workflow committee_tct_ct_daily.yml --branch codex/runtime-boursorama-shared-limiter-v21-15-2 --event workflow_dispatch --limit 1
