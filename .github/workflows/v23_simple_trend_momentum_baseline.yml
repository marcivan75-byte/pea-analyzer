name: V23 simple trend-momentum baseline

on:
  workflow_dispatch:
  push:
    branches: [v23/tabport-reset-benchmark-first]
    paths:
      - scripts/v23_simple_trend_momentum_baseline.py
      - .github/workflows/v23_simple_trend_momentum_baseline.yml

permissions:
  contents: read

jobs:
  simple-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install minimal runtime
        run: python -m pip install --prefer-binary 'pandas>=2.2' 'numpy>=2.0' 'yfinance>=0.2'
      - name: Run frozen simple baseline
        run: |
          python scripts/v23_simple_trend_momentum_baseline.py \
            --symbol CW8.PA \
            --out-dir outputs/v23_simple_baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v23-simple-baseline-${{ github.run_id }}
          path: outputs/v23_simple_baseline
          if-no-files-found: error
