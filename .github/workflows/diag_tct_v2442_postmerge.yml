name: Diagnostic TCT V24.4.2 post-merge

on:
  pull_request:
    paths:
      - '.github/workflows/diag_tct_v2442_postmerge.yml'

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Dispatch representative V24.4.2 POSTMARKET run on main if absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p diag/target_artifact
          gh api "/repos/${GH_REPO}/actions/workflows/tct_next_session_context.yml/runs?branch=main&per_page=30" > diag/runs_before.json
          RUN_ID=$(python - <<'PY'
          import json
          data=json.load(open('diag/runs_before.json'))
          cutoff='2026-08-21T12:18:02Z'
          c=[r for r in data.get('workflow_runs',[]) if r.get('head_branch')=='main' and r.get('created_at','')>cutoff]
          print(c[0]['id'] if c else '')
          PY
          )
          if [ -z "$RUN_ID" ]; then
            START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            echo "$START" > diag/dispatch_start.txt
            gh workflow run tct_next_session_context.yml --ref main -f phase=POSTMARKET
            for i in $(seq 1 90); do
              sleep 10
              gh api "/repos/${GH_REPO}/actions/workflows/tct_next_session_context.yml/runs?branch=main&per_page=30" > diag/runs_poll.json
              RUN_ID=$(python - <<'PY'
          import json, pathlib
          start=pathlib.Path('diag/dispatch_start.txt').read_text().strip()
          data=json.load(open('diag/runs_poll.json'))
          c=[r for r in data.get('workflow_runs',[]) if r.get('head_branch')=='main' and r.get('created_at','')>=start and r.get('event') in {'workflow_dispatch','schedule'}]
          print(c[0]['id'] if c else '')
          PY
              )
              if [ -n "$RUN_ID" ]; then break; fi
            done
          fi
          if [ -z "$RUN_ID" ]; then
            echo 'No post-merge V24.4.2 run found or created' >&2
            exit 1
          fi
          echo "$RUN_ID" | tee diag/selected_run.txt

      - name: Wait for selected run and collect metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID=$(cat diag/selected_run.txt)
          for i in $(seq 1 120); do
            gh api "/repos/${GH_REPO}/actions/runs/${RUN_ID}" > diag/run.json
            STATUS=$(python -c "import json; print(json.load(open('diag/run.json'))['status'])")
            echo "target run $RUN_ID status=$STATUS"
            if [ "$STATUS" = completed ]; then break; fi
            sleep 10
          done
          gh api "/repos/${GH_REPO}/actions/runs/${RUN_ID}" > diag/run.json
          gh api "/repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" > diag/jobs.json
          gh api "/repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100" > diag/artifacts.json
          python - <<'PY'
          import json, pathlib
          run=json.load(open('diag/run.json'))
          jobs=json.load(open('diag/jobs.json')).get('jobs',[])
          arts=json.load(open('diag/artifacts.json')).get('artifacts',[])
          lines=[f"run={run['id']} status={run['status']} conclusion={run.get('conclusion')} event={run['event']} created={run['created_at']} updated={run['updated_at']} head_branch={run['head_branch']} head_sha={run['head_sha']}"]
          for j in jobs:
              lines.append(f"job={j['id']} {j['name']} {j['status']} {j.get('conclusion')}")
              for s in j.get('steps',[]):
                  lines.append(f"  step={s['number']} {s['name']} {s['status']} {s.get('conclusion')}")
          for a in arts:
              lines.append(f"artifact={a['id']} {a['name']} size={a['size_in_bytes']} expired={a['expired']} digest={a.get('digest')}")
          text='\n'.join(lines)
          print(text)
          pathlib.Path('diag/details.txt').write_text(text)
          PY

      - name: Download target run artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID=$(cat diag/selected_run.txt)
          NAME=$(python - <<'PY'
          import json
          arts=json.load(open('diag/artifacts.json')).get('artifacts',[])
          preferred=[a['name'] for a in arts if a['name'].startswith('tct-next-session-catalyst-v24-4-2-')]
          print(preferred[0] if preferred else '')
          PY
          )
          if [ -n "$NAME" ]; then
            gh run download "$RUN_ID" --name "$NAME" --dir diag/target_artifact
          fi
          find diag/target_artifact -type f -maxdepth 5 -print | sort | tee diag/target_files.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: tct-v2442-postmerge-diagnostic
          path: diag/
          if-no-files-found: error
          retention-days: 2
