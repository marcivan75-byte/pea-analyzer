name: PEA Weekly Heavy Committee V22.2.3 TEST

on:
  workflow_dispatch:
    inputs:
      run_validation:
        description: "Run V22.2.3 targeted regressions before representative run"
        required: false
        type: boolean
        default: true

concurrency:
  group: committee-weekly-v22-2-3-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

jobs:
  committee-v22-2-3-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      PEA_SLOW_SOURCE_MODE: LIVE
      PEA_PROVENANCE_PATH: state/provenance/OBSERVATION_PROVENANCE.csv
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Restore persistent OHLCV cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-v22-2-3-test-${{ github.run_id }}
          restore-keys: |
            ohlcv-v3-

      - name: Restore consolidated tactical decision state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/
          key: decision-state-v1-v22-2-3-test-${{ github.run_id }}
          restore-keys: |
            decision-state-v1-

      - name: Restore consolidated weekly research state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            state/sector_rotation_v2/
            state/etf_fund_flows/
          key: weekly-research-state-v1-v22-2-3-test-${{ github.run_id }}
          restore-keys: |
            weekly-research-state-v1-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-runtime.txt

      - name: Install production runtime
        run: pip install --prefer-binary -r requirements-runtime.txt

      - name: Validate V22.2.3 targeted regressions
        if: ${{ inputs.run_validation }}
        run: |
          pip install pytest
          python -m compileall -q \
            src/v182/reporting/ci_entry_confidence_v22_2.py \
            src/v182/reporting/ci_entry_watch_v22_2.py \
            src/v182/reporting/ci_entry_watch_v22_2_1.py \
            src/v182/reporting/ci_selection_gate_v22_2_2.py \
            src/v182/reporting/ci_light_v4.py \
            src/v182/reporting/ci_light_source_context_v4.py \
            src/v182/decision/tct_timing_exact_v24_1_7.py \
            src/v182/reporting/market_orientation_v22_2.py \
            src/v182/reporting/weekly_unified_super_runner_v22_2_3.py \
            src/v182/reporting/weekly_operational_runner_v4_3.py \
            src/v182/reporting/etf_structure_refresh.py
          pytest -q \
            tests/test_ci_entry_confidence_v22_2.py \
            tests/test_ci_entry_watch_v22_2.py \
            tests/test_ci_entry_watch_v22_2_1.py \
            tests/test_ci_selection_gate_v22_2_2.py \
            tests/test_ci_light_v4.py \
            tests/test_tct_exact_v24_1_7.py \
            tests/test_market_orientation_v22_2.py \
            tests/test_market_orientation_ci_integration_v22_2.py \
            tests/test_weekly_v22_1_runtime_overlap.py \
            tests/test_weekly_unified_super_runner_v22_2_3_runtime.py \
            tests/test_weekly_v22_no_wave09.py

      - name: Run governed Weekly V4.3 under 20 minutes
        run: python -m v182.reporting.weekly_operational_runner_v4_3

      - name: Show V22.2.3 runtime and CI summaries
        if: always()
        run: |
          for f in \
            outputs/audit/WEEKLY_UNIFIED_SUPER_RUNTIME_V22_2_3.json \
            outputs/audit/WEEKLY_OPERATIONAL_RUNTIME_V4_3.json \
            outputs/audit/WEEKLY_UNIFIED_SUPER_RUNTIME_V22_2_2.json \
            outputs/audit/WEEKLY_UNIFIED_SUPER_RUNTIME_V22_2_1.json \
            outputs/audit/MARKET_ORIENTATION_V22_2.json \
            outputs/audit/V21_10_ETF_STRUCTURAL_DATA.json \
            outputs/audit/V21_15_ETF_STRUCTURE_STATE_REPLAY.json \
            outputs/audit/V21_15_ETF_STRUCTURE_STATE_WRITE.json \
            outputs/audit/CI_ENTRY_CONFIDENCE_V22_2.json \
            outputs/audit/CI_ENTRY_WATCH_V22_2.json \
            outputs/audit/CI_ENTRY_WATCH_V22_2_1.json \
            outputs/audit/CI_SELECTION_GATE_V22_2_2.json \
            outputs/audit/CI_LIGHT_V4.json \
            outputs/audit/CI_LIGHT_V4_INDEPENDENT_SOURCE_CONTEXT.json \
            outputs/audit/WEEKLY_TAIL_SUPER_RUNTIME_V21_16_0.json \
            outputs/audit/CI_EXPLAINABILITY_AUDIT.json; do
            if [ -f "$f" ]; then cat "$f"; fi
          done

      - name: Save consolidated CI watch state
        if: ${{ always() && hashFiles('state/ci_entry_watch/**') != '' }}
        run: |
          mkdir -p state/provenance
          cp -f state/ci_entry_watch/V22_2_CANDIDATE_STATE.csv state/provenance/CI_ENTRY_WATCH_V22_2_STATE.csv || true

      - name: Save consolidated tactical and provenance state
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            state/TCT_V24_1_7_T1_STATE.json
            state/tct_context/
            state/action_ct/
            state/action_ct_v22_1/
            state/provenance/
          key: decision-state-v1-v22-2-3-test-${{ github.run_id }}

      - name: Upload V22.2.3 test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: committee-weekly-v22-2-3-test-${{ github.run_id }}
          path: |
            outputs/unified/
            outputs/decision_brief/
            outputs/committee_master/
            outputs/etf_mt_v2081/
            outputs/etf_fund_flows/
            outputs/sector_rotation/
            outputs/risk/
            outputs/mobile/
            outputs/audit/
            outputs/gaps/
            outputs/V18.2_PEA_ACTIONS_MASTER_ENRICHED.csv
            outputs/V18.2_PEA_ETF_MASTER_ENRICHED.csv
            state/ci_entry_watch/
            state/provenance/CI_ENTRY_WATCH_V22_2_STATE.csv
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14
