name: V22 PIT True PnL PREOPEN validation

on:
  pull_request:
    paths:
      - "src/v182/audit/pit_loader.py"
      - "src/v182/backtest/v21_8_1_backtest_B_v2.py"
      - "src/v182/scoring/ic_lasso_selector.py"
      - "src/v182/tct/**"
      - "src/v182/etf/**"
      - "tests/test_backtest_B_v2.py"
      - "tests/test_v21_8_1_backtest_B_v2.py"
      - "tests/test_etf_ter_assets_governance.py"
      - "requirements-runtime.txt"
      - ".github/workflows/committee_tct_ct_daily.yml"
      - ".github/workflows/tct_next_session_context.yml"
      - ".github/workflows/etf_distribution_v21_18_1r4.yml"
      - ".github/workflows/v22_pit_backtest_preopen_validation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  validate-v22:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install production and test runtime
        run: |
          python -m pip install --prefer-binary -r requirements-runtime.txt
          python -m pip install pytest==9.1.1
      - name: Compile V22 changed modules
        run: |
          python -m py_compile \
            src/v182/audit/pit_loader.py \
            src/v182/backtest/v21_8_1_backtest_B_v2.py \
            src/v182/scoring/ic_lasso_selector.py \
            src/v182/tct/preopen_enricher.py \
            src/v182/etf/ter_assets_governance.py
      - name: Critical regression tests
        run: |
          python -m pytest -q \
            tests/test_backtest_B_v2.py \
            tests/test_v21_8_1_backtest_B_v2.py \
            tests/test_ic_lasso_selector.py \
            tests/test_etf_ter_assets_governance.py
      - name: Full pytest suite
        run: python -m pytest -q
      - name: Master data fail-fatal audit
        run: python -m v182.audit.master_data --root . --fail-fatal
