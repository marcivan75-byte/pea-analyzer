name: V23 benchmark-first Stage A

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-stage-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install minimal runtime
        run: python -m pip install --prefer-binary 'pandas>=2.2' 'numpy>=2.0' 'yfinance>=0.2'
      - name: Run frozen passive benchmark
        run: |
          python scripts/v23_benchmark_first_stage_a.py \
            --symbol CW8.PA \
            --start 2010-01-01 \
            --end 2023-01-01 \
            --out-dir outputs/v23_benchmark_stage_a
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v23-benchmark-stage-a-${{ github.run_id }}
          path: outputs/v23_benchmark_stage_a
          if-no-files-found: error
