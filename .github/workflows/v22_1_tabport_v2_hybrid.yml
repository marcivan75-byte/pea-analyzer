name: V22.1 TABPORT v2 hybrid backtest

on:
  push:
    branches:
      - v22/pit-mae-mfe-preopen
    paths:
      - '.github/workflows/v22_1_tabport_v2_hybrid.yml'
      - 'scripts/v22_1_tabport_v2_hybrid.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  tabport-v2-hybrid:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      BACKTEST_RUN_ID: '33420487572'
      HISTORY_RUN_ID: '33393842087'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install TABPORT v2 runtime
        run: python -m pip install --prefer-binary "pandas>=2.2" "numpy>=2.0" "scikit-learn>=1.8" "pyarrow>=18"
      - name: Download governed signal ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKTEST_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("v22-1-historical-weekly-backtest-")) | .name' | head -n1)"
          test -n "$artifact" || { echo "BLOCK_TABPORT_V2_DATA: governed backtest artifact missing"; exit 1; }
          gh run download "$BACKTEST_RUN_ID" -n "$artifact" -D inputs
          test -f inputs/V22_1_TRAIN.csv && test -f inputs/V22_1_HOLDOUT.csv || { echo "BLOCK_TABPORT_V2_DATA: train/holdout ledger missing"; exit 1; }
      - name: Download governed repaired OHLC history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${HISTORY_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("pea-history-2010-2026-")) | .name' | head -n1)"
          test -n "$artifact" || { echo "BLOCK_TABPORT_V2_DATA: repaired history artifact missing"; exit 1; }
          gh run download "$HISTORY_RUN_ID" -n "$artifact" -D history
          test -f history/PEA_OHLCV_2010_2026_CONSOLIDATED.parquet || { echo "BLOCK_TABPORT_V2_DATA: consolidated OHLC parquet missing"; exit 1; }
      - name: Run TABPORT v2 hybrid simulation
        run: |
          python scripts/v22_1_tabport_v2_hybrid.py \
            --input-dir inputs \
            --price-parquet history/PEA_OHLCV_2010_2026_CONSOLIDATED.parquet \
            --out-dir outputs/tabport_v2
      - name: Publish TABPORT v2 summary
        shell: bash
        run: |
          echo '## TABPORT V2 - pre2023-selected hybrid' >> "$GITHUB_STEP_SUMMARY"
          echo '### Config and validation policy' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/tabport_v2/TABPORT_V2_CONFIG.json >> "$GITHUB_STEP_SUMMARY"
          echo '### Overall' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/tabport_v2/TABPORT_V2_SUMMARY.csv >> "$GITHUB_STEP_SUMMARY"
          echo '### Annual' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/tabport_v2/TABPORT_V2_ANNUAL.csv >> "$GITHUB_STEP_SUMMARY"
          echo '### Quarterly' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/tabport_v2/TABPORT_V2_QUARTERLY.csv >> "$GITHUB_STEP_SUMMARY"
          echo '### Robustness +0.10% slippage per side' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/tabport_v2/TABPORT_V2_ROBUSTNESS.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v22-1-tabport-v2-hybrid-${{ github.run_id }}
          path: outputs/tabport_v2/
          if-no-files-found: error
          retention-days: 30
