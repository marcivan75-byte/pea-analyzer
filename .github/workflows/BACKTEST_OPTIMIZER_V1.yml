name: BACKTEST_OPTIMIZER_V1

on:
  workflow_dispatch:
    inputs:
      horizon_days:
        description: "Forward horizon in calendar days"
        required: false
        default: "28"
        type: string
      artifact_limit:
        description: "Maximum historical committee artifacts to inspect"
        required: false
        default: "100"
        type: string
  schedule:
    - cron: "30 17 * * 5"

permissions:
  contents: read
  actions: read

concurrency:
  group: backtest-optimizer-v1
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validated dependency set
        run: pip install -c constraints-ci.txt -e .[test]

      - name: Validate optimizer module
        run: |
          python -m compileall -q src tests
          ruff check --select E9,F63,F7,F82 src/v182/backtest_optimizer tests/test_backtest_optimizer_v1.py
          pytest -q tests/test_backtest_optimizer_v1.py

      - name: Collect point-in-time committee artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_LIMIT: ${{ inputs.artifact_limit || '100' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/backtest-history
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired == false) | select((.name | startswith("V20.4-GitOK-end-to-end-")) or (.name | startswith("V20.4-GitOK-full-cycle-")) or (.name | startswith("V20.7"))) | [.id,.workflow_run.id,.created_at,.name] | @tsv' \
            | head -n "${ARTIFACT_LIMIT}" > /tmp/backtest-artifacts.tsv || true
          while IFS=$'\t' read -r ARTIFACT_ID RUN_ID CREATED_AT ARTIFACT_NAME; do
            [ -n "${ARTIFACT_ID:-}" ] || continue
            CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""' 2>/dev/null || true)
            [ "$CONCLUSION" = "success" ] || continue
            SNAPSHOT_DATE="${CREATED_AT:0:10}"
            DEST="/tmp/backtest-history/${SNAPSHOT_DATE}__${RUN_ID}"
            mkdir -p "$DEST"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$DEST/artifact.zip" || continue
            unzip -oq "$DEST/artifact.zip" -d "$DEST/extract" || continue
            find "$DEST/extract" -type f -name '*ACTIONS*DECISIONS*.csv' -exec cp '{}' "$DEST/" ';'
            rm -rf "$DEST/extract" "$DEST/artifact.zip"
          done < /tmp/backtest-artifacts.tsv
          echo "Archived rich action snapshots: $(find /tmp/backtest-history -type f -name '*.csv' | wc -l)"

      - name: Apply requested horizon without mutating repository
        env:
          HORIZON_DAYS: ${{ inputs.horizon_days || '28' }}
        run: |
          cp config/BACKTEST_OPTIMIZER_V1.json /tmp/backtest-config.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/tmp/backtest-config.json')
          cfg=json.loads(p.read_text())
          cfg['horizon_days']=int(os.environ['HORIZON_DAYS'])
          p.write_text(json.dumps(cfg,indent=2)+'\n')
          PY

      - name: Run optimizer
        run: |
          python -m v182.backtest_optimizer.run \
            --input /tmp/backtest-history \
            --config /tmp/backtest-config.json \
            --output-dir outputs/backtest_optimizer

      - name: Publish optimizer summary
        if: always()
        run: |
          if [ -s outputs/backtest_optimizer/SUMMARY.md ]; then
            cat outputs/backtest_optimizer/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BACKTEST_OPTIMIZER_V1 produced no summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload optimizer evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: BACKTEST_OPTIMIZER_V1-${{ github.run_id }}
          path: outputs/backtest_optimizer/**
          if-no-files-found: warn
          retention-days: 90
