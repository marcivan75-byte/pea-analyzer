name: HEBDO AT META 2010-2026 access

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - 'v182/hebdo/meta_price_history.py'
      - 'v182/hebdo/tabport_historical.py'
      - '.github/workflows/hebdo_at_meta_2010_2026_access.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-access:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --prefer-binary pandas numpy pyarrow
      - name: Compile historical loaders
        run: python -m py_compile v182/hebdo/meta_price_history.py v182/hebdo/tabport_historical.py
      - name: Restore governed 2023-2026 holdout cache
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Download governed PRE2023 corpus
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9817322742'
        run: |
          mkdir -p inputs/pre2023
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/pre2023.zip
          unzip -q /tmp/pre2023.zip -d inputs/pre2023
          test -s inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet
          test -s inputs/pre2023/PRE2023_YAHOO_CORPUS_MANIFEST.json
          test -d data/cache/actions
      - name: Validate and quarantine 2010-2026 data quality
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from v182.hebdo.meta_price_history import load_pre2023_development, load_holdout, load_2010_2026, assert_fit_window

          dev = load_pre2023_development('inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet','inputs/pre2023/PRE2023_YAHOO_CORPUS_MANIFEST.json')
          hold = load_holdout('data/cache/actions')
          combined = load_2010_2026('inputs/pre2023/PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet','inputs/pre2023/PRE2023_YAHOO_CORPUS_MANIFEST.json','data/cache/actions')
          assert_fit_window(dev)
          try:
              assert_fit_window(hold.head(1))
          except ValueError as exc:
              if 'BLOCK_META_FIT_HOLDOUT_ACCESS' not in str(exc): raise
          else:
              raise SystemExit('BLOCK_META_HOLDOUT_FIT_GUARD_MISSING')

          required = ['date','ticker','open','high','low','close','volume']
          for name, frame in [('development',dev),('holdout',hold),('combined',combined)]:
              miss=[c for c in required if c not in frame.columns]
              if miss: raise SystemExit(f'BLOCK_META_REQUIRED_COLUMNS:{name}:{miss}')
              if frame[['date','ticker','volume']].isna().any().any(): raise SystemExit(f'BLOCK_META_CORE_NULLS:{name}')
              if frame.duplicated(['ticker','date']).any(): raise SystemExit(f'BLOCK_META_DUPLICATE_TICKER_DATE:{name}')
              v=pd.to_numeric(frame['volume'],errors='coerce')
              if v.isna().any() or not np.isfinite(v.to_numpy(dtype='float64',na_value=np.nan)).all() or (v<0).any():
                  raise SystemExit(f'BLOCK_META_VOLUME_INVALID:{name}')

          def quality_flags(frame):
              x=frame.copy()
              vals={c:pd.to_numeric(x[c],errors='coerce') for c in ['open','high','low','close']}
              finite=np.ones(len(x),dtype=bool)
              positive=np.ones(len(x),dtype=bool)
              for c in vals:
                  a=vals[c].to_numpy(dtype='float64',na_value=np.nan)
                  finite &= np.isfinite(a)
                  positive &= (a>0)
              o,h,l,c=vals['open'],vals['high'],vals['low'],vals['close']
              geometry=(h>=l)&(h>=o)&(h>=c)&(l<=o)&(l<=c)
              x['invalid_price']=~(finite & positive)
              x['invalid_geometry']=~geometry.fillna(False).to_numpy()
              x['certified_ohlc_row']=~(x['invalid_price']|x['invalid_geometry'])
              x['zero_volume']=(pd.to_numeric(x['volume'],errors='coerce')==0)
              return x

          devq=quality_flags(dev)
          if (~devq['certified_ohlc_row']).any():
              raise SystemExit(f"BLOCK_META_DEVELOPMENT_OHLC_INVALID:{int((~devq['certified_ohlc_row']).sum())}")
          q=quality_flags(combined)
          q['year']=q['date'].dt.year
          years=sorted(q['year'].unique().tolist())
          if years != list(range(2010,2027)): raise SystemExit(f'BLOCK_META_YEAR_GAP:{years}')

          annual=q.groupby('year',as_index=False).agg(
              rows=('ticker','size'),
              tickers=('ticker','nunique'),
              certified_ohlc_rows=('certified_ohlc_row','sum'),
              invalid_price_rows=('invalid_price','sum'),
              invalid_geometry_rows=('invalid_geometry','sum'),
              zero_volume_rows=('zero_volume','sum'),
              median_volume=('volume','median'),
              first_date=('date','min'),
              last_date=('date','max'),
          )
          annual['certified_ohlc_pct']=(100*annual['certified_ohlc_rows']/annual['rows']).round(6)
          annual['zero_volume_pct']=(100*annual['zero_volume_rows']/annual['rows']).round(6)
          annual['positive_volume_pct']=(100-annual['zero_volume_pct']).round(6)

          anomalies=q.loc[~q['certified_ohlc_row'],['date','ticker','open','high','low','close','segment','invalid_price','invalid_geometry']].copy()
          anomalies['reason_code']=np.where(anomalies['invalid_price'],'INVALID_NONPOSITIVE_OR_NONFINITE_PRICE','INVALID_OHLC_GEOMETRY')

          out=Path('outputs/meta_2010_2026'); out.mkdir(parents=True,exist_ok=True)
          annual.to_csv(out/'HEBDO_AT_META_DATA_QUALITY_BY_YEAR.csv',index=False)
          anomalies.to_csv(out/'HEBDO_AT_META_OHLC_QUARANTINE.csv',index=False)
          print('YEARLY_DATA_QUALITY_BEGIN')
          print(annual.to_csv(index=False).strip())
          print('YEARLY_DATA_QUALITY_END')
          print('OHLC_QUARANTINE_BEGIN')
          print(anomalies.head(200).to_csv(index=False).strip())
          print('OHLC_QUARANTINE_END')

          summary={
              'status':'OK_WITH_QUARANTINE' if len(anomalies) else 'OK',
              'access_window':'2010-2026',
              'development_rows':int(len(dev)),
              'development_tickers':int(dev['ticker'].nunique()),
              'holdout_rows':int(len(hold)),
              'holdout_tickers':int(hold['ticker'].nunique()),
              'combined_rows':int(len(combined)),
              'combined_tickers':int(combined['ticker'].nunique()),
              'combined_min_date':str(combined['date'].min()),
              'combined_max_date':str(combined['date'].max()),
              'all_years_2010_2026_present':True,
              'duplicate_ticker_dates':0,
              'combined_volume_nonnull_pct':100.0,
              'combined_zero_volume_rows':int(q['zero_volume'].sum()),
              'combined_zero_volume_pct':round(100*q['zero_volume'].mean(),6),
              'ohlc_quarantine_rows':int(len(anomalies)),
              'certified_ohlc_rows':int(q['certified_ohlc_row'].sum()),
              'certified_ohlc_pct':round(100*q['certified_ohlc_row'].mean(),6),
              'fit_holdout_blocked':True,
              'volume_basis':'RAW_MARKET_VOLUME_UNADJUSTED',
              'pre2023_price_basis':'YAHOO_ADJ_CLOSE_RATIO_OHLC',
              'historical_universe_certified':False,
              'survivorship_safe':False,
              'historical_pea_eligibility_certified':False,
              'retuning_with_holdout':False,
          }
          (out/'HEBDO_AT_META_2010_2026_ACCESS.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY
      - name: Upload access evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hebdo-at-meta-2010-2026-access-${{ github.run_id }}
          path: outputs/meta_2010_2026/
          if-no-files-found: warn
          retention-days: 30
