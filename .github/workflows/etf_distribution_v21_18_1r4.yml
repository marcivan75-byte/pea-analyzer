name: ETF V21.18.1R4 distribution validation

on:
  pull_request:
    paths:
      - "packages/PACKAGE_ETF_V21_18_1R4_DISTRIBUTION_COMPLETE/**"
      - "src/v182/etf/**"
      - "tests/test_etf_ter_assets_governance.py"
      - ".github/workflows/etf_distribution_v21_18_1r4.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/PACKAGE_ETF_V21_18_1R4_DISTRIBUTION_COMPLETE
    env:
      SOURCE_DATE_EPOCH: "1787270400"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/PACKAGE_ETF_V21_18_1R4_DISTRIBUTION_COMPLETE/pyproject.toml
      - name: Install package and audit tools
        run: python -m pip install -e ".[test]"
      - name: Validate governed TER/assets gate
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q tests/test_etf_ter_assets_governance.py
      - name: Validate package integrity governance and schemas
        run: python tools/validate_package.py --json-report validation_report.json
      - name: Confirm strict canonical-source gate remains closed
        run: |
          if python tools/validate_package.py --strict; then
            echo "Strict validation unexpectedly passed"
            exit 1
          fi
          echo "Expected fail-closed canonical source gate confirmed"
      - name: Unit and security regression tests
        run: python -m pytest -q
      - name: Static quality and compilation checks
        run: |
          python -m ruff check src tests tools
          python -m mypy src/etf_pack tools/validate_package.py
          python -m compileall -q src tools
      - name: Build deterministic distributions
        run: |
          python -m pip wheel . --no-deps -w dist-a
          python -m pip wheel . --no-deps -w dist-b
          test "$(sha256sum dist-a/*.whl | cut -d' ' -f1)" = "$(sha256sum dist-b/*.whl | cut -d' ' -f1)"
      - name: Upload validated wheel and report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: etf-pack-v21-18-1r4
          path: |
            packages/PACKAGE_ETF_V21_18_1R4_DISTRIBUTION_COMPLETE/dist-a/*.whl
            packages/PACKAGE_ETF_V21_18_1R4_DISTRIBUTION_COMPLETE/validation_report.json
          if-no-files-found: error
          retention-days: 30
