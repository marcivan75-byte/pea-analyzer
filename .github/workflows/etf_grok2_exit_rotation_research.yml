name: ETF GROK2 Exit Rotation Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/ETF_GROK2_EXIT_RESEARCH_V1.json'
      - 'src/v182/backtest/etf_grok2_exit_rotation_research.py'
      - 'tests/test_etf_grok2_exit_rotation_research.py'
      - '.github/workflows/etf_grok2_exit_rotation_research.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - name: Unit tests
        run: pytest -q tests/test_etf_grok2_exit_rotation_research.py tests/test_etf_grok2_cdc.py
      - name: Compile
        run: python -m py_compile src/v182/backtest/etf_grok2_exit_rotation_research.py
      - name: Build hardened ETF base
        run: python -m v182.backtest.etf_backtest_base_v1
      - name: Run exit and rotation portfolio research
        run: python -m v182.backtest.etf_grok2_exit_rotation_research
      - name: Validate governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/etf_grok2_exit_rotation_research/SUMMARY.json')
          d=json.loads(p.read_text())
          assert d['take_profit_fixed_pct_used'] is False
          assert d['promotion_eligible'] is False
          assert d['real_orders_allowed'] is False
          assert len(d['variants']) == 4
          assert d['world_benchmark']['isin'] == 'LU1681043599'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ETF_GROK2_EXIT_ROTATION_RESEARCH
          path: outputs/etf_grok2_exit_rotation_research/
