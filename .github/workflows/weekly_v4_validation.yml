name: V4 Hebdo validation

on:
  push:
    branches: ["codex/weekly-v4-five-audit"]
  pull_request:
    paths:
      - "config/WEEKLY_V4_*.json"
      - "src/v182/audit/weekly_v4_*.py"
      - "src/v182/reporting/*v4.py"
      - "src/v182/sources/*.py"
      - "scripts/audit_v4_sources_live.py"
      - "scripts/audit_v4_runtime_optimization.py"
      - "tests/test_*v4*.py"
      - ".github/workflows/weekly_v4_validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-v4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
      BASELINE_ARTIFACT_ID: "9516854863"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project and audit tools
        run: python -m pip install -c constraints-ci.txt -e ".[test]"
      - name: Static and complete test validation
        run: |
          ruff check src tests
          python -m compileall -q src scripts
          python -m pytest -q
      - name: Restore frozen 15-instrument reference artifact
        shell: bash
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" > baseline.zip
          unzip -oq baseline.zip
          test -s outputs/committee_master/CI_ENTRY_WATCH_V22_2.csv
          test "$(python - <<'PY'
          import pandas as pd
          print(len(pd.read_csv('outputs/committee_master/CI_ENTRY_WATCH_V22_2.csv', sep=';')))
          PY
          )" = "15"
          python scripts/materialize_v4_frozen_upstream.py outputs/committee_master/CI_ENTRY_WATCH_V22_2.csv
      - name: Governance and descriptive calibration audits
        run: |
          python -m v182.audit.weekly_v4_governance
          python - <<'PY'
          from pathlib import Path
          from v182.audit.weekly_v4_calibration import run
          result = run(Path.cwd(), candidate_path=Path('outputs/committee_master/CI_ENTRY_WATCH_V22_2.csv'))
          assert result['status'] == 'PASS', result
          PY
      - name: Bounded live Boursorama and TradingView audit
        run: python scripts/audit_v4_sources_live.py outputs/committee_master/CI_ENTRY_WATCH_V22_2.csv
      - name: Publish CI Light V4
        run: |
          python - <<'PY'
          from pathlib import Path
          from v182.reporting.ci_selection_gate_v4 import run
          audit = run(Path.cwd(), ensure_upstream=False)
          assert audit['status'] == 'SUCCESS', audit
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          from v182.reporting.ci_light_v4 import run
          result = run(Path.cwd(), reuse_selection_context=True)
          assert result['status'] == 'SUCCESS', result
          audit = json.loads(Path('outputs/audit/CI_LIGHT_V4.json').read_text(encoding='utf-8'))
          assert audit['status'] == 'SUCCESS', audit
          assert audit['input_rows'] == 15, audit
          assert audit['investing_enabled'] is False, audit
          assert audit['etf_rules']['analyst_consensus_required'] is False, audit
          assert audit['source_can_create_candidate'] is False, audit
          assert audit['source_context_reused'] is True, audit
          assert audit['source_collection_passes'] == 0, audit
          PY
      - name: Runtime equivalence audit
        run: python scripts/audit_v4_runtime_optimization.py --iterations 1
      - name: Build deterministic V4 release package
        run: python scripts/build_weekly_v4_package.py outputs/releases/WEEKLY_V4_HEBDO --release-commit "${GITHUB_SHA}"
      - name: Upload V4 validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weekly-v4-validation-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            outputs/audit/WEEKLY_V4_*.json
            outputs/audit/CI_LIGHT_V4.json
            outputs/committee_master/CI_LIGHT_V4.csv
            outputs/committee_master/CI_LIGHT_REJECTED_V4.csv
            outputs/committee_master/CI_LIGHT_V4.xlsx
            outputs/committee_master/CI_SELECTION_ALL_V4.csv
            outputs/mobile/ANDROID_CI_LIGHT_V4.md
            outputs/source_context/CI_LIGHT_V4_V4_SOURCE_*.csv
            outputs/releases/WEEKLY_V4_HEBDO/**
            outputs/releases/WEEKLY_V4_HEBDO.zip
