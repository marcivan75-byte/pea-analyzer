name: Maintenance - Patch Actions 3609 Source

on:
  push:
    branches: [feature/smart-money-v1]
    paths: [.github/workflows/_maintenance_patch_actions3609.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/smart-money-v1
          fetch-depth: 0
      - name: Patch unique V20.4 workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/V20.4_gitok_end_to_end.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('      - "data/external/ACTIONS_PEA_3609_LATEST.xlsx"\n', '      - "data/external/ACTIONS_PEA_3609_LATEST.xlsx"\n      - "data/external/ACTIONS_PEA_3609_LATEST.csv.gz"\n      - "src/v182/decision/actions_universe_3609_csv_runner.py"\n')
          s=s.replace('if [ -s data/external/ACTIONS_PEA_3609_LATEST.xlsx ]; then', 'if [ -s data/external/ACTIONS_PEA_3609_LATEST.csv.gz ]; then')
          s=s.replace('ACTIONS_3609_SOURCE_MISSING: independent 18:00 updater must publish data/external/ACTIONS_PEA_3609_LATEST.xlsx', 'ACTIONS_3609_SOURCE_MISSING: independent 18:00 updater must publish data/external/ACTIONS_PEA_3609_LATEST.csv.gz')
          s=s.replace('V204_ACTIONS_3609_SOURCE: data/external/ACTIONS_PEA_3609_LATEST.xlsx', 'V204_ACTIONS_3609_SOURCE: data/external/ACTIONS_PEA_3609_LATEST.csv.gz')
          s=s.replace('run: python -m v182.decision.actions_universe_3609_policy', 'run: python -m v182.decision.actions_universe_3609_csv_runner')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/V20.4_gitok_end_to_end.yml
          git diff --cached --quiet && exit 0
          git commit -m "[v20.4] Use canonical CSV.GZ source for 3609 actions"
          git push origin HEAD:feature/smart-money-v1
