name: HEBDO AT META validation

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - 'v182/**'
      - 'tests/test_hebdo_at_meta.py'
      - 'tests/test_backtest_B_v2.py'
      - 'tests/test_pit_loader_meta.py'
      - '.github/workflows/hebdo_at_meta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hebdo-at-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install runtime
        run: |
          python -m pip install --prefer-binary -r requirements-runtime.txt
          python -m pip install pytest scikit-learn scipy
      - name: Compile Meta modules
        run: python -m compileall -q v182
      - name: Run HEBDO AT META tests
        run: python -m pytest -q tests/test_backtest_B_v2.py tests/test_hebdo_at_meta.py tests/test_pit_loader_meta.py
