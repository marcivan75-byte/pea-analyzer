name: TCT reverse inventory +20pct adjusted 2010-2026

on:
  push:
    branches: [v22/pit-mae-mfe-preopen]
    paths: [".github/workflows/tct_reverse_inventory_20pct_adjusted.yml"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  inventory-adjusted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install runtime
        run: python -m pip install --prefer-binary -r requirements-runtime.txt
      - name: Download governed history
        run: |
          mkdir -p inputs/history
          gh run download 33393842087 -n pea-history-2010-2026-33393842087 -D inputs/history
      - name: Compute adjusted-price inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import pandas as pd

          src=Path('inputs/history/PEA_OHLCV_2010_2026_CONSOLIDATED.parquet')
          out=Path('outputs/tct_reverse_inventory_20pct_adjusted'); out.mkdir(parents=True,exist_ok=True)
          cols=['date','asset_class','isin','ticker','close','adj_close','high','stock_splits','origin']
          d=pd.read_parquet(src,columns=cols)
          d['date']=pd.to_datetime(d['date'],errors='coerce')
          d=d[d.asset_class.eq('ACTION')].copy()
          for c in ['close','adj_close','high','stock_splits']:
              d[c]=pd.to_numeric(d[c],errors='coerce')
          d=d.dropna(subset=['date','isin','ticker','close']).sort_values(['isin','date']).drop_duplicates(['isin','date'],keep='last')
          d['adj_valid']=d['adj_close'].gt(0)
          d['year']=d.date.dt.year
          cov=(d.groupby('year').agg(action_universe=('isin','nunique'),rows=('isin','size'),rows_adj_valid=('adj_valid','sum'),actions_with_adj=('isin',lambda s: d.loc[s.index & d.index if False else s.index,'isin'].nunique())).reset_index())
          # correct actions_with_adj explicitly
          aw=d[d.adj_valid].groupby('year')['isin'].nunique().rename('actions_with_adj').reset_index()
          cov=cov.drop(columns=['actions_with_adj']).merge(aw,on='year',how='left').fillna({'actions_with_adj':0})
          cov['adj_row_coverage_pct']=100*cov.rows_adj_valid/cov.rows
          cov['adj_action_coverage_pct']=100*cov.actions_with_adj/cov.action_universe
          cov.to_csv(out/'TCT_ADJ_PRICE_COVERAGE.csv',index=False)

          x=d[d.adj_valid].copy()
          horizons=(4,10,20)
          chunks=[]
          for (isin,ticker),g0 in x.groupby(['isin','ticker'],sort=False):
              g=g0.sort_values('date').reset_index(drop=True)
              p=g.adj_close.to_numpy(float); n=len(g)
              for H in horizons:
                  fmax=np.full(n,np.nan); first=np.full(n,np.nan); hdate=np.full(n,np.datetime64('NaT'),dtype='datetime64[ns]')
                  for i in range(n-1):
                      vals=p[i+1:min(n,i+H+1)]
                      if len(vals)==0 or not np.isfinite(vals).any(): continue
                      fmax[i]=np.nanmax(vals)
                      hits=np.flatnonzero(vals>p[i]*1.20)
                      if len(hits):
                          k=int(hits[0]); first[i]=k+1; hdate[i]=g.loc[i+1+k,'date'].to_datetime64()
                  gain=fmax/p-1
                  hit=gain>0.20
                  if hit.any():
                      chunks.append(pd.DataFrame({'isin':isin,'ticker':ticker,'entry_date':g.loc[hit,'date'].to_numpy(),'entry_year':g.loc[hit,'date'].dt.year.to_numpy(),'horizon_sessions':H,'entry_adj_close':p[hit],'max_future_adj_close_gain':gain[hit],'first_hit_sessions':first[hit],'first_hit_date':hdate[hit]}))
          ev=pd.concat(chunks,ignore_index=True) if chunks else pd.DataFrame()
          ev=ev.sort_values(['entry_year','horizon_sessions','ticker','entry_date'])
          ev.to_csv(out/'TCT_PLUS20_EVENTS_ADJ_CLOSE.csv',index=False)
          names=(ev.groupby(['entry_year','horizon_sessions','isin','ticker'],as_index=False).agg(first_event_date=('entry_date','min'),event_start_dates=('entry_date','nunique'),best_adj_close_gain=('max_future_adj_close_gain','max'),fastest_hit_sessions=('first_hit_sessions','min')))
          names.to_csv(out/'TCT_PLUS20_DISTINCT_WINNERS_ADJ_BY_YEAR_HORIZON.csv',index=False)
          annual=(ev.groupby(['entry_year','horizon_sessions'])['isin'].nunique().rename('distinct_winners').reset_index().pivot(index='entry_year',columns='horizon_sessions',values='distinct_winners').fillna(0).astype(int).rename(columns={4:'plus20_within_4_sessions',10:'plus20_within_10_sessions',20:'plus20_within_20_sessions'}).reset_index().rename(columns={'entry_year':'year'}))
          summary=cov[['year','action_universe','actions_with_adj','adj_action_coverage_pct']].merge(annual,on='year',how='left').fillna(0)
          for c in ['plus20_within_4_sessions','plus20_within_10_sessions','plus20_within_20_sessions']:
              summary[c]=summary[c].astype(int)
          summary.to_csv(out/'TCT_PLUS20_ANNUAL_SUMMARY_ADJ.csv',index=False)
          audit={'definition_primary':'adjusted close J0 to any future adjusted close in next H trading observations strictly > +20%','source_run_id':33393842087,'asset_class':'ACTION only','period':[str(x.date.min().date()),str(x.date.max().date())],'rows_adj_valid':int(len(x)),'unique_actions_with_adj':int(x['isin'].nunique()),'global_distinct_winners':{str(H):int(ev.loc[ev.horizon_sessions.eq(H),'isin'].nunique()) for H in horizons},'nested_4_in_10':bool(set(ev.loc[ev.horizon_sessions.eq(4),'isin'])<=set(ev.loc[ev.horizon_sessions.eq(10),'isin'])),'nested_10_in_20':bool(set(ev.loc[ev.horizon_sessions.eq(10),'isin'])<=set(ev.loc[ev.horizon_sessions.eq(20),'isin'])),'known_limit':'2010-2019 source is current-universe ticker reconstruction; identity/ticker-reuse governance still required before model training'}
          (out/'TCT_PLUS20_ADJ_AUDIT.json').write_text(json.dumps(audit,indent=2),encoding='utf-8')
          print(summary.to_string(index=False)); print(json.dumps(audit,indent=2))
          PY
      - name: Upload adjusted inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tct-reverse-inventory-plus20-adjusted-${{ github.run_id }}
          path: outputs/tct_reverse_inventory_20pct_adjusted/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
