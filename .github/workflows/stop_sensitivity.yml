name: ETF stop-loss sensitivity study

on:
  workflow_dispatch:
  push:
    branches: [agent/v21-6-3-cdc-postselection]
    paths:
      - ".github/workflows/stop_sensitivity.yml"

concurrency:
  group: etf-stop-sensitivity-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stop-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run ETF stop sensitivity without final holdout
        run: python -m v182.backtest.stop_sensitivity
      - name: Show sensitivity metrics
        if: always()
        run: |
          if [ -f outputs/backtest/stop_sensitivity_2026_08_15/ETF_STOP_SENSITIVITY_METRICS.csv ]; then
            cat outputs/backtest/stop_sensitivity_2026_08_15/ETF_STOP_SENSITIVITY_METRICS.csv
          fi
      - name: Upload stop sensitivity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-stop-sensitivity-${{ github.run_id }}
          path: outputs/backtest/stop_sensitivity_2026_08_15/
          if-no-files-found: warn
          retention-days: 30
