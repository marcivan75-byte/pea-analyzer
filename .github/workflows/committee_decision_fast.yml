name: PEA Decision Brief Fast V1

on:
  workflow_dispatch:
    inputs:
      max_artifact_age_hours:
        description: Maximum age of the last successful global artifact
        required: true
        default: "192"

concurrency:
  group: committee-decision-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  decision-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Restore fresh inputs from latest successful global run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m v182.ci.restore_decision_inputs
          --max-age-hours "${{ inputs.max_artifact_age_hours }}"
        shell: bash
      - name: Build synthetic decision brief
        run: python -m v182.reporting.decision_brief
      - name: Publish decision brief
        run: cat outputs/decision_brief/DECISION_BRIEF.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compact decision package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: decision-brief-fast-${{ github.run_id }}
          path: outputs/decision_brief/
          if-no-files-found: error
          retention-days: 7

