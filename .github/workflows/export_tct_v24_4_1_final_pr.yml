name: Export TCT V24.4.1 final package on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release manifest and governance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'docs/TCT_RELEASE_MANIFEST_V24_4_1.json').read_text(encoding='utf-8'))
          missing = []
          for section in manifest['python'].values():
              for path in section:
                  if not (root / path).is_file():
                      missing.append(path)
          for section in ('config', 'workflows', 'documentation', 'tests_required'):
              for path in manifest[section]:
                  if not (root / path).is_file():
                      missing.append(path)
          if missing:
              raise SystemExit('Missing manifest files: ' + ', '.join(missing))

          cfg31 = json.loads((root / 'config/TCT_V24_3_1_DAILY_TRADER_SHADOW.json').read_text(encoding='utf-8'))
          cfg41 = json.loads((root / 'config/TCT_V24_4_1_CATALYST_CONTEXT_SHADOW.json').read_text(encoding='utf-8'))
          gates = json.loads((root / 'config/TCT_V24_4_1_VALIDATION_GATES.json').read_text(encoding='utf-8'))
          for label, weights in [
              ('entry', cfg31['entry_weights']),
              ('exit', cfg31['exit_risk_weights']),
              ('movement', cfg41['movement_potential_weights']),
              ('direction', cfg41['direction_weights']),
          ]:
              total = sum(float(v) for v in weights.values())
              if abs(total - 1.0) > 1e-9:
                  raise SystemExit(f'{label} weights sum to {total}, expected 1.0')
          gov = cfg41['governance']
          assert float(gov['decision_influence']) == 0.0
          assert float(gov['score_influence']) == 0.0
          assert float(gov['sizing_influence']) == 0.0
          assert float(gov['stop_loss_influence']) == 0.0
          assert gov['real_orders_enabled'] is False
          assert gov['holdout_locked'] is True
          assert gates['validation_epoch'] == 'V24.4.1_ONLY_NO_MIX_WITH_V24.4.0'
          assert gates['governance']['promotion_authority'] is False
          print('TCT V24.4.1 release manifest/governance validation: SUCCESS')
          PY

      - name: Build audited TCT reference package
        run: |
          set -euo pipefail
          ROOT=TCT_V24_4_1_FINAL_AUDITED
          rm -rf "$ROOT" TCT_V24_4_1_FINAL_AUDITED.zip
          mkdir -p "$ROOT/CDC" "$ROOT/REFERENTIEL" "$ROOT/AUDIT" "$ROOT/CODE/src" "$ROOT/CONFIG" "$ROOT/WORKFLOWS" "$ROOT/TESTS" "$ROOT/MANIFEST"

          # Complete Python runtime snapshot for dependency-safe code review.
          cp -r src/v182 "$ROOT/CODE/src/"
          cp pyproject.toml "$ROOT/CODE/"

          # Requested normative deliverables.
          cp docs/TCT_CDC_V24_4_1_FINAL.md "$ROOT/CDC/"
          cp docs/TCT_REFERENTIEL_V24_4_1_FINAL.md "$ROOT/REFERENTIEL/"
          cp docs/TCT_AUDIT_V24_4_1_2026-08-21.md "$ROOT/AUDIT/"
          cp docs/PROCESS_REFERENCE_V21_8_1_TCT_V24_4_1_ADDENDUM.md "$ROOT/REFERENTIEL/"
          cp docs/PROCESS_REFERENCE_V21_8_1_FINAL.md "$ROOT/REFERENTIEL/"
          if [ -f docs/PROCESS_GOVERNANCE_STATUS_2026_08_20.md ]; then
            cp docs/PROCESS_GOVERNANCE_STATUS_2026_08_20.md "$ROOT/REFERENTIEL/"
          fi
          cp docs/TCT_RELEASE_MANIFEST_V24_4_1.json "$ROOT/MANIFEST/"

          # Exact TCT configurations.
          for f in \
            config/TCT_V24_1_7_SHADOW.json \
            config/TCT_V24_3_0_DAILY_TRADER_SHADOW.json \
            config/TCT_V24_3_1_DAILY_TRADER_SHADOW.json \
            config/TCT_V24_4_1_CATALYST_CONTEXT_SHADOW.json \
            config/TCT_V24_4_1_VALIDATION_GATES.json; do
            cp "$f" "$ROOT/CONFIG/"
          done

          # Active orchestration.
          cp .github/workflows/committee_tct_ct_daily.yml "$ROOT/WORKFLOWS/"
          cp .github/workflows/tct_next_session_context.yml "$ROOT/WORKFLOWS/"

          # All TCT-focused regression tests present at release.
          find tests -maxdepth 1 -type f \( -name 'test_tct*.py' -o -name 'test_daily_tct_ct*.py' \) -print0 | sort -z | xargs -0 -I{} cp '{}' "$ROOT/TESTS/"

          cat > "$ROOT/README_DOWNLOAD.md" <<'EOF'
          # TCT V24.4.1 — paquet final audité

          Contenu principal :
          - `CDC/TCT_CDC_V24_4_1_FINAL.md` : cahier des charges complet et détaillé ;
          - `REFERENTIEL/TCT_REFERENTIEL_V24_4_1_FINAL.md` : référentiel TCT actualisé ;
          - `CODE/src/v182/` : snapshot Python complet du runtime V182 afin de conserver les dépendances nécessaires à la lecture/exécution du code TCT ;
          - `CONFIG/` : configurations TCT V24.1.7, V24.3.x et V24.4.1 ;
          - `WORKFLOWS/` : workflows daily et PREOPEN/POSTMARKET ;
          - `TESTS/` : tests TCT du dépôt au moment de la livraison ;
          - `AUDIT/` : rapport des anomalies détectées et corrigées ;
          - `MANIFEST/` et `SHA256SUMS.txt` : inventaire et contrôle d'intégrité.

          Source fonctionnelle : main commit `63f64aa90a9a6aa29f60084ebfd0f6447c506d81`.

          Gouvernance : V24.4.1 reste SHADOW_RESEARCH_ONLY ; production V21.8.1 inchangée ; T1/T2 Actions TCT uniquement ; aucun ordre réel ; aucun 1m/5m ; holdout final fermé.

          Le paquet exclut volontairement secrets, `.env`, caches de marché, outputs de run et ledgers PIT contenant des observations de marché.
          EOF

          cat > "$ROOT/CI_VALIDATION.txt" <<'EOF'
          Committee Master run 32456059692: SUCCESS
          - compile all Python/tests: SUCCESS
          - Ruff: SUCCESS
          - static Python safety audit: SUCCESS
          - master data integrity: SUCCESS
          - referential/governance integrity: SUCCESS
          - full pytest suite: SUCCESS

          Action Identity Hydration run 32456059659: SUCCESS
          - static/unit validation: SUCCESS
          - frozen governed overlay: SUCCESS
          - full suite: SUCCESS
          EOF

          printf '%s\n' '63f64aa90a9a6aa29f60084ebfd0f6447c506d81' > "$ROOT/SOURCE_COMMIT.txt"

          python -m compileall -q "$ROOT/CODE/src" "$ROOT/TESTS"
          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS.txt"
          zip -qr TCT_V24_4_1_FINAL_AUDITED.zip "$ROOT"
          sha256sum TCT_V24_4_1_FINAL_AUDITED.zip > TCT_V24_4_1_FINAL_AUDITED.zip.sha256

      - name: Upload final TCT package
        uses: actions/upload-artifact@v4
        with:
          name: TCT_V24_4_1_FINAL_AUDITED
          path: |
            TCT_V24_4_1_FINAL_AUDITED.zip
            TCT_V24_4_1_FINAL_AUDITED.zip.sha256
          retention-days: 30
