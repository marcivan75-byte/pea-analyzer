name: TCT Reverse Engineering V1 Tests

on:
  push:
    branches:
      - agent/tct-reverse-engineering-v1
    paths:
      - 'src/v182/backtest/tct_reverse_engineering_v1*.py'
      - 'scripts/run_tct_reverse_engineering_v1.py'
      - 'tests/test_tct_reverse_engineering_v1*.py'
      - '.github/workflows/tct_reverse_engineering_v1_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test tooling
        run: pip install -e . pytest
      - name: Compile reverse-engineering engine
        run: python -m compileall -q src/v182/backtest/tct_reverse_engineering_v1.py src/v182/backtest/tct_reverse_engineering_v1_1.py scripts/run_tct_reverse_engineering_v1.py
      - name: Run targeted tests
        run: pytest -q tests/test_tct_reverse_engineering_v1.py tests/test_tct_reverse_engineering_v1_1.py
