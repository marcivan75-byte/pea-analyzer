name: V22.1 TABPORT pass 3 selective ranking

on:
  workflow_dispatch:
  push:
    branches: [v22/pit-mae-mfe-preopen]
    paths:
      - scripts/v22_1_selective_ranking_pass3.py
      - .github/workflows/v22_1_tabport_pass3.yml

permissions:
  contents: read
  actions: read

env:
  BACKTEST_RUN_ID: '33420487572'
  PASS2_RUN_ID: '33444844183'

jobs:
  selective-ranking:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: python -m pip install --prefer-binary 'pandas>=2.2' 'numpy>=2.0'
      - name: Download governed pre-2023 ledger and pass 2 report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs pass2
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BACKTEST_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("v22-1-historical-weekly-backtest-")) | .name' | head -n1)"
          test -n "$artifact" || { echo 'BLOCK_PASS3_DATA: governed artifact missing'; exit 1; }
          gh run download "$BACKTEST_RUN_ID" -n "$artifact" -D inputs
          p2="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PASS2_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("v22-1-hybrid-fp-")) | .name' | head -n1)"
          test -n "$p2" || { echo 'BLOCK_PASS3_DATA: pass2 artifact missing'; exit 1; }
          gh run download "$PASS2_RUN_ID" -n "$p2" -D pass2
          test -f inputs/V22_1_TRAIN.csv
          test -f pass2/HYBRID_FP_REPORT.json
      - name: Run selective ranking research
        run: python scripts/v22_1_selective_ranking_pass3.py --input-dir inputs --pass2-report pass2/HYBRID_FP_REPORT.json --out-dir outputs/pass3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v22-1-tabport-pass3-${{ github.run_id }}
          path: outputs/pass3
          if-no-files-found: error
