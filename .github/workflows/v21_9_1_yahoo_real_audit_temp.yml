name: TEMP V21.9.1 Yahoo ETF Real Audit

on:
  pull_request:
    branches: [main]

concurrency:
  group: v2191-yahoo-etf-real-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yahoo-etf-real-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PEA_PROVENANCE_PATH: state/provenance/OBSERVATION_PROVENANCE_V2191_YAHOO_ETF_AUDIT.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: pip install -e ".[test]"

      - name: Real Yahoo ETF collection and governed audit
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          import pandas as pd
          from v182.audit.master_data import audit_frame
          from v182.audit.master_data_profile import profile_frame
          from v182.io.frames import load_master, apply_observations, is_missing
          from v182.reporting.waves import resolve_etf_tickers, wave6_etf_info

          root=Path('.')
          out=root/'outputs'/'audit'/'v21_9_1_yahoo_etf_real'; out.mkdir(parents=True,exist_ok=True)
          cfg=json.loads((root/'config/V18.2_MASTER_CONFIG.json').read_text(encoding='utf-8'))
          etf=load_master(root/'inputs/V18.2_PEA_ETF_MASTER.csv')
          etf_resolved,etf_gaps=resolve_etf_tickers(etf,root/'config/V18.2_ETF_TICKER_MAP.csv')
          etf_obs,etf_failures=wave6_etf_info(etf_resolved,cfg)
          etf_enriched,etf_quarantine=apply_observations(etf,etf_obs)
          etf_detail,etf_profile=profile_frame(etf_enriched,'ETF')
          etf_integrity=audit_frame(etf_enriched,'ETF').summary

          def coverage(frame,field):
              if field not in frame.columns: return 0.0
              observed=int((~frame[field].map(is_missing)).sum())
              return round(observed/len(frame)*100.0,2) if len(frame) else 0.0

          obs_fields=pd.Series([str(row.get('field') or '') for row in etf_obs])
          payload={
              'generated_at_utc':datetime.now(timezone.utc).isoformat(),
              'rows':len(etf_enriched),
              'ticker_gaps':len(etf_gaps),
              'observations':len(etf_obs),
              'failures':len(etf_failures),
              'quarantined':len(etf_quarantine),
              'raw_expense_ratio_pct':coverage(etf_enriched,'annual_report_expense_ratio_yf'),
              'raw_total_assets_pct':coverage(etf_enriched,'total_assets_yf'),
              'quote_currency_pct':coverage(etf_enriched,'currency_yf'),
              'ter_pct':coverage(etf_enriched,'ter_pct'),
              'aum_m_pct':coverage(etf_enriched,'aum_m'),
              'fund_total_assets_eur_m_pct':coverage(etf_enriched,'fund_total_assets_eur_m'),
              'new_ter_observations':int((obs_fields=='ter_pct').sum()),
              'new_aum_observations':int((obs_fields=='aum_m').sum()),
              'new_fund_assets_eur_observations':int((obs_fields=='fund_total_assets_eur_m').sum()),
              'profile':etf_profile,
              'integrity':etf_integrity,
          }
          (out/'YAHOO_ETF_REAL_AUDIT.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          etf_detail.to_csv(out/'ETF_PROFILE.csv',sep=';',encoding='utf-8-sig',index=False)
          pd.DataFrame(etf_quarantine).to_csv(out/'ETF_QUARANTINE.csv',sep=';',encoding='utf-8-sig',index=False)
          pd.DataFrame(etf_failures).to_csv(out/'ETF_FAILURES.csv',sep=';',encoding='utf-8-sig',index=False)
          print(json.dumps(payload,ensure_ascii=False,indent=2,default=str))
          assert etf_integrity['issue_counts']['FATAL']==0
          assert payload['new_aum_observations']==0
          assert payload['new_fund_assets_eur_observations']==0
          PY

      - name: Full regression
        run: pytest -q

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-9-1-yahoo-etf-real-audit-${{ github.run_id }}
          path: outputs/audit/v21_9_1_yahoo_etf_real/
          if-no-files-found: error
          retention-days: 30
