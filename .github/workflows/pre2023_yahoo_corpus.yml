name: PRE2023 Yahoo development corpus

on:
  push:
    branches: [hebdo-at-meta]
    paths:
      - '.github/workflows/pre2023_yahoo_corpus.yml'
      - 'scripts/pre2023_yahoo_build_corpus.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore governed current OHLCV cache for identity bootstrap only
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: data/cache/
          key: ohlcv-v3-33132925283
          restore-keys: |
            ohlcv-v3-
      - name: Install corpus dependencies
        run: python -m pip install --prefer-binary pandas numpy pyarrow yfinance
      - name: Verify isolated corpus builder
        run: |
          python -m py_compile scripts/pre2023_yahoo_build_corpus.py
          if [ ! -d data/cache/actions ]; then
            echo 'BLOCK_PRE2023_CORPUS_CACHE: governed action cache unavailable'
            exit 2
          fi
          echo "CACHE_HIT=${{ steps.cache.outputs.cache-hit }}"
          echo "CACHE_MATCHED_KEY=${{ steps.cache.outputs.cache-matched-key }}"
      - name: Build Yahoo raw 2010-2022 fail-closed corpus
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/pre2023_yahoo_build_corpus.py \
            --cache-root data/cache/actions \
            --output-dir outputs/pre2023_yahoo_corpus \
            --batch-size 20 \
            --pause-seconds 0.25
      - name: Validate development corpus governance contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('outputs/pre2023_yahoo_corpus')
          manifest = json.loads((root/'PRE2023_YAHOO_CORPUS_MANIFEST.json').read_text(encoding='utf-8'))
          corpus = pd.read_parquet(root/'PRE2023_YAHOO_DEVELOPMENT_OHLCV.parquet')
          required = {
              'purpose': 'DEVELOPMENT_PRICE_CORPUS_BOOTSTRAP',
              'source': 'YAHOO_YFINANCE_RAW',
              'auto_adjust': False,
              'repair': False,
              'historical_universe_certified': False,
              'survivorship_safe': False,
              'historical_pea_eligibility_certified': False,
              'repair_promoted': False,
              'retuning': False,
              'holdout_accessed_for_prices': False,
              'requested_start': '2010-01-01',
              'requested_end_exclusive': '2023-01-01',
          }
          for key, value in required.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'BLOCK_PRE2023_CORPUS_CONTRACT:{key}={manifest.get(key)!r}')
          if corpus.empty:
              raise SystemExit('BLOCK_PRE2023_EMPTY_CORPUS')
          dates = pd.to_datetime(corpus['date'], errors='raise')
          if dates.max() >= pd.Timestamp('2023-01-01'):
              raise SystemExit('BLOCK_PRE2023_HOLDOUT_LEAK')
          if corpus.duplicated(['ticker','date']).any():
              raise SystemExit('BLOCK_PRE2023_DUPLICATES')
          o,h,l,c = (pd.to_numeric(corpus[x], errors='coerce') for x in ('open','high','low','close'))
          if ((h<l)|(h<o)|(h<c)|(l>o)|(l>c)).any():
              raise SystemExit('BLOCK_PRE2023_INVALID_OHLC')
          if len(corpus) != int(manifest['kept_rows']):
              raise SystemExit('BLOCK_PRE2023_ROWCOUNT_MISMATCH')
          print('PRE2023_YAHOO_DEVELOPMENT_CORPUS_CONTRACT_OK')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Upload governed PRE2023 development corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre2023-yahoo-development-corpus-${{ github.run_id }}
          path: outputs/pre2023_yahoo_corpus/
          if-no-files-found: warn
          retention-days: 14
