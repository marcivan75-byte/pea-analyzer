name: Temporary source validation dispatcher

on:
  push:
    branches:
      - codex/runtime-boursorama-shared-limiter-v21-15-2
    paths:
      - .github/source-validation-trigger
  pull_request:
    branches:
      - codex/runtime-boursorama-shared-limiter-v21-15-2
    paths:
      - .github/source-validation-trigger

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/runtime-boursorama-shared-limiter-v21-15-2
      - name: Dispatch official Daily
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run committee_tct_ct_daily.yml --ref codex/runtime-boursorama-shared-limiter-v21-15-2 -f run_validation=false
          sleep 8
          RUN_JSON="$(gh run list --workflow committee_tct_ct_daily.yml --branch codex/runtime-boursorama-shared-limiter-v21-15-2 --event workflow_dispatch --limit 1 --json databaseId,status,headSha,createdAt)"
          printf '%s\n' "$RUN_JSON" > .github/source-validation-status.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/source-validation-status.json
          git commit -m 'chore(validation): record source validation run' || true
          git push
