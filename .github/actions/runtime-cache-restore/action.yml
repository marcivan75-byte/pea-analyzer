name: Restore PEA runtime cache
description: Restore the consolidated V21.16 runtime state, with one-time legacy migration fallbacks.

runs:
  using: composite
  steps:
    - name: Restore consolidated runtime state
      id: runtime-state
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          data/cache/
          state/TCT_V24_1_7_T1_STATE.json
          state/tct_context/
          state/action_ct/
          state/action_ct_v22_1/
          state/provenance/
          state/sector_rotation_v2/
          state/etf_fund_flows/
        key: runtime-state-v21-16-${{ github.run_id }}
        restore-keys: |
          runtime-state-v21-16-

    - name: Restore legacy OHLCV cache during migration
      if: steps.runtime-state.outputs.cache-matched-key == ''
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: data/cache/
        key: ohlcv-v3-${{ github.run_id }}
        restore-keys: |
          ohlcv-v3-

    - name: Restore legacy consolidated decision state during migration
      id: legacy-decision-state
      if: steps.runtime-state.outputs.cache-matched-key == ''
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          state/TCT_V24_1_7_T1_STATE.json
          state/tct_context/
          state/action_ct/
          state/action_ct_v22_1/
          state/provenance/
        key: decision-state-v1-${{ github.run_id }}
        restore-keys: |
          decision-state-v1-

    - name: Restore legacy TCT state during deep migration
      if: steps.runtime-state.outputs.cache-matched-key == '' && steps.legacy-decision-state.outputs.cache-matched-key == ''
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: state/TCT_V24_1_7_T1_STATE.json
        key: tct-v2417-state-${{ github.run_id }}
        restore-keys: |
          daily-tct-state-
          tct-v2417-state-

    - name: Restore legacy TCT context during deep migration
      if: steps.runtime-state.outputs.cache-matched-key == '' && steps.legacy-decision-state.outputs.cache-matched-key == ''
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: state/tct_context/
        key: tct-context-${{ github.run_id }}
        restore-keys: |
          tct-context-

    - name: Restore legacy Action CT V22 state during deep migration
      if: steps.runtime-state.outputs.cache-matched-key == '' && steps.legacy-decision-state.outputs.cache-matched-key == ''
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: state/action_ct/
        key: action-ct-v22-${{ github.run_id }}
        restore-keys: |
          action-ct-v22-

    - name: Restore legacy Action CT V22.1 state during deep migration
      if: steps.runtime-state.outputs.cache-matched-key == '' && steps.legacy-decision-state.outputs.cache-matched-key == ''
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: state/action_ct_v22_1/
        key: action-ct-v221-${{ github.run_id }}
        restore-keys: |
          action-ct-v221-

    - name: Restore legacy provenance during deep migration
      if: steps.runtime-state.outputs.cache-matched-key == '' && steps.legacy-decision-state.outputs.cache-matched-key == ''
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: state/provenance/
        key: provenance-v2181-${{ github.run_id }}
        restore-keys: |
          daily-provenance-v2181-
          provenance-v2181-
          provenance-v2161-
          provenance-v216-
          provenance-v215-
          provenance-v214-

    - name: Restore legacy weekly research state during migration
      if: steps.runtime-state.outputs.cache-matched-key == ''
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          state/sector_rotation_v2/
          state/etf_fund_flows/
        key: weekly-research-state-v1-${{ github.run_id }}
        restore-keys: |
          weekly-research-state-v1-
