[project]
name = "pea-v182"
version = "18.2.1"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.8,<3",
  "yfinance>=0.2,<2",
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
  "pyarrow>=17,<26",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.2,<7",
  "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "mypy>=1.10,<3"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]