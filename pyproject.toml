[project]
name = "pea-v182"
version = "21.4.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "yfinance>=0.2",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "playwright>=1.46",
  "openpyxl>=3.1",
  "ta>=0.11.0"
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
# CI uses a deliberately narrow safety subset first; style cleanup remains
# separate from functional correctness to avoid mass formatting changes.
select = ["E9", "F63", "F7", "F82"]
