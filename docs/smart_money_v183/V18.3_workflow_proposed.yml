name: V18.3 Smart Money Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * 1-5"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: v18-3-smart-money-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[test]
      - run: pytest -q
      - name: Execute V18.3 in Smart Money shadow mode
        env:
          V183_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          SMART_MONEY_SHADOW_MODE: "true"
        run: python -m v183.reporting.run
      - name: Verify V18.3 quality gates
        run: |
          python - <<'PY'
          import json
          base=json.load(open('outputs/audit/V18.3_QUALITY_GATES.json'))
          sm=json.load(open('outputs/audit/V18.3_SMART_MONEY_QUALITY_GATES.json'))
          assert base['passed'], base
          assert sm['passed'], sm
          PY
      - name: Upload controlled artifacts
        uses: actions/upload-artifact@v6
        with:
          name: V18.3-smart-money-shadow-${{ github.run_id }}
          path: |
            outputs/*.xlsx
            outputs/*.csv
            outputs/audit/**
            outputs/gaps/**
            state/runs/**
            state/smart_money/**
          retention-days: 30
      - name: Create controlled refresh pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/v18-3-shadow-${{ github.run_id }}
          delete-branch: true
          commit-message: "V18.3 Smart Money shadow refresh ${{ github.run_id }}"
          title: "V18.3 Smart Money shadow refresh ${{ github.run_id }}"
          body: |
            Automated V18.3 shadow refresh. Base and Smart Money quality gates passed.
            WIS/IFS remain shadow-only and do not alter production decisions.
          add-paths: |
            state/runs/**
            state/smart_money/**
            outputs/**
